name: Temporary ARM64 Cgroup Diagnostic

on:
  push:
    branches:
      - syswarden/release-v4.03.2-qualification-fix

permissions: {}

concurrency:
  group: temporary-arm64-cgroup-diagnostic
  cancel-in-progress: true

jobs:
  inspect-rootless-delegation:
    name: Inspect Rootless Podman Delegation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Capture Baseline
        shell: bash
        env:
          EXPECTED_REF: refs/heads/syswarden/release-v4.03.2-qualification-fix
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "${EXPECTED_REF}"
          test "$(uname -m)" = "aarch64"
          test "$(id -u)" -gt 0
          command -v jq >/dev/null
          command -v podman >/dev/null
          command -v systemctl >/dev/null
          command -v systemd-run >/dev/null

          printf 'identity=%s:%s user=%s architecture=%s\n' \
            "$(id -u)" "$(id -g)" "$(id -un)" "$(uname -m)"
          printf 'self_cgroup=%s\n' "$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          podman --version

          user_id="$(id -u)"
          loginctl show-user "${user_id}" \
            --property=Linger \
            --property=RuntimePath \
            --property=Service \
            --property=State || true
          systemctl show "user@${user_id}.service" \
            --property=ActiveState \
            --property=ControlGroup \
            --property=Delegate \
            --property=DelegateControllers || true

      - name: Prepare and Prove Delegated User Scope
        shell: bash
        run: |
          set -euo pipefail
          user_id="$(id -u)"
          user_name="$(id -un)"
          runtime_dir="/run/user/${user_id}"
          delegate_drop_in="/etc/systemd/system/user@.service.d/syswarden-delegate.conf"
          containers_override="${RUNNER_TEMP}/syswarden-containers-override.conf"
          cleanup() {
            set +e
            sudo systemctl stop "user@${user_id}.service"
            sudo rm -f "${delegate_drop_in}"
            sudo systemctl daemon-reload
            rm -f "${containers_override}"
          }
          trap cleanup EXIT

          sudo install -d -m 0755 /etc/systemd/system/user@.service.d
          printf '%s\n' \
            '[Service]' \
            'Delegate=cpu io memory pids' | \
            sudo tee "${delegate_drop_in}" >/dev/null
          sudo chmod 0644 "${delegate_drop_in}"
          sudo systemctl daemon-reload
          sudo systemctl stop "user@${user_id}.service" || true
          umask 077
          printf '%s\n' \
            '[engine]' \
            'cgroup_manager="systemd"' > "${containers_override}"
          test "$(stat -c '%a' "${containers_override}")" = "600"

          unit_name="syswarden-arm64-cgroup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo systemd-run \
            --machine="${user_name}@" \
            --user \
            --unit="${unit_name}" \
            --quiet \
            --wait \
            --collect \
            --pipe \
            --property='Type=exec' \
            --property='Delegate=cpu io memory pids' \
            --setenv="HOME=${HOME}" \
            --setenv="PATH=${PATH}" \
            --setenv="RUNNER_TEMP=${RUNNER_TEMP}" \
            --setenv="XDG_RUNTIME_DIR=${runtime_dir}" \
            --setenv="CONTAINERS_CONF_OVERRIDE=${containers_override}" \
            /bin/bash -euo pipefail -s <<'SCOPED'
          test "$(id -u)" -gt 0
          printf 'scope_cgroup=%s\n' \
            "$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          podman info --format json | tee "${RUNNER_TEMP}/podman-info.json" | \
            jq -c '{host: {
              arch: .host.arch,
              cgroupControllers: .host.cgroupControllers,
              cgroupManager: .host.cgroupManager,
              cgroupVersion: .host.cgroupVersion,
              os: .host.os,
              rootless: .host.security.rootless,
              serviceIsRemote: .host.serviceIsRemote
            }}'
          jq -e '
            .host.arch == "arm64" and
            .host.cgroupVersion == "v2" and
            .host.cgroupManager == "systemd" and
            .host.security.rootless == true and
            .host.serviceIsRemote == false and
            .host.os == "linux" and
            (["cpu", "io", "memory", "pids"] - .host.cgroupControllers | length == 0)
          ' "${RUNNER_TEMP}/podman-info.json" >/dev/null
          podman run \
            --rm \
            --pull=always \
            --network=none \
            --memory=64m \
            --pids-limit=32 \
            --platform=linux/arm64 \
            docker.io/library/alpine:3.22@sha256:2c9d26f410d032d5b1525aa8a873e238b05b90c4ae8618743d4311f0cc827e37 \
            /bin/true
          SCOPED

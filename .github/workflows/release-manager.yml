name: SysWarden Release Orchestrator

# workflow_run is coordination-only. Publication is dispatched separately at the
# exact release tag so GitHub OIDC binds provenance to the release commit SHA.
on:
  workflow_run:
    workflows:
      - SysWarden Security Audit
      - SysWarden Builder and Packager
      - Plumber Compliance
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact SysWarden release tag (select the same tag as the workflow ref)
        required: true
        type: string
      release_sha:
        description: Exact full commit SHA resolved by the release tag
        required: true
        type: string
      qualification_run_id:
        description: Exact successful pre-tag release qualification workflow run ID
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_run'
        && format('release-coordinate-{0}', github.event.workflow_run.head_sha)
        || format('release-publish-{0}', github.sha) }}
  cancel-in-progress: false

jobs:
  coordinate-release:
    name: Coordinate Exact Tag Gates
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.upstream.outputs.ready }}
      release_tag: ${{ steps.context.outputs.release_tag }}
      release_sha: ${{ steps.context.outputs.release_sha }}
      qualification_run_id: ${{ steps.upstream.outputs.qualification_run_id }}

    steps:
      - name: Resolve Tag Release Context
        id: context
        shell: bash
        env:
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${TRIGGER_BRANCH}" =~ ^v[0-9]+\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "This completed workflow is not scoped to a SysWarden release tag."
            echo "candidate=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${TRIGGER_EVENT}" != "push" ]]; then
            echo "ERROR: release workflow ${TRIGGER_BRANCH} was not triggered by a push event." >&2
            exit 1
          fi
          if [[ "${TRIGGER_CONCLUSION}" != "success" ]]; then
            echo "ERROR: triggering workflow concluded ${TRIGGER_CONCLUSION} for ${TRIGGER_BRANCH}." >&2
            exit 1
          fi
          if [[ ! "${TRIGGER_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: invalid release commit SHA: ${TRIGGER_SHA}." >&2
            exit 1
          fi
          {
            echo "candidate=true"
            echo "release_tag=${TRIGGER_BRANCH}"
            echo "release_sha=${TRIGGER_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout Exact Release Commit
        if: ${{ steps.context.outputs.candidate == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.context.outputs.release_sha }}

      - name: Set up Go
        if: ${{ steps.context.outputs.candidate == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Validate Tag, Source, Changelog, and Main Ancestry
        if: ${{ steps.context.outputs.candidate == 'true' }}
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.context.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${TAG_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "ERROR: ${RELEASE_TAG} resolves to ${TAG_SHA}, expected ${RELEASE_SHA}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main; then
            echo "ERROR: release commit ${RELEASE_SHA} is not reachable from origin/main." >&2
            exit 1
          fi
          (cd scripts/versionctl && GOWORK=off go test ./...)
          ./scripts/versioning.sh validate-tag \
            --repo "${GITHUB_WORKSPACE}" \
            --tag "${RELEASE_TAG}"
          commit_message="$(git log -1 --format=%B HEAD)"
          if ! ./scripts/versioning.sh validate-commit \
              --repo "${GITHUB_WORKSPACE}" \
              --base-ref HEAD^ \
              --tag-phase \
              --commit-message "${commit_message}"; then
            ./scripts/versioning.sh validate-commit \
              --repo "${GITHUB_WORKSPACE}" \
              --base-ref HEAD^ \
              --commit-message "${commit_message}"
            commit_subject="$(git log -1 --format=%s HEAD)"
            if [[ "${RELEASE_TAG}" == "v4.03.2" ]]; then
              v4032_merge_parent_sha="$(git rev-parse HEAD^)"
              if [[ "${v4032_merge_parent_sha}" != "14ccbf1d32c221ee1e430dbad5eac40b1c5bd2c1" ]]; then
                echo "ERROR: the v4.03.2 merge-subject repair is not based on the reviewed PR95 squash." >&2
                exit 1
              fi
              v4032_merge_expected_subject='Qualification : repair v4.03.2 merged squash subject contract (#96)'
              if [[ "${commit_subject}" != "${v4032_merge_expected_subject}" ]]; then
                echo "ERROR: the v4.03.2 merge-subject repair requires the exact reviewed squash subject." >&2
                exit 1
              fi
              read -r -a v4032_merge_head_line <<< "$(git rev-list --parents -n 1 HEAD)"
              if (( ${#v4032_merge_head_line[@]} != 2 )); then
                echo "ERROR: the v4.03.2 merge-subject repair must be one linear commit." >&2
                exit 1
              fi
              # BEGIN exact v4.03.2 merge-subject repair diff contract
              expected_v4032_merge_diff=(
                M ".github/workflows/release-manager.yml"
                M "scripts/ci/release_gate_test.py"
              )
              mapfile -d '' -t actual_v4032_merge_diff < <(
                git diff-tree --no-commit-id --name-status -r --no-renames -z HEAD^ HEAD
              )
              if (( ${#actual_v4032_merge_diff[@]} != ${#expected_v4032_merge_diff[@]} )); then
                echo "ERROR: the v4.03.2 merge-subject repair must modify exactly the two reviewed files." >&2
                exit 1
              fi
              for ((index = 0; index < ${#expected_v4032_merge_diff[@]}; index++)); do
                if [[ "${actual_v4032_merge_diff[index]}" != "${expected_v4032_merge_diff[index]}" ]]; then
                  echo "ERROR: the v4.03.2 merge-subject repair contains an unauthorized path, status, or rename." >&2
                  exit 1
                fi
              done
              v4032_merge_paths=(
                ".github/workflows/release-manager.yml"
                "scripts/ci/release_gate_test.py"
              )
              for tree_ref in HEAD^ HEAD; do
                for fix_path in "${v4032_merge_paths[@]}"; do
                  tree_entry="$(git ls-tree "${tree_ref}" -- "${fix_path}")"
                  IFS=$' \t' read -r tree_mode tree_type tree_object tree_path tree_extra <<< "${tree_entry}"
                  if [[ "${tree_mode}" != "100644" || \
                        "${tree_type}" != "blob" || \
                        ! "${tree_object}" =~ ^[0-9a-f]{40}$ || \
                        "${tree_path}" != "${fix_path}" || \
                        -n "${tree_extra:-}" ]]; then
                    echo "ERROR: reviewed v4.03.2 merge-subject repair path ${fix_path} is not one exact 100644 blob at ${tree_ref}." >&2
                    exit 1
                  fi
                done
              done
              # END exact v4.03.2 merge-subject repair diff contract
              v4032_repair_ref=HEAD^
              v4032_parent_sha="$(git rev-parse "${v4032_repair_ref}^")"
              if [[ "${v4032_parent_sha}" != "3839d592467a4f92f24b613412d8d89bb6905251" ]]; then
                echo "ERROR: the v4.03.2 package lifecycle repair is not based on the reviewed qualification repair." >&2
                exit 1
              fi
              v4032_expected_subject='Qualification : repair v4.03.2 package lifecycle qualification (#95) (#95)'
              v4032_repair_subject="$(git log -1 --format=%s "${v4032_repair_ref}")"
              if [[ "${v4032_repair_subject}" != "${v4032_expected_subject}" ]]; then
                echo "ERROR: the v4.03.2 package lifecycle repair requires the exact reviewed squash subject." >&2
                exit 1
              fi
              read -r -a v4032_head_line <<< "$(git rev-list --parents -n 1 "${v4032_repair_ref}")"
              read -r -a v4032_parent_line <<< "$(git rev-list --parents -n 1 "${v4032_repair_ref}^")"
              read -r -a v4032_release_line <<< "$(git rev-list --parents -n 1 "${v4032_repair_ref}^^")"
              if (( ${#v4032_head_line[@]} != 2 || \
                    ${#v4032_parent_line[@]} != 2 || \
                    ${#v4032_release_line[@]} != 2 )); then
                echo "ERROR: the v4.03.2 package lifecycle repair requires the reviewed three-commit linear chain." >&2
                exit 1
              fi
              v4032_grandparent_sha="$(git rev-parse "${v4032_repair_ref}^^")"
              if [[ "${v4032_grandparent_sha}" != "3655abe045deffc669e0ba9c11a6e4cf17a317a5" ]]; then
                echo "ERROR: the v4.03.2 qualification repair is not based on the reviewed release commit." >&2
                exit 1
              fi
              v4032_release_base_sha="$(git rev-parse "${v4032_repair_ref}^^^")"
              if [[ "${v4032_release_base_sha}" != "f2270a2a8138f1f2b72a6200f6febbdc83fa5eaa" ]]; then
                echo "ERROR: the v4.03.2 release commit does not have the reviewed Patch baseline." >&2
                exit 1
              fi
              # BEGIN exact v4.03.2 preserved-version recovery diff contract
              expected_v4032_diff=(
                M ".github/workflows/package.yml"
                M ".github/workflows/release-manager.yml"
                M ".github/workflows/release-qualification.yml"
                M "build_packages.sh"
                M "scripts/ci/package_lifecycle_contract_test.py"
                M "scripts/ci/package_lifecycle_lab.py"
                M "scripts/ci/package_lifecycle_lab_test.py"
                M "scripts/ci/package_webtui_retirement.sh"
                M "scripts/ci/release_gate_test.py"
                M "scripts/ci/release_qualification_workflow_test.py"
                M "src/core/syswarden-cli/pkg/integration/waf_logs_linux.go"
                M "src/core/syswarden-cli/pkg/integration/waf_logs_linux_test.go"
                M "src/core/syswarden-cli/pkg/security/hardening_linux_helpers.go"
                M "src/core/syswarden-cli/pkg/security/hardening_linux_test.go"
                M "src/core/syswarden-cli/pkg/system/firewall_optimizer.go"
                M "src/core/syswarden-cli/pkg/system/firewall_optimizer_test.go"
                M "src/core/syswarden-cli/pkg/system/service_linux.go"
                M "src/core/syswarden-cli/pkg/system/service_linux_test.go"
                M "src/core/syswarden-cli/pkg/system/uninstall_linux.go"
                M "src/core/syswarden-cli/pkg/system/uninstall_prepare_linux_test.go"
              )
              mapfile -d '' -t actual_v4032_diff < <(
                git diff-tree --no-commit-id --name-status -r --no-renames -z \
                  "${v4032_repair_ref}^" "${v4032_repair_ref}"
              )
              if (( ${#actual_v4032_diff[@]} != ${#expected_v4032_diff[@]} )); then
                echo "ERROR: the v4.03.2 package lifecycle repair must modify exactly the twenty reviewed files." >&2
                exit 1
              fi
              for ((index = 0; index < ${#expected_v4032_diff[@]}; index++)); do
                if [[ "${actual_v4032_diff[index]}" != "${expected_v4032_diff[index]}" ]]; then
                  echo "ERROR: the v4.03.2 qualification repair contains an unauthorized path, status, or rename." >&2
                  exit 1
                fi
              done
              v4032_fix_paths=(
                ".github/workflows/package.yml"
                ".github/workflows/release-manager.yml"
                ".github/workflows/release-qualification.yml"
                "build_packages.sh"
                "scripts/ci/package_lifecycle_contract_test.py"
                "scripts/ci/package_lifecycle_lab.py"
                "scripts/ci/package_lifecycle_lab_test.py"
                "scripts/ci/package_webtui_retirement.sh"
                "scripts/ci/release_gate_test.py"
                "scripts/ci/release_qualification_workflow_test.py"
                "src/core/syswarden-cli/pkg/integration/waf_logs_linux.go"
                "src/core/syswarden-cli/pkg/integration/waf_logs_linux_test.go"
                "src/core/syswarden-cli/pkg/security/hardening_linux_helpers.go"
                "src/core/syswarden-cli/pkg/security/hardening_linux_test.go"
                "src/core/syswarden-cli/pkg/system/firewall_optimizer.go"
                "src/core/syswarden-cli/pkg/system/firewall_optimizer_test.go"
                "src/core/syswarden-cli/pkg/system/service_linux.go"
                "src/core/syswarden-cli/pkg/system/service_linux_test.go"
                "src/core/syswarden-cli/pkg/system/uninstall_linux.go"
                "src/core/syswarden-cli/pkg/system/uninstall_prepare_linux_test.go"
              )
              for tree_ref in "${v4032_repair_ref}^" "${v4032_repair_ref}"; do
                for fix_path in "${v4032_fix_paths[@]}"; do
                  expected_mode="100644"
                  if [[ "${fix_path}" == "build_packages.sh" ]]; then
                    expected_mode="100755"
                  fi
                  tree_entry="$(git ls-tree "${tree_ref}" -- "${fix_path}")"
                  IFS=$' \t' read -r tree_mode tree_type tree_object tree_path tree_extra <<< "${tree_entry}"
                  if [[ "${tree_mode}" != "${expected_mode}" || \
                        "${tree_type}" != "blob" || \
                        ! "${tree_object}" =~ ^[0-9a-f]{40}$ || \
                        "${tree_path}" != "${fix_path}" || \
                        -n "${tree_extra:-}" ]]; then
                    echo "ERROR: reviewed v4.03.2 repair path ${fix_path} is not one exact ${expected_mode} blob at ${tree_ref}." >&2
                    exit 1
                  fi
                done
              done
              # END exact v4.03.2 preserved-version recovery diff contract
              git diff --quiet "${v4032_repair_ref}^" "${v4032_repair_ref}" -- \
                changelog.md \
                src/core/syswarden-cli/pkg/system/upgrade.go \
                src/core/syswarden-tui/main.go \
                src/core/syswarden-cli/cmd/install.go \
                src/core/syswarden-cli/config/default.go \
                src/core/syswarden-cli/pkg/integration/webhook.go \
                src/core/syswarden-core/webhook/discord.go \
                README.md
              v4032_repair_commit_message="$(git log -1 --format=%B "${v4032_repair_ref}")"
              ./scripts/versioning.sh validate-commit \
                --repo "${GITHUB_WORKSPACE}" \
                --base-ref "${v4032_parent_sha}" \
                --commit-message "${v4032_repair_commit_message}"
              v4032_parent_commit_message="$(git log -1 --format=%B "${v4032_repair_ref}^")"
              ./scripts/versioning.sh validate-commit \
                --repo "${GITHUB_WORKSPACE}" \
                --base-ref "${v4032_grandparent_sha}" \
                --commit-message "${v4032_parent_commit_message}"
              v4032_release_commit_message="$(git log -1 --format=%B "${v4032_repair_ref}^^")"
              ./scripts/versioning.sh validate-commit \
                --repo "${GITHUB_WORKSPACE}" \
                --base-ref "${v4032_release_base_sha}" \
                --tag-phase \
                --commit-message "${v4032_release_commit_message}"
            else
              if [[ "${RELEASE_TAG}" != "v4.03.0" ]]; then
                echo "ERROR: preserved-version release recovery is authorized only for v4.03.0 or v4.03.2." >&2
                exit 1
              fi
              current_parent_sha="$(git rev-parse HEAD^)"
              case "${current_parent_sha}" in
              295275baf021adc2efe22e5e14e38e2184c635a1)
                if [[ ! "${commit_subject}" =~ ^Qualification[[:space:]]*:[[:space:]]*[^[:space:]] ]]; then
                  echo "ERROR: a preserved-version release fix requires a Qualification commit subject." >&2
                  exit 1
                fi
                read -r -a head_line <<< "$(git rev-list --parents -n 1 HEAD)"
                read -r -a release_parent_line <<< "$(git rev-list --parents -n 1 HEAD^)"
                if (( ${#head_line[@]} != 2 || ${#release_parent_line[@]} != 2 )); then
                  echo "ERROR: a preserved-version release fix requires one linear commit after one versioning commit." >&2
                  exit 1
                fi
                git diff --quiet HEAD^ HEAD -- \
                  changelog.md \
                  src/core/syswarden-cli/pkg/system/upgrade.go \
                  src/core/syswarden-tui/main.go \
                  src/core/syswarden-cli/cmd/install.go \
                  src/core/syswarden-cli/config/default.go \
                  src/core/syswarden-cli/pkg/integration/webhook.go \
                  src/core/syswarden-core/webhook/discord.go \
                  README.md
                release_base_sha="$(git rev-parse HEAD^^)"
                if [[ ! "${release_base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "ERROR: the versioning baseline is not a full lowercase commit SHA." >&2
                  exit 1
                fi
                parent_commit_message="$(git log -1 --format=%B HEAD^)"
                ./scripts/versioning.sh validate-commit \
                  --repo "${GITHUB_WORKSPACE}" \
                  --base-ref "${release_base_sha}" \
                  --tag-phase \
                  --commit-message "${parent_commit_message}"
                ;;
              10af4a7b754e1007fa8167e8c5222ac183cb288a)
                second_fix_subject_pattern='^Qualification : isolate nft golden helper TMPDIR \(#[1-9][0-9]*\)$'
                if [[ ! "${commit_subject}" =~ ${second_fix_subject_pattern} ]]; then
                  echo "ERROR: the second preserved-version release fix requires the exact reviewed Qualification subject." >&2
                  exit 1
                fi
                previous_fix_parent_sha="$(git rev-parse HEAD^^)"
                if [[ "${previous_fix_parent_sha}" != "295275baf021adc2efe22e5e14e38e2184c635a1" ]]; then
                  echo "ERROR: the second preserved-version release fix is not based on the reviewed v4.03.0 follow-up chain." >&2
                  exit 1
                fi
                read -r -a head_line <<< "$(git rev-list --parents -n 1 HEAD)"
                read -r -a previous_fix_line <<< "$(git rev-list --parents -n 1 HEAD^)"
                if (( ${#head_line[@]} != 2 || ${#previous_fix_line[@]} != 2 )); then
                  echo "ERROR: the second preserved-version release fix and its reviewed parent must both be linear commits." >&2
                  exit 1
                fi
                # BEGIN exact second preserved-version fix diff contract
                expected_fix_diff=(
                  M ".github/workflows/release-manager.yml"
                  M "scripts/ci/release_gate_test.py"
                  M "src/core/syswarden-cli/pkg/firewall/firewall_linux_golden_test.go"
                )
                mapfile -d '' -t actual_fix_diff < <(
                  git diff-tree --no-commit-id --name-status -r --no-renames -z HEAD^ HEAD
                )
                if (( ${#actual_fix_diff[@]} != ${#expected_fix_diff[@]} )); then
                  echo "ERROR: the second preserved-version release fix must modify exactly the three reviewed files." >&2
                  exit 1
                fi
                for ((index = 0; index < ${#expected_fix_diff[@]}; index++)); do
                  if [[ "${actual_fix_diff[index]}" != "${expected_fix_diff[index]}" ]]; then
                    echo "ERROR: the second preserved-version release fix contains an unauthorized path, status, or rename." >&2
                    exit 1
                  fi
                done
                fix_paths=(
                  ".github/workflows/release-manager.yml"
                  "scripts/ci/release_gate_test.py"
                  "src/core/syswarden-cli/pkg/firewall/firewall_linux_golden_test.go"
                )
                for tree_ref in HEAD^ HEAD; do
                  for fix_path in "${fix_paths[@]}"; do
                    tree_entry="$(git ls-tree "${tree_ref}" -- "${fix_path}")"
                    IFS=$' \t' read -r tree_mode tree_type tree_object tree_path tree_extra <<< "${tree_entry}"
                    if [[ "${tree_mode}" != "100644" || \
                          "${tree_type}" != "blob" || \
                          ! "${tree_object}" =~ ^[0-9a-f]{40}$ || \
                          "${tree_path}" != "${fix_path}" || \
                          -n "${tree_extra:-}" ]]; then
                      echo "ERROR: reviewed fix path ${fix_path} is not one exact 100644 blob at ${tree_ref}." >&2
                      exit 1
                    fi
                  done
                done
                # END exact second preserved-version fix diff contract
                git diff --quiet HEAD^ HEAD -- \
                  changelog.md \
                  src/core/syswarden-cli/pkg/system/upgrade.go \
                  src/core/syswarden-tui/main.go \
                  src/core/syswarden-cli/cmd/install.go \
                  src/core/syswarden-cli/config/default.go \
                  src/core/syswarden-cli/pkg/integration/webhook.go \
                  src/core/syswarden-core/webhook/discord.go \
                  README.md
                previous_fix_message="$(git log -1 --format=%B HEAD^)"
                ./scripts/versioning.sh validate-commit \
                  --repo "${GITHUB_WORKSPACE}" \
                  --base-ref "${previous_fix_parent_sha}" \
                  --commit-message "${previous_fix_message}"
                release_base_sha="$(git rev-parse HEAD^^^)"
                if [[ "${release_base_sha}" != "dfb8dfcf52bd1f82dcd2cd3b311119f01270af1e" ]]; then
                  echo "ERROR: the original v4.03.0 versioning parent is not the reviewed commit." >&2
                  exit 1
                fi
                versioning_commit_message="$(git log -1 --format=%B HEAD^^)"
                ./scripts/versioning.sh validate-commit \
                  --repo "${GITHUB_WORKSPACE}" \
                  --base-ref "${release_base_sha}" \
                  --tag-phase \
                  --commit-message "${versioning_commit_message}"
                ;;
              *)
                echo "ERROR: preserved-version release recovery is not authorized for parent ${current_parent_sha}." >&2
                exit 1
                ;;
              esac
            fi
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s scripts/ci \
            -p 'release_gate_test.py' \
            -v
          GOFLAGS=-mod=readonly go test \
            ./scripts/ci/update_manifest.go \
            ./scripts/ci/update_manifest_test.go

      - name: Resolve Exact Successful Upstream Runs and Artifacts
        id: upstream
        if: ${{ steps.context.outputs.candidate == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.context.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          workflows=(
            "package.yml|syswarden-packages-${VERSION}"
            "security-audit.yml|syswarden-attested-bundle"
            "security-audit.yml|syswarden-sbom"
            "compliance.yml|plumber-report"
          )
          declare -A run_ids=()
          pending=false

          qualification_pages="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-qualification.yml/runs" \
            -f event=workflow_dispatch \
            -f branch=main \
            -f head_sha="${RELEASE_SHA}" \
            -f per_page=100)"
          qualification_matches="$(jq --arg sha "${RELEASE_SHA}" \
            '[.[] | .workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "success" and
              .run_attempt == 1
            )]' <<< "${qualification_pages}")"
          qualification_count="$(jq 'length' <<< "${qualification_matches}")"
          if [[ "${qualification_count}" -ne 1 ]]; then
            echo "ERROR: found ${qualification_count} completed successful attempt-1 release qualification runs for main/${RELEASE_SHA}; expected exactly one." >&2
            exit 1
          fi
          qualification_active_count="$(jq --arg sha "${RELEASE_SHA}" \
            '[.[] | .workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "workflow_dispatch" and
              .status != "completed"
            )] | length' <<< "${qualification_pages}")"
          if [[ "${qualification_active_count}" -ne 0 ]]; then
            echo "ERROR: ${qualification_active_count} concurrent release qualification runs remain active for main/${RELEASE_SHA}." >&2
            exit 1
          fi
          qualification_run_id="$(jq -r '.[0].id | tostring' <<< "${qualification_matches}")"
          if [[ ! "${qualification_run_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: release qualification returned an invalid run ID." >&2
            exit 1
          fi
          qualification_artifact_pages="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}/artifacts" \
            -f per_page=100)"
          qualification_artifacts="$(jq \
            '[.[] | .artifacts[] | select(.name == "syswarden-release-qualification")]' \
            <<< "${qualification_artifact_pages}")"
          if [[ "$(jq 'length' <<< "${qualification_artifacts}")" -ne 1 ]]; then
            echo "ERROR: release qualification run ${qualification_run_id} must expose exactly one syswarden-release-qualification artifact." >&2
            exit 1
          fi
          if [[ "$(jq -r '.[0].expired' <<< "${qualification_artifacts}")" != "false" || \
                "$(jq -r '.[0].size_in_bytes' <<< "${qualification_artifacts}")" -le 0 ]]; then
            echo "ERROR: syswarden-release-qualification from run ${qualification_run_id} is expired or empty." >&2
            exit 1
          fi
          qualification_artifact_id="$(jq -r '.[0].id | tostring' <<< "${qualification_artifacts}")"
          if [[ ! "${qualification_artifact_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: syswarden-release-qualification returned an invalid artifact ID." >&2
            exit 1
          fi
          echo "qualification_run_id=${qualification_run_id}" >> "${GITHUB_OUTPUT}"
          echo "Validated pre-tag release qualification run ${qualification_run_id} and artifact ${qualification_artifact_id} for main/${RELEASE_SHA}."

          print_controlled_retry() {
            echo "After every exact gate is successful, an authorized maintainer may retry with:"
            echo "gh workflow run release-manager.yml --repo ${GITHUB_REPOSITORY} --ref ${RELEASE_TAG} --raw-field release_tag=${RELEASE_TAG} --raw-field release_sha=${RELEASE_SHA} --raw-field qualification_run_id=${qualification_run_id}"
          }

          validation_response="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/auto-versioning.yml/runs" \
            -f event=push \
            -f head_sha="${RELEASE_SHA}" \
            -f per_page=100)"
          validation_matches="$(jq --arg sha "${RELEASE_SHA}" \
            '[.[] | .workflow_runs[] | select(
              .head_sha == $sha and
              (.head_branch == "main" or .head_branch == "master") and
              .event == "push"
            )]' <<< "${validation_response}")"
          validation_count="$(jq 'length' <<< "${validation_matches}")"
          if [[ "${validation_count}" -gt 1 ]]; then
            echo "ERROR: found ${validation_count} Auto Versioning runs for ${RELEASE_SHA}; expected one." >&2
            exit 1
          fi
          if [[ "${validation_count}" -eq 0 ]]; then
            echo "ERROR: the exact Auto Versioning run for ${RELEASE_SHA} does not exist yet." >&2
            print_controlled_retry >&2
            exit 1
          fi
          validation_status="$(jq -r '.[0].status' <<< "${validation_matches}")"
          validation_conclusion="$(jq -r '.[0].conclusion // ""' <<< "${validation_matches}")"
          validation_id="$(jq -r '.[0].id' <<< "${validation_matches}")"
          if [[ "${validation_status}" != "completed" ]]; then
            echo "ERROR: exact Auto Versioning run ${validation_id} is still ${validation_status}." >&2
            print_controlled_retry >&2
            exit 1
          fi
          if [[ "${validation_conclusion}" != "success" ]]; then
            echo "ERROR: exact Auto Versioning run ${validation_id} concluded ${validation_conclusion}." >&2
            print_controlled_retry >&2
            exit 1
          fi
          echo "Validated Auto Versioning run ${validation_id} for ${RELEASE_SHA}."

          for specification in "${workflows[@]}"; do
            IFS='|' read -r workflow artifact <<< "${specification}"
            if [[ -n "${run_ids[${workflow}]:-}" ]]; then
              continue
            fi
            response="$(gh api --paginate --slurp --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f event=push \
              -f head_sha="${RELEASE_SHA}" \
              -f per_page=100)"
            matches="$(jq --arg sha "${RELEASE_SHA}" --arg tag "${RELEASE_TAG}" \
              '[.[] | .workflow_runs[] | select(
                .head_sha == $sha and
                .head_branch == $tag and
                .event == "push"
              )]' <<< "${response}")"
            count="$(jq 'length' <<< "${matches}")"
            if [[ "${count}" -gt 1 ]]; then
              echo "ERROR: found ${count} ${workflow} runs for ${RELEASE_TAG}/${RELEASE_SHA}." >&2
              exit 1
            fi
            if [[ "${count}" -eq 0 ]]; then
              echo "Waiting for the exact ${workflow} tag run."
              pending=true
              continue
            fi
            status="$(jq -r '.[0].status' <<< "${matches}")"
            conclusion="$(jq -r '.[0].conclusion // ""' <<< "${matches}")"
            run_id="$(jq -r '.[0].id' <<< "${matches}")"
            if [[ "${status}" != "completed" ]]; then
              echo "Exact ${workflow} run ${run_id} is still ${status}."
              pending=true
              continue
            fi
            if [[ "${conclusion}" != "success" ]]; then
              echo "ERROR: exact ${workflow} run ${run_id} concluded ${conclusion}." >&2
              exit 1
            fi
            run_ids["${workflow}"]="${run_id}"
            echo "Validated ${workflow} run ${run_id} for ${RELEASE_TAG}/${RELEASE_SHA}."
          done

          if [[ "${pending}" == "true" ]]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "Release dispatch is deferred until every tag-scoped workflow completes."
            exit 0
          fi

          for specification in "${workflows[@]}"; do
            IFS='|' read -r workflow artifact <<< "${specification}"
            run_id="${run_ids[${workflow}]}"
            artifact_response="$(gh api --paginate --slurp --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              -f per_page=100)"
            artifact_matches="$(jq --arg name "${artifact}" \
              '[.[] | .artifacts[] | select(.name == $name)]' <<< "${artifact_response}")"
            artifact_count="$(jq 'length' <<< "${artifact_matches}")"
            if [[ "${artifact_count}" -ne 1 ]]; then
              echo "ERROR: run ${run_id} has ${artifact_count} artifacts named ${artifact}; expected one." >&2
              exit 1
            fi
            expired="$(jq -r '.[0].expired' <<< "${artifact_matches}")"
            size="$(jq -r '.[0].size_in_bytes' <<< "${artifact_matches}")"
            if [[ "${expired}" != "false" || "${size}" -le 0 ]]; then
              echo "ERROR: artifact ${artifact} is expired or empty." >&2
              exit 1
            fi
            echo "Validated artifact ${artifact} from run ${run_id}."
          done
          echo "ready=true" >> "${GITHUB_OUTPUT}"

  dispatch-release:
    name: Dispatch Exact Tag Publisher
    needs:
      - coordinate-release
    if: ${{ needs.coordinate-release.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - name: Dispatch Publisher in Exact Tag Context
        if: ${{ env.ACT != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ needs.coordinate-release.outputs.qualification_run_id }}
          RELEASE_SHA: ${{ needs.coordinate-release.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.coordinate-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh workflow run release-manager.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_TAG}" \
            --raw-field "release_tag=${RELEASE_TAG}" \
            --raw-field "release_sha=${RELEASE_SHA}" \
            --raw-field "qualification_run_id=${QUALIFICATION_RUN_ID}"
          echo "Dispatched the publisher at ${RELEASE_TAG}/${RELEASE_SHA} with qualification run ${QUALIFICATION_RUN_ID}."

      - name: Confirm Act Did Not Dispatch GitHub
        if: ${{ env.ACT == 'true' }}
        shell: bash
        run: echo "Act completed release coordination without dispatching GitHub."

  validate-and-stage:
    name: Validate Tag Gates and Stage Exact Assets
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.upstream.outputs.ready }}
      release_tag: ${{ steps.context.outputs.release_tag }}
      release_sha: ${{ steps.context.outputs.release_sha }}
      qualification_run_id: ${{ steps.upstream.outputs.qualification_run_id }}

    steps:
      - name: Validate Exact Tag Dispatch Context
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "ERROR: publication is restricted to workflow_dispatch." >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "ERROR: invalid requested release tag: ${REQUESTED_TAG}." >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: invalid requested release SHA: ${REQUESTED_SHA}." >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_QUALIFICATION_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: invalid requested release qualification run ID: ${REQUESTED_QUALIFICATION_RUN_ID}." >&2
            exit 1
          fi
          if [[ "${EVENT_REF_TYPE}" != "tag" || \
                "${EVENT_REF_NAME}" != "${REQUESTED_TAG}" || \
                "${EVENT_REF}" != "refs/tags/${REQUESTED_TAG}" ]]; then
            echo "ERROR: publisher must be dispatched with --ref ${REQUESTED_TAG}." >&2
            exit 1
          fi
          if [[ "${EVENT_SHA}" != "${REQUESTED_SHA}" ]]; then
            echo "ERROR: dispatch context ${EVENT_SHA} does not equal requested ${REQUESTED_SHA}." >&2
            exit 1
          fi
          {
            echo "candidate=true"
            echo "release_tag=${REQUESTED_TAG}"
            echo "release_sha=${REQUESTED_SHA}"
            echo "qualification_run_id=${REQUESTED_QUALIFICATION_RUN_ID}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout Exact Release Commit
        if: ${{ steps.context.outputs.candidate == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.context.outputs.release_sha }}

      - name: Set up Go
        if: ${{ steps.context.outputs.candidate == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Validate Tag, Source, Changelog, and Main Ancestry
        if: ${{ steps.context.outputs.candidate == 'true' }}
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.context.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${TAG_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "ERROR: ${RELEASE_TAG} resolves to ${TAG_SHA}, expected ${RELEASE_SHA}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main; then
            echo "ERROR: release commit ${RELEASE_SHA} is not reachable from origin/main." >&2
            exit 1
          fi
          (cd scripts/versionctl && GOWORK=off go test ./...)
          ./scripts/versioning.sh validate-tag \
            --repo "${GITHUB_WORKSPACE}" \
            --tag "${RELEASE_TAG}"
          commit_message="$(git log -1 --format=%B HEAD)"
          if ! ./scripts/versioning.sh validate-commit \
              --repo "${GITHUB_WORKSPACE}" \
              --base-ref HEAD^ \
              --tag-phase \
              --commit-message "${commit_message}"; then
            ./scripts/versioning.sh validate-commit \
              --repo "${GITHUB_WORKSPACE}" \
              --base-ref HEAD^ \
              --commit-message "${commit_message}"
            commit_subject="$(git log -1 --format=%s HEAD)"
            if [[ "${RELEASE_TAG}" == "v4.03.2" ]]; then
              v4032_merge_parent_sha="$(git rev-parse HEAD^)"
              if [[ "${v4032_merge_parent_sha}" != "14ccbf1d32c221ee1e430dbad5eac40b1c5bd2c1" ]]; then
                echo "ERROR: the v4.03.2 merge-subject repair is not based on the reviewed PR95 squash." >&2
                exit 1
              fi
              v4032_merge_expected_subject='Qualification : repair v4.03.2 merged squash subject contract (#96)'
              if [[ "${commit_subject}" != "${v4032_merge_expected_subject}" ]]; then
                echo "ERROR: the v4.03.2 merge-subject repair requires the exact reviewed squash subject." >&2
                exit 1
              fi
              read -r -a v4032_merge_head_line <<< "$(git rev-list --parents -n 1 HEAD)"
              if (( ${#v4032_merge_head_line[@]} != 2 )); then
                echo "ERROR: the v4.03.2 merge-subject repair must be one linear commit." >&2
                exit 1
              fi
              # BEGIN exact v4.03.2 merge-subject repair diff contract
              expected_v4032_merge_diff=(
                M ".github/workflows/release-manager.yml"
                M "scripts/ci/release_gate_test.py"
              )
              mapfile -d '' -t actual_v4032_merge_diff < <(
                git diff-tree --no-commit-id --name-status -r --no-renames -z HEAD^ HEAD
              )
              if (( ${#actual_v4032_merge_diff[@]} != ${#expected_v4032_merge_diff[@]} )); then
                echo "ERROR: the v4.03.2 merge-subject repair must modify exactly the two reviewed files." >&2
                exit 1
              fi
              for ((index = 0; index < ${#expected_v4032_merge_diff[@]}; index++)); do
                if [[ "${actual_v4032_merge_diff[index]}" != "${expected_v4032_merge_diff[index]}" ]]; then
                  echo "ERROR: the v4.03.2 merge-subject repair contains an unauthorized path, status, or rename." >&2
                  exit 1
                fi
              done
              v4032_merge_paths=(
                ".github/workflows/release-manager.yml"
                "scripts/ci/release_gate_test.py"
              )
              for tree_ref in HEAD^ HEAD; do
                for fix_path in "${v4032_merge_paths[@]}"; do
                  tree_entry="$(git ls-tree "${tree_ref}" -- "${fix_path}")"
                  IFS=$' \t' read -r tree_mode tree_type tree_object tree_path tree_extra <<< "${tree_entry}"
                  if [[ "${tree_mode}" != "100644" || \
                        "${tree_type}" != "blob" || \
                        ! "${tree_object}" =~ ^[0-9a-f]{40}$ || \
                        "${tree_path}" != "${fix_path}" || \
                        -n "${tree_extra:-}" ]]; then
                    echo "ERROR: reviewed v4.03.2 merge-subject repair path ${fix_path} is not one exact 100644 blob at ${tree_ref}." >&2
                    exit 1
                  fi
                done
              done
              # END exact v4.03.2 merge-subject repair diff contract
              v4032_repair_ref=HEAD^
              v4032_parent_sha="$(git rev-parse "${v4032_repair_ref}^")"
              if [[ "${v4032_parent_sha}" != "3839d592467a4f92f24b613412d8d89bb6905251" ]]; then
                echo "ERROR: the v4.03.2 package lifecycle repair is not based on the reviewed qualification repair." >&2
                exit 1
              fi
              v4032_expected_subject='Qualification : repair v4.03.2 package lifecycle qualification (#95) (#95)'
              v4032_repair_subject="$(git log -1 --format=%s "${v4032_repair_ref}")"
              if [[ "${v4032_repair_subject}" != "${v4032_expected_subject}" ]]; then
                echo "ERROR: the v4.03.2 package lifecycle repair requires the exact reviewed squash subject." >&2
                exit 1
              fi
              read -r -a v4032_head_line <<< "$(git rev-list --parents -n 1 "${v4032_repair_ref}")"
              read -r -a v4032_parent_line <<< "$(git rev-list --parents -n 1 "${v4032_repair_ref}^")"
              read -r -a v4032_release_line <<< "$(git rev-list --parents -n 1 "${v4032_repair_ref}^^")"
              if (( ${#v4032_head_line[@]} != 2 || \
                    ${#v4032_parent_line[@]} != 2 || \
                    ${#v4032_release_line[@]} != 2 )); then
                echo "ERROR: the v4.03.2 package lifecycle repair requires the reviewed three-commit linear chain." >&2
                exit 1
              fi
              v4032_grandparent_sha="$(git rev-parse "${v4032_repair_ref}^^")"
              if [[ "${v4032_grandparent_sha}" != "3655abe045deffc669e0ba9c11a6e4cf17a317a5" ]]; then
                echo "ERROR: the v4.03.2 qualification repair is not based on the reviewed release commit." >&2
                exit 1
              fi
              v4032_release_base_sha="$(git rev-parse "${v4032_repair_ref}^^^")"
              if [[ "${v4032_release_base_sha}" != "f2270a2a8138f1f2b72a6200f6febbdc83fa5eaa" ]]; then
                echo "ERROR: the v4.03.2 release commit does not have the reviewed Patch baseline." >&2
                exit 1
              fi
              # BEGIN exact v4.03.2 preserved-version recovery diff contract
              expected_v4032_diff=(
                M ".github/workflows/package.yml"
                M ".github/workflows/release-manager.yml"
                M ".github/workflows/release-qualification.yml"
                M "build_packages.sh"
                M "scripts/ci/package_lifecycle_contract_test.py"
                M "scripts/ci/package_lifecycle_lab.py"
                M "scripts/ci/package_lifecycle_lab_test.py"
                M "scripts/ci/package_webtui_retirement.sh"
                M "scripts/ci/release_gate_test.py"
                M "scripts/ci/release_qualification_workflow_test.py"
                M "src/core/syswarden-cli/pkg/integration/waf_logs_linux.go"
                M "src/core/syswarden-cli/pkg/integration/waf_logs_linux_test.go"
                M "src/core/syswarden-cli/pkg/security/hardening_linux_helpers.go"
                M "src/core/syswarden-cli/pkg/security/hardening_linux_test.go"
                M "src/core/syswarden-cli/pkg/system/firewall_optimizer.go"
                M "src/core/syswarden-cli/pkg/system/firewall_optimizer_test.go"
                M "src/core/syswarden-cli/pkg/system/service_linux.go"
                M "src/core/syswarden-cli/pkg/system/service_linux_test.go"
                M "src/core/syswarden-cli/pkg/system/uninstall_linux.go"
                M "src/core/syswarden-cli/pkg/system/uninstall_prepare_linux_test.go"
              )
              mapfile -d '' -t actual_v4032_diff < <(
                git diff-tree --no-commit-id --name-status -r --no-renames -z \
                  "${v4032_repair_ref}^" "${v4032_repair_ref}"
              )
              if (( ${#actual_v4032_diff[@]} != ${#expected_v4032_diff[@]} )); then
                echo "ERROR: the v4.03.2 package lifecycle repair must modify exactly the twenty reviewed files." >&2
                exit 1
              fi
              for ((index = 0; index < ${#expected_v4032_diff[@]}; index++)); do
                if [[ "${actual_v4032_diff[index]}" != "${expected_v4032_diff[index]}" ]]; then
                  echo "ERROR: the v4.03.2 qualification repair contains an unauthorized path, status, or rename." >&2
                  exit 1
                fi
              done
              v4032_fix_paths=(
                ".github/workflows/package.yml"
                ".github/workflows/release-manager.yml"
                ".github/workflows/release-qualification.yml"
                "build_packages.sh"
                "scripts/ci/package_lifecycle_contract_test.py"
                "scripts/ci/package_lifecycle_lab.py"
                "scripts/ci/package_lifecycle_lab_test.py"
                "scripts/ci/package_webtui_retirement.sh"
                "scripts/ci/release_gate_test.py"
                "scripts/ci/release_qualification_workflow_test.py"
                "src/core/syswarden-cli/pkg/integration/waf_logs_linux.go"
                "src/core/syswarden-cli/pkg/integration/waf_logs_linux_test.go"
                "src/core/syswarden-cli/pkg/security/hardening_linux_helpers.go"
                "src/core/syswarden-cli/pkg/security/hardening_linux_test.go"
                "src/core/syswarden-cli/pkg/system/firewall_optimizer.go"
                "src/core/syswarden-cli/pkg/system/firewall_optimizer_test.go"
                "src/core/syswarden-cli/pkg/system/service_linux.go"
                "src/core/syswarden-cli/pkg/system/service_linux_test.go"
                "src/core/syswarden-cli/pkg/system/uninstall_linux.go"
                "src/core/syswarden-cli/pkg/system/uninstall_prepare_linux_test.go"
              )
              for tree_ref in "${v4032_repair_ref}^" "${v4032_repair_ref}"; do
                for fix_path in "${v4032_fix_paths[@]}"; do
                  expected_mode="100644"
                  if [[ "${fix_path}" == "build_packages.sh" ]]; then
                    expected_mode="100755"
                  fi
                  tree_entry="$(git ls-tree "${tree_ref}" -- "${fix_path}")"
                  IFS=$' \t' read -r tree_mode tree_type tree_object tree_path tree_extra <<< "${tree_entry}"
                  if [[ "${tree_mode}" != "${expected_mode}" || \
                        "${tree_type}" != "blob" || \
                        ! "${tree_object}" =~ ^[0-9a-f]{40}$ || \
                        "${tree_path}" != "${fix_path}" || \
                        -n "${tree_extra:-}" ]]; then
                    echo "ERROR: reviewed v4.03.2 repair path ${fix_path} is not one exact ${expected_mode} blob at ${tree_ref}." >&2
                    exit 1
                  fi
                done
              done
              # END exact v4.03.2 preserved-version recovery diff contract
              git diff --quiet "${v4032_repair_ref}^" "${v4032_repair_ref}" -- \
                changelog.md \
                src/core/syswarden-cli/pkg/system/upgrade.go \
                src/core/syswarden-tui/main.go \
                src/core/syswarden-cli/cmd/install.go \
                src/core/syswarden-cli/config/default.go \
                src/core/syswarden-cli/pkg/integration/webhook.go \
                src/core/syswarden-core/webhook/discord.go \
                README.md
              v4032_repair_commit_message="$(git log -1 --format=%B "${v4032_repair_ref}")"
              ./scripts/versioning.sh validate-commit \
                --repo "${GITHUB_WORKSPACE}" \
                --base-ref "${v4032_parent_sha}" \
                --commit-message "${v4032_repair_commit_message}"
              v4032_parent_commit_message="$(git log -1 --format=%B "${v4032_repair_ref}^")"
              ./scripts/versioning.sh validate-commit \
                --repo "${GITHUB_WORKSPACE}" \
                --base-ref "${v4032_grandparent_sha}" \
                --commit-message "${v4032_parent_commit_message}"
              v4032_release_commit_message="$(git log -1 --format=%B "${v4032_repair_ref}^^")"
              ./scripts/versioning.sh validate-commit \
                --repo "${GITHUB_WORKSPACE}" \
                --base-ref "${v4032_release_base_sha}" \
                --tag-phase \
                --commit-message "${v4032_release_commit_message}"
            else
              if [[ "${RELEASE_TAG}" != "v4.03.0" ]]; then
                echo "ERROR: preserved-version release recovery is authorized only for v4.03.0 or v4.03.2." >&2
                exit 1
              fi
              current_parent_sha="$(git rev-parse HEAD^)"
              case "${current_parent_sha}" in
              295275baf021adc2efe22e5e14e38e2184c635a1)
                if [[ ! "${commit_subject}" =~ ^Qualification[[:space:]]*:[[:space:]]*[^[:space:]] ]]; then
                  echo "ERROR: a preserved-version release fix requires a Qualification commit subject." >&2
                  exit 1
                fi
                read -r -a head_line <<< "$(git rev-list --parents -n 1 HEAD)"
                read -r -a release_parent_line <<< "$(git rev-list --parents -n 1 HEAD^)"
                if (( ${#head_line[@]} != 2 || ${#release_parent_line[@]} != 2 )); then
                  echo "ERROR: a preserved-version release fix requires one linear commit after one versioning commit." >&2
                  exit 1
                fi
                git diff --quiet HEAD^ HEAD -- \
                  changelog.md \
                  src/core/syswarden-cli/pkg/system/upgrade.go \
                  src/core/syswarden-tui/main.go \
                  src/core/syswarden-cli/cmd/install.go \
                  src/core/syswarden-cli/config/default.go \
                  src/core/syswarden-cli/pkg/integration/webhook.go \
                  src/core/syswarden-core/webhook/discord.go \
                  README.md
                release_base_sha="$(git rev-parse HEAD^^)"
                if [[ ! "${release_base_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "ERROR: the versioning baseline is not a full lowercase commit SHA." >&2
                  exit 1
                fi
                parent_commit_message="$(git log -1 --format=%B HEAD^)"
                ./scripts/versioning.sh validate-commit \
                  --repo "${GITHUB_WORKSPACE}" \
                  --base-ref "${release_base_sha}" \
                  --tag-phase \
                  --commit-message "${parent_commit_message}"
                ;;
              10af4a7b754e1007fa8167e8c5222ac183cb288a)
                second_fix_subject_pattern='^Qualification : isolate nft golden helper TMPDIR \(#[1-9][0-9]*\)$'
                if [[ ! "${commit_subject}" =~ ${second_fix_subject_pattern} ]]; then
                  echo "ERROR: the second preserved-version release fix requires the exact reviewed Qualification subject." >&2
                  exit 1
                fi
                previous_fix_parent_sha="$(git rev-parse HEAD^^)"
                if [[ "${previous_fix_parent_sha}" != "295275baf021adc2efe22e5e14e38e2184c635a1" ]]; then
                  echo "ERROR: the second preserved-version release fix is not based on the reviewed v4.03.0 follow-up chain." >&2
                  exit 1
                fi
                read -r -a head_line <<< "$(git rev-list --parents -n 1 HEAD)"
                read -r -a previous_fix_line <<< "$(git rev-list --parents -n 1 HEAD^)"
                if (( ${#head_line[@]} != 2 || ${#previous_fix_line[@]} != 2 )); then
                  echo "ERROR: the second preserved-version release fix and its reviewed parent must both be linear commits." >&2
                  exit 1
                fi
                # BEGIN exact second preserved-version fix diff contract
                expected_fix_diff=(
                  M ".github/workflows/release-manager.yml"
                  M "scripts/ci/release_gate_test.py"
                  M "src/core/syswarden-cli/pkg/firewall/firewall_linux_golden_test.go"
                )
                mapfile -d '' -t actual_fix_diff < <(
                  git diff-tree --no-commit-id --name-status -r --no-renames -z HEAD^ HEAD
                )
                if (( ${#actual_fix_diff[@]} != ${#expected_fix_diff[@]} )); then
                  echo "ERROR: the second preserved-version release fix must modify exactly the three reviewed files." >&2
                  exit 1
                fi
                for ((index = 0; index < ${#expected_fix_diff[@]}; index++)); do
                  if [[ "${actual_fix_diff[index]}" != "${expected_fix_diff[index]}" ]]; then
                    echo "ERROR: the second preserved-version release fix contains an unauthorized path, status, or rename." >&2
                    exit 1
                  fi
                done
                fix_paths=(
                  ".github/workflows/release-manager.yml"
                  "scripts/ci/release_gate_test.py"
                  "src/core/syswarden-cli/pkg/firewall/firewall_linux_golden_test.go"
                )
                for tree_ref in HEAD^ HEAD; do
                  for fix_path in "${fix_paths[@]}"; do
                    tree_entry="$(git ls-tree "${tree_ref}" -- "${fix_path}")"
                    IFS=$' \t' read -r tree_mode tree_type tree_object tree_path tree_extra <<< "${tree_entry}"
                    if [[ "${tree_mode}" != "100644" || \
                          "${tree_type}" != "blob" || \
                          ! "${tree_object}" =~ ^[0-9a-f]{40}$ || \
                          "${tree_path}" != "${fix_path}" || \
                          -n "${tree_extra:-}" ]]; then
                      echo "ERROR: reviewed fix path ${fix_path} is not one exact 100644 blob at ${tree_ref}." >&2
                      exit 1
                    fi
                  done
                done
                # END exact second preserved-version fix diff contract
                git diff --quiet HEAD^ HEAD -- \
                  changelog.md \
                  src/core/syswarden-cli/pkg/system/upgrade.go \
                  src/core/syswarden-tui/main.go \
                  src/core/syswarden-cli/cmd/install.go \
                  src/core/syswarden-cli/config/default.go \
                  src/core/syswarden-cli/pkg/integration/webhook.go \
                  src/core/syswarden-core/webhook/discord.go \
                  README.md
                previous_fix_message="$(git log -1 --format=%B HEAD^)"
                ./scripts/versioning.sh validate-commit \
                  --repo "${GITHUB_WORKSPACE}" \
                  --base-ref "${previous_fix_parent_sha}" \
                  --commit-message "${previous_fix_message}"
                release_base_sha="$(git rev-parse HEAD^^^)"
                if [[ "${release_base_sha}" != "dfb8dfcf52bd1f82dcd2cd3b311119f01270af1e" ]]; then
                  echo "ERROR: the original v4.03.0 versioning parent is not the reviewed commit." >&2
                  exit 1
                fi
                versioning_commit_message="$(git log -1 --format=%B HEAD^^)"
                ./scripts/versioning.sh validate-commit \
                  --repo "${GITHUB_WORKSPACE}" \
                  --base-ref "${release_base_sha}" \
                  --tag-phase \
                  --commit-message "${versioning_commit_message}"
                ;;
              *)
                echo "ERROR: preserved-version release recovery is not authorized for parent ${current_parent_sha}." >&2
                exit 1
                ;;
              esac
            fi
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s scripts/ci \
            -p 'release_gate_test.py' \
            -v
          GOFLAGS=-mod=readonly go test \
            ./scripts/ci/update_manifest.go \
            ./scripts/ci/update_manifest_test.go

      - name: Resolve Exact Successful Upstream Runs
        id: upstream
        if: ${{ steps.context.outputs.candidate == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_QUALIFICATION_RUN_ID: ${{ steps.context.outputs.qualification_run_id }}
          RELEASE_SHA: ${{ steps.context.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          workflows=(
            "package.yml|syswarden-packages-${VERSION}"
            "security-audit.yml|syswarden-attested-bundle"
            "security-audit.yml|syswarden-sbom"
            "compliance.yml|plumber-report"
          )
          declare -A run_ids=()

          qualification_pages="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-qualification.yml/runs" \
            -f event=workflow_dispatch \
            -f branch=main \
            -f head_sha="${RELEASE_SHA}" \
            -f per_page=100)"
          qualification_matches="$(jq --arg sha "${RELEASE_SHA}" \
            '[.[] | .workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "success" and
              .run_attempt == 1
            )]' <<< "${qualification_pages}")"
          qualification_count="$(jq 'length' <<< "${qualification_matches}")"
          if [[ "${qualification_count}" -ne 1 ]]; then
            echo "ERROR: found ${qualification_count} completed successful attempt-1 release qualification runs for main/${RELEASE_SHA}; expected exactly one." >&2
            exit 1
          fi
          qualification_active_count="$(jq --arg sha "${RELEASE_SHA}" \
            '[.[] | .workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "workflow_dispatch" and
              .status != "completed"
            )] | length' <<< "${qualification_pages}")"
          if [[ "${qualification_active_count}" -ne 0 ]]; then
            echo "ERROR: ${qualification_active_count} concurrent release qualification runs remain active for main/${RELEASE_SHA}." >&2
            exit 1
          fi
          qualification_run_id="$(jq -r '.[0].id | tostring' <<< "${qualification_matches}")"
          if [[ "${qualification_run_id}" != "${REQUESTED_QUALIFICATION_RUN_ID}" ]]; then
            echo "ERROR: requested release qualification run ${REQUESTED_QUALIFICATION_RUN_ID} does not equal uniquely resolved run ${qualification_run_id}." >&2
            exit 1
          fi
          qualification_artifact_pages="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${qualification_run_id}/artifacts" \
            -f per_page=100)"
          qualification_artifacts="$(jq \
            '[.[] | .artifacts[] | select(.name == "syswarden-release-qualification")]' \
            <<< "${qualification_artifact_pages}")"
          if [[ "$(jq 'length' <<< "${qualification_artifacts}")" -ne 1 ]]; then
            echo "ERROR: release qualification run ${qualification_run_id} must expose exactly one syswarden-release-qualification artifact." >&2
            exit 1
          fi
          if [[ "$(jq -r '.[0].expired' <<< "${qualification_artifacts}")" != "false" || \
                "$(jq -r '.[0].size_in_bytes' <<< "${qualification_artifacts}")" -le 0 ]]; then
            echo "ERROR: syswarden-release-qualification from run ${qualification_run_id} is expired or empty." >&2
            exit 1
          fi
          qualification_artifact_id="$(jq -r '.[0].id | tostring' <<< "${qualification_artifacts}")"
          if [[ ! "${qualification_artifact_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: syswarden-release-qualification returned an invalid artifact ID." >&2
            exit 1
          fi
          echo "qualification_run_id=${qualification_run_id}" >> "${GITHUB_OUTPUT}"
          echo "Independently validated pre-tag release qualification run ${qualification_run_id} and artifact ${qualification_artifact_id}."

          validation_response="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/auto-versioning.yml/runs" \
            -f event=push \
            -f head_sha="${RELEASE_SHA}" \
            -f per_page=100)"
          validation_matches="$(jq --arg sha "${RELEASE_SHA}" \
            '[.[] | .workflow_runs[] | select(
              .head_sha == $sha and
              (.head_branch == "main" or .head_branch == "master") and
              .event == "push"
            )]' <<< "${validation_response}")"
          validation_count="$(jq 'length' <<< "${validation_matches}")"
          if [[ "${validation_count}" -ne 1 ]]; then
            echo "ERROR: found ${validation_count} Auto Versioning runs for ${RELEASE_SHA}; expected one." >&2
            exit 1
          fi
          validation_status="$(jq -r '.[0].status' <<< "${validation_matches}")"
          validation_conclusion="$(jq -r '.[0].conclusion // ""' <<< "${validation_matches}")"
          validation_id="$(jq -r '.[0].id' <<< "${validation_matches}")"
          if [[ "${validation_status}" != "completed" ]]; then
            echo "ERROR: exact Auto Versioning run ${validation_id} is still ${validation_status}." >&2
            exit 1
          fi
          if [[ "${validation_conclusion}" != "success" ]]; then
            echo "ERROR: exact Auto Versioning run ${validation_id} concluded ${validation_conclusion}." >&2
            exit 1
          fi
          echo "Validated Auto Versioning run ${validation_id} for ${RELEASE_SHA}."

          for specification in "${workflows[@]}"; do
            IFS='|' read -r workflow artifact <<< "${specification}"
            if [[ -n "${run_ids[${workflow}]:-}" ]]; then
              continue
            fi
            response="$(gh api --paginate --slurp --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f event=push \
              -f head_sha="${RELEASE_SHA}" \
              -f per_page=100)"
            matches="$(jq --arg sha "${RELEASE_SHA}" --arg tag "${RELEASE_TAG}" \
              '[.[] | .workflow_runs[] | select(
                .head_sha == $sha and
                .head_branch == $tag and
                .event == "push"
              )]' <<< "${response}")"
            count="$(jq 'length' <<< "${matches}")"
            if [[ "${count}" -ne 1 ]]; then
              echo "ERROR: found ${count} ${workflow} runs for ${RELEASE_TAG}/${RELEASE_SHA}; expected one." >&2
              exit 1
            fi
            status="$(jq -r '.[0].status' <<< "${matches}")"
            conclusion="$(jq -r '.[0].conclusion // ""' <<< "${matches}")"
            run_id="$(jq -r '.[0].id' <<< "${matches}")"
            if [[ "${status}" != "completed" ]]; then
              echo "ERROR: exact ${workflow} run ${run_id} is still ${status}." >&2
              exit 1
            fi
            if [[ "${conclusion}" != "success" ]]; then
              echo "ERROR: exact ${workflow} run ${run_id} concluded ${conclusion}." >&2
              exit 1
            fi
            run_ids["${workflow}"]="${run_id}"
            echo "Validated ${workflow} run ${run_id} for ${RELEASE_TAG}/${RELEASE_SHA}."
          done

          mkdir -p incoming
          qualification_root="${RUNNER_TEMP}/syswarden-release-qualification-stage"
          mkdir "${qualification_root}"
          gh run download "${qualification_run_id}" \
            --name syswarden-release-qualification \
            --dir "${qualification_root}"
          for specification in "${workflows[@]}"; do
            IFS='|' read -r workflow artifact <<< "${specification}"
            run_id="${run_ids[${workflow}]}"
            artifact_response="$(gh api --paginate --slurp --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              -f per_page=100)"
            artifact_matches="$(jq --arg name "${artifact}" \
              '[.[] | .artifacts[] | select(.name == $name)]' <<< "${artifact_response}")"
            artifact_count="$(jq 'length' <<< "${artifact_matches}")"
            if [[ "${artifact_count}" -ne 1 ]]; then
              echo "ERROR: run ${run_id} has ${artifact_count} artifacts named ${artifact}; expected one." >&2
              exit 1
            fi
            expired="$(jq -r '.[0].expired' <<< "${artifact_matches}")"
            size="$(jq -r '.[0].size_in_bytes' <<< "${artifact_matches}")"
            if [[ "${expired}" != "false" || "${size}" -le 0 ]]; then
              echo "ERROR: artifact ${artifact} is expired or empty." >&2
              exit 1
            fi
            destination="incoming/${artifact}"
            mkdir "${destination}"
            gh run download "${run_id}" \
              --name "${artifact}" \
              --dir "${destination}"
          done
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Revalidate Exact Pre-Tag Qualification and Candidate Packages
        if: ${{ steps.upstream.outputs.ready == 'true' }}
        shell: bash
        env:
          QUALIFICATION_RUN_ID: ${{ steps.upstream.outputs.qualification_run_id }}
          RELEASE_SHA: ${{ steps.context.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
        run: |
          set -euo pipefail
          QUALIFICATION_ROOT="${RUNNER_TEMP}/syswarden-release-qualification-stage"
          VERSION="${RELEASE_TAG#v}"
          SIGNED_UPDATE_REQUIRED="$(PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            requires-signed-update --tag "${RELEASE_TAG}")"

          test -s "${QUALIFICATION_ROOT}/qualification-context.json"
          test -s "${QUALIFICATION_ROOT}/status/qualification-exit-codes.json"
          test -s "${QUALIFICATION_ROOT}/EVIDENCE_SHA256SUMS.txt"
          test -z "$(find "${QUALIFICATION_ROOT}" -type l -print -quit)"
          test -z "$(find "${QUALIFICATION_ROOT}" -mindepth 1 ! -type f ! -type d -print -quit)"
          qualification_root_directories=(aggregate bound packages raw status)
          qualification_all_directories=(aggregate bound packages packages/candidate packages/previous raw status)
          qualification_raw_files=(
            nftables-raw.json
            package-lifecycle-amd64.json
            package-lifecycle-arm64.json
            package-lifecycle-raw.json
          )
          if [[ "${SIGNED_UPDATE_REQUIRED}" == "true" ]]; then
            qualification_root_directories+=(update)
            qualification_all_directories+=(update)
          else
            test ! -e "${QUALIFICATION_ROOT}/update"
          fi
          diff -u \
            <(printf '%s\n' EVIDENCE_SHA256SUMS.txt qualification-context.json | LC_ALL=C sort) \
            <(find "${QUALIFICATION_ROOT}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' "${qualification_root_directories[@]}" | LC_ALL=C sort) \
            <(find "${QUALIFICATION_ROOT}" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' "${qualification_all_directories[@]}" | LC_ALL=C sort) \
            <(find "${QUALIFICATION_ROOT}" -mindepth 1 -type d -printf '%P\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' release-qualification.json) \
            <(find "${QUALIFICATION_ROOT}/aggregate" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' "${qualification_raw_files[@]}" | LC_ALL=C sort) \
            <(find "${QUALIFICATION_ROOT}/raw" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' nftables-bound.json package-lifecycle-bound.json | LC_ALL=C sort) \
            <(find "${QUALIFICATION_ROOT}/bound" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' candidate previous | LC_ALL=C sort) \
            <(find "${QUALIFICATION_ROOT}/packages" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' qualification-exit-codes.json) \
            <(find "${QUALIFICATION_ROOT}/status" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "${SIGNED_UPDATE_REQUIRED}" == "true" ]]; then
            diff -u \
              <(printf '%s\n' syswarden-update-manifest-v1.json syswarden-update-manifest-v1.json.sig | LC_ALL=C sort) \
              <(find "${QUALIFICATION_ROOT}/update" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
            env -u SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY GOFLAGS=-mod=readonly \
              go run ./scripts/ci/update_manifest.go verify \
                --repository "${GITHUB_WORKSPACE}" \
                --tag "${RELEASE_TAG}" \
                --packages "${QUALIFICATION_ROOT}/packages/candidate" \
                --manifest "${QUALIFICATION_ROOT}/update/syswarden-update-manifest-v1.json" \
                --signature "${QUALIFICATION_ROOT}/update/syswarden-update-manifest-v1.json.sig"
          fi
          (
            cd "${QUALIFICATION_ROOT}"
            diff -u \
              <(sed -E -n 's#^[0-9a-f]{64}  (\./)?##p' EVIDENCE_SHA256SUMS.txt | LC_ALL=C sort) \
              <(find . -type f ! -name EVIDENCE_SHA256SUMS.txt -printf '%P\n' | LC_ALL=C sort)
            sha256sum --check --strict EVIDENCE_SHA256SUMS.txt
          )
          jq --exit-status \
            --slurpfile aggregate "${QUALIFICATION_ROOT}/aggregate/release-qualification.json" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg release_sha "${RELEASE_SHA}" \
            '(keys | sort) == [
              "candidate_package_artifact_id",
              "candidate_package_artifact_name",
              "candidate_package_run_id",
              "candidate_package_workflow",
              "previous_package_asset_ids",
              "previous_release_id",
              "previous_tag",
              "release_sha",
              "release_tag",
              "repository",
              "schema_version"
            ] and
            .schema_version == 1 and
            .repository == $repository and
            .release_tag == $release_tag and
            .release_sha == $release_sha and
            .candidate_package_workflow == "package.yml" and
            .candidate_package_artifact_name ==
              ("syswarden-packages-" + ($release_tag | ltrimstr("v"))) and
            (.candidate_package_run_id | type) == "number" and
            .candidate_package_run_id > 0 and
            (.candidate_package_artifact_id | type) == "number" and
            .candidate_package_artifact_id > 0 and
            (.previous_release_id | type) == "number" and
            .previous_release_id > 0 and
            (.previous_tag | type) == "string" and
            .previous_tag == $aggregate[0].bindings.previous_version and
            (.previous_package_asset_ids | type) == "array" and
            (.previous_package_asset_ids | length) == 7 and
            ([.previous_package_asset_ids[].name] | unique | length) == 7 and
            all(.previous_package_asset_ids[];
              (keys | sort) == ["id", "name"] and
              (.id | type) == "number" and .id > 0 and
              (.name | type) == "string" and (.name | length) > 0
            )' "${QUALIFICATION_ROOT}/qualification-context.json"
          candidate_run_id="$(jq -r '.candidate_package_run_id' \
            "${QUALIFICATION_ROOT}/qualification-context.json")"
          candidate_artifact_id="$(jq -r '.candidate_package_artifact_id' \
            "${QUALIFICATION_ROOT}/qualification-context.json")"
          candidate_artifact_name="$(jq -r '.candidate_package_artifact_name' \
            "${QUALIFICATION_ROOT}/qualification-context.json")"
          previous_release_id="$(jq -r '.previous_release_id' \
            "${QUALIFICATION_ROOT}/qualification-context.json")"
          jq --exit-status '
            (keys | sort) == ([
              "adapter_build",
              "adapter_verify",
              "gate_generate",
              "gate_verify",
              "nftables_lab",
              "package_lab"
            ] | sort) and all(.[]; . == 0)
          ' "${QUALIFICATION_ROOT}/status/qualification-exit-codes.json"

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_adapter.py verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-version "${RELEASE_TAG}" \
            --candidate-packages-dir "${QUALIFICATION_ROOT}/packages/candidate" \
            --previous-packages-dir "${QUALIFICATION_ROOT}/packages/previous" \
            --nft-raw "${QUALIFICATION_ROOT}/raw/nftables-raw.json" \
            --package-raw "${QUALIFICATION_ROOT}/raw/package-lifecycle-raw.json" \
            --package-amd64-shard "${QUALIFICATION_ROOT}/raw/package-lifecycle-amd64.json" \
            --package-arm64-shard "${QUALIFICATION_ROOT}/raw/package-lifecycle-arm64.json" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-workflow-run-id "${QUALIFICATION_RUN_ID}" \
            --expected-workflow-run-attempt 1 \
            --expected-candidate-run-id "${candidate_run_id}" \
            --expected-candidate-artifact-id "${candidate_artifact_id}" \
            --expected-candidate-artifact-name "${candidate_artifact_name}" \
            --expected-previous-release-id "${previous_release_id}" \
            --max-age-seconds 172800 \
            --max-report-skew-seconds 0 \
            --nft-envelope "${QUALIFICATION_ROOT}/bound/nftables-bound.json" \
            --package-envelope "${QUALIFICATION_ROOT}/bound/package-lifecycle-bound.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_gate.py verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-version "${RELEASE_TAG}" \
            --candidate-packages-dir "${QUALIFICATION_ROOT}/packages/candidate" \
            --nft-report "${QUALIFICATION_ROOT}/bound/nftables-bound.json" \
            --package-report "${QUALIFICATION_ROOT}/bound/package-lifecycle-bound.json" \
            --max-age-seconds 172800 \
            --max-report-skew-seconds 0 \
            --aggregate "${QUALIFICATION_ROOT}/aggregate/release-qualification.json" \
            --require-tag

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py verify-packages \
            --tag "${RELEASE_TAG}" \
            --packages "incoming/syswarden-packages-${VERSION}"
          package_names=(
            "syswarden_${VERSION}_amd64.deb"
            "syswarden_${VERSION}_arm64.deb"
            "syswarden-${VERSION}-1.x86_64.rpm"
            "syswarden-${VERSION}-1.aarch64.rpm"
            "syswarden_${VERSION}_x86_64.apk"
            "syswarden_${VERSION}_aarch64.apk"
            "SHA256SUMS.txt"
          )
          for package_name in "${package_names[@]}"; do
            cmp --silent \
              "${QUALIFICATION_ROOT}/packages/candidate/${package_name}" \
              "incoming/syswarden-packages-${VERSION}/${package_name}"
          done
          echo "Qualification run ${QUALIFICATION_RUN_ID} and the exact tag package bytes are release-ready."

      - name: Validate and Assemble Exact Release Inventory
        if: ${{ steps.upstream.outputs.ready == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          SIGNED_UPDATE_REQUIRED="$(PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            requires-signed-update --tag "${RELEASE_TAG}")"
          mkdir -p release_payload
          update_manifest_arguments=()
          if [[ "${SIGNED_UPDATE_REQUIRED}" == "true" ]]; then
            update_manifest_arguments=(
              --update-manifest-dir
              "${RUNNER_TEMP}/syswarden-release-qualification-stage/update"
            )
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py prepare \
            --repository "${GITHUB_WORKSPACE}" \
            --tag "${RELEASE_TAG}" \
            --packages "incoming/syswarden-packages-${VERSION}" \
            --bundle incoming/syswarden-attested-bundle \
            --sbom incoming/syswarden-sbom \
            --compliance incoming/plumber-report \
            --output release_payload/assets \
            --notes-output release_payload/release_notes.md \
            "${update_manifest_arguments[@]}"
          echo "----- BEGIN VALIDATED RELEASE NOTES -----"
          sed -n '1,240p' release_payload/release_notes.md
          echo "----- END VALIDATED RELEASE NOTES -----"
          echo "----- BEGIN VALIDATED RELEASE CHECKSUMS -----"
          cat release_payload/assets/RELEASE_SHA256SUMS.txt
          echo "----- END VALIDATED RELEASE CHECKSUMS -----"

      - name: Upload Validated Release Payload
        if: ${{ steps.upstream.outputs.ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release-${{ steps.context.outputs.release_tag }}-${{ steps.context.outputs.release_sha }}
          path: release_payload/
          if-no-files-found: error
          retention-days: 30

  attest-and-publish:
    name: Attest and Publish Validated Release
    needs:
      - validate-and-stage
    if: ${{ github.event_name == 'workflow_dispatch' && needs.validate-and-stage.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: syswarden-release-production
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Require Protected Maintainer Release Environment
        if: ${{ env.ACT != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/environments/syswarden-release-production")"
          required_environment_boolean() {
            local field="${1:?environment boolean field is required}"
            jq -er --arg field "${field}" '
              .deployment_branch_policy[$field] |
              if type == "boolean" then
                tostring
              else
                error("deployment_branch_policy." + $field + " must be boolean")
              end
            ' <<< "${environment_json}"
          }
          required_top_level_environment_boolean() {
            local field="${1:?environment boolean field is required}"
            jq -er --arg field "${field}" '
              .[$field] |
              if type == "boolean" then
                tostring
              else
                error($field + " must be boolean")
              end
            ' <<< "${environment_json}"
          }
          environment_name="$(jq -r '.name // ""' <<< "${environment_json}")"
          reviewer_rule_count="$(jq --arg owner "${GITHUB_REPOSITORY_OWNER}" '[
            .protection_rules[]? |
            select(
              .type == "required_reviewers" and
              .prevent_self_review == false and
              (.reviewers | type) == "array" and
              (.reviewers | length) == 1 and
              .reviewers[0].type == "User" and
              .reviewers[0].reviewer.login == $owner
            )
          ] | length' <<< "${environment_json}")"
          branch_policy_rule_count="$(jq '[
            .protection_rules[]? | select(.type == "branch_policy")
          ] | length' <<< "${environment_json}")"
          protection_rule_count="$(jq '[.protection_rules[]?] | length' \
            <<< "${environment_json}")"
          protected_branches="$(required_environment_boolean \
            "protected_branches")"
          custom_branch_policies="$(required_environment_boolean \
            "custom_branch_policies")"
          can_admins_bypass="$(required_top_level_environment_boolean \
            "can_admins_bypass")"
          if [[ "${environment_name}" != "syswarden-release-production" || \
                "${reviewer_rule_count}" != "1" || \
                "${branch_policy_rule_count}" != "1" || \
                "${protection_rule_count}" != "2" || \
                "${protected_branches}" != "false" || \
                "${custom_branch_policies}" != "true" || \
                "${can_admins_bypass}" != "false" ]]; then
            echo "ERROR: syswarden-release-production must forbid administrator bypass, require exactly one approval from the repository owner, and allow one custom tag policy." >&2
            echo "Publication is blocked until the maintainer configures that GitHub Environment." >&2
            exit 1
          fi
          policies_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/environments/syswarden-release-production/deployment-branch-policies" \
            -f per_page=100)"
          declared_policy_count="$(jq -r '.[0].total_count' <<< "${policies_json}")"
          policy_count="$(jq '[.[] | .branch_policies[]?] | length' <<< "${policies_json}")"
          release_tag_policy_count="$(jq '[
            .[] | .branch_policies[]? |
            select(.name == "v*" and .type == "tag")
          ] | length' <<< "${policies_json}")"
          if [[ "${declared_policy_count}" != "1" || \
                "${policy_count}" != "1" || \
                "${release_tag_policy_count}" != "1" ]]; then
            echo "ERROR: syswarden-release-production must allow deployments from v* tags only." >&2
            exit 1
          fi
          echo "Protected maintainer release environment is configured."

      - name: Checkout Exact Release Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate-and-stage.outputs.release_sha }}

      - name: Set Up Go for Signed Update Verification
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Download Validated Release Payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-${{ needs.validate-and-stage.outputs.release_tag }}-${{ needs.validate-and-stage.outputs.release_sha }}
          path: release_payload

      - name: Re-resolve and Download Original Qualification Evidence by Run ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ needs.validate-and-stage.outputs.qualification_run_id }}
          RELEASE_SHA: ${{ needs.validate-and-stage.outputs.release_sha }}
          REQUESTED_QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "${QUALIFICATION_RUN_ID}" =~ ^[1-9][0-9]*$ || \
                "${QUALIFICATION_RUN_ID}" != "${REQUESTED_QUALIFICATION_RUN_ID}" ]]; then
            echo "ERROR: privileged publisher did not receive the exact validated qualification run ID." >&2
            exit 1
          fi

          qualification_run="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}")"
          if ! jq -e \
            --argjson run_id "${QUALIFICATION_RUN_ID}" \
            --arg sha "${RELEASE_SHA}" \
            '.id == $run_id and
             .path == ".github/workflows/release-qualification.yml" and
             .head_sha == $sha and
             .head_branch == "main" and
             .event == "workflow_dispatch" and
             .status == "completed" and
             .conclusion == "success" and
             .run_attempt == 1' <<< "${qualification_run}" >/dev/null; then
            echo "ERROR: qualification run ${QUALIFICATION_RUN_ID} no longer satisfies the exact immutable run contract." >&2
            exit 1
          fi

          qualification_pages="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-qualification.yml/runs" \
            -f event=workflow_dispatch \
            -f branch=main \
            -f head_sha="${RELEASE_SHA}" \
            -f per_page=100)"
          qualification_matches="$(jq --arg sha "${RELEASE_SHA}" \
            '[.[] | .workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "success" and
              .run_attempt == 1
            )]' <<< "${qualification_pages}")"
          if [[ "$(jq 'length' <<< "${qualification_matches}")" -ne 1 || \
                "$(jq -r '.[0].id | tostring' <<< "${qualification_matches}")" != "${QUALIFICATION_RUN_ID}" ]]; then
            echo "ERROR: qualification run ${QUALIFICATION_RUN_ID} is no longer the unique completed successful attempt-1 run." >&2
            exit 1
          fi
          qualification_active_count="$(jq --arg sha "${RELEASE_SHA}" \
            '[.[] | .workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "workflow_dispatch" and
              .status != "completed"
            )] | length' <<< "${qualification_pages}")"
          if [[ "${qualification_active_count}" -ne 0 ]]; then
            echo "ERROR: ${qualification_active_count} concurrent release qualification runs remain active for main/${RELEASE_SHA}." >&2
            exit 1
          fi

          qualification_artifact_pages="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}/artifacts" \
            -f per_page=100)"
          qualification_artifacts="$(jq \
            '[.[] | .artifacts[] | select(.name == "syswarden-release-qualification")]' \
            <<< "${qualification_artifact_pages}")"
          if [[ "$(jq 'length' <<< "${qualification_artifacts}")" -ne 1 || \
                "$(jq -r '.[0].expired' <<< "${qualification_artifacts}")" != "false" || \
                "$(jq -r '.[0].size_in_bytes' <<< "${qualification_artifacts}")" -le 0 ]]; then
            echo "ERROR: qualification run ${QUALIFICATION_RUN_ID} no longer exposes exactly one non-expired, non-empty original artifact." >&2
            exit 1
          fi
          qualification_artifact_id="$(jq -r '.[0].id | tostring' <<< "${qualification_artifacts}")"
          if [[ ! "${qualification_artifact_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: exact qualification artifact ID is invalid." >&2
            exit 1
          fi
          qualification_artifact="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${qualification_artifact_id}")"
          if ! jq -e \
            --argjson artifact_id "${qualification_artifact_id}" \
            --argjson run_id "${QUALIFICATION_RUN_ID}" \
            '.id == $artifact_id and
             .name == "syswarden-release-qualification" and
             .expired == false and
             .size_in_bytes > 0 and
             .workflow_run.id == $run_id' <<< "${qualification_artifact}" >/dev/null; then
            echo "ERROR: qualification artifact ${qualification_artifact_id} no longer belongs to exact run ${QUALIFICATION_RUN_ID}." >&2
            exit 1
          fi

          qualification_root="${RUNNER_TEMP}/syswarden-release-qualification-privileged"
          mkdir "${qualification_root}"
          gh run download "${QUALIFICATION_RUN_ID}" \
            --name syswarden-release-qualification \
            --dir "${qualification_root}"

      - name: Revalidate Tag Context and Payload in Privileged Job
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          QUALIFICATION_RUN_ID: ${{ needs.validate-and-stage.outputs.qualification_run_id }}
          RELEASE_SHA: ${{ needs.validate-and-stage.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.validate-and-stage.outputs.release_tag }}
          REQUESTED_QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          SIGNED_UPDATE_REQUIRED="$(PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            requires-signed-update --tag "${RELEASE_TAG}")"
          if [[ "${EVENT_NAME}" != "workflow_dispatch" || \
                "${EVENT_REF_TYPE}" != "tag" || \
                "${EVENT_REF_NAME}" != "${RELEASE_TAG}" || \
                "${EVENT_REF}" != "refs/tags/${RELEASE_TAG}" || \
                "${EVENT_SHA}" != "${RELEASE_SHA}" || \
                "${REQUESTED_TAG}" != "${RELEASE_TAG}" || \
                "${REQUESTED_SHA}" != "${RELEASE_SHA}" || \
                "${REQUESTED_QUALIFICATION_RUN_ID}" != "${QUALIFICATION_RUN_ID}" ]]; then
            echo "ERROR: privileged publisher context is not the validated tag and SHA." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${RELEASE_SHA}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main

          remote_refs="$(git ls-remote --exit-code origin \
            "refs/tags/${RELEASE_TAG}" \
            "refs/tags/${RELEASE_TAG}^{}")"
          remote_tag_sha=""
          while IFS=$'\t' read -r object_sha ref_name; do
            case "${ref_name}" in
              "refs/tags/${RELEASE_TAG}")
                if [[ -z "${remote_tag_sha}" ]]; then
                  remote_tag_sha="${object_sha}"
                fi
                ;;
              "refs/tags/${RELEASE_TAG}^{}")
                remote_tag_sha="${object_sha}"
                ;;
            esac
          done <<< "${remote_refs}"
          if [[ "${remote_tag_sha}" != "${RELEASE_SHA}" ]]; then
            echo "ERROR: remote tag ${RELEASE_TAG} now resolves to ${remote_tag_sha:-nothing}, expected ${RELEASE_SHA}." >&2
            exit 1
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py verify \
            --repository "${GITHUB_WORKSPACE}" \
            --tag "${RELEASE_TAG}" \
            --assets release_payload/assets
          test -s release_payload/release_notes.md

          QUALIFICATION_ROOT="${RUNNER_TEMP}/syswarden-release-qualification-privileged"
          VERSION="${RELEASE_TAG#v}"
          test -s "${QUALIFICATION_ROOT}/qualification-context.json"
          test -s "${QUALIFICATION_ROOT}/status/qualification-exit-codes.json"
          test -s "${QUALIFICATION_ROOT}/EVIDENCE_SHA256SUMS.txt"
          test -z "$(find "${QUALIFICATION_ROOT}" -type l -print -quit)"
          test -z "$(find "${QUALIFICATION_ROOT}" -mindepth 1 ! -type f ! -type d -print -quit)"
          qualification_root_directories=(aggregate bound packages raw status)
          qualification_all_directories=(aggregate bound packages packages/candidate packages/previous raw status)
          qualification_raw_files=(
            nftables-raw.json
            package-lifecycle-amd64.json
            package-lifecycle-arm64.json
            package-lifecycle-raw.json
          )
          if [[ "${SIGNED_UPDATE_REQUIRED}" == "true" ]]; then
            qualification_root_directories+=(update)
            qualification_all_directories+=(update)
          else
            test ! -e "${QUALIFICATION_ROOT}/update"
          fi
          diff -u \
            <(printf '%s\n' EVIDENCE_SHA256SUMS.txt qualification-context.json | LC_ALL=C sort) \
            <(find "${QUALIFICATION_ROOT}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' "${qualification_root_directories[@]}" | LC_ALL=C sort) \
            <(find "${QUALIFICATION_ROOT}" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' "${qualification_all_directories[@]}" | LC_ALL=C sort) \
            <(find "${QUALIFICATION_ROOT}" -mindepth 1 -type d -printf '%P\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' release-qualification.json) \
            <(find "${QUALIFICATION_ROOT}/aggregate" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' "${qualification_raw_files[@]}" | LC_ALL=C sort) \
            <(find "${QUALIFICATION_ROOT}/raw" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' nftables-bound.json package-lifecycle-bound.json | LC_ALL=C sort) \
            <(find "${QUALIFICATION_ROOT}/bound" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' candidate previous | LC_ALL=C sort) \
            <(find "${QUALIFICATION_ROOT}/packages" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort)
          diff -u \
            <(printf '%s\n' qualification-exit-codes.json) \
            <(find "${QUALIFICATION_ROOT}/status" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "${SIGNED_UPDATE_REQUIRED}" == "true" ]]; then
            diff -u \
              <(printf '%s\n' syswarden-update-manifest-v1.json syswarden-update-manifest-v1.json.sig | LC_ALL=C sort) \
              <(find "${QUALIFICATION_ROOT}/update" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
            env -u SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY GOFLAGS=-mod=readonly \
              go run ./scripts/ci/update_manifest.go verify \
                --repository "${GITHUB_WORKSPACE}" \
                --tag "${RELEASE_TAG}" \
                --packages "${QUALIFICATION_ROOT}/packages/candidate" \
                --manifest "${QUALIFICATION_ROOT}/update/syswarden-update-manifest-v1.json" \
                --signature "${QUALIFICATION_ROOT}/update/syswarden-update-manifest-v1.json.sig"
          fi
          (
            cd "${QUALIFICATION_ROOT}"
            diff -u \
              <(sed -E -n 's#^[0-9a-f]{64}  (\./)?##p' EVIDENCE_SHA256SUMS.txt | LC_ALL=C sort) \
              <(find . -type f ! -name EVIDENCE_SHA256SUMS.txt -printf '%P\n' | LC_ALL=C sort)
            sha256sum --check --strict EVIDENCE_SHA256SUMS.txt
          )
          jq --exit-status \
            --slurpfile aggregate "${QUALIFICATION_ROOT}/aggregate/release-qualification.json" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg release_sha "${RELEASE_SHA}" \
            '(keys | sort) == [
              "candidate_package_artifact_id",
              "candidate_package_artifact_name",
              "candidate_package_run_id",
              "candidate_package_workflow",
              "previous_package_asset_ids",
              "previous_release_id",
              "previous_tag",
              "release_sha",
              "release_tag",
              "repository",
              "schema_version"
            ] and
            .schema_version == 1 and
            .repository == $repository and
            .release_tag == $release_tag and
            .release_sha == $release_sha and
            .candidate_package_workflow == "package.yml" and
            .candidate_package_artifact_name ==
              ("syswarden-packages-" + ($release_tag | ltrimstr("v"))) and
            (.candidate_package_run_id | type) == "number" and
            .candidate_package_run_id > 0 and
            (.candidate_package_artifact_id | type) == "number" and
            .candidate_package_artifact_id > 0 and
            (.previous_release_id | type) == "number" and
            .previous_release_id > 0 and
            (.previous_tag | type) == "string" and
            .previous_tag == $aggregate[0].bindings.previous_version and
            (.previous_package_asset_ids | type) == "array" and
            (.previous_package_asset_ids | length) == 7 and
            ([.previous_package_asset_ids[].name] | unique | length) == 7 and
            all(.previous_package_asset_ids[];
              (keys | sort) == ["id", "name"] and
              (.id | type) == "number" and .id > 0 and
              (.name | type) == "string" and (.name | length) > 0
            )' "${QUALIFICATION_ROOT}/qualification-context.json"
          candidate_run_id="$(jq -r '.candidate_package_run_id' \
            "${QUALIFICATION_ROOT}/qualification-context.json")"
          candidate_artifact_id="$(jq -r '.candidate_package_artifact_id' \
            "${QUALIFICATION_ROOT}/qualification-context.json")"
          candidate_artifact_name="$(jq -r '.candidate_package_artifact_name' \
            "${QUALIFICATION_ROOT}/qualification-context.json")"
          previous_release_id="$(jq -r '.previous_release_id' \
            "${QUALIFICATION_ROOT}/qualification-context.json")"
          jq --exit-status '
            (keys | sort) == ([
              "adapter_build",
              "adapter_verify",
              "gate_generate",
              "gate_verify",
              "nftables_lab",
              "package_lab"
            ] | sort) and all(.[]; . == 0)
          ' "${QUALIFICATION_ROOT}/status/qualification-exit-codes.json"

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_adapter.py verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-version "${RELEASE_TAG}" \
            --candidate-packages-dir "${QUALIFICATION_ROOT}/packages/candidate" \
            --previous-packages-dir "${QUALIFICATION_ROOT}/packages/previous" \
            --nft-raw "${QUALIFICATION_ROOT}/raw/nftables-raw.json" \
            --package-raw "${QUALIFICATION_ROOT}/raw/package-lifecycle-raw.json" \
            --package-amd64-shard "${QUALIFICATION_ROOT}/raw/package-lifecycle-amd64.json" \
            --package-arm64-shard "${QUALIFICATION_ROOT}/raw/package-lifecycle-arm64.json" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-workflow-run-id "${QUALIFICATION_RUN_ID}" \
            --expected-workflow-run-attempt 1 \
            --expected-candidate-run-id "${candidate_run_id}" \
            --expected-candidate-artifact-id "${candidate_artifact_id}" \
            --expected-candidate-artifact-name "${candidate_artifact_name}" \
            --expected-previous-release-id "${previous_release_id}" \
            --max-age-seconds 172800 \
            --max-report-skew-seconds 0 \
            --nft-envelope "${QUALIFICATION_ROOT}/bound/nftables-bound.json" \
            --package-envelope "${QUALIFICATION_ROOT}/bound/package-lifecycle-bound.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_gate.py verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-version "${RELEASE_TAG}" \
            --candidate-packages-dir "${QUALIFICATION_ROOT}/packages/candidate" \
            --nft-report "${QUALIFICATION_ROOT}/bound/nftables-bound.json" \
            --package-report "${QUALIFICATION_ROOT}/bound/package-lifecycle-bound.json" \
            --max-age-seconds 172800 \
            --max-report-skew-seconds 0 \
            --aggregate "${QUALIFICATION_ROOT}/aggregate/release-qualification.json" \
            --require-tag

          package_names=(
            "syswarden_${VERSION}_amd64.deb"
            "syswarden_${VERSION}_arm64.deb"
            "syswarden-${VERSION}-1.x86_64.rpm"
            "syswarden-${VERSION}-1.aarch64.rpm"
            "syswarden_${VERSION}_x86_64.apk"
            "syswarden_${VERSION}_aarch64.apk"
            "SHA256SUMS.txt"
          )
          for package_name in "${package_names[@]}"; do
            cmp --silent \
              "${QUALIFICATION_ROOT}/packages/candidate/${package_name}" \
              "release_payload/assets/${package_name}"
          done
          if [[ "${SIGNED_UPDATE_REQUIRED}" == "true" ]]; then
            for update_asset in \
              syswarden-update-manifest-v1.json \
              syswarden-update-manifest-v1.json.sig; do
              cmp --silent \
                "${QUALIFICATION_ROOT}/update/${update_asset}" \
                "release_payload/assets/${update_asset}"
            done
          fi
          echo "Privileged revalidation retained qualification run ${QUALIFICATION_RUN_ID} and exact candidate package bytes."

      - name: Detect and Validate Existing Release
        id: existing
        if: ${{ env.ACT != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate-and-stage.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.validate-and-stage.outputs.release_tag }}
        run: |
          set -euo pipefail
          {
            echo "public=false"
            echo "draft=false"
          } >> "${GITHUB_OUTPUT}"
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            exit 0
          fi

          metadata="$(gh release view "${RELEASE_TAG}" \
            --json tagName,isDraft,isPrerelease,body)"
          if [[ "$(jq -r '.tagName' <<< "${metadata}")" != "${RELEASE_TAG}" || \
                "$(jq -r '.isPrerelease' <<< "${metadata}")" != "false" ]]; then
            echo "ERROR: existing release metadata is inconsistent with the validated candidate." >&2
            exit 1
          fi
          jq -j '.body' <<< "${metadata}" > existing_release_notes.md
          cmp --silent release_payload/release_notes.md existing_release_notes.md || {
            echo "ERROR: existing release notes differ from the validated changelog block." >&2
            exit 1
          }

          if [[ "$(jq -r '.isDraft' <<< "${metadata}")" == "true" ]]; then
            echo "A matching draft exists and must pass exact remote validation before publication."
            echo "draft=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mkdir existing_release_assets
          gh release download "${RELEASE_TAG}" --dir existing_release_assets
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py verify \
            --repository "${GITHUB_WORKSPACE}" \
            --tag "${RELEASE_TAG}" \
            --assets existing_release_assets
          diff --no-index \
            release_payload/assets/RELEASE_SHA256SUMS.txt \
            existing_release_assets/RELEASE_SHA256SUMS.txt
          bash scripts/ci/verify_release_attestations.sh \
            existing_release_assets \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REPOSITORY}/.github/workflows/release-manager.yml" \
            "${RELEASE_SHA}"
          echo "Existing release ${RELEASE_TAG} already matches the validated payload exactly."
          echo "public=true" >> "${GITHUB_OUTPUT}"

      - name: Bind Attestation OIDC Context to the Exact Release Commit
        if: ${{ env.ACT != 'true' && steps.existing.outputs.public != 'true' }}
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ needs.validate-and-stage.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "ERROR: workflow_dispatch OIDC context ${EVENT_SHA} does not equal release ${RELEASE_SHA}." >&2
            echo "Refusing to attest assets with provenance for a different source commit." >&2
            exit 1
          fi

      - name: Generate GitHub Build Provenance Attestations
        if: ${{ env.ACT != 'true' && steps.existing.outputs.public != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release_payload/assets/*

      - name: Create Private Draft Release
        if: ${{ env.ACT != 'true' && steps.existing.outputs.public != 'true' && steps.existing.outputs.draft != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-and-stage.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --draft \
            --notes-file release_payload/release_notes.md \
            release_payload/assets/*

      - name: Verify Private Draft Assets Before Publication
        if: ${{ env.ACT != 'true' && steps.existing.outputs.public != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate-and-stage.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.validate-and-stage.outputs.release_tag }}
        run: |
          set -euo pipefail
          metadata="$(gh release view "${RELEASE_TAG}" --json tagName,isDraft,isPrerelease,body)"
          if [[ "$(jq -r '.tagName' <<< "${metadata}")" != "${RELEASE_TAG}" || \
                "$(jq -r '.isDraft' <<< "${metadata}")" != "true" || \
                "$(jq -r '.isPrerelease' <<< "${metadata}")" != "false" ]]; then
            echo "ERROR: private draft metadata is inconsistent." >&2
            exit 1
          fi
          jq -j '.body' <<< "${metadata}" > draft_release_notes.md
          cmp --silent release_payload/release_notes.md draft_release_notes.md
          mkdir draft_release_assets
          gh release download "${RELEASE_TAG}" --dir draft_release_assets
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py verify \
            --repository "${GITHUB_WORKSPACE}" \
            --tag "${RELEASE_TAG}" \
            --assets draft_release_assets
          diff --no-index \
            release_payload/assets/RELEASE_SHA256SUMS.txt \
            draft_release_assets/RELEASE_SHA256SUMS.txt
          bash scripts/ci/verify_release_attestations.sh \
            draft_release_assets \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REPOSITORY}/.github/workflows/release-manager.yml" \
            "${RELEASE_SHA}"

      - name: Require Immutable Release Tag Ruleset Before Publication
        if: ${{ env.ACT != 'true' }}
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.validate-and-stage.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.validate-and-stage.outputs.release_tag }}
          # GitHub omits bypass_actors without ruleset write access. This
          # protected GitHub App/fine-grained PAT credential is used only for
          # the two read-only GET requests in this step.
          RULESET_READ_TOKEN: ${{ secrets.SYSWARDEN_RULESET_READ_TOKEN }}
        run: |
          set -euo pipefail
          readonly ruleset_name="syswarden-release-tags-immutable"
          if [[ -z "${RULESET_READ_TOKEN}" ]]; then
            echo "ERROR: protected-environment secret SYSWARDEN_RULESET_READ_TOKEN must be a GitHub App or fine-grained PAT credential with Repository Administration: write and is used only for read-only GET requests." >&2
            exit 1
          fi

          ruleset_pages="$(GH_TOKEN="${RULESET_READ_TOKEN}" gh api --paginate --slurp --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/rulesets" \
            -f targets=tag \
            -f per_page=100)"
          if ! RULESET_READ_TOKEN='' jq -e '
            type == "array" and
            all(.[]; type == "array" and all(.[]; type == "object"))
          ' <<< "${ruleset_pages}" >/dev/null; then
            echo "ERROR: paginated tag-ruleset response has an invalid shape." >&2
            exit 1
          fi
          ruleset_matches="$(RULESET_READ_TOKEN='' jq --arg name "${ruleset_name}" \
            '[.[][] | select(.name == $name)]' <<< "${ruleset_pages}")"
          ruleset_count="$(RULESET_READ_TOKEN='' jq 'length' <<< "${ruleset_matches}")"
          if [[ "${ruleset_count}" -ne 1 ]]; then
            echo "ERROR: found ${ruleset_count} tag rulesets named ${ruleset_name}; expected exactly one." >&2
            echo "Publication is blocked until the maintainer configures that external GitHub ruleset." >&2
            exit 1
          fi
          ruleset_id="$(RULESET_READ_TOKEN='' jq -r '.[0].id | tostring' <<< "${ruleset_matches}")"
          if [[ ! "${ruleset_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: ${ruleset_name} returned an invalid ruleset ID." >&2
            exit 1
          fi

          ruleset_detail="$(GH_TOKEN="${RULESET_READ_TOKEN}" gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}")"
          unset RULESET_READ_TOKEN
          ruleset_path="${RUNNER_TEMP}/${ruleset_name}-${ruleset_id}.json"
          umask 077
          printf '%s' "${ruleset_detail}" > "${ruleset_path}"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/tag_ruleset_gate.py \
            --ruleset "${ruleset_path}" \
            --expected-id "${ruleset_id}" \
            --expected-repository "${GITHUB_REPOSITORY}"

          remote_refs="$(git ls-remote --exit-code origin \
            "refs/tags/${RELEASE_TAG}" \
            "refs/tags/${RELEASE_TAG}^{}")"
          direct_sha=""
          peeled_sha=""
          direct_count=0
          peeled_count=0
          while IFS=$'\t' read -r object_sha ref_name; do
            if [[ ! "${object_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "ERROR: immutable-ruleset tag lookup returned an invalid object SHA." >&2
              exit 1
            fi
            case "${ref_name}" in
              "refs/tags/${RELEASE_TAG}")
                direct_count=$((direct_count + 1))
                direct_sha="${object_sha}"
                ;;
              "refs/tags/${RELEASE_TAG}^{}")
                peeled_count=$((peeled_count + 1))
                peeled_sha="${object_sha}"
                ;;
              *)
                echo "ERROR: immutable-ruleset tag lookup returned unexpected ref ${ref_name:-<empty>}." >&2
                exit 1
                ;;
            esac
          done <<< "${remote_refs}"
          if [[ "${direct_count}" -ne 1 || "${peeled_count}" -gt 1 ]]; then
            echo "ERROR: immutable-ruleset tag lookup returned ${direct_count} direct and ${peeled_count} peeled refs; expected one direct ref and at most one peeled ref." >&2
            exit 1
          fi
          resolved_sha="${peeled_sha:-${direct_sha}}"
          if [[ "${resolved_sha}" != "${RELEASE_SHA}" ]]; then
            echo "ERROR: remote tag ${RELEASE_TAG} resolves to ${resolved_sha:-nothing}, expected ${RELEASE_SHA}; release validation is blocked." >&2
            exit 1
          fi
          echo "Immutable tag ruleset and exact remote tag SHA were revalidated for the release."

      - name: Publish Validated Draft Release
        if: ${{ env.ACT != 'true' }}
        shell: bash
        env:
          EXISTING_PUBLIC: ${{ steps.existing.outputs.public }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate-and-stage.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.validate-and-stage.outputs.release_tag }}
        run: |
          set -euo pipefail

          revalidate_remote_release_tag() {
            local phase="${1:?remote tag validation phase is required}"
            local remote_refs=""
            local direct_sha=""
            local peeled_sha=""
            local resolved_sha=""
            local direct_count=0
            local peeled_count=0

            if ! remote_refs="$(git ls-remote --exit-code origin \
              "refs/tags/${RELEASE_TAG}" \
              "refs/tags/${RELEASE_TAG}^{}")"; then
              echo "ERROR: ${phase} remote tag lookup failed for ${RELEASE_TAG}; refusing to trust the release ref." >&2
              return 1
            fi

            while IFS=$'\t' read -r object_sha ref_name; do
              if [[ ! "${object_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "ERROR: ${phase} remote tag lookup returned an invalid object SHA for ${RELEASE_TAG}." >&2
                return 1
              fi
              case "${ref_name}" in
                "refs/tags/${RELEASE_TAG}")
                  direct_count=$((direct_count + 1))
                  direct_sha="${object_sha}"
                  ;;
                "refs/tags/${RELEASE_TAG}^{}")
                  peeled_count=$((peeled_count + 1))
                  peeled_sha="${object_sha}"
                  ;;
                *)
                  echo "ERROR: ${phase} remote tag lookup returned unexpected ref ${ref_name:-<empty>}." >&2
                  return 1
                  ;;
              esac
            done <<< "${remote_refs}"

            if [[ "${direct_count}" -ne 1 || "${peeled_count}" -gt 1 ]]; then
              echo "ERROR: ${phase} remote tag lookup returned ${direct_count} direct and ${peeled_count} peeled refs for ${RELEASE_TAG}; expected one direct ref and at most one peeled ref." >&2
              return 1
            fi
            resolved_sha="${peeled_sha:-${direct_sha}}"
            if [[ "${resolved_sha}" != "${RELEASE_SHA}" ]]; then
              if [[ "${phase}" == "post-publication" || "${phase}" == "idempotent-public" ]]; then
                echo "ERROR: the release was made public, but remote tag ${RELEASE_TAG} now resolves to ${resolved_sha:-nothing}, expected ${RELEASE_SHA}." >&2
              else
                echo "ERROR: ${phase} remote tag ${RELEASE_TAG} resolves to ${resolved_sha:-nothing}, expected ${RELEASE_SHA}; the draft remains private." >&2
              fi
              return 1
            fi
            echo "${phase} remote tag ${RELEASE_TAG} resolves exactly to ${RELEASE_SHA}."
          }

          if [[ "${EXISTING_PUBLIC}" == "true" ]]; then
            revalidate_remote_release_tag "idempotent-public"
            echo "Existing public release ${RELEASE_TAG} remains bound to ${RELEASE_SHA}; no publication mutation was attempted."
            exit 0
          fi
          if [[ "${EXISTING_PUBLIC}" != "false" ]]; then
            echo "ERROR: existing release state is invalid: ${EXISTING_PUBLIC:-<empty>}." >&2
            exit 1
          fi

          revalidate_remote_release_tag "pre-publication"
          gh release edit "${RELEASE_TAG}" --draft=false --latest
          revalidate_remote_release_tag "post-publication"

      - name: Verify Published Release Assets
        if: ${{ env.ACT != 'true' && steps.existing.outputs.public != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate-and-stage.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.validate-and-stage.outputs.release_tag }}
        run: |
          set -euo pipefail
          metadata="$(gh release view "${RELEASE_TAG}" --json tagName,isDraft,isPrerelease)"
          if [[ "$(jq -r '.tagName' <<< "${metadata}")" != "${RELEASE_TAG}" || \
                "$(jq -r '.isDraft' <<< "${metadata}")" != "false" || \
                "$(jq -r '.isPrerelease' <<< "${metadata}")" != "false" ]]; then
            echo "ERROR: published release metadata is inconsistent." >&2
            exit 1
          fi
          mkdir published_release_assets
          gh release download "${RELEASE_TAG}" --dir published_release_assets
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py verify \
            --repository "${GITHUB_WORKSPACE}" \
            --tag "${RELEASE_TAG}" \
            --assets published_release_assets
          diff --no-index \
            release_payload/assets/RELEASE_SHA256SUMS.txt \
            published_release_assets/RELEASE_SHA256SUMS.txt
          bash scripts/ci/verify_release_attestations.sh \
            published_release_assets \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REPOSITORY}/.github/workflows/release-manager.yml" \
            "${RELEASE_SHA}"

      - name: Confirm Act Stopped Before GitHub-Only Operations
        if: ${{ env.ACT == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Act validated the complete payload; OIDC attestation and GitHub publication were skipped."

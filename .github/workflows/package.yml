name: SysWarden Builder and Packager

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOAMD64: 'v1'
  GOCACHEPROG: ''
  GOENV: 'off'
  GOEXPERIMENT: ''
  GOFLAGS: '-mod=readonly'
  GOTOOLCHAIN: 'local'
  GOWORK: 'off'
  GIT_NO_REPLACE_OBJECTS: '1'

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    # paths removed to allow tags


  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    name: Compile and Build Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Reject Redirected Git Environment
        shell: bash
        run: |
          set -euo pipefail
          redirected_git_environment=(
            GIT_DIR
            GIT_WORK_TREE
            GIT_COMMON_DIR
            GIT_INDEX_FILE
            GIT_OBJECT_DIRECTORY
            GIT_ALTERNATE_OBJECT_DIRECTORIES
            GIT_ATTR_SOURCE
            GIT_CEILING_DIRECTORIES
            GIT_DISCOVERY_ACROSS_FILESYSTEM
            GIT_EXEC_PATH
            GIT_NAMESPACE
            GIT_REPLACE_REF_BASE
            GIT_SHALLOW_FILE
            GIT_GRAFT_FILE
            GIT_QUARANTINE_PATH
            GIT_CONFIG_COUNT
            GIT_CONFIG_PARAMETERS
            GIT_CONFIG_GLOBAL
            GIT_CONFIG_SYSTEM
          )
          for variable in "${redirected_git_environment[@]}"; do
            if [[ -v "${variable}" ]]; then
              echo "ERROR: inherited ${variable} may redirect release provenance." >&2
              exit 1
            fi
          done
          [[ "${GIT_NO_REPLACE_OBJECTS}" == "1" ]] || {
            echo "ERROR: Git replacement objects must be disabled." >&2
            exit 1
          }

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            go.work.sum
            src/core/syswarden-cli/go.sum
            src/core/syswarden-core/go.sum
            src/core/syswarden-tui/go.sum

      - name: Validate Hermetic Go Environment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(go env GOVERSION)" == "go1.26.6" ]]
          [[ "${GOWORK}" == "off" ]]
          [[ "${GOENV}" == "off" ]]
          [[ "${GOAMD64}" == "v1" ]]
          [[ -z "${GOCACHEPROG}" ]]
          [[ "${GOTOOLCHAIN}" == "local" ]]
          [[ "${GOFLAGS}" == "-mod=readonly" ]]
          [[ -z "${GOEXPERIMENT}" ]]

      - name: Setup pinned PowerShell 7.6.4
        shell: bash
        run: bash scripts/ci/setup_powershell.sh

      - name: Test Package and Release Validators
        shell: bash
        run: |
          set -euo pipefail
          (cd scripts/versionctl && GOWORK=off go test ./...)
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            scripts/ci/candidate_update_bundle_workflow_test.py \
            scripts/ci/package_binary_provenance_gate_test.py \
            scripts/ci/package_systemd_ordering_artifact_gate_test.py \
            scripts/ci/package_systemd_ordering_preflight_test.py \
            scripts/ci/go_toolchain_evaluation_test.py \
            scripts/ci/native_package_signature_gate_test.py \
            scripts/ci/native_package_signing_bundle_test.py \
            scripts/ci/native_package_signing_workflow_test.py \
            scripts/ci/native_capability_evidence_test.py \
            scripts/ci/native_feed_evidence_test.py \
            scripts/ci/osint_tls_fixture_test.py \
            scripts/ci/native_lifecycle_evidence_test.py \
            scripts/ci/native_performance_adapter_test.py \
            scripts/ci/native_performance_probe_test.py \
            scripts/ci/native_release_evidence_workflow_test.py \
            scripts/ci/package_qualification_matrix_test.py \
            scripts/ci/package_lifecycle_contract_test.py \
            scripts/ci/package_lifecycle_lab_test.py \
            scripts/ci/package_stage_gate_test.py \
            scripts/ci/performance_evidence_test.py \
            scripts/ci/performance_gate_test.py \
            scripts/ci/source_allocation_producer_test.py \
            scripts/ci/source_allocation_gate_test.py \
            scripts/ci/performance_channel_aggregate_test.py \
            scripts/ci/release_gate_test.py \
            scripts/ci/release_qualification_adapter_test.py \
            scripts/ci/release_qualification_gate_test.py \
            scripts/ci/release_qualification_workflow_test.py \
            scripts/ci/repository_state_test.py \
            -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            extensions/rhel-package-owned/tests/test_stage.py \
            -v

      - name: Validate and Export Version Contract
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          SOURCE_TOPLEVEL="$(git -c core.fsmonitor=false rev-parse --show-toplevel)"
          if [[ "$(realpath -e "${SOURCE_TOPLEVEL}")" != "$(realpath -e "${GITHUB_WORKSPACE}")" ]]; then
            echo "ERROR: Git discovered an unexpected release work tree." >&2
            exit 1
          fi
          SOURCE_GIT_DIR="$(git -c core.fsmonitor=false rev-parse --absolute-git-dir)"
          SOURCE_GIT_COMMON_DIR="$(git -c core.fsmonitor=false rev-parse --path-format=absolute --git-common-dir)"
          if [[ ! -d "${SOURCE_GIT_DIR}" || ! -d "${SOURCE_GIT_COMMON_DIR}" ]]; then
            echo "ERROR: Git metadata directories are unavailable." >&2
            exit 1
          fi
          SOURCE_GIT_DIR="$(realpath -e "${SOURCE_GIT_DIR}")"
          SOURCE_GIT_COMMON_DIR="$(realpath -e "${SOURCE_GIT_COMMON_DIR}")"
          if [[ "${SOURCE_GIT_COMMON_DIR}" != "${SOURCE_GIT_DIR}" ]]; then
            echo "ERROR: GitHub packaging requires one canonical Git metadata directory." >&2
            exit 1
          fi
          if ! SOURCE_STATUS="$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"; then
            echo "ERROR: unable to attest the release work tree." >&2
            exit 1
          fi
          if [[ -n "${SOURCE_STATUS}" ]]; then
            echo "ERROR: release packaging requires an exact clean checkout." >&2
            exit 1
          fi
          SOURCE_TAG="$(./scripts/versioning.sh inspect --repo "${GITHUB_WORKSPACE}")"
          if [[ "${RELEASE_REF_TYPE}" == "tag" ]]; then
            ./scripts/versioning.sh validate-tag \
              --repo "${GITHUB_WORKSPACE}" \
              --tag "${RELEASE_REF_NAME}"
            if [[ "${SOURCE_TAG}" != "${RELEASE_REF_NAME}" ]]; then
              echo "ERROR: source version ${SOURCE_TAG} does not match tag ${RELEASE_REF_NAME}." >&2
              exit 1
            fi
          fi
          SOURCE_DATE_EPOCH="$(git -c core.fsmonitor=false log -1 --format=%ct HEAD)"
          if [[ ! "${SOURCE_DATE_EPOCH}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: unable to derive a reproducible source timestamp from HEAD." >&2
            exit 1
          fi
          SOURCE_COMMIT_SHA="$(git -c core.fsmonitor=false rev-parse --verify 'HEAD^{commit}')"
          if [[ ! "${SOURCE_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: unable to derive the exact source commit." >&2
            exit 1
          fi
          SOURCE_VCS_TIME="$(date --utc --date="@${SOURCE_DATE_EPOCH}" '+%Y-%m-%dT%H:%M:%SZ')"
          echo "RELEASE_TAG=${SOURCE_TAG}" >> "${GITHUB_ENV}"
          echo "VERSION=${SOURCE_TAG#v}" >> "${GITHUB_ENV}"
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "${GITHUB_ENV}"
          echo "SOURCE_COMMIT_SHA=${SOURCE_COMMIT_SHA}" >> "${GITHUB_ENV}"
          echo "SOURCE_VCS_TIME=${SOURCE_VCS_TIME}" >> "${GITHUB_ENV}"
          echo "SOURCE_GIT_DIR=${SOURCE_GIT_DIR}" >> "${GITHUB_ENV}"
          echo "SOURCE_GIT_COMMON_DIR=${SOURCE_GIT_COMMON_DIR}" >> "${GITHUB_ENV}"
          echo "LC_ALL=C" >> "${GITHUB_ENV}"
          echo "LANG=C" >> "${GITHUB_ENV}"
          echo "TZ=UTC" >> "${GITHUB_ENV}"

      - name: Capture Candidate Repository State
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          test -d "${RUNNER_TEMP}"
          PACKAGE_REPOSITORY_STATE="$(mktemp \
            "${RUNNER_TEMP%/}/syswarden-package-repository-state.XXXXXX")"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/repository_state.py \
            --repository "${GITHUB_WORKSPACE}" \
            capture \
            --output "${PACKAGE_REPOSITORY_STATE}"
          printf 'PACKAGE_REPOSITORY_STATE=%s\n' "${PACKAGE_REPOSITORY_STATE}" \
            >> "${GITHUB_ENV}"

      - name: Compile AMD64 Release Binaries
        run: pwsh -File ./build.ps1

      - name: Validate Compiled Inventory
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            dist/bin/syswarden-cli
            dist/bin/syswarden-core
            dist/bin/syswarden-tui
            dist/signatures.json
          )
          for artifact in "${expected[@]}"; do
            test -s "${artifact}" || {
              echo "ERROR: required build artifact is missing or empty: ${artifact}" >&2
              exit 1
            }
          done

          validate_linux_pie() {
            local artifact="$1"
            local expected_machine="$2"
            local elf_type
            local machine
            elf_type="$(readelf --file-header "${artifact}" | sed -n 's/^[[:space:]]*Type:[[:space:]]*\([^[:space:]]*\).*/\1/p')"
            machine="$(readelf --file-header "${artifact}" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
            [[ "${elf_type}" == "DYN" ]] || {
              echo "ERROR: Linux artifact is not PIE: ${artifact}" >&2
              exit 1
            }
            [[ "${machine}" == "${expected_machine}" ]] || {
              echo "ERROR: Linux artifact has unexpected machine ${machine}: ${artifact}" >&2
              exit 1
            }
            go version -m "${artifact}" | grep -Eq '^[[:space:]]*build[[:space:]]+CGO_ENABLED=0$' || {
              echo "ERROR: Linux artifact was not built with CGO_ENABLED=0: ${artifact}" >&2
              exit 1
            }
            go version -m "${artifact}" | grep -Eq '^[[:space:]]*build[[:space:]]+-trimpath=true$' || {
              echo "ERROR: Linux artifact does not attest path-independent compilation: ${artifact}" >&2
              exit 1
            }
            go version -m "${artifact}" | grep -Eq '^[[:space:]]*build[[:space:]]+GOAMD64=v1$' || {
              echo "ERROR: Linux artifact does not attest the baseline AMD64 level: ${artifact}" >&2
              exit 1
            }
            validate_vcs_provenance "${artifact}"
          }

          validate_vcs_provenance() {
            local artifact="$1"
            if ! go version -m "${artifact}" | LC_ALL=C awk \
              -v revision="${SOURCE_COMMIT_SHA}" \
              -v commit_time="${SOURCE_VCS_TIME}" '
                $1 == "build" && $2 == "vcs=git" { vcs_git++ }
                $1 == "build" && $2 == "vcs.revision=" revision { vcs_revision++ }
                $1 == "build" && $2 == "vcs.time=" commit_time { vcs_time++ }
                $1 == "build" && $2 == "vcs.modified=false" { vcs_clean++ }
                $1 == "build" && $2 ~ /^vcs(\.|=)/ { vcs_total++ }
                END {
                  exit vcs_git == 1 && vcs_revision == 1 && vcs_time == 1 &&
                       vcs_clean == 1 && vcs_total == 4 ? 0 : 1
                }
              '; then
              echo "ERROR: binary VCS provenance does not match the clean exact source commit: ${artifact}" >&2
              exit 1
            fi
          }

          for artifact in \
            dist/bin/syswarden-cli \
            dist/bin/syswarden-core \
            dist/bin/syswarden-tui; do
            validate_linux_pie "${artifact}" 'Advanced Micro Devices X86-64'
          done
          dist/bin/syswarden-cli --help >/dev/null

      - name: Set up Ruby for FPM
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'

      - name: Install FPM and RPM build tools
        run: |
          set -euo pipefail
          # Keep package setup independent of the optional Chrome repository.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y cpio rpm
          gem install --no-document fpm -v 1.17.0

      - name: Test Opt-in RHEL Package-owned RPM Assembly
        shell: bash
        run: bash extensions/rhel-package-owned/tests/test-rpm-assembly.sh

      - name: Create Isolated Packaging Workspace
        id: package_workspace
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          test -d "${RUNNER_TEMP}"
          PACKAGE_WORKSPACE="$(mktemp -d "${RUNNER_TEMP%/}/syswarden-package.XXXXXX")"
          STAGING_AMD64="${PACKAGE_WORKSPACE}/staging-amd64"
          STAGING_APK_AMD64="${PACKAGE_WORKSPACE}/staging-apk-amd64"
          EXACT_SOURCE_ROOT="${PACKAGE_WORKSPACE}/source-exact"
          EXACT_SOURCE_ARCHIVE="${PACKAGE_WORKSPACE}/source-exact.tar"
          PACKAGE_ASSETS="${PACKAGE_WORKSPACE}/assets"
          RHEL_PROFILE_STAGING="${PACKAGE_WORKSPACE}/staging-rhel-package-owned"
          RHEL_PROFILE_SOURCE="${PACKAGE_WORKSPACE}/rhel-package-owned-source"
          RHEL_PROFILE_ASSETS="${PACKAGE_WORKSPACE}/assets-rhel-package-owned"
          RHEL_PROFILE_RPM_SCRIPTS="${PACKAGE_WORKSPACE}/rhel-package-owned-rpm-scripts"
          PACKAGE_SCRIPTS="${PACKAGE_WORKSPACE}/scripts"
          PACKAGE_RPM_SCRIPTS="${PACKAGE_WORKSPACE}/rpm-scripts"
          PACKAGE_CONFIGS="${PACKAGE_WORKSPACE}/configs"
          GO_BUILD_CACHE="${PACKAGE_WORKSPACE}/go-build-cache"
          GO_PATH="${PACKAGE_WORKSPACE}/go-path"
          GO_MODULE_CACHE="${GO_PATH}/pkg/mod"
          GO_BUILD_TMP="${PACKAGE_WORKSPACE}/go-tmp"
          install -d -m 0755 \
            "${STAGING_AMD64}" \
            "${STAGING_APK_AMD64}" \
            "${RHEL_PROFILE_STAGING}" \
            "${EXACT_SOURCE_ROOT}" \
            "${PACKAGE_ASSETS}" \
            "${RHEL_PROFILE_ASSETS}"
          install -d -m 0700 \
            "${PACKAGE_SCRIPTS}" \
            "${PACKAGE_RPM_SCRIPTS}" \
            "${RHEL_PROFILE_RPM_SCRIPTS}" \
            "${PACKAGE_CONFIGS}" \
            "${GO_BUILD_CACHE}" \
            "${GO_PATH}" \
            "${GO_MODULE_CACHE}" \
            "${GO_BUILD_TMP}"
          env \
            GIT_COMMON_DIR="${SOURCE_GIT_COMMON_DIR}" \
            GIT_DIR="${SOURCE_GIT_DIR}" \
            GIT_WORK_TREE="${GITHUB_WORKSPACE}" \
            GIT_NO_REPLACE_OBJECTS=1 \
            git -c core.fsmonitor=false archive \
              --format=tar \
              --output="${EXACT_SOURCE_ARCHIVE}" \
              "${SOURCE_COMMIT_SHA}"
          tar --extract \
            --file "${EXACT_SOURCE_ARCHIVE}" \
            --directory "${EXACT_SOURCE_ROOT}"
          rm -- "${EXACT_SOURCE_ARCHIVE}"
          if [[ -e "${EXACT_SOURCE_ROOT}/.git" ]]; then
            echo "ERROR: the exact source snapshot contains Git metadata." >&2
            exit 1
          fi
          if ! EXACT_SOURCE_STATUS="$(
            env \
              GIT_COMMON_DIR="${SOURCE_GIT_COMMON_DIR}" \
              GIT_DIR="${SOURCE_GIT_DIR}" \
              GIT_WORK_TREE="${EXACT_SOURCE_ROOT}" \
              GIT_NO_REPLACE_OBJECTS=1 \
              git -c core.fsmonitor=false status \
                --porcelain=v1 \
                --untracked-files=all
          )"; then
            echo "ERROR: unable to attest the exact source snapshot." >&2
            exit 1
          fi
          if [[ -n "${EXACT_SOURCE_STATUS}" ]]; then
            echo "ERROR: the source snapshot differs from the exact source commit." >&2
            exit 1
          fi
          mkdir -- "${EXACT_SOURCE_ROOT}/.git"
          chmod 0500 "${EXACT_SOURCE_ROOT}/.git"
          if [[ -L "${EXACT_SOURCE_ROOT}/.git" || ! -d "${EXACT_SOURCE_ROOT}/.git" ]] ||
             [[ -n "$(find "${EXACT_SOURCE_ROOT}/.git" -mindepth 1 -print -quit)" ]]; then
            echo "ERROR: refusing an unsafe VCS discovery sentinel." >&2
            exit 1
          fi
          {
            printf 'PACKAGE_WORKSPACE=%s\n' "${PACKAGE_WORKSPACE}"
            printf 'STAGING_AMD64=%s\n' "${STAGING_AMD64}"
            printf 'STAGING_APK_AMD64=%s\n' "${STAGING_APK_AMD64}"
            printf 'EXACT_SOURCE_ROOT=%s\n' "${EXACT_SOURCE_ROOT}"
            printf 'PACKAGE_ASSETS=%s\n' "${PACKAGE_ASSETS}"
            printf 'RHEL_PROFILE_STAGING=%s\n' "${RHEL_PROFILE_STAGING}"
            printf 'RHEL_PROFILE_SOURCE=%s\n' "${RHEL_PROFILE_SOURCE}"
            printf 'RHEL_PROFILE_ASSETS=%s\n' "${RHEL_PROFILE_ASSETS}"
            printf 'RHEL_PROFILE_RPM_SCRIPTS=%s\n' "${RHEL_PROFILE_RPM_SCRIPTS}"
            printf 'PACKAGE_SCRIPTS=%s\n' "${PACKAGE_SCRIPTS}"
            printf 'PACKAGE_RPM_SCRIPTS=%s\n' "${PACKAGE_RPM_SCRIPTS}"
            printf 'PACKAGE_CONFIGS=%s\n' "${PACKAGE_CONFIGS}"
            printf 'GOCACHE=%s\n' "${GO_BUILD_CACHE}"
            printf 'GOMODCACHE=%s\n' "${GO_MODULE_CACHE}"
            printf 'GOPATH=%s\n' "${GO_PATH}"
            printf 'GOTMPDIR=%s\n' "${GO_BUILD_TMP}"
          } >> "${GITHUB_ENV}"
          printf 'assets=%s\n' "${PACKAGE_ASSETS}" >> "${GITHUB_OUTPUT}"
          printf 'rhel_profile_assets=%s\n' "${RHEL_PROFILE_ASSETS}" >> "${GITHUB_OUTPUT}"

      - name: Prepare Staging Environment (AMD64)
        run: |
          set -euo pipefail
          install -d -m 0755 \
            "${STAGING_AMD64}/opt/syswarden/bin" \
            "${STAGING_AMD64}/usr/lib/systemd/system/syswarden-firewall.service.d" \
            "${STAGING_AMD64}/usr/local/bin" \
            "${STAGING_AMD64}/usr/share/bash-completion/completions" \
            "${STAGING_AMD64}/usr/share/doc/syswarden"

          cp dist/bin/syswarden-cli "${STAGING_AMD64}/opt/syswarden/bin/"
          cp dist/bin/syswarden-core "${STAGING_AMD64}/opt/syswarden/bin/"
          cp dist/bin/syswarden-tui "${STAGING_AMD64}/opt/syswarden/bin/"
          cp dist/signatures.json "${STAGING_AMD64}/opt/syswarden/"

          chmod 0750 \
            "${STAGING_AMD64}/opt/syswarden/bin/syswarden-cli" \
            "${STAGING_AMD64}/opt/syswarden/bin/syswarden-core" \
            "${STAGING_AMD64}/opt/syswarden/bin/syswarden-tui"
          chmod 0640 "${STAGING_AMD64}/opt/syswarden/signatures.json"

          # Create a symlink for global execution from the terminal (Routing to Go CLI)
          ln -s /opt/syswarden/bin/syswarden-cli \
            "${STAGING_AMD64}/usr/local/bin/syswarden"
          ln -s /opt/syswarden/bin/syswarden-tui \
            "${STAGING_AMD64}/usr/local/bin/syswarden-tui"
          "${STAGING_AMD64}/opt/syswarden/bin/syswarden-cli" completion bash > \
            "${STAGING_AMD64}/usr/share/bash-completion/completions/syswarden"
          chmod 0644 \
            "${STAGING_AMD64}/usr/share/bash-completion/completions/syswarden"
          install -m 0644 \
            "${EXACT_SOURCE_ROOT}/src/core/syswarden-cli/pkg/geoip/LICENSE-CC0-1.0.txt" \
            "${STAGING_AMD64}/usr/share/doc/syswarden/GEOIP-DATA-LICENSE.txt"
          install -m 0644 "${EXACT_SOURCE_ROOT}/LICENSE" \
            "${STAGING_AMD64}/usr/share/doc/syswarden/LICENSE.txt"
          install -m 0644 \
            "${EXACT_SOURCE_ROOT}/src/init/systemd/syswarden-firewall.service.d/10-syswarden-wireguard-ordering.conf" \
            "${STAGING_AMD64}/usr/lib/systemd/system/syswarden-firewall.service.d/10-syswarden-wireguard-ordering.conf"

      - name: Stage Opt-in RHEL Package-owned RPM Payload
        shell: bash
        run: |
          set -euo pipefail
          cp -a "${STAGING_AMD64}/." "${RHEL_PROFILE_STAGING}/"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            "${EXACT_SOURCE_ROOT}/extensions/rhel-package-owned/stage.py" \
            --enable-rhel-package-owned-profile \
            --shared-base-payload "${RHEL_PROFILE_STAGING}" \
            --output "${RHEL_PROFILE_SOURCE}"
          for relative in \
            usr/lib/systemd/system/syswarden-core.service \
            usr/lib/systemd/system/syswarden-firewall.service \
            usr/lib/systemd/system-preset/90-syswarden-rhel-image.preset \
            usr/share/doc/syswarden/rhel-package-owned-profile.json; do
            if [[ -e "${RHEL_PROFILE_STAGING}/${relative}" || \
                  -L "${RHEL_PROFILE_STAGING}/${relative}" ]]; then
              echo "ERROR: RHEL package-owned payload collision: ${relative}" >&2
              exit 1
            fi
          done
          cp -a "${RHEL_PROFILE_SOURCE}/payload/." "${RHEL_PROFILE_STAGING}/"
          shared="usr/lib/systemd/system/syswarden-firewall.service.d/10-syswarden-wireguard-ordering.conf"
          cmp -s \
            "${STAGING_AMD64}/${shared}" \
            "${RHEL_PROFILE_STAGING}/${shared}"
          [[ "$(stat -c '%a:%u:%g' "${STAGING_AMD64}/${shared}")" == \
              "$(stat -c '%a:%u:%g' "${RHEL_PROFILE_STAGING}/${shared}")" ]]
          prepare_profile_rpm_scriptlet() {
            local source="$1"
            local destination="$2"
            [[ -f "${source}" && ! -L "${source}" ]]
            LC_ALL=C sed 's/%/%%/g' -- "${source}" > "${destination}"
            chmod 0700 "${destination}"
            [[ -f "${destination}" && ! -L "${destination}" ]]
            cmp -s \
              <(LC_ALL=C sed 's/%%/%/g' -- "${destination}") \
              "${source}"
          }
          prepare_profile_rpm_scriptlet \
            "${RHEL_PROFILE_SOURCE}/rpm-scriptlets/pre-install.sh" \
            "${RHEL_PROFILE_RPM_SCRIPTS}/pre-install.sh"
          prepare_profile_rpm_scriptlet \
            "${RHEL_PROFILE_SOURCE}/rpm-scriptlets/post-install.sh" \
            "${RHEL_PROFILE_RPM_SCRIPTS}/post-install.sh"
          prepare_profile_rpm_scriptlet \
            "${RHEL_PROFILE_SOURCE}/rpm-scriptlets/pre-uninstall.sh" \
            "${RHEL_PROFILE_RPM_SCRIPTS}/pre-uninstall.sh"
          prepare_profile_rpm_scriptlet \
            "${RHEL_PROFILE_SOURCE}/rpm-scriptlets/post-uninstall.sh" \
            "${RHEL_PROFILE_RPM_SCRIPTS}/post-uninstall.sh"

      - name: Build and Stage Static Alpine Binaries
        shell: bash
        run: |
          set -euo pipefail

          build_apk_stage() {
            local goarch="$1"
            local stage="$2"
            install -d -m 0755 \
              "${stage}/opt/syswarden/bin" \
              "${stage}/usr/local/bin" \
              "${stage}/usr/share/bash-completion/completions" \
              "${stage}/usr/share/doc/syswarden"
            for component in syswarden-cli syswarden-core syswarden-tui; do
              env \
                CGO_ENABLED=0 \
                GIT_NO_REPLACE_OBJECTS=1 \
                GOAMD64=v1 \
                GOCACHE="${GOCACHE}" \
                GOCACHEPROG= \
                GOENV=off \
                GOEXPERIMENT= \
                GOFLAGS=-mod=readonly \
                GOMODCACHE="${GOMODCACHE}" \
                GOPATH="${GOPATH}" \
                GOTOOLCHAIN=local \
                GOTMPDIR="${GOTMPDIR}" \
                GOWORK=off \
                GOOS=linux \
                GOARCH="${goarch}" \
                go -C "${EXACT_SOURCE_ROOT}/src/core/${component}" mod download
              env \
                CGO_ENABLED=0 \
                GIT_NO_REPLACE_OBJECTS=1 \
                GOAMD64=v1 \
                GOCACHE="${GOCACHE}" \
                GOCACHEPROG= \
                GOENV=off \
                GOEXPERIMENT= \
                GOFLAGS=-mod=readonly \
                GOMODCACHE="${GOMODCACHE}" \
                GOPATH="${GOPATH}" \
                GOTOOLCHAIN=local \
                GOTMPDIR="${GOTMPDIR}" \
                GOWORK=off \
                GOOS=linux \
                GOARCH="${goarch}" \
                go -C "${EXACT_SOURCE_ROOT}/src/core/${component}" mod verify
              env \
                CGO_ENABLED=0 \
                GIT_COMMON_DIR="${SOURCE_GIT_COMMON_DIR}" \
                GIT_CONFIG_COUNT=1 \
                GIT_CONFIG_KEY_0=core.fsmonitor \
                GIT_CONFIG_VALUE_0=false \
                GIT_DIR="${SOURCE_GIT_DIR}" \
                GIT_NO_REPLACE_OBJECTS=1 \
                GIT_WORK_TREE="${EXACT_SOURCE_ROOT}" \
                GOAMD64=v1 \
                GOCACHE="${GOCACHE}" \
                GOCACHEPROG= \
                GOENV=off \
                GOEXPERIMENT= \
                GOFLAGS=-mod=readonly \
                GOMODCACHE="${GOMODCACHE}" \
                GOPATH="${GOPATH}" \
                GOTOOLCHAIN=local \
                GOTMPDIR="${GOTMPDIR}" \
                GOWORK="${EXACT_SOURCE_ROOT}/go.work" \
                GOOS=linux \
                GOARCH="${goarch}" \
                go -C "${EXACT_SOURCE_ROOT}" build \
                  -buildvcs=true \
                  -mod=readonly \
                  -trimpath \
                  -ldflags='-s -w' \
                  -o "${stage}/opt/syswarden/bin/${component}" \
                  "./src/core/${component}"
              chmod 0750 "${stage}/opt/syswarden/bin/${component}"
            done
            cp "${EXACT_SOURCE_ROOT}/src/core/syswarden-core/signatures.json" \
              "${stage}/opt/syswarden/signatures.json"
            chmod 0640 "${stage}/opt/syswarden/signatures.json"
            ln -s /opt/syswarden/bin/syswarden-cli \
              "${stage}/usr/local/bin/syswarden"
            ln -s /opt/syswarden/bin/syswarden-tui \
              "${stage}/usr/local/bin/syswarden-tui"
            "${stage}/opt/syswarden/bin/syswarden-cli" completion bash > \
              "${stage}/usr/share/bash-completion/completions/syswarden"
            chmod 0644 \
              "${stage}/usr/share/bash-completion/completions/syswarden"
            install -m 0644 \
              "${EXACT_SOURCE_ROOT}/src/core/syswarden-cli/pkg/geoip/LICENSE-CC0-1.0.txt" \
              "${stage}/usr/share/doc/syswarden/GEOIP-DATA-LICENSE.txt"
            install -m 0644 "${EXACT_SOURCE_ROOT}/LICENSE" \
              "${stage}/usr/share/doc/syswarden/LICENSE.txt"
          }

          validate_static_apk_binary() {
            local artifact="$1"
            local expected_machine="$2"
            local elf_type
            local machine
            elf_type="$(readelf --file-header "${artifact}" | sed -n 's/^[[:space:]]*Type:[[:space:]]*\([^[:space:]]*\).*/\1/p')"
            machine="$(readelf --file-header "${artifact}" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
            [[ "${elf_type}" == "EXEC" ]] || {
              echo "ERROR: Alpine artifact is not a static ET_EXEC binary: ${artifact}" >&2
              exit 1
            }
            [[ "${machine}" == "${expected_machine}" ]] || {
              echo "ERROR: Alpine artifact has unexpected machine ${machine}: ${artifact}" >&2
              exit 1
            }
            if readelf --program-headers "${artifact}" | grep -q '[[:space:]]INTERP[[:space:]]'; then
              echo "ERROR: Alpine artifact contains a dynamic PT_INTERP loader: ${artifact}" >&2
              exit 1
            fi
            file "${artifact}" | grep -Fq 'statically linked' || {
              echo "ERROR: Alpine artifact is not statically linked: ${artifact}" >&2
              exit 1
            }
            go version -m "${artifact}" | grep -Eq '^[[:space:]]*build[[:space:]]+CGO_ENABLED=0$' || {
              echo "ERROR: Alpine artifact was not built with CGO_ENABLED=0: ${artifact}" >&2
              exit 1
            }
            go version -m "${artifact}" | grep -Eq '^[[:space:]]*build[[:space:]]+-trimpath=true$' || {
              echo "ERROR: Alpine artifact does not attest path-independent compilation: ${artifact}" >&2
              exit 1
            }
            go version -m "${artifact}" | grep -Eq '^[[:space:]]*build[[:space:]]+GOAMD64=v1$' || {
              echo "ERROR: Alpine artifact does not attest the baseline AMD64 level: ${artifact}" >&2
              exit 1
            }
            validate_vcs_provenance "${artifact}"
          }

          validate_vcs_provenance() {
            local artifact="$1"
            if ! go version -m "${artifact}" | LC_ALL=C awk \
              -v revision="${SOURCE_COMMIT_SHA}" \
              -v commit_time="${SOURCE_VCS_TIME}" '
                $1 == "build" && $2 == "vcs=git" { vcs_git++ }
                $1 == "build" && $2 == "vcs.revision=" revision { vcs_revision++ }
                $1 == "build" && $2 == "vcs.time=" commit_time { vcs_time++ }
                $1 == "build" && $2 == "vcs.modified=false" { vcs_clean++ }
                $1 == "build" && $2 ~ /^vcs(\.|=)/ { vcs_total++ }
                END {
                  exit vcs_git == 1 && vcs_revision == 1 && vcs_time == 1 &&
                       vcs_clean == 1 && vcs_total == 4 ? 0 : 1
                }
              '; then
              echo "ERROR: binary VCS provenance does not match the clean exact source commit: ${artifact}" >&2
              exit 1
            fi
          }

          build_apk_stage amd64 "${STAGING_APK_AMD64}"
          for artifact in "${STAGING_APK_AMD64}"/opt/syswarden/bin/*; do
            validate_static_apk_binary "${artifact}" 'Advanced Micro Devices X86-64'
          done
          "${STAGING_APK_AMD64}/opt/syswarden/bin/syswarden-cli" --help >/dev/null
          docker run --rm \
            --network none \
            --security-opt no-new-privileges \
            --volume "${STAGING_APK_AMD64}/opt/syswarden/bin/syswarden-cli:/usr/local/bin/syswarden:ro" \
            docker.io/library/alpine:3.22@sha256:7c8cb692ae09657cbc4a3f3cbd0e8d5a2690ba38386aaaf252dbb060bf5eb2e6 \
            /usr/local/bin/syswarden --help >/dev/null

      - name: Validate Exact Linux Staging Inventories
        id: stage_provenance
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/package_stage_gate.py \
            linux --root "${STAGING_AMD64}" \
            --service-manager systemd \
            --systemd-ordering-contract \
            scripts/ci/package_systemd_wireguard_ordering_contract.json \
            --systemd-ordering-source \
            "${EXACT_SOURCE_ROOT}/src/init/systemd/syswarden-firewall.service.d/10-syswarden-wireguard-ordering.conf" \
            --completion-contract scripts/ci/package_completion_contract.json \
            --geoip-data-license-contract \
            scripts/ci/package_geoip_data_license_contract.json \
            --geoip-data-license-source \
            "${EXACT_SOURCE_ROOT}/src/core/syswarden-cli/pkg/geoip/LICENSE-CC0-1.0.txt" \
            --project-license-contract \
            scripts/ci/package_project_license_contract.json \
            --project-license-source "${EXACT_SOURCE_ROOT}/LICENSE"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            scripts/ci/package_systemd_ordering_artifact_gate.py \
            --format stage \
            --root "${STAGING_AMD64}" \
            --source \
            "${EXACT_SOURCE_ROOT}/src/init/systemd/syswarden-firewall.service.d/10-syswarden-wireguard-ordering.conf" \
            --contract scripts/ci/package_systemd_wireguard_ordering_contract.json
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/package_stage_gate.py \
            linux --root "${STAGING_APK_AMD64}" \
            --service-manager openrc \
            --completion-contract scripts/ci/package_completion_contract.json \
            --geoip-data-license-contract \
            scripts/ci/package_geoip_data_license_contract.json \
            --geoip-data-license-source \
            "${EXACT_SOURCE_ROOT}/src/core/syswarden-cli/pkg/geoip/LICENSE-CC0-1.0.txt" \
            --project-license-contract \
            scripts/ci/package_project_license_contract.json \
            --project-license-source "${EXACT_SOURCE_ROOT}/LICENSE"
          AMD64_DIGEST_CONTRACT="$(
            PYTHONDONTWRITEBYTECODE=1 python3 \
              "${EXACT_SOURCE_ROOT}/scripts/ci/package_binary_provenance_gate.py" \
              --root "${STAGING_AMD64}" \
              --mode pie \
              --revision "${SOURCE_COMMIT_SHA}" \
              --vcs-time "${SOURCE_VCS_TIME}" \
              --signatures-source \
              "${EXACT_SOURCE_ROOT}/src/core/syswarden-core/signatures.json" \
              --print-digest-contract
          )"
          APK_AMD64_DIGEST_CONTRACT="$(
            PYTHONDONTWRITEBYTECODE=1 python3 \
              "${EXACT_SOURCE_ROOT}/scripts/ci/package_binary_provenance_gate.py" \
              --root "${STAGING_APK_AMD64}" \
              --mode static \
              --revision "${SOURCE_COMMIT_SHA}" \
              --vcs-time "${SOURCE_VCS_TIME}" \
              --signatures-source \
              "${EXACT_SOURCE_ROOT}/src/core/syswarden-core/signatures.json" \
              --print-digest-contract
          )"
          [[ "${AMD64_DIGEST_CONTRACT}" == v1\;* ]]
          [[ "${APK_AMD64_DIGEST_CONTRACT}" == v1\;* ]]
          printf 'amd64_digest_contract=%s\n' \
            "${AMD64_DIGEST_CONTRACT}" >> "${GITHUB_OUTPUT}"
          printf 'apk_amd64_digest_contract=%s\n' \
            "${APK_AMD64_DIGEST_CONTRACT}" >> "${GITHUB_OUTPUT}"

      - name: Prepare Linux Maintainer Scripts
        run: |
          set -euo pipefail
          cat "${EXACT_SOURCE_ROOT}/scripts/ci/package_webtui_retirement.sh" > "${PACKAGE_SCRIPTS}/preinst.sh"
          cat "${EXACT_SOURCE_ROOT}/scripts/ci/package_deferred_purge_postinstall.sh" >> "${PACKAGE_SCRIPTS}/preinst.sh"
          cat "${EXACT_SOURCE_ROOT}/scripts/ci/package_alpine_cronie_preflight.sh" >> "${PACKAGE_SCRIPTS}/preinst.sh"
          cat "${EXACT_SOURCE_ROOT}/scripts/ci/package_systemd_ordering_preflight.sh" >> "${PACKAGE_SCRIPTS}/preinst.sh"
          cat << 'EOF' >> "${PACKAGE_SCRIPTS}/preinst.sh"
          set -e
          export SYSWARDEN_PKG_INSTALL=1
          syswarden_preflight_alpine_cronie
          syswarden_preflight_install_barriers
          syswarden_preflight_systemd_ordering_dropin
          if [ "${SYSWARDEN_OFFLINE_QUALIFICATION:-}" = 1 ]; then
              if [ "${syswarden_deferred_present:-0}" -ne 0 ] || \
                 [ "${syswarden_finalizing_present:-0}" -ne 0 ]; then
                  printf '%s\n' 'Offline qualification requires an installation state without deferred removal barriers.' >&2
                  exit 1
              fi
              printf '%s\n' 'SysWarden offline qualification staging: pre-install host mutation deferred.'
              exit 0
          fi
          secure_private_directory() {
              path="$1"
              if [ -L "${path}" ] || { [ -e "${path}" ] && [ ! -d "${path}" ]; }; then
                  echo "Refusing unsafe SysWarden directory: ${path}" >&2
                  exit 1
              fi
              if [ ! -d "${path}" ]; then
                  (umask 027 && mkdir -p "${path}")
              fi
              expected_user="$(id -un)"
              expected_group="$(id -gn)"
              if [ "$(find "${path}" -prune -user "${expected_user}" -group "${expected_group}" -print)" != "${path}" ]; then
                  echo "Refusing non-owner-controlled SysWarden directory: ${path}" >&2
                  exit 1
              fi
              chmod go-w,o-rwx "${path}"
              if [ -L "${path}" ] || [ ! -d "${path}" ] || \
                 [ "$(find "${path}" -prune -user "${expected_user}" -group "${expected_group}" -print)" != "${path}" ]; then
                  echo "SysWarden directory identity changed while securing it: ${path}" >&2
                  exit 1
              fi
          }
          for directory in \
              /etc/syswarden \
              /etc/syswarden/config \
              /etc/syswarden/config/modules \
              /etc/syswarden/lists \
              /etc/syswarden/tls \
              /var/lib/syswarden \
              /var/lib/syswarden/ui; do
              secure_private_directory "${directory}"
          done
          for legacy_config_path in \
              /opt/syswarden/syswarden-auto.conf \
              /opt/syswarden/syswarden-auto.conf.migration_backup \
              /opt/syswarden/syswarden-auto.conf.migration_backup.migrated \
              /opt/syswarden/syswarden-auto.conf.bak; do
              if [ -L "${legacy_config_path}" ]; then
                  echo "Refusing a symlinked legacy configuration path: ${legacy_config_path}" >&2
                  exit 1
              fi
          done
          syswarden_retire_legacy_webtui / || exit 1
          if [ -f /opt/syswarden/syswarden-auto.conf ] && \
             [ ! -e /opt/syswarden/syswarden-auto.conf.migration_backup ] && \
             [ ! -e /opt/syswarden/syswarden-auto.conf.migration_backup.migrated ]; then
              mv /opt/syswarden/syswarden-auto.conf /opt/syswarden/syswarden-auto.conf.migration_backup
          fi
          EOF

          cat "${EXACT_SOURCE_ROOT}/scripts/ci/package_webtui_retirement.sh" > "${PACKAGE_SCRIPTS}/postinst.sh"
          cat "${EXACT_SOURCE_ROOT}/scripts/ci/package_deferred_purge_postinstall.sh" >> "${PACKAGE_SCRIPTS}/postinst.sh"
          cat "${EXACT_SOURCE_ROOT}/scripts/ci/package_alpine_cronie_preflight.sh" >> "${PACKAGE_SCRIPTS}/postinst.sh"
          cat << 'EOF' >> "${PACKAGE_SCRIPTS}/postinst.sh"
          set -e
          export SYSWARDEN_PKG_INSTALL=1
          syswarden_preflight_alpine_cronie
          syswarden_preflight_install_barriers
          if [ "${SYSWARDEN_OFFLINE_QUALIFICATION:-}" = 1 ]; then
              if [ "${syswarden_deferred_present:-0}" -ne 0 ] || \
                 [ "${syswarden_finalizing_present:-0}" -ne 0 ]; then
                  printf '%s\n' 'Offline qualification requires an installation state without deferred removal barriers.' >&2
                  exit 1
              fi
              printf '%s\n' 'SysWarden offline qualification staging: post-install host mutation deferred.'
              exit 0
          fi
          ln -sf /opt/syswarden/bin/syswarden-cli /usr/local/bin/syswarden
          ln -sf /opt/syswarden/bin/syswarden-tui /usr/local/bin/syswarden-tui

          package_service_manager() {
              if [ -f /etc/alpine-release ]; then
                  printf '%s\n' openrc
              else
                  printf '%s\n' systemd
              fi
          }

          modular_config_complete() {
              for file in \
                  /etc/syswarden/config/config.toml \
                  /etc/syswarden/config/modules/00-core.toml \
                  /etc/syswarden/config/modules/10-network.toml \
                  /etc/syswarden/config/modules/20-security.toml \
                  /etc/syswarden/config/modules/30-waap.toml \
                  /etc/syswarden/config/modules/40-integrations.toml \
                  /etc/syswarden/config/modules/99-user.toml; do
                  [ -f "${file}" ] || return 1
              done
              return 0
          }
          migrate_legacy_configuration() {
              source=/opt/syswarden/syswarden-auto.conf.migration_backup
              marker=/etc/syswarden/config/.migration-in-progress
              archive=/opt/syswarden/syswarden-auto.conf.bak
              if [ -f "${marker}" ]; then
                  /opt/syswarden/bin/syswarden-cli migrate-config --source "${source}" --output /etc/syswarden/config
              elif [ -f "${source}" ] && ! modular_config_complete; then
                  /opt/syswarden/bin/syswarden-cli migrate-config --source "${source}" --output /etc/syswarden/config
              fi
              if [ -f "${source}.migrated" ]; then
                  [ ! -e "${archive}" ] && [ ! -L "${archive}" ] || {
                      echo "Refusing to overwrite an existing legacy configuration archive" >&2
                      return 1
                  }
                  mv "${source}.migrated" "${archive}"
              elif [ -f "${source}" ] && [ ! -f "${marker}" ] && modular_config_complete; then
                  [ ! -e "${archive}" ] && [ ! -L "${archive}" ] || {
                      echo "Refusing to overwrite an existing legacy configuration archive" >&2
                      return 1
                  }
                  mv "${source}" "${archive}"
              fi
          }
          migrate_legacy_configuration

          if [ "$1" = "2" ] || [ "$1" = "1" ] || [ "$1" = "configure" ] || [ -f /etc/alpine-release ]; then
              manager="$(package_service_manager)"
              manager_state="$(syswarden_classify_service_manager / "${manager}")"
              case "${manager_state}" in
                  ACTIVE)
                      /opt/syswarden/bin/syswarden-cli install
                      [ "$(syswarden_classify_service_manager / "${manager}")" = ACTIVE ] || {
                          echo "Service-manager runtime changed during package installation" >&2
                          exit 1
                      }
                      ;;
                  OFFLINE)
                      echo "Service-manager runtime is offline; host configuration is deferred until an explicit online install."
                      ;;
                  *)
                      echo "Refusing an ambiguous service-manager runtime" >&2
                      exit 1
                      ;;
              esac
          fi
          syswarden_verify_webtui_retirement /
          syswarden_consume_deferred_purge_marker
          EOF

          cat "${EXACT_SOURCE_ROOT}/scripts/ci/package_webtui_retirement.sh" > "${PACKAGE_SCRIPTS}/postrm.sh"
          cat "${EXACT_SOURCE_ROOT}/scripts/ci/package_removal_state.sh" >> "${PACKAGE_SCRIPTS}/postrm.sh"
          cat << 'EOF' >> "${PACKAGE_SCRIPTS}/postrm.sh"
          export SYSWARDEN_PKG_INSTALL=1

          syswarden_refresh_systemd_after_rpm_payload_transition() {
              [ "${1:-}" = 1 ] || return 0
              [ ! -f /etc/alpine-release ] || return 1
              syswarden_postremove_manager_state="$(
                  syswarden_classify_service_manager / systemd isolated
              )" || return 1
              case "${syswarden_postremove_manager_state}" in
                  ACTIVE)
                      command -v systemctl >/dev/null 2>&1 || return 1
                      systemctl daemon-reload || return 1
                      [ "$(syswarden_classify_service_manager / systemd isolated)" = ACTIVE ] || return 1
                      ;;
                  OFFLINE) ;;
                  *)
                      printf '%s\n' 'Refusing an ambiguous systemd runtime after an RPM payload transition.' >&2
                      return 1
                      ;;
              esac
          }

          cleanup_generated_runtime_artifacts() {
              syswarden_verify_legacy_webtui_runtime_absent / || return 1
              printf '%s\n' 'Preserving root crontab and every modified or ambiguous legacy host artifact for manual recovery.' >&2
          }

          syswarden_path_absent() {
              [ ! -e "$1" ] && [ ! -L "$1" ]
          }

          syswarden_refuse_mounted_path_tree() {
              syswarden_mount_root="$1"
              [ -r /proc/self/mountinfo ] || {
                  printf 'Refusing removal without readable mount topology: %s\n' "${syswarden_mount_root}" >&2
                  return 1
              }
              if ! awk -v root="${syswarden_mount_root}" '
                  {
                      mountpoint = $5
                      gsub(/\\040/, " ", mountpoint)
                      gsub(/\\011/, "\t", mountpoint)
                      gsub(/\\012/, "\n", mountpoint)
                      gsub(/\\134/, "\\", mountpoint)
                      if (mountpoint == root || index(mountpoint, root "/") == 1) {
                          exit 42
                      }
                  }
              ' /proc/self/mountinfo; then
                  printf 'Refusing removal across a mounted product path: %s\n' "${syswarden_mount_root}" >&2
                  return 1
              fi
          }

          syswarden_attest_dedicated_root() {
              syswarden_root_path="$1"
              syswarden_path_absent "${syswarden_root_path}" && return 0
              [ ! -L "${syswarden_root_path}" ] && [ -d "${syswarden_root_path}" ] || {
                  printf 'Refusing unsafe dedicated product root: %s\n' "${syswarden_root_path}" >&2
                  return 1
              }
              case "$(stat -c '%u:%g:%a' "${syswarden_root_path}")" in
                  0:0:700|0:0:750|0:0:755) ;;
                  *) printf 'Refusing unsafe dedicated product root metadata: %s\n' "${syswarden_root_path}" >&2; return 1 ;;
              esac
          }

          syswarden_remove_exact_product_link() {
              syswarden_link_path="$1"
              syswarden_link_target="$2"
              syswarden_path_absent "${syswarden_link_path}" && return 0
              [ -L "${syswarden_link_path}" ] || {
                  printf 'Refusing non-symlink product launcher: %s\n' "${syswarden_link_path}" >&2
                  return 1
              }
              [ "$(stat -c '%u:%g:%h' "${syswarden_link_path}")" = '0:0:1' ] || return 1
              [ "$(readlink "${syswarden_link_path}")" = "${syswarden_link_target}" ] || {
                  printf 'Refusing unexpected product launcher target: %s\n' "${syswarden_link_path}" >&2
                  return 1
              }
              [ "$(readlink "${syswarden_link_path}")" = "${syswarden_link_target}" ] || return 1
              rm -f -- "${syswarden_link_path}" || return 1
              syswarden_path_absent "${syswarden_link_path}"
          }

          syswarden_remove_exact_runtime_socket() {
              syswarden_socket_path="$1"
              syswarden_path_absent "${syswarden_socket_path}" && return 0
              [ ! -L "${syswarden_socket_path}" ] && [ -S "${syswarden_socket_path}" ] || {
                  printf 'Refusing non-attributable product socket: %s\n' "${syswarden_socket_path}" >&2
                  return 1
              }
              [ "$(stat -c '%u:%g:%h' "${syswarden_socket_path}")" = '0:0:1' ] || return 1
              [ ! -L "${syswarden_socket_path}" ] && [ -S "${syswarden_socket_path}" ] || return 1
              rm -f -- "${syswarden_socket_path}" || return 1
              syswarden_path_absent "${syswarden_socket_path}"
          }

          syswarden_remove_dedicated_root() {
              syswarden_root_path="$1"
              syswarden_path_absent "${syswarden_root_path}" && return 0
              syswarden_attest_dedicated_root "${syswarden_root_path}" || return 1
              syswarden_refuse_mounted_path_tree "${syswarden_root_path}" || return 1
              syswarden_attest_dedicated_root "${syswarden_root_path}" || return 1
              rm -rf -- "${syswarden_root_path}" || return 1
              syswarden_path_absent "${syswarden_root_path}"
          }

          if [ -f /etc/alpine-release ] || [ "$1" = "0" ] || [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
              cleanup_generated_runtime_artifacts || exit 1
              syswarden_remove_exact_product_link /usr/local/bin/syswarden /opt/syswarden/bin/syswarden-cli || exit 1
              syswarden_remove_exact_product_link /usr/local/bin/syswarden-tui /opt/syswarden/bin/syswarden-tui || exit 1
              syswarden_remove_exact_runtime_socket /run/syswarden.sock || exit 1
              syswarden_remove_exact_runtime_socket /run/syswarden-control.sock || exit 1
              if [ -f /etc/alpine-release ] || [ "$1" = "0" ] || [ "$1" = "purge" ]; then
                  syswarden_select_removal_barrier
                  syswarden_barrier_status=$?
                  if [ "${syswarden_barrier_status}" -eq 2 ]; then
                      syswarden_resume_unmarked_terminal_state || exit 1
                      exit 0
                  fi
                  [ "${syswarden_barrier_status}" -eq 0 ] || exit 1
                  if [ "${syswarden_barrier_kind}" = finalizing ]; then
                      syswarden_resume_external_finalization || exit 1
                      exit 0
                  fi
                  for syswarden_purge_root in \
                      /opt/syswarden \
                      /etc/syswarden \
                      /var/log/syswarden \
                      /var/lib/syswarden; do
                      syswarden_attest_dedicated_root "${syswarden_purge_root}" || exit 1
                      syswarden_refuse_mounted_path_tree "${syswarden_purge_root}" || exit 1
                  done
                  syswarden_attest_removal_marker "${syswarden_active_barrier}" || exit 1
                  syswarden_remove_dedicated_root /opt/syswarden || exit 1
                  syswarden_remove_dedicated_root /etc/syswarden || exit 1
                  syswarden_remove_dedicated_root /var/log/syswarden || exit 1
                  syswarden_empty_removal_state || exit 1
                  syswarden_finalize_removal_state_root || exit 1
              else
                  syswarden_transition_to_deferred_purge || exit 1
              fi
          fi
          syswarden_refresh_systemd_after_rpm_payload_transition "${1:-}" || exit 1
          EOF

          cat "${EXACT_SOURCE_ROOT}/scripts/ci/package_webtui_retirement.sh" > "${PACKAGE_SCRIPTS}/prerm.sh"
          cat << 'EOF' >> "${PACKAGE_SCRIPTS}/prerm.sh"
          export SYSWARDEN_PKG_INSTALL=1
          case "${APK_PACKAGE:-}:${APK_SCRIPT:-}:${1:-}" in
          ::0|::remove|::purge) ;;
          ::*grade|::reinstall|::deconfigure) exit;;
          syswarden:pre-deinstall:*|::*.*.*) case "$1" in *[!0-9.]*) exit 1;;esac;printf %s "$1"|grep -Eq '^[1-9][0-9]*(\.(0|[1-9][0-9]*)){2}$'||exit;[ -n "${APK_SCRIPT:-}" ]||[ -f /etc/alpine-release ]||exit;;
          ::*) [ "$1" -gt 0 ] 2>/dev/null&&exit;exit 1;;
          *) exit 1;;
          esac
          /opt/syswarden/bin/syswarden-cli prepare-package-removal || exit 1
          syswarden_retire_legacy_webtui / || exit 1
          printf '%s\n' 'Root crontab bytes and ambiguous legacy host artifacts were preserved for manual recovery.' >&2
          EOF

          chmod 0755 \
            "${PACKAGE_SCRIPTS}/preinst.sh" \
            "${PACKAGE_SCRIPTS}/postinst.sh" \
            "${PACKAGE_SCRIPTS}/postrm.sh" \
            "${PACKAGE_SCRIPTS}/prerm.sh"

          # rpmbuild expands RPM macros inside scriptlets. Double each percent
          # only in the private RPM inputs so final scriptlets stay byte-exact.
          prepare_rpm_scriptlet() {
            local source="$1"
            local destination="$2"
            if [ -L "${source}" ] || [ ! -f "${source}" ]; then
              echo "ERROR: RPM scriptlet source is not a regular file: ${source}" >&2
              return 1
            fi
            LC_ALL=C sed 's/%/%%/g' -- "${source}" > "${destination}"
            chmod 0700 "${destination}"
            if [ -L "${destination}" ] || [ ! -f "${destination}" ]; then
              echo "ERROR: RPM scriptlet input is not a regular file: ${destination}" >&2
              return 1
            fi
          }
          for script_name in preinst.sh postinst.sh prerm.sh postrm.sh; do
            prepare_rpm_scriptlet \
              "${PACKAGE_SCRIPTS}/${script_name}" \
              "${PACKAGE_RPM_SCRIPTS}/${script_name}"
          done

      - name: Normalize Package Input Timestamps
        shell: bash
        run: |
          set -euo pipefail
          prepare_rpm_changelog() {
            local destination="$1"
            local package_release="$2"
            local changelog_date
            local changelog_day
            changelog_day="$(date --utc --date="@${SOURCE_DATE_EPOCH}" '+%Y-%m-%d')" || return 1
            changelog_date="$(date --utc --date="@${SOURCE_DATE_EPOCH}" '+%a %b %e %Y')" || return 1
            RPM_CHANGELOG_EPOCH="$(date --utc --date="${changelog_day} 12:00:00" '+%s')" || return 1
            case "${RPM_CHANGELOG_EPOCH}" in
              ''|0|*[!0-9]*) return 1 ;;
            esac
            printf '* %s SysWarden Engineering - %s-%s\n- Package created with FPM\n' \
              "${changelog_date}" "${VERSION}" "${package_release}" > "${destination}"
            chmod 0600 "${destination}"
          }
          normalize_package_mtimes() {
            local target
            for target in "$@"; do
              if [ ! -e "${target}" ] && [ ! -L "${target}" ]; then
                echo "ERROR: package timestamp target is missing: ${target}" >&2
                return 1
              fi
              find "${target}" -depth -exec \
                touch -h --date="@${SOURCE_DATE_EPOCH}" -- {} +
            done
          }
          RPM_CHANGELOG="${PACKAGE_CONFIGS}/rpm-changelog"
          RHEL_PROFILE_RPM_CHANGELOG="${PACKAGE_CONFIGS}/rpm-changelog-rhelpo"
          prepare_rpm_changelog "${RPM_CHANGELOG}" 1
          prepare_rpm_changelog "${RHEL_PROFILE_RPM_CHANGELOG}" 1.rhelpo
          normalize_package_mtimes \
            "${STAGING_AMD64}" \
            "${STAGING_APK_AMD64}" \
            "${RHEL_PROFILE_STAGING}" \
            "${RHEL_PROFILE_SOURCE}" \
            "${RHEL_PROFILE_RPM_SCRIPTS}" \
            "${PACKAGE_SCRIPTS}" \
            "${PACKAGE_RPM_SCRIPTS}" \
            "${RPM_CHANGELOG}" \
            "${RHEL_PROFILE_RPM_CHANGELOG}"
          echo "RPM_CHANGELOG=${RPM_CHANGELOG}" >> "${GITHUB_ENV}"
          echo "RPM_CHANGELOG_EPOCH=${RPM_CHANGELOG_EPOCH}" >> "${GITHUB_ENV}"
          echo "RHEL_PROFILE_RPM_CHANGELOG=${RHEL_PROFILE_RPM_CHANGELOG}" >> "${GITHUB_ENV}"

      - name: Build Debian Package (.deb)
        run: |
          set -euo pipefail
          fpm -s dir -t deb \
            -n syswarden \
            -v "${VERSION}" \
            -p "${PACKAGE_ASSETS}/syswarden_${VERSION}_amd64.deb" \
            --vendor "SysWarden Security" \
            --maintainer "SysWarden Engineering" \
            --description "SysWarden Host-based Security Orchestrator for Linux" \
            --url "https://github.com/${{ github.repository }}" \
            --license "GPL-3.0-or-later" \
            --architecture amd64 \
            --source-date-epoch-default "${SOURCE_DATE_EPOCH}" \
            -d "nftables" -d "ipset" -d "curl" -d "wget" -d "rsyslog" -d "cron" -d "bash-completion" \
            -d "wireguard-tools" -d "qrencode" -d "jq" -d "unattended-upgrades" -d "apt-listchanges" -d "procps" -d "e2fsprogs" \
            --before-install "${PACKAGE_SCRIPTS}/preinst.sh" \
            --after-install "${PACKAGE_SCRIPTS}/postinst.sh" \
            --before-remove "${PACKAGE_SCRIPTS}/prerm.sh" \
            --after-remove "${PACKAGE_SCRIPTS}/postrm.sh" \
            -C "${STAGING_AMD64}" .

      - name: Build RHEL Family Package (.rpm)
        run: |
          set -euo pipefail
          fpm -s dir -t rpm \
            -n syswarden \
            -v "${VERSION}" \
            -p "${PACKAGE_ASSETS}/syswarden-${VERSION}-1.x86_64.rpm" \
            --vendor "SysWarden Security" \
            --maintainer "SysWarden Engineering" \
            --description "SysWarden Host-based Security Orchestrator for Linux" \
            --url "https://github.com/${{ github.repository }}" \
            --license "GPL-3.0-or-later" \
            --architecture x86_64 \
            --source-date-epoch-default "${SOURCE_DATE_EPOCH}" \
            --rpm-changelog "${RPM_CHANGELOG}" \
            --rpm-digest sha256 \
            --rpm-rpmbuild-define "_binary_filedigest_algorithm 8" \
            --rpm-rpmbuild-define "_source_filedigest_algorithm 8" \
            --rpm-rpmbuild-define "use_source_date_epoch_as_buildtime 1" \
            --rpm-rpmbuild-define "clamp_mtime_to_source_date_epoch 1" \
            --rpm-rpmbuild-define "_buildhost syswarden-build.invalid" \
            -d "nftables" -d "ipset" -d "curl" -d "wget" -d "rsyslog" -d "cronie" -d "bash-completion" \
            -d "wireguard-tools" -d "jq" -d "checkpolicy" -d "policycoreutils-python-utils" \
            -d "dnf-automatic" -d "procps-ng" -d "e2fsprogs" \
            --before-install "${PACKAGE_RPM_SCRIPTS}/preinst.sh" \
            --after-install "${PACKAGE_RPM_SCRIPTS}/postinst.sh" \
            --before-remove "${PACKAGE_RPM_SCRIPTS}/prerm.sh" \
            --after-remove "${PACKAGE_RPM_SCRIPTS}/postrm.sh" \
            --directories /usr/lib/systemd/system/syswarden-firewall.service.d \
            --rpm-attr "0755,root,root:/usr/lib/systemd/system/syswarden-firewall.service.d" \
            --directories /usr/share/doc/syswarden \
            -C "${STAGING_AMD64}" .

      - name: Build Opt-in RHEL Package-owned Variant (.rpm)
        shell: bash
        run: |
          set -euo pipefail
          fpm -s dir -t rpm \
            -n syswarden \
            -v "${VERSION}" \
            --iteration 1.rhelpo \
            -p "${RHEL_PROFILE_ASSETS}/syswarden-${VERSION}-1.rhelpo.x86_64.rpm" \
            --vendor "SysWarden Security" \
            --maintainer "SysWarden Engineering" \
            --description "SysWarden package-owned runtime profile for RHEL images" \
            --url "https://github.com/${{ github.repository }}" \
            --license "GPL-3.0-or-later" \
            --architecture x86_64 \
            --source-date-epoch-default "${SOURCE_DATE_EPOCH}" \
            --rpm-changelog "${RHEL_PROFILE_RPM_CHANGELOG}" \
            --rpm-digest sha256 \
            --rpm-rpmbuild-define "_build_id_links none" \
            --rpm-rpmbuild-define "_binary_filedigest_algorithm 8" \
            --rpm-rpmbuild-define "_source_filedigest_algorithm 8" \
            --rpm-rpmbuild-define "use_source_date_epoch_as_buildtime 1" \
            --rpm-rpmbuild-define "clamp_mtime_to_source_date_epoch 1" \
            --rpm-rpmbuild-define "_buildhost syswarden-build.invalid" \
            -d "nftables" -d "systemd" -d "ipset" -d "curl" -d "wget" -d "rsyslog" -d "cronie" -d "bash-completion" \
            -d "wireguard-tools" -d "jq" -d "checkpolicy" -d "policycoreutils-python-utils" \
            -d "dnf-automatic" -d "procps-ng" -d "e2fsprogs" \
            --before-install "${RHEL_PROFILE_RPM_SCRIPTS}/pre-install.sh" \
            --after-install "${RHEL_PROFILE_RPM_SCRIPTS}/post-install.sh" \
            --before-remove "${RHEL_PROFILE_RPM_SCRIPTS}/pre-uninstall.sh" \
            --after-remove "${RHEL_PROFILE_RPM_SCRIPTS}/post-uninstall.sh" \
            --directories /etc/syswarden \
            --directories /etc/syswarden/config \
            --directories /etc/syswarden/config/modules \
            --directories /etc/syswarden/lists \
            --directories /etc/syswarden/tls \
            --directories /var/lib/syswarden \
            --directories /var/lib/syswarden/ui \
            --directories /var/log/syswarden \
            --directories /usr/lib/systemd/system/syswarden-firewall.service.d \
            --rpm-attr "0755,root,root:/usr/lib/systemd/system/syswarden-firewall.service.d" \
            --rpm-attr "0750,root,root:/etc/syswarden" \
            --rpm-attr "0750,root,root:/etc/syswarden/config" \
            --rpm-attr "0750,root,root:/etc/syswarden/config/modules" \
            --rpm-attr "0750,root,root:/etc/syswarden/lists" \
            --rpm-attr "0750,root,root:/etc/syswarden/tls" \
            --rpm-attr "0750,root,root:/var/lib/syswarden" \
            --rpm-attr "0750,root,root:/var/lib/syswarden/ui" \
            --rpm-attr "0750,root,root:/var/log/syswarden" \
            --rpm-attr "0755,root,root:/usr/share/doc/syswarden" \
            --directories /usr/share/doc/syswarden \
            -C "${RHEL_PROFILE_STAGING}" .

      - name: Build Alpine Package (.apk)
        run: |
          set -euo pipefail
          TOOL_DIR="${PACKAGE_WORKSPACE}/tools"
          install -d -m 0700 "${TOOL_DIR}"
          GOBIN="${TOOL_DIR}" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          
          cat << EOF > "${PACKAGE_CONFIGS}/nfpm_alpine_x86_64.yaml"
          name: "syswarden"
          arch: "amd64"
          platform: "linux"
          version: "${VERSION}"
          maintainer: "SysWarden Engineering"
          description: "SysWarden Host-based Security Orchestrator for Alpine Linux"
          vendor: "SysWarden Security"
          homepage: "https://github.com/${{ github.repository }}"
          license: "GPL-3.0-or-later"
          depends:
            - nftables
            - openrc
            - cronie
            - cronie-openrc
            - curl
            - wget
            - rsyslog
            - rsyslog-uxsock
            - bash-completion
            - wireguard-tools
            - libqrencode-tools
            - jq
            - procps-ng
            - e2fsprogs-extra
            - shadow
          contents:
            - src: "${STAGING_APK_AMD64}/opt"
              dst: "/opt"
            - src: "${STAGING_APK_AMD64}/usr"
              dst: "/usr"
          scripts:
            preinstall: "${PACKAGE_SCRIPTS}/preinst.sh"
            postinstall: "${PACKAGE_SCRIPTS}/postinst.sh"
            preremove: "${PACKAGE_SCRIPTS}/prerm.sh"
            postremove: "${PACKAGE_SCRIPTS}/postrm.sh"
          apk:
            scripts:
              preupgrade: "${PACKAGE_SCRIPTS}/preinst.sh"
              postupgrade: "${PACKAGE_SCRIPTS}/postinst.sh"
          EOF

          "${TOOL_DIR}/nfpm" pkg \
            --config "${PACKAGE_CONFIGS}/nfpm_alpine_x86_64.yaml" \
            --packager apk \
            --target "${PACKAGE_ASSETS}/syswarden_${VERSION}_x86_64.apk"

      - name: Validate Package Metadata
        shell: bash
        run: |
          set -euo pipefail

          validate_deb() {
            local path="$1"
            local architecture="$2"
            [[ "$(dpkg-deb --field "${path}" Version)" == "${VERSION}" ]]
            [[ "$(dpkg-deb --field "${path}" Architecture)" == "${architecture}" ]]
            [[ "$(dpkg-deb --field "${path}" License)" == "GPL-3.0-or-later" ]]
            [[ "$(dpkg-deb --field "${path}" Homepage)" == "https://github.com/${{ github.repository }}" ]]
          }

          validate_rpm_scriptlet() {
            local path="$1"
            local tag="$2"
            local expected_path="$3"
            local actual
            local expected
            local interpreter
            actual="$(rpm --query --package --queryformat "%{${tag}}" "${path}")" || return 1
            expected="$(cat "${expected_path}")" || return 1
            interpreter="$(rpm --query --package --queryformat "%{${tag}PROG}" "${path}")" || return 1
            [[ -n "${actual}" ]]
            [[ "${actual}" == "${expected}" ]]
            [[ "${interpreter}" == "/bin/sh" ]]
          }

          validate_rpm() {
            local path="$1"
            local architecture="$2"
            local actual_architecture
            local actual_build_host
            local actual_build_time
            local actual_changelog_time
            local actual_license
            local actual_url
            local actual_version
            local forbidden_crontab_token
            local scriptlets
            actual_version="$(rpm --query --package --queryformat '%{VERSION}' "${path}")" || return 1
            actual_architecture="$(rpm --query --package --queryformat '%{ARCH}' "${path}")" || return 1
            actual_build_time="$(rpm --query --package --queryformat '%{BUILDTIME}' "${path}")" || return 1
            actual_build_host="$(rpm --query --package --queryformat '%{BUILDHOST}' "${path}")" || return 1
            actual_changelog_time="$(rpm --query --package --queryformat '%{CHANGELOGTIME}' "${path}")" || return 1
            actual_license="$(rpm --query --package --queryformat '%{LICENSE}' "${path}")" || return 1
            actual_url="$(rpm --query --package --queryformat '%{URL}' "${path}")" || return 1
            [[ "${actual_version}" == "${VERSION}" ]]
            [[ "${actual_architecture}" == "${architecture}" ]]
            [[ "${actual_build_time}" == "${SOURCE_DATE_EPOCH}" ]]
            [[ "${actual_build_host}" == "syswarden-build.invalid" ]]
            [[ "${actual_changelog_time}" == "${RPM_CHANGELOG_EPOCH}" ]]
            [[ "${actual_license}" == "GPL-3.0-or-later" ]]
            [[ "${actual_url}" == "https://github.com/${{ github.repository }}" ]]
            scriptlets="$(rpm --query --package --scripts "${path}")" || return 1
            for forbidden_crontab_token in \
              syswarden_cron_candidate \
              syswarden_cron_minute \
              syswarden_managed_cron_line \
              syswarden_filter_crontab \
              syswarden_read_crontab \
              syswarden_cleanup_crontab \
              'crontab -l' \
              'crontab -r' \
              'crontab - <'; do
              if grep --fixed-strings --quiet -- "${forbidden_crontab_token}" <<< "${scriptlets}"; then
                return 1
              fi
            done
            validate_rpm_scriptlet "${path}" PREIN "${PACKAGE_SCRIPTS}/preinst.sh"
            validate_rpm_scriptlet "${path}" POSTIN "${PACKAGE_SCRIPTS}/postinst.sh"
            validate_rpm_scriptlet "${path}" PREUN "${PACKAGE_SCRIPTS}/prerm.sh"
            validate_rpm_scriptlet "${path}" POSTUN "${PACKAGE_SCRIPTS}/postrm.sh"
          }

          validate_apk() {
            local path="$1"
            local architecture="$2"
            local member
            local metadata
            local package_version
            local package_architecture
            local -a preinstall_members=()
            local -a preupgrade_members=()
            local -a postinstall_members=()
            local -a postupgrade_members=()
            member="$(tar --list --file "${path}" | awk '/(^|\/)\.PKGINFO$/ { print }')"
            [[ "$(wc -l <<< "${member}")" -eq 1 ]]
            metadata="$(tar --extract --to-stdout --file "${path}" "${member}")"
            [[ "$(grep --count '^pkgver = ' <<< "${metadata}")" -eq 1 ]]
            [[ "$(grep --count '^arch = ' <<< "${metadata}")" -eq 1 ]]
            [[ "$(grep --count '^depend = openrc$' <<< "${metadata}")" -eq 1 ]]
            [[ "$(grep --count '^depend = cronie$' <<< "${metadata}")" -eq 1 ]]
            [[ "$(grep --count '^depend = cronie-openrc$' <<< "${metadata}")" -eq 1 ]]
            [[ "$(grep --count '^license = GPL-3.0-or-later$' <<< "${metadata}")" -eq 1 ]]
            [[ "$(grep --fixed-strings --line-regexp --count -- 'url = https://github.com/${{ github.repository }}' <<< "${metadata}")" -eq 1 ]]
            mapfile -t preinstall_members < <(
              tar --list --file "${path}" | awk '/(^|\/)\.pre-install$/ { print }'
            )
            mapfile -t preupgrade_members < <(
              tar --list --file "${path}" | awk '/(^|\/)\.pre-upgrade$/ { print }'
            )
            mapfile -t postinstall_members < <(
              tar --list --file "${path}" | awk '/(^|\/)\.post-install$/ { print }'
            )
            mapfile -t postupgrade_members < <(
              tar --list --file "${path}" | awk '/(^|\/)\.post-upgrade$/ { print }'
            )
            [[ "${#preinstall_members[@]}" -eq 1 ]]
            [[ "${#preupgrade_members[@]}" -eq 1 ]]
            [[ "${#postinstall_members[@]}" -eq 1 ]]
            [[ "${#postupgrade_members[@]}" -eq 1 ]]
            cmp -s \
              <(tar --extract --to-stdout --file "${path}" "${preinstall_members[0]}") \
              <(tar --extract --to-stdout --file "${path}" "${preupgrade_members[0]}")
            cmp -s \
              <(tar --extract --to-stdout --file "${path}" "${postinstall_members[0]}") \
              <(tar --extract --to-stdout --file "${path}" "${postupgrade_members[0]}")
            package_version="$(sed -n 's/^pkgver = //p' <<< "${metadata}")"
            package_architecture="$(sed -n 's/^arch = //p' <<< "${metadata}")"
            python3 - "${VERSION}" "${package_version}" <<'PY'
          import re
          import sys

          expected, actual = sys.argv[1:]
          pattern = re.compile(r"^[0-9]+(?:\.[0-9]+){2}$")
          if pattern.fullmatch(expected) is None or pattern.fullmatch(actual) is None:
              raise SystemExit("APK versions must contain exactly three numeric components")
          normalize = lambda value: tuple(int(part) for part in value.split("."))
          if normalize(expected) != normalize(actual):
              raise SystemExit(f"APK version mismatch: expected {expected}, found {actual}")
          PY
            [[ "${package_architecture}" == "${architecture}" ]]
          }

          validate_deb "${PACKAGE_ASSETS}/syswarden_${VERSION}_amd64.deb" amd64
          validate_rpm "${PACKAGE_ASSETS}/syswarden-${VERSION}-1.x86_64.rpm" x86_64
          validate_apk "${PACKAGE_ASSETS}/syswarden_${VERSION}_x86_64.apk" x86_64

      - name: Validate Opt-in RHEL Package-owned Variant
        shell: bash
        run: |
          set -euo pipefail
          standard="${PACKAGE_ASSETS}/syswarden-${VERSION}-1.x86_64.rpm"
          profile="${RHEL_PROFILE_ASSETS}/syswarden-${VERSION}-1.rhelpo.x86_64.rpm"
          [[ "$(rpm --query --package --queryformat '%{NAME}' "${standard}")" == syswarden ]]
          [[ "$(rpm --query --package --queryformat '%{RELEASE}' "${standard}")" == 1 ]]
          [[ "$(rpm --query --package --queryformat '%{NAME}' "${profile}")" == syswarden ]]
          [[ "$(rpm --query --package --queryformat '%{VERSION}' "${profile}")" == "${VERSION}" ]]
          [[ "$(rpm --query --package --queryformat '%{RELEASE}' "${profile}")" == 1.rhelpo ]]
          if cmp -s "${standard}" "${profile}"; then
            echo "ERROR: standard and package-owned RPM variants are byte-identical." >&2
            exit 1
          fi
          profile_sha256="$(sha256sum "${profile}" | awk 'NF == 2 { print $1 }')"
          [[ "${profile_sha256}" =~ ^[0-9a-f]{64}$ ]]
          PYTHONDONTWRITEBYTECODE=1 python3 \
            "${EXACT_SOURCE_ROOT}/extensions/rhel-package-owned/verify-rpm.py" \
            --rpm "${profile}" \
            --sha256 "${profile_sha256}"

      - name: Generate Opt-in RHEL Package-owned Checksums
        shell: bash
        run: |
          set -euo pipefail
          name="syswarden-${VERSION}-1.rhelpo.x86_64.rpm"
          (
            cd "${RHEL_PROFILE_ASSETS}"
            test -s "${name}"
            sha256sum "${name}" > SHA256SUMS.txt
            sha256sum --check --strict SHA256SUMS.txt
          )

      - name: Generate Checksums
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "syswarden_${VERSION}_amd64.deb"
            "syswarden-${VERSION}-1.x86_64.rpm"
            "syswarden_${VERSION}_x86_64.apk"
          )
          (
            cd "${PACKAGE_ASSETS}"
            for asset in "${assets[@]}"; do
              test -s "${asset}" || {
                echo "ERROR: required package is missing or empty: ${asset}" >&2
                exit 1
              }
            done
            sha256sum "${assets[@]}" > SHA256SUMS.txt
            sha256sum --check --strict SHA256SUMS.txt
          )

      - name: Validate Exact Package Artifact
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py verify-packages \
            --tag "${RELEASE_TAG}" \
            --packages "${PACKAGE_ASSETS}"
          for format in deb rpm; do
            case "${format}" in
              deb) package="${PACKAGE_ASSETS}/syswarden_${VERSION}_amd64.deb" ;;
              rpm) package="${PACKAGE_ASSETS}/syswarden-${VERSION}-1.x86_64.rpm" ;;
            esac
            PYTHONDONTWRITEBYTECODE=1 python3 \
              scripts/ci/package_systemd_ordering_artifact_gate.py \
              --format "${format}" \
              --package "${package}" \
              --source \
              "${EXACT_SOURCE_ROOT}/src/init/systemd/syswarden-firewall.service.d/10-syswarden-wireguard-ordering.conf" \
              --contract scripts/ci/package_systemd_wireguard_ordering_contract.json
          done

      - name: Validate Packaged Binary Provenance
        shell: bash
        env:
          VALIDATED_AMD64_DIGEST_CONTRACT: ${{ steps.stage_provenance.outputs.amd64_digest_contract }}
          VALIDATED_APK_AMD64_DIGEST_CONTRACT: ${{ steps.stage_provenance.outputs.apk_amd64_digest_contract }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${VALIDATED_AMD64_DIGEST_CONTRACT}" == v1\;* ]]
          [[ "${VALIDATED_APK_AMD64_DIGEST_CONTRACT}" == v1\;* ]]
          PAYLOAD_ATTEST_ROOT="${PACKAGE_WORKSPACE}/payload-attestation"
          if [[ -e "${PAYLOAD_ATTEST_ROOT}" || -L "${PAYLOAD_ATTEST_ROOT}" ]]; then
            echo "ERROR: package payload attestation root already exists." >&2
            exit 1
          fi
          install -d -m 0700 \
            "${PAYLOAD_ATTEST_ROOT}" \
            "${PAYLOAD_ATTEST_ROOT}/deb/opt/syswarden/bin" \
            "${PAYLOAD_ATTEST_ROOT}/rpm/opt/syswarden/bin" \
            "${PAYLOAD_ATTEST_ROOT}/rpm-rhel-package-owned/opt/syswarden/bin" \
            "${PAYLOAD_ATTEST_ROOT}/apk/opt/syswarden/bin"

          extract_exact_member() {
            local format="$1"
            local package="$2"
            local relative="$3"
            local archive_member
            local count
            local destination="${PAYLOAD_ATTEST_ROOT}/${format}/${relative}"
            local temporary="${destination}.tmp"
            case "${format}" in
              deb)
                archive_member="./${relative}"
                count="$(
                  dpkg-deb --fsys-tarfile "${package}" |
                    tar --list --file=- |
                    awk -v expected="${archive_member}" \
                      '$0 == expected { count++ } END { print count + 0 }'
                )"
                [[ "${count}" == "1" ]]
                dpkg-deb --fsys-tarfile "${package}" |
                  tar --extract --to-stdout --file=- "${archive_member}" > \
                    "${temporary}"
                ;;
              rpm|rpm-rhel-package-owned)
                archive_member="./${relative}"
                count="$(
                  rpm2cpio "${package}" |
                    cpio --list --quiet |
                    awk -v expected="${archive_member}" \
                      '$0 == expected { count++ } END { print count + 0 }'
                )"
                [[ "${count}" == "1" ]]
                rpm2cpio "${package}" |
                  cpio --extract --to-stdout --quiet "${archive_member}" > \
                    "${temporary}"
                ;;
              apk)
                archive_member="${relative}"
                count="$(
                  tar --list --file "${package}" |
                    awk -v expected="${archive_member}" \
                      '$0 == expected { count++ } END { print count + 0 }'
                )"
                [[ "${count}" == "1" ]]
                tar --extract --to-stdout --file "${package}" \
                  "${archive_member}" > "${temporary}"
                ;;
              *)
                echo "ERROR: unsupported package format for payload attestation." >&2
                return 1
                ;;
            esac
            [[ -s "${temporary}" && ! -L "${temporary}" ]]
            chmod 0600 "${temporary}"
            mv -T -- "${temporary}" "${destination}"
          }

          for relative in \
            opt/syswarden/bin/syswarden-cli \
            opt/syswarden/bin/syswarden-core \
            opt/syswarden/bin/syswarden-tui \
            opt/syswarden/signatures.json; do
            extract_exact_member deb \
              "${PACKAGE_ASSETS}/syswarden_${VERSION}_amd64.deb" "${relative}"
            extract_exact_member rpm \
              "${PACKAGE_ASSETS}/syswarden-${VERSION}-1.x86_64.rpm" "${relative}"
            extract_exact_member rpm-rhel-package-owned \
              "${RHEL_PROFILE_ASSETS}/syswarden-${VERSION}-1.rhelpo.x86_64.rpm" "${relative}"
            extract_exact_member apk \
              "${PACKAGE_ASSETS}/syswarden_${VERSION}_x86_64.apk" "${relative}"
          done

          PYTHONDONTWRITEBYTECODE=1 python3 \
            "${EXACT_SOURCE_ROOT}/scripts/ci/package_binary_provenance_gate.py" \
            --root "${PAYLOAD_ATTEST_ROOT}/deb" \
            --mode pie \
            --revision "${SOURCE_COMMIT_SHA}" \
            --vcs-time "${SOURCE_VCS_TIME}" \
            --signatures-source \
            "${EXACT_SOURCE_ROOT}/src/core/syswarden-core/signatures.json" \
            --reference-root "${STAGING_AMD64}" \
            --expected-digest-contract \
            "${VALIDATED_AMD64_DIGEST_CONTRACT}"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            "${EXACT_SOURCE_ROOT}/scripts/ci/package_binary_provenance_gate.py" \
            --root "${PAYLOAD_ATTEST_ROOT}/rpm" \
            --mode pie \
            --revision "${SOURCE_COMMIT_SHA}" \
            --vcs-time "${SOURCE_VCS_TIME}" \
            --signatures-source \
            "${EXACT_SOURCE_ROOT}/src/core/syswarden-core/signatures.json" \
            --reference-root "${STAGING_AMD64}" \
            --expected-digest-contract \
            "${VALIDATED_AMD64_DIGEST_CONTRACT}"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            "${EXACT_SOURCE_ROOT}/scripts/ci/package_binary_provenance_gate.py" \
            --root "${PAYLOAD_ATTEST_ROOT}/rpm-rhel-package-owned" \
            --mode pie \
            --revision "${SOURCE_COMMIT_SHA}" \
            --vcs-time "${SOURCE_VCS_TIME}" \
            --signatures-source \
            "${EXACT_SOURCE_ROOT}/src/core/syswarden-core/signatures.json" \
            --reference-root "${RHEL_PROFILE_STAGING}" \
            --expected-digest-contract \
            "${VALIDATED_AMD64_DIGEST_CONTRACT}"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            "${EXACT_SOURCE_ROOT}/scripts/ci/package_binary_provenance_gate.py" \
            --root "${PAYLOAD_ATTEST_ROOT}/apk" \
            --mode static \
            --revision "${SOURCE_COMMIT_SHA}" \
            --vcs-time "${SOURCE_VCS_TIME}" \
            --signatures-source \
            "${EXACT_SOURCE_ROOT}/src/core/syswarden-core/signatures.json" \
            --reference-root "${STAGING_APK_AMD64}" \
            --expected-digest-contract \
            "${VALIDATED_APK_AMD64_DIGEST_CONTRACT}"
          (
            cd "${PACKAGE_ASSETS}"
            sha256sum --check --strict SHA256SUMS.txt
          )
          (
            cd "${RHEL_PROFILE_ASSETS}"
            sha256sum --check --strict SHA256SUMS.txt
          )
          find "${PACKAGE_ASSETS}" -maxdepth 1 -type f -exec chmod 0444 -- {} +
          find "${RHEL_PROFILE_ASSETS}" -maxdepth 1 -type f -exec chmod 0444 -- {} +

      - name: Prove Packaging Did Not Mutate Source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PACKAGE_REPOSITORY_STATE:-}" || {
            echo "ERROR: package repository-state snapshot is unavailable." >&2
            exit 1
          }
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/repository_state.py \
            --repository "${GITHUB_WORKSPACE}" \
            verify \
            --snapshot "${PACKAGE_REPOSITORY_STATE}"

      - name: Upload Package Artifacts
        if: ${{ !github.event.act }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syswarden-packages-${{ env.VERSION }}
          path: ${{ steps.package_workspace.outputs.assets }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Opt-in RHEL Package-owned Artifact
        if: ${{ !github.event.act }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syswarden-rhel-package-owned-${{ env.VERSION }}
          path: ${{ steps.package_workspace.outputs.rhel_profile_assets }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Package Artifacts with Act-compatible protocol
        if: ${{ github.event.act }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: '1'
        with:
          name: syswarden-packages-${{ env.VERSION }}
          path: ${{ steps.package_workspace.outputs.assets }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Opt-in RHEL Package-owned Artifact with Act-compatible protocol
        if: ${{ github.event.act }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: '1'
        with:
          name: syswarden-rhel-package-owned-${{ env.VERSION }}
          path: ${{ steps.package_workspace.outputs.rhel_profile_assets }}
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package
    needs: [build-and-package]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce package build result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build-and-package.result }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "ERROR: Compile and Build Packages concluded ${BUILD_RESULT}." >&2
            exit 1
          fi

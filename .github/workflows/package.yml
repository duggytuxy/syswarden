name: SysWarden Builder and Packager

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    # paths removed to allow tags


  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    name: Compile and Build Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            go.work.sum
            src/core/syswarden-cli/go.sum
            src/core/syswarden-core/go.sum
            src/core/syswarden-tui/go.sum

      - name: Setup pinned PowerShell 7.6.4
        shell: bash
        run: bash scripts/ci/setup_powershell.sh

      - name: Test Package and Release Validators
        shell: bash
        run: |
          set -euo pipefail
          (cd scripts/versionctl && GOWORK=off go test ./...)
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            scripts/ci/package_lifecycle_contract_test.py \
            scripts/ci/package_stage_gate_test.py \
            scripts/ci/release_gate_test.py \
            scripts/ci/repository_state_test.py \
            -v

      - name: Validate and Export Version Contract
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          SOURCE_TAG="$(./scripts/versioning.sh inspect --repo "${GITHUB_WORKSPACE}")"
          if [[ "${RELEASE_REF_TYPE}" == "tag" ]]; then
            ./scripts/versioning.sh validate-tag \
              --repo "${GITHUB_WORKSPACE}" \
              --tag "${RELEASE_REF_NAME}"
            if [[ "${SOURCE_TAG}" != "${RELEASE_REF_NAME}" ]]; then
              echo "ERROR: source version ${SOURCE_TAG} does not match tag ${RELEASE_REF_NAME}." >&2
              exit 1
            fi
          fi
          echo "RELEASE_TAG=${SOURCE_TAG}" >> "${GITHUB_ENV}"
          echo "VERSION=${SOURCE_TAG#v}" >> "${GITHUB_ENV}"

      - name: Capture Candidate Repository State
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          test -d "${RUNNER_TEMP}"
          PACKAGE_REPOSITORY_STATE="$(mktemp \
            "${RUNNER_TEMP%/}/syswarden-package-repository-state.XXXXXX")"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/repository_state.py \
            --repository "${GITHUB_WORKSPACE}" \
            capture \
            --output "${PACKAGE_REPOSITORY_STATE}"
          printf 'PACKAGE_REPOSITORY_STATE=%s\n' "${PACKAGE_REPOSITORY_STATE}" \
            >> "${GITHUB_ENV}"

      - name: Compile Universal Script
        run: pwsh -File ./build.ps1

      - name: Validate Compiled Inventory
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            dist/bin/syswarden-cli
            dist/bin/syswarden-core
            dist/bin/syswarden-tui
            dist/linux-arm64/bin/syswarden-cli
            dist/linux-arm64/bin/syswarden-core
            dist/linux-arm64/bin/syswarden-tui
            dist/freebsd/bin/syswarden-cli
            dist/freebsd/bin/syswarden-core
            dist/freebsd/bin/syswarden-tui
            dist/signatures.json
            dist/linux-arm64/signatures.json
          )
          for artifact in "${expected[@]}"; do
            test -s "${artifact}" || {
              echo "ERROR: required build artifact is missing or empty: ${artifact}" >&2
              exit 1
            }
          done

          validate_linux_pie() {
            local artifact="$1"
            local expected_machine="$2"
            local elf_type
            local machine
            elf_type="$(readelf --file-header "${artifact}" | sed -n 's/^[[:space:]]*Type:[[:space:]]*\([^[:space:]]*\).*/\1/p')"
            machine="$(readelf --file-header "${artifact}" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
            [[ "${elf_type}" == "DYN" ]] || {
              echo "ERROR: Linux artifact is not PIE: ${artifact}" >&2
              exit 1
            }
            [[ "${machine}" == "${expected_machine}" ]] || {
              echo "ERROR: Linux artifact has unexpected machine ${machine}: ${artifact}" >&2
              exit 1
            }
            go version -m "${artifact}" | grep -Eq '^[[:space:]]*build[[:space:]]+CGO_ENABLED=0$' || {
              echo "ERROR: Linux artifact was not built with CGO_ENABLED=0: ${artifact}" >&2
              exit 1
            }
          }

          for artifact in \
            dist/bin/syswarden-cli \
            dist/bin/syswarden-core \
            dist/bin/syswarden-tui; do
            validate_linux_pie "${artifact}" 'Advanced Micro Devices X86-64'
          done
          for artifact in \
            dist/linux-arm64/bin/syswarden-cli \
            dist/linux-arm64/bin/syswarden-core \
            dist/linux-arm64/bin/syswarden-tui; do
            validate_linux_pie "${artifact}" 'AArch64'
          done
          dist/bin/syswarden-cli --help >/dev/null

      - name: Set up Ruby for FPM
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'

      - name: Install FPM and RPM build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          gem install --no-document fpm -v 1.17.0

      - name: Create Isolated Packaging Workspace
        id: package_workspace
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          test -d "${RUNNER_TEMP}"
          PACKAGE_WORKSPACE="$(mktemp -d "${RUNNER_TEMP%/}/syswarden-package.XXXXXX")"
          STAGING_AMD64="${PACKAGE_WORKSPACE}/staging-amd64"
          STAGING_ARM64="${PACKAGE_WORKSPACE}/staging-arm64"
          STAGING_APK_AMD64="${PACKAGE_WORKSPACE}/staging-apk-amd64"
          STAGING_APK_ARM64="${PACKAGE_WORKSPACE}/staging-apk-arm64"
          STAGING_FREEBSD="${PACKAGE_WORKSPACE}/staging-freebsd"
          PACKAGE_ASSETS="${PACKAGE_WORKSPACE}/assets"
          PACKAGE_SCRIPTS="${PACKAGE_WORKSPACE}/scripts"
          PACKAGE_CONFIGS="${PACKAGE_WORKSPACE}/configs"
          install -d -m 0755 \
            "${STAGING_AMD64}" \
            "${STAGING_ARM64}" \
            "${STAGING_APK_AMD64}" \
            "${STAGING_APK_ARM64}" \
            "${STAGING_FREEBSD}" \
            "${PACKAGE_ASSETS}"
          install -d -m 0700 "${PACKAGE_SCRIPTS}" "${PACKAGE_CONFIGS}"
          {
            printf 'PACKAGE_WORKSPACE=%s\n' "${PACKAGE_WORKSPACE}"
            printf 'STAGING_AMD64=%s\n' "${STAGING_AMD64}"
            printf 'STAGING_ARM64=%s\n' "${STAGING_ARM64}"
            printf 'STAGING_APK_AMD64=%s\n' "${STAGING_APK_AMD64}"
            printf 'STAGING_APK_ARM64=%s\n' "${STAGING_APK_ARM64}"
            printf 'STAGING_FREEBSD=%s\n' "${STAGING_FREEBSD}"
            printf 'PACKAGE_ASSETS=%s\n' "${PACKAGE_ASSETS}"
            printf 'PACKAGE_SCRIPTS=%s\n' "${PACKAGE_SCRIPTS}"
            printf 'PACKAGE_CONFIGS=%s\n' "${PACKAGE_CONFIGS}"
          } >> "${GITHUB_ENV}"
          printf 'assets=%s\n' "${PACKAGE_ASSETS}" >> "${GITHUB_OUTPUT}"

      - name: Prepare Staging Environment (AMD64)
        run: |
          set -euo pipefail
          install -d -m 0755 \
            "${STAGING_AMD64}/opt/syswarden/bin" \
            "${STAGING_AMD64}/usr/local/bin"

          cp dist/bin/syswarden-cli "${STAGING_AMD64}/opt/syswarden/bin/"
          cp dist/bin/syswarden-core "${STAGING_AMD64}/opt/syswarden/bin/"
          cp dist/bin/syswarden-tui "${STAGING_AMD64}/opt/syswarden/bin/"
          cp dist/signatures.json "${STAGING_AMD64}/opt/syswarden/"

          chmod 0750 \
            "${STAGING_AMD64}/opt/syswarden/bin/syswarden-cli" \
            "${STAGING_AMD64}/opt/syswarden/bin/syswarden-core" \
            "${STAGING_AMD64}/opt/syswarden/bin/syswarden-tui"
          chmod 0640 "${STAGING_AMD64}/opt/syswarden/signatures.json"

          # Create a symlink for global execution from the terminal (Routing to Go CLI)
          ln -s /opt/syswarden/bin/syswarden-cli \
            "${STAGING_AMD64}/usr/local/bin/syswarden"
          ln -s /opt/syswarden/bin/syswarden-tui \
            "${STAGING_AMD64}/usr/local/bin/syswarden-tui"

      - name: Prepare Staging Environment (ARM64)
        run: |
          set -euo pipefail
          install -d -m 0755 \
            "${STAGING_ARM64}/opt/syswarden/bin" \
            "${STAGING_ARM64}/usr/local/bin"

          cp dist/linux-arm64/bin/syswarden-cli "${STAGING_ARM64}/opt/syswarden/bin/"
          cp dist/linux-arm64/bin/syswarden-core "${STAGING_ARM64}/opt/syswarden/bin/"
          cp dist/linux-arm64/bin/syswarden-tui "${STAGING_ARM64}/opt/syswarden/bin/"
          cp dist/linux-arm64/signatures.json "${STAGING_ARM64}/opt/syswarden/"

          chmod 0750 \
            "${STAGING_ARM64}/opt/syswarden/bin/syswarden-cli" \
            "${STAGING_ARM64}/opt/syswarden/bin/syswarden-core" \
            "${STAGING_ARM64}/opt/syswarden/bin/syswarden-tui"
          chmod 0640 "${STAGING_ARM64}/opt/syswarden/signatures.json"

          ln -s /opt/syswarden/bin/syswarden-cli \
            "${STAGING_ARM64}/usr/local/bin/syswarden"
          ln -s /opt/syswarden/bin/syswarden-tui \
            "${STAGING_ARM64}/usr/local/bin/syswarden-tui"

      - name: Build and Stage Static Alpine Binaries
        shell: bash
        run: |
          set -euo pipefail

          build_apk_stage() {
            local goarch="$1"
            local stage="$2"
            install -d -m 0755 \
              "${stage}/opt/syswarden/bin" \
              "${stage}/usr/local/bin"
            for component in syswarden-cli syswarden-core syswarden-tui; do
              env \
                CGO_ENABLED=0 \
                GOOS=linux \
                GOARCH="${goarch}" \
                GOFLAGS=-mod=readonly \
                go -C "src/core/${component}" build \
                  -mod=readonly \
                  -ldflags='-s -w' \
                  -o "${stage}/opt/syswarden/bin/${component}" \
                  .
              chmod 0750 "${stage}/opt/syswarden/bin/${component}"
            done
            cp src/core/syswarden-core/signatures.json \
              "${stage}/opt/syswarden/signatures.json"
            chmod 0640 "${stage}/opt/syswarden/signatures.json"
            ln -s /opt/syswarden/bin/syswarden-cli \
              "${stage}/usr/local/bin/syswarden"
            ln -s /opt/syswarden/bin/syswarden-tui \
              "${stage}/usr/local/bin/syswarden-tui"
          }

          validate_static_apk_binary() {
            local artifact="$1"
            local expected_machine="$2"
            local elf_type
            local machine
            elf_type="$(readelf --file-header "${artifact}" | sed -n 's/^[[:space:]]*Type:[[:space:]]*\([^[:space:]]*\).*/\1/p')"
            machine="$(readelf --file-header "${artifact}" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
            [[ "${elf_type}" == "EXEC" ]] || {
              echo "ERROR: Alpine artifact is not a static ET_EXEC binary: ${artifact}" >&2
              exit 1
            }
            [[ "${machine}" == "${expected_machine}" ]] || {
              echo "ERROR: Alpine artifact has unexpected machine ${machine}: ${artifact}" >&2
              exit 1
            }
            if readelf --program-headers "${artifact}" | grep -q '[[:space:]]INTERP[[:space:]]'; then
              echo "ERROR: Alpine artifact contains a dynamic PT_INTERP loader: ${artifact}" >&2
              exit 1
            fi
            file "${artifact}" | grep -Fq 'statically linked' || {
              echo "ERROR: Alpine artifact is not statically linked: ${artifact}" >&2
              exit 1
            }
            go version -m "${artifact}" | grep -Eq '^[[:space:]]*build[[:space:]]+CGO_ENABLED=0$' || {
              echo "ERROR: Alpine artifact was not built with CGO_ENABLED=0: ${artifact}" >&2
              exit 1
            }
          }

          build_apk_stage amd64 "${STAGING_APK_AMD64}"
          build_apk_stage arm64 "${STAGING_APK_ARM64}"
          for artifact in "${STAGING_APK_AMD64}"/opt/syswarden/bin/*; do
            validate_static_apk_binary "${artifact}" 'Advanced Micro Devices X86-64'
          done
          for artifact in "${STAGING_APK_ARM64}"/opt/syswarden/bin/*; do
            validate_static_apk_binary "${artifact}" 'AArch64'
          done
          "${STAGING_APK_AMD64}/opt/syswarden/bin/syswarden-cli" --help >/dev/null
          docker run --rm \
            --network none \
            --security-opt no-new-privileges \
            --volume "${STAGING_APK_AMD64}/opt/syswarden/bin/syswarden-cli:/usr/local/bin/syswarden:ro" \
            docker.io/library/alpine:3.22@sha256:7c8cb692ae09657cbc4a3f3cbd0e8d5a2690ba38386aaaf252dbb060bf5eb2e6 \
            /usr/local/bin/syswarden --help >/dev/null

      - name: Validate Exact Linux Staging Inventories
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/package_stage_gate.py \
            linux --root "${STAGING_AMD64}"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/package_stage_gate.py \
            linux --root "${STAGING_ARM64}"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/package_stage_gate.py \
            linux --root "${STAGING_APK_AMD64}"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/package_stage_gate.py \
            linux --root "${STAGING_APK_ARM64}"

      - name: Prepare Linux Maintainer Scripts
        run: |
          set -euo pipefail
          cat << 'EOF' > "${PACKAGE_SCRIPTS}/preinst.sh"
          #!/bin/sh
          set -e
          secure_private_directory() {
              path="$1"
              if [ -L "${path}" ] || { [ -e "${path}" ] && [ ! -d "${path}" ]; }; then
                  echo "Refusing unsafe SysWarden directory: ${path}" >&2
                  exit 1
              fi
              if [ ! -d "${path}" ]; then
                  (umask 027 && mkdir -p "${path}")
              fi
              expected_user="$(id -un)"
              expected_group="$(id -gn)"
              if [ "$(find "${path}" -prune -user "${expected_user}" -group "${expected_group}" -print)" != "${path}" ]; then
                  echo "Refusing non-owner-controlled SysWarden directory: ${path}" >&2
                  exit 1
              fi
              chmod go-w,o-rwx "${path}"
              if [ -L "${path}" ] || [ ! -d "${path}" ] || \
                 [ "$(find "${path}" -prune -user "${expected_user}" -group "${expected_group}" -print)" != "${path}" ]; then
                  echo "SysWarden directory identity changed while securing it: ${path}" >&2
                  exit 1
              fi
          }
          for directory in \
              /etc/syswarden \
              /etc/syswarden/config \
              /etc/syswarden/config/modules \
              /etc/syswarden/lists \
              /etc/syswarden/tls \
              /var/lib/syswarden \
              /var/lib/syswarden/ui; do
              secure_private_directory "${directory}"
          done
          if [ -f /opt/syswarden/syswarden-auto.conf ] && \
             [ ! -e /opt/syswarden/syswarden-auto.conf.migration_backup ] && \
             [ ! -e /opt/syswarden/syswarden-auto.conf.migration_backup.migrated ]; then
              mv /opt/syswarden/syswarden-auto.conf /opt/syswarden/syswarden-auto.conf.migration_backup
          fi
          EOF

          cat << 'EOF' > "${PACKAGE_SCRIPTS}/postinst.sh"
          #!/bin/sh
          set -e
          export SYSWARDEN_PKG_INSTALL=1
          ln -sf /opt/syswarden/bin/syswarden-cli /usr/local/bin/syswarden
          ln -sf /opt/syswarden/bin/syswarden-tui /usr/local/bin/syswarden-tui

          systemd_running() {
              command -v systemctl >/dev/null 2>&1 && [ -d /run/systemd/system ]
          }

          modular_config_complete() {
              for file in \
                  /etc/syswarden/config/config.toml \
                  /etc/syswarden/config/modules/00-core.toml \
                  /etc/syswarden/config/modules/10-network.toml \
                  /etc/syswarden/config/modules/20-security.toml \
                  /etc/syswarden/config/modules/30-waap.toml \
                  /etc/syswarden/config/modules/40-integrations.toml \
                  /etc/syswarden/config/modules/99-user.toml; do
                  [ -f "${file}" ] || return 1
              done
              return 0
          }
          migrate_legacy_configuration() {
              source=/opt/syswarden/syswarden-auto.conf.migration_backup
              marker=/etc/syswarden/config/.migration-in-progress
              if [ -f "${marker}" ]; then
                  /opt/syswarden/bin/syswarden-cli migrate-config --source "${source}" --output /etc/syswarden/config
              elif [ -f "${source}" ] && ! modular_config_complete; then
                  /opt/syswarden/bin/syswarden-cli migrate-config --source "${source}" --output /etc/syswarden/config
              fi
              if [ -f "${source}.migrated" ]; then
                  mv "${source}.migrated" /opt/syswarden/syswarden-auto.conf.bak
              elif [ -f "${source}" ] && [ ! -f "${marker}" ] && modular_config_complete; then
                  mv "${source}" /opt/syswarden/syswarden-auto.conf.bak
              fi
          }
          migrate_legacy_configuration

          # Install Bash Autocompletion
          mkdir -p /etc/bash_completion.d
          /opt/syswarden/bin/syswarden-cli completion bash > /etc/bash_completion.d/syswarden 2>/dev/null || true

          # Force Bash Autocompletion on Debian/Ubuntu minimal images
          if [ -f /etc/debian_version ] && [ -f /root/.bashrc ]; then
              if ! grep -qE "^[[:space:]]*\.[[:space:]]+/etc/bash_completion" /root/.bashrc; then
                  echo "" >> /root/.bashrc
                  echo "# SysWarden Auto-Completion Hook" >> /root/.bashrc
                  echo "if [ -f /etc/bash_completion ] && ! shopt -oq posix; then" >> /root/.bashrc
                  echo "    . /etc/bash_completion" >> /root/.bashrc
                  echo "fi" >> /root/.bashrc
              fi
          fi

          # RPM Upgrade ($1 = 2) or DEB Upgrade ($1 = configure && $2 != "")
          if [ "$1" = "2" ] || { [ "$1" = "configure" ] && [ -n "${2:-}" ]; }; then
              /opt/syswarden/bin/syswarden-cli install
              if systemd_running; then
                  systemctl daemon-reload
                  /opt/syswarden/bin/syswarden-cli reload
                  systemctl enable syswarden-firewall || true
                  systemctl restart syswarden-firewall || true
                  systemctl restart syswarden-core || true
                  systemctl restart syswarden-webtui || true
              elif command -v rc-service >/dev/null 2>&1; then
                  /opt/syswarden/bin/syswarden-cli reload || true
                  rc-service syswarden-firewall restart || true
                  rc-service syswarden-core restart || true
                  rc-service syswarden-webtui restart || true
              fi
          # RPM Install ($1 = 1) or DEB Install ($1 = configure && $2 == "")
          elif [ "$1" = "1" ] || [ "$1" = "configure" ]; then
              /opt/syswarden/bin/syswarden-cli install
              if systemd_running; then
                  systemctl restart syswarden-core || true
                  systemctl restart syswarden-webtui || true
              elif command -v rc-service >/dev/null 2>&1; then
                  rc-service syswarden-core restart || true
                  rc-service syswarden-webtui restart || true
              fi
          # Alpine APK Install/Upgrade (APK passes version string in $1)
          elif [ -f /etc/alpine-release ]; then
              /opt/syswarden/bin/syswarden-cli install
              # syswarden update handles the daemon restart in Alpine, so we just reload.
              /opt/syswarden/bin/syswarden-cli reload || true
          fi
          EOF

          cat << 'EOF' > "${PACKAGE_SCRIPTS}/postrm.sh"
          #!/bin/sh
          syswarden_managed_cron_line() {
              syswarden_cron_candidate="$1"
              shift
              syswarden_cron_minute="${syswarden_cron_candidate%% *}"
              for syswarden_cron_cli do
                  if [ "${syswarden_cron_candidate}" = "*/30 * * * * ${syswarden_cron_cli} ha-sync >/dev/null 2>&1" ]; then
                      return 0
                  fi
                  case "${syswarden_cron_minute}" in
                      [1-9]|[1-5][0-9])
                          if [ "${syswarden_cron_candidate}" = "${syswarden_cron_minute} * * * * ${syswarden_cron_cli} update-feeds >/dev/null 2>&1" ]; then
                              return 0
                          fi
                          ;;
                  esac
              done
              return 1
          }
          syswarden_filter_crontab() {
              syswarden_cron_input="$1"
              syswarden_cron_output="$2"
              shift 2
              {
                  while :; do
                      syswarden_cron_candidate=
                      if IFS= read -r syswarden_cron_candidate; then
                          syswarden_cron_terminated=1
                      else
                          syswarden_cron_terminated=0
                          [ -n "${syswarden_cron_candidate}" ] || break
                      fi
                      if ! syswarden_managed_cron_line "${syswarden_cron_candidate}" "$@"; then
                          if [ "${syswarden_cron_terminated}" -eq 1 ]; then
                              printf '%s\n' "${syswarden_cron_candidate}" || return 1
                          else
                              printf '%s' "${syswarden_cron_candidate}" || return 1
                          fi
                      fi
                  done
              } < "${syswarden_cron_input}" > "${syswarden_cron_output}"
          }
          syswarden_read_crontab() {
              syswarden_cron_backup="$1"
              syswarden_cron_error="$2"
              syswarden_cron_present=0
              if LC_ALL=C crontab -l > "${syswarden_cron_backup}" 2> "${syswarden_cron_error}"; then
                  syswarden_cron_present=1
                  return 0
              else
                  syswarden_cron_rc=$?
              fi
              [ "${syswarden_cron_rc}" -eq 1 ] || {
                  printf 'crontab -l failed with exit %s\n' "${syswarden_cron_rc}" >&2
                  return 1
              }
              [ ! -s "${syswarden_cron_backup}" ] || {
                  printf '%s\n' 'crontab -l emitted partial stdout while reporting absence' >&2
                  return 1
              }
              syswarden_cron_message="$(cat "${syswarden_cron_error}")"
              syswarden_cron_lines="$(LC_ALL=C awk 'END { print NR + 0 }' "${syswarden_cron_error}")"
              case "${syswarden_cron_lines}:${syswarden_cron_message}" in
                  "1:no crontab for root"|\
                  "1:crontab: no crontab for root"|\
                  "1:crontab: can't open 'root': No such file or directory")
                      if [ -n "${SYSWARDEN_CRON_ABSENCE_SPOOL:-}" ] && \
                         { [ -e "${SYSWARDEN_CRON_ABSENCE_SPOOL}" ] || [ -L "${SYSWARDEN_CRON_ABSENCE_SPOOL}" ]; }; then
                          printf '%s\n' 'crontab reported absence while the configured spool path still exists' >&2
                          return 1
                      fi
                      : > "${syswarden_cron_backup}"
                      return 0
                      ;;
              esac
              printf '%s\n' "${syswarden_cron_message}" >&2
              return 1
          }
          syswarden_cleanup_cron_work() {
              [ -n "${cron_work:-}" ] || return 0
              syswarden_cron_cleanup_target="${cron_work}"
              if [ "${XDG_CACHE_HOME:-}" = "${syswarden_cron_cleanup_target}/cache" ]; then
                  unset XDG_CACHE_HOME
              fi
              cron_cache=
              rm -rf -- "${syswarden_cron_cleanup_target}" || return 1
              if [ -e "${syswarden_cron_cleanup_target}" ] || [ -L "${syswarden_cron_cleanup_target}" ]; then
                  printf '%s\n' 'private cron work directory remains after cleanup' >&2
                  return 1
              fi
              cron_work=
          }
          syswarden_prepare_cron_work() {
              cron_work="$(mktemp -d /var/tmp/syswarden-cron.XXXXXX)" || return 1
              chmod 0700 "${cron_work}" || return 1
              cron_cache="${cron_work}/cache"
              mkdir "${cron_cache}" || return 1
              chmod 0700 "${cron_cache}" || return 1
              XDG_CACHE_HOME="${cron_cache}"
              export XDG_CACHE_HOME
              cron_backup="${cron_work}/backup"
              cron_error="${cron_work}/error"
              cron_filtered="${cron_work}/filtered"
          }
          syswarden_cleanup_crontab() {
              syswarden_cron_backup="$1"
              syswarden_cron_error="$2"
              syswarden_cron_filtered="$3"
              shift 3
              syswarden_read_crontab "${syswarden_cron_backup}" "${syswarden_cron_error}" || return 1
              [ "${syswarden_cron_present}" -eq 1 ] || return 0
              syswarden_filter_crontab "${syswarden_cron_backup}" "${syswarden_cron_filtered}" "$@" || return 1
              if cmp -s "${syswarden_cron_backup}" "${syswarden_cron_filtered}"; then
                  return 0
              else
                  syswarden_cron_cmp_rc=$?
              fi
              [ "${syswarden_cron_cmp_rc}" -eq 1 ] || return 1
              if [ ! -s "${syswarden_cron_filtered}" ]; then
                  LC_ALL=C crontab -r || return 1
                  syswarden_read_crontab "${syswarden_cron_backup}" "${syswarden_cron_error}" || return 1
                  [ "${syswarden_cron_present}" -eq 0 ] || {
                      printf '%s\n' 'crontab -r returned success but the root crontab is still present' >&2
                      return 1
                  }
                  return 0
              fi
              crontab - < "${syswarden_cron_filtered}" || return 1
          }

          systemd_running() {
              command -v systemctl >/dev/null 2>&1 && [ -d /run/systemd/system ]
          }
          cleanup_generated_runtime_artifacts() {
              rm -f \
                  /etc/systemd/system/syswarden-core.service \
                  /etc/systemd/system/syswarden-firewall.service \
                  /etc/systemd/system/syswarden-webtui.service \
                  /etc/init.d/syswarden-core \
                  /etc/init.d/syswarden-firewall \
                  /etc/init.d/syswarden-webtui \
                  /etc/bash_completion.d/syswarden \
                  /etc/rsyslog.d/99-syswarden-siem.conf \
                  /etc/rsyslog.d/99-syswarden-waf-bridge.conf
              if command -v crontab >/dev/null 2>&1; then
                  umask 077
                  SYSWARDEN_CRON_ABSENCE_SPOOL=
                  cron_work=
                  trap 'syswarden_cleanup_cron_work' 0
                  trap 'syswarden_cleanup_cron_work; exit 129' 1
                  trap 'syswarden_cleanup_cron_work; exit 130' 2
                  trap 'syswarden_cleanup_cron_work; exit 143' 15
                  syswarden_prepare_cron_work || return 1
                  syswarden_cleanup_crontab \
                      "${cron_backup}" "${cron_error}" "${cron_filtered}" \
                      /opt/syswarden/bin/syswarden-cli || return 1
                  syswarden_cleanup_cron_work || return 1
                  trap - 0 1 2 15
              fi
              if systemd_running; then
                  systemctl daemon-reload || true
                  systemctl try-restart rsyslog.service || true
              elif command -v rc-service >/dev/null 2>&1; then
                  rc-service rsyslog status >/dev/null 2>&1 && rc-service rsyslog restart || true
              fi
          }

          # RPM final erase, DEB removal/purge, or Alpine post-remove.
          if [ -f /etc/alpine-release ] || [ "$1" = "0" ] || [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
              cleanup_generated_runtime_artifacts || exit 1
              rm -f /usr/local/bin/syswarden
              rm -f /usr/local/bin/syswarden-tui
          fi
          # RPM final erase and DEB purge remove configuration by contract.
          if [ "$1" = "0" ] || [ "$1" = "purge" ]; then
              rm -rf /opt/syswarden
              rm -rf /etc/syswarden
          fi
          EOF

          cat << 'EOF' > "${PACKAGE_SCRIPTS}/prerm.sh"
          #!/bin/sh
          syswarden_managed_cron_line() {
              syswarden_cron_candidate="$1"
              shift
              syswarden_cron_minute="${syswarden_cron_candidate%% *}"
              for syswarden_cron_cli do
                  if [ "${syswarden_cron_candidate}" = "*/30 * * * * ${syswarden_cron_cli} ha-sync >/dev/null 2>&1" ]; then
                      return 0
                  fi
                  case "${syswarden_cron_minute}" in
                      [1-9]|[1-5][0-9])
                          if [ "${syswarden_cron_candidate}" = "${syswarden_cron_minute} * * * * ${syswarden_cron_cli} update-feeds >/dev/null 2>&1" ]; then
                              return 0
                          fi
                          ;;
                  esac
              done
              return 1
          }
          syswarden_filter_crontab() {
              syswarden_cron_input="$1"
              syswarden_cron_output="$2"
              shift 2
              {
                  while :; do
                      syswarden_cron_candidate=
                      if IFS= read -r syswarden_cron_candidate; then
                          syswarden_cron_terminated=1
                      else
                          syswarden_cron_terminated=0
                          [ -n "${syswarden_cron_candidate}" ] || break
                      fi
                      if ! syswarden_managed_cron_line "${syswarden_cron_candidate}" "$@"; then
                          if [ "${syswarden_cron_terminated}" -eq 1 ]; then
                              printf '%s\n' "${syswarden_cron_candidate}" || return 1
                          else
                              printf '%s' "${syswarden_cron_candidate}" || return 1
                          fi
                      fi
                  done
              } < "${syswarden_cron_input}" > "${syswarden_cron_output}"
          }
          syswarden_read_crontab() {
              syswarden_cron_backup="$1"
              syswarden_cron_error="$2"
              syswarden_cron_present=0
              if LC_ALL=C crontab -l > "${syswarden_cron_backup}" 2> "${syswarden_cron_error}"; then
                  syswarden_cron_present=1
                  return 0
              else
                  syswarden_cron_rc=$?
              fi
              [ "${syswarden_cron_rc}" -eq 1 ] || {
                  printf 'crontab -l failed with exit %s\n' "${syswarden_cron_rc}" >&2
                  return 1
              }
              [ ! -s "${syswarden_cron_backup}" ] || {
                  printf '%s\n' 'crontab -l emitted partial stdout while reporting absence' >&2
                  return 1
              }
              syswarden_cron_message="$(cat "${syswarden_cron_error}")"
              syswarden_cron_lines="$(LC_ALL=C awk 'END { print NR + 0 }' "${syswarden_cron_error}")"
              case "${syswarden_cron_lines}:${syswarden_cron_message}" in
                  "1:no crontab for root"|\
                  "1:crontab: no crontab for root"|\
                  "1:crontab: can't open 'root': No such file or directory")
                      if [ -n "${SYSWARDEN_CRON_ABSENCE_SPOOL:-}" ] && \
                         { [ -e "${SYSWARDEN_CRON_ABSENCE_SPOOL}" ] || [ -L "${SYSWARDEN_CRON_ABSENCE_SPOOL}" ]; }; then
                          printf '%s\n' 'crontab reported absence while the configured spool path still exists' >&2
                          return 1
                      fi
                      : > "${syswarden_cron_backup}"
                      return 0
                      ;;
              esac
              printf '%s\n' "${syswarden_cron_message}" >&2
              return 1
          }
          syswarden_cleanup_cron_work() {
              [ -n "${cron_work:-}" ] || return 0
              syswarden_cron_cleanup_target="${cron_work}"
              if [ "${XDG_CACHE_HOME:-}" = "${syswarden_cron_cleanup_target}/cache" ]; then
                  unset XDG_CACHE_HOME
              fi
              cron_cache=
              rm -rf -- "${syswarden_cron_cleanup_target}" || return 1
              if [ -e "${syswarden_cron_cleanup_target}" ] || [ -L "${syswarden_cron_cleanup_target}" ]; then
                  printf '%s\n' 'private cron work directory remains after cleanup' >&2
                  return 1
              fi
              cron_work=
          }
          syswarden_prepare_cron_work() {
              cron_work="$(mktemp -d /var/tmp/syswarden-cron.XXXXXX)" || return 1
              chmod 0700 "${cron_work}" || return 1
              cron_cache="${cron_work}/cache"
              mkdir "${cron_cache}" || return 1
              chmod 0700 "${cron_cache}" || return 1
              XDG_CACHE_HOME="${cron_cache}"
              export XDG_CACHE_HOME
              cron_backup="${cron_work}/backup"
              cron_error="${cron_work}/error"
              cron_filtered="${cron_work}/filtered"
          }
          syswarden_cleanup_crontab() {
              syswarden_cron_backup="$1"
              syswarden_cron_error="$2"
              syswarden_cron_filtered="$3"
              shift 3
              syswarden_read_crontab "${syswarden_cron_backup}" "${syswarden_cron_error}" || return 1
              [ "${syswarden_cron_present}" -eq 1 ] || return 0
              syswarden_filter_crontab "${syswarden_cron_backup}" "${syswarden_cron_filtered}" "$@" || return 1
              if cmp -s "${syswarden_cron_backup}" "${syswarden_cron_filtered}"; then
                  return 0
              else
                  syswarden_cron_cmp_rc=$?
              fi
              [ "${syswarden_cron_cmp_rc}" -eq 1 ] || return 1
              if [ ! -s "${syswarden_cron_filtered}" ]; then
                  LC_ALL=C crontab -r || return 1
                  syswarden_read_crontab "${syswarden_cron_backup}" "${syswarden_cron_error}" || return 1
                  [ "${syswarden_cron_present}" -eq 0 ] || {
                      printf '%s\n' 'crontab -r returned success but the root crontab is still present' >&2
                      return 1
                  }
                  return 0
              fi
              crontab - < "${syswarden_cron_filtered}" || return 1
          }

          # RPM Uninstall ($1 = 0) or DEB Uninstall/Purge
          if [ -f /etc/alpine-release ] || [ "$1" = "0" ] || [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
              if command -v systemctl >/dev/null 2>&1 && [ -d /run/systemd/system ]; then
                  systemctl stop syswarden-core.service || true
                  systemctl disable syswarden-core.service || true
                  systemctl stop syswarden-firewall.service || true
                  systemctl disable syswarden-firewall.service || true
                  systemctl stop syswarden-webtui.service || true
                  systemctl disable syswarden-webtui.service || true
                  systemctl restart rsyslog || true
              elif command -v rc-service >/dev/null 2>&1; then
                  rc-service syswarden-core stop || true
                  rc-update del syswarden-core default || true
                  rc-service syswarden-firewall stop || true
                  rc-update del syswarden-firewall default || true
                  rc-service syswarden-webtui stop || true
                  rc-update del syswarden-webtui default || true
                  rc-service rsyslog restart || true
              fi
              nft delete table netdev syswarden_hw_drop || true
              nft delete table arp syswarden_arp || true
              nft delete table inet syswarden || true
              umask 077
              SYSWARDEN_CRON_ABSENCE_SPOOL=
              cron_work=
              trap 'syswarden_cleanup_cron_work' 0
              trap 'syswarden_cleanup_cron_work; exit 129' 1
              trap 'syswarden_cleanup_cron_work; exit 130' 2
              trap 'syswarden_cleanup_cron_work; exit 143' 15
              syswarden_prepare_cron_work || {
                  echo "Unable to create the private cron backup" >&2
                  exit 1
              }
              syswarden_cleanup_crontab \
                  "${cron_backup}" "${cron_error}" "${cron_filtered}" \
                  /opt/syswarden/bin/syswarden-cli || exit 1
              syswarden_cleanup_cron_work || exit 1
              trap - 0 1 2 15
              rm -f /etc/rsyslog.d/99-syswarden-siem.conf || true
              rm -f /etc/rsyslog.d/99-syswarden-waf-bridge.conf || true
          fi
          EOF

          chmod 0755 \
            "${PACKAGE_SCRIPTS}/preinst.sh" \
            "${PACKAGE_SCRIPTS}/postinst.sh" \
            "${PACKAGE_SCRIPTS}/postrm.sh" \
            "${PACKAGE_SCRIPTS}/prerm.sh"

      - name: Build Debian Package (.deb)
        run: |
          set -euo pipefail
          fpm -s dir -t deb \
            -n syswarden \
            -v "${VERSION}" \
            -p "${PACKAGE_ASSETS}/syswarden_${VERSION}_amd64.deb" \
            --vendor "SysWarden Security" \
            --maintainer "SysWarden Engineering" \
            --description "SysWarden Host-based Security Orchestrator for Linux" \
            --url "https://github.com/${{ github.repository }}" \
            --architecture amd64 \
            -d "nftables" -d "ipset" -d "curl" -d "wget" -d "rsyslog" -d "cron" -d "bash-completion" \
            -d "wireguard-tools" -d "qrencode" -d "jq" \
            --before-install "${PACKAGE_SCRIPTS}/preinst.sh" \
            --after-install "${PACKAGE_SCRIPTS}/postinst.sh" \
            --before-remove "${PACKAGE_SCRIPTS}/prerm.sh" \
            --after-remove "${PACKAGE_SCRIPTS}/postrm.sh" \
            -C "${STAGING_AMD64}" .

          fpm -s dir -t deb \
            -n syswarden \
            -v "${VERSION}" \
            -p "${PACKAGE_ASSETS}/syswarden_${VERSION}_arm64.deb" \
            --vendor "SysWarden Security" \
            --maintainer "SysWarden Engineering" \
            --description "SysWarden Host-based Security Orchestrator for Linux (ARM64)" \
            --url "https://github.com/${{ github.repository }}" \
            --architecture arm64 \
            -d "nftables" -d "ipset" -d "curl" -d "wget" -d "rsyslog" -d "cron" -d "bash-completion" \
            -d "wireguard-tools" -d "qrencode" -d "jq" \
            --before-install "${PACKAGE_SCRIPTS}/preinst.sh" \
            --after-install "${PACKAGE_SCRIPTS}/postinst.sh" \
            --before-remove "${PACKAGE_SCRIPTS}/prerm.sh" \
            --after-remove "${PACKAGE_SCRIPTS}/postrm.sh" \
            -C "${STAGING_ARM64}" .

      - name: Build RHEL Family Package (.rpm)
        run: |
          set -euo pipefail
          fpm -s dir -t rpm \
            -n syswarden \
            -v "${VERSION}" \
            -p "${PACKAGE_ASSETS}/syswarden-${VERSION}-1.x86_64.rpm" \
            --vendor "SysWarden Security" \
            --maintainer "SysWarden Engineering" \
            --description "SysWarden Host-based Security Orchestrator for Linux" \
            --url "https://github.com/${{ github.repository }}" \
            --architecture x86_64 \
            -d "nftables" -d "ipset" -d "curl" -d "wget" -d "rsyslog" -d "cronie" -d "bash-completion" \
            -d "wireguard-tools" -d "qrencode" -d "jq" -d "checkpolicy" -d "policycoreutils-python-utils" \
            --before-install "${PACKAGE_SCRIPTS}/preinst.sh" \
            --after-install "${PACKAGE_SCRIPTS}/postinst.sh" \
            --before-remove "${PACKAGE_SCRIPTS}/prerm.sh" \
            --after-remove "${PACKAGE_SCRIPTS}/postrm.sh" \
            -C "${STAGING_AMD64}" .

          fpm -s dir -t rpm \
            -n syswarden \
            -v "${VERSION}" \
            -p "${PACKAGE_ASSETS}/syswarden-${VERSION}-1.aarch64.rpm" \
            --vendor "SysWarden Security" \
            --maintainer "SysWarden Engineering" \
            --description "SysWarden Host-based Security Orchestrator for Linux (ARM64)" \
            --url "https://github.com/${{ github.repository }}" \
            --architecture aarch64 \
            -d "nftables" -d "ipset" -d "curl" -d "wget" -d "rsyslog" -d "cronie" -d "bash-completion" \
            -d "wireguard-tools" -d "qrencode" -d "jq" -d "checkpolicy" -d "policycoreutils-python-utils" \
            --before-install "${PACKAGE_SCRIPTS}/preinst.sh" \
            --after-install "${PACKAGE_SCRIPTS}/postinst.sh" \
            --before-remove "${PACKAGE_SCRIPTS}/prerm.sh" \
            --after-remove "${PACKAGE_SCRIPTS}/postrm.sh" \
            -C "${STAGING_ARM64}" .

      - name: Build Alpine Package (.apk)
        run: |
          set -euo pipefail
          TOOL_DIR="${PACKAGE_WORKSPACE}/tools"
          install -d -m 0700 "${TOOL_DIR}"
          GOBIN="${TOOL_DIR}" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          
          cat << EOF > "${PACKAGE_CONFIGS}/nfpm_alpine_x86_64.yaml"
          name: "syswarden"
          arch: "amd64"
          platform: "linux"
          version: "${VERSION}"
          maintainer: "SysWarden Engineering"
          description: "SysWarden Host-based Security Orchestrator for Alpine Linux"
          vendor: "SysWarden Security"
          homepage: "https://github.com/${{ github.repository }}"
          depends:
            - nftables
            - openrc
            - curl
            - wget
            - rsyslog
            - rsyslog-uxsock
            - bash-completion
            - wireguard-tools
            - libqrencode-tools
            - jq
          contents:
            - src: "${STAGING_APK_AMD64}/opt"
              dst: "/opt"
            - src: "${STAGING_APK_AMD64}/usr"
              dst: "/usr"
          scripts:
            preinstall: "${PACKAGE_SCRIPTS}/preinst.sh"
            postinstall: "${PACKAGE_SCRIPTS}/postinst.sh"
            preremove: "${PACKAGE_SCRIPTS}/prerm.sh"
            postremove: "${PACKAGE_SCRIPTS}/postrm.sh"
          apk:
            scripts:
              postupgrade: "${PACKAGE_SCRIPTS}/postinst.sh"
          EOF

          cat << EOF > "${PACKAGE_CONFIGS}/nfpm_alpine_aarch64.yaml"
          name: "syswarden"
          arch: "arm64"
          platform: "linux"
          version: "${VERSION}"
          maintainer: "SysWarden Engineering"
          description: "SysWarden Host-based Security Orchestrator for Alpine Linux (ARM64)"
          vendor: "SysWarden Security"
          homepage: "https://github.com/${{ github.repository }}"
          depends:
            - nftables
            - openrc
            - curl
            - wget
            - rsyslog
            - rsyslog-uxsock
            - bash-completion
            - wireguard-tools
            - libqrencode-tools
            - jq
          contents:
            - src: "${STAGING_APK_ARM64}/opt"
              dst: "/opt"
            - src: "${STAGING_APK_ARM64}/usr"
              dst: "/usr"
          scripts:
            preinstall: "${PACKAGE_SCRIPTS}/preinst.sh"
            postinstall: "${PACKAGE_SCRIPTS}/postinst.sh"
            preremove: "${PACKAGE_SCRIPTS}/prerm.sh"
            postremove: "${PACKAGE_SCRIPTS}/postrm.sh"
          apk:
            scripts:
              postupgrade: "${PACKAGE_SCRIPTS}/postinst.sh"
          EOF

          "${TOOL_DIR}/nfpm" pkg \
            --config "${PACKAGE_CONFIGS}/nfpm_alpine_x86_64.yaml" \
            --packager apk \
            --target "${PACKAGE_ASSETS}/syswarden_${VERSION}_x86_64.apk"
          "${TOOL_DIR}/nfpm" pkg \
            --config "${PACKAGE_CONFIGS}/nfpm_alpine_aarch64.yaml" \
            --packager apk \
            --target "${PACKAGE_ASSETS}/syswarden_${VERSION}_aarch64.apk"

      - name: Prepare FreeBSD Staging Environment
        run: |
          set -euo pipefail
          install -d -m 0755 \
            "${STAGING_FREEBSD}/usr/local/syswarden/bin" \
            "${STAGING_FREEBSD}/usr/local/etc/rc.d"
          cp src/core/syswarden-core/signatures.json \
            "${STAGING_FREEBSD}/usr/local/syswarden/"
          cp dist/freebsd/bin/syswarden-cli \
            "${STAGING_FREEBSD}/usr/local/syswarden/bin/"
          cp dist/freebsd/bin/syswarden-core \
            "${STAGING_FREEBSD}/usr/local/syswarden/bin/"
          cp dist/freebsd/bin/syswarden-tui \
            "${STAGING_FREEBSD}/usr/local/syswarden/bin/"
          chmod 0750 \
            "${STAGING_FREEBSD}/usr/local/syswarden/bin/syswarden-cli" \
            "${STAGING_FREEBSD}/usr/local/syswarden/bin/syswarden-core" \
            "${STAGING_FREEBSD}/usr/local/syswarden/bin/syswarden-tui"
          chmod 0640 "${STAGING_FREEBSD}/usr/local/syswarden/signatures.json"
          install -m 0755 testdata/services/freebsd-syswarden.rc \
            "${STAGING_FREEBSD}/usr/local/etc/rc.d/syswarden"
          install -m 0755 testdata/services/freebsd-syswardenwebtui.rc \
            "${STAGING_FREEBSD}/usr/local/etc/rc.d/syswardenwebtui"

          cat << 'EOF' > "${PACKAGE_SCRIPTS}/preinst_fbsd.sh"
          #!/bin/sh
          set -e
          secure_private_directory() {
              path="$1"
              if [ -L "${path}" ] || { [ -e "${path}" ] && [ ! -d "${path}" ]; }; then
                  echo "Refusing unsafe SysWarden directory: ${path}" >&2
                  exit 1
              fi
              if [ ! -d "${path}" ]; then
                  (umask 027 && mkdir -p "${path}")
              fi
              expected_user="$(id -un)"
              expected_group="$(id -gn)"
              if [ "$(find "${path}" -prune -user "${expected_user}" -group "${expected_group}" -print)" != "${path}" ]; then
                  echo "Refusing non-owner-controlled SysWarden directory: ${path}" >&2
                  exit 1
              fi
              chmod go-w,o-rwx "${path}"
              if [ -L "${path}" ] || [ ! -d "${path}" ] || \
                 [ "$(find "${path}" -prune -user "${expected_user}" -group "${expected_group}" -print)" != "${path}" ]; then
                  echo "SysWarden directory identity changed while securing it: ${path}" >&2
                  exit 1
              fi
          }
          for directory in \
              /etc/syswarden \
              /etc/syswarden/config \
              /etc/syswarden/config/modules \
              /etc/syswarden/lists \
              /etc/syswarden/tls \
              /var/lib/syswarden \
              /var/db/syswarden; do
              secure_private_directory "${directory}"
          done
          transition_marker=/var/db/syswarden/pf-transition-v4.02.8
          rm -f "${transition_marker}"
          if pkg info -e syswarden >/dev/null 2>&1 && \
             [ "$(pkg query '%v' syswarden 2>/dev/null || true)" = "4.02.8" ]; then
              marker_tmp=${transition_marker}.tmp
              umask 077
              printf '%s\n' 'legacy_derived:v4.02.8' > "${marker_tmp}"
              chmod 0600 "${marker_tmp}"
              mv -f "${marker_tmp}" "${transition_marker}"
          fi
          rm -f \
              /usr/local/syswarden/.postinstall-ok \
              /usr/local/syswarden/.postinstall-ok.tmp
          if [ -f /usr/local/syswarden/syswarden-auto.conf ] && \
             [ ! -e /usr/local/syswarden/syswarden-auto.conf.migration_backup ] && \
             [ ! -e /usr/local/syswarden/syswarden-auto.conf.migration_backup.migrated ]; then
              mv /usr/local/syswarden/syswarden-auto.conf /usr/local/syswarden/syswarden-auto.conf.migration_backup
          fi
          EOF

          cat << 'EOF' > "${PACKAGE_SCRIPTS}/postinst_fbsd.sh"
          #!/bin/sh
          set -e
          export SYSWARDEN_PKG_INSTALL=1
          ln -sf /usr/local/syswarden/bin/syswarden-cli /usr/local/bin/syswarden
          ln -sf /usr/local/syswarden/bin/syswarden-tui /usr/local/bin/syswarden-tui
          transition_marker=/var/db/syswarden/pf-transition-v4.02.8
          if [ -f "${transition_marker}" ] && \
             [ "$(cat "${transition_marker}")" = "legacy_derived:v4.02.8" ]; then
              /usr/local/syswarden/bin/syswarden-cli package-capture-pf --legacy-v4-02-8
          else
              /usr/local/syswarden/bin/syswarden-cli package-capture-pf
          fi
          rm -f "${transition_marker}"
          modular_config_complete() {
              for file in \
                  /etc/syswarden/config/config.toml \
                  /etc/syswarden/config/modules/00-core.toml \
                  /etc/syswarden/config/modules/10-network.toml \
                  /etc/syswarden/config/modules/20-security.toml \
                  /etc/syswarden/config/modules/30-waap.toml \
                  /etc/syswarden/config/modules/40-integrations.toml \
                  /etc/syswarden/config/modules/99-user.toml; do
                  [ -f "${file}" ] || return 1
              done
              return 0
          }
          migrate_legacy_configuration() {
              source=/usr/local/syswarden/syswarden-auto.conf.migration_backup
              backup=/etc/syswarden/config/syswarden-auto.conf.bak
              marker=/etc/syswarden/config/.migration-in-progress
              if [ -f "${marker}" ]; then
                  /usr/local/syswarden/bin/syswarden-cli migrate-config --source "${source}" --output /etc/syswarden/config
              elif [ -f "${source}" ] && ! modular_config_complete; then
                  /usr/local/syswarden/bin/syswarden-cli migrate-config --source "${source}" --output /etc/syswarden/config
              fi
              if [ -f "${source}.migrated" ]; then
                  preserved=${source}.migrated
              elif [ -f "${source}" ] && [ ! -f "${marker}" ] && modular_config_complete; then
                  preserved=${source}
              else
                  preserved=
              fi
              if [ -n "${preserved}" ]; then
                  if [ -f "${backup}" ]; then
                      cmp -s "${preserved}" "${backup}" || {
                          echo "Refusing to overwrite a different preserved legacy configuration" >&2
                          return 1
                      }
                      rm -f "${preserved}"
                  else
                      mv "${preserved}" "${backup}"
                  fi
                  chmod 0600 "${backup}"
              fi
          }
          migrate_legacy_configuration
          /usr/local/bin/syswarden install
          service syswarden restart
          service syswarden onestatus
          service syswardenwebtui restart
          service syswardenwebtui onestatus
          marker=/usr/local/syswarden/.postinstall-ok
          marker_tmp=/usr/local/syswarden/.postinstall-ok.tmp
          umask 077
          printf '%s\n' 'syswarden-freebsd-postinstall-v1' > "${marker_tmp}"
          chmod 0600 "${marker_tmp}"
          mv -f "${marker_tmp}" "${marker}"
          EOF

          cat << 'EOF' > "${PACKAGE_SCRIPTS}/postrm_fbsd.sh"
          #!/bin/sh
          set -eu
          syswarden_managed_cron_line() {
              syswarden_cron_candidate="$1"
              shift
              syswarden_cron_minute="${syswarden_cron_candidate%% *}"
              for syswarden_cron_cli do
                  if [ "${syswarden_cron_candidate}" = "*/30 * * * * ${syswarden_cron_cli} ha-sync >/dev/null 2>&1" ]; then
                      return 0
                  fi
                  case "${syswarden_cron_minute}" in
                      [1-9]|[1-5][0-9])
                          if [ "${syswarden_cron_candidate}" = "${syswarden_cron_minute} * * * * ${syswarden_cron_cli} update-feeds >/dev/null 2>&1" ]; then
                              return 0
                          fi
                          ;;
                  esac
              done
              return 1
          }
          syswarden_filter_crontab() {
              syswarden_cron_input="$1"
              syswarden_cron_output="$2"
              shift 2
              {
                  while :; do
                      syswarden_cron_candidate=
                      if IFS= read -r syswarden_cron_candidate; then
                          syswarden_cron_terminated=1
                      else
                          syswarden_cron_terminated=0
                          [ -n "${syswarden_cron_candidate}" ] || break
                      fi
                      if ! syswarden_managed_cron_line "${syswarden_cron_candidate}" "$@"; then
                          if [ "${syswarden_cron_terminated}" -eq 1 ]; then
                              printf '%s\n' "${syswarden_cron_candidate}" || return 1
                          else
                              printf '%s' "${syswarden_cron_candidate}" || return 1
                          fi
                      fi
                  done
              } < "${syswarden_cron_input}" > "${syswarden_cron_output}"
          }
          syswarden_read_crontab() {
              syswarden_cron_backup="$1"
              syswarden_cron_error="$2"
              syswarden_cron_present=0
              if LC_ALL=C crontab -l > "${syswarden_cron_backup}" 2> "${syswarden_cron_error}"; then
                  syswarden_cron_present=1
                  return 0
              else
                  syswarden_cron_rc=$?
              fi
              [ "${syswarden_cron_rc}" -eq 1 ] || {
                  printf 'crontab -l failed with exit %s\n' "${syswarden_cron_rc}" >&2
                  return 1
              }
              [ ! -s "${syswarden_cron_backup}" ] || {
                  printf '%s\n' 'crontab -l emitted partial stdout while reporting absence' >&2
                  return 1
              }
              syswarden_cron_message="$(cat "${syswarden_cron_error}")"
              syswarden_cron_lines="$(LC_ALL=C awk 'END { print NR + 0 }' "${syswarden_cron_error}")"
              case "${syswarden_cron_lines}:${syswarden_cron_message}" in
                  "1:no crontab for root"|\
                  "1:crontab: no crontab for root"|\
                  "1:crontab: can't open 'root': No such file or directory")
                      if [ -n "${SYSWARDEN_CRON_ABSENCE_SPOOL:-}" ] && \
                         { [ -e "${SYSWARDEN_CRON_ABSENCE_SPOOL}" ] || [ -L "${SYSWARDEN_CRON_ABSENCE_SPOOL}" ]; }; then
                          printf '%s\n' 'crontab reported absence while the configured spool path still exists' >&2
                          return 1
                      fi
                      : > "${syswarden_cron_backup}"
                      return 0
                      ;;
              esac
              printf '%s\n' "${syswarden_cron_message}" >&2
              return 1
          }
          syswarden_cleanup_cron_work() {
              [ -n "${cron_work:-}" ] || return 0
              syswarden_cron_cleanup_target="${cron_work}"
              if [ "${XDG_CACHE_HOME:-}" = "${syswarden_cron_cleanup_target}/cache" ]; then
                  unset XDG_CACHE_HOME
              fi
              cron_cache=
              rm -rf -- "${syswarden_cron_cleanup_target}" || return 1
              if [ -e "${syswarden_cron_cleanup_target}" ] || [ -L "${syswarden_cron_cleanup_target}" ]; then
                  printf '%s\n' 'private cron work directory remains after cleanup' >&2
                  return 1
              fi
              cron_work=
          }
          syswarden_prepare_cron_work() {
              cron_work="$(mktemp -d /var/tmp/syswarden-cron.XXXXXX)" || return 1
              chmod 0700 "${cron_work}" || return 1
              cron_cache="${cron_work}/cache"
              mkdir "${cron_cache}" || return 1
              chmod 0700 "${cron_cache}" || return 1
              XDG_CACHE_HOME="${cron_cache}"
              export XDG_CACHE_HOME
              cron_backup="${cron_work}/backup"
              cron_error="${cron_work}/error"
              cron_filtered="${cron_work}/filtered"
          }
          syswarden_cleanup_crontab() {
              syswarden_cron_backup="$1"
              syswarden_cron_error="$2"
              syswarden_cron_filtered="$3"
              shift 3
              syswarden_read_crontab "${syswarden_cron_backup}" "${syswarden_cron_error}" || return 1
              [ "${syswarden_cron_present}" -eq 1 ] || return 0
              syswarden_filter_crontab "${syswarden_cron_backup}" "${syswarden_cron_filtered}" "$@" || return 1
              if cmp -s "${syswarden_cron_backup}" "${syswarden_cron_filtered}"; then
                  return 0
              else
                  syswarden_cron_cmp_rc=$?
              fi
              [ "${syswarden_cron_cmp_rc}" -eq 1 ] || return 1
              if [ ! -s "${syswarden_cron_filtered}" ]; then
                  LC_ALL=C crontab -r || return 1
                  syswarden_read_crontab "${syswarden_cron_backup}" "${syswarden_cron_error}" || return 1
                  [ "${syswarden_cron_present}" -eq 0 ] || {
                      printf '%s\n' 'crontab -r returned success but the root crontab is still present' >&2
                      return 1
                  }
                  return 0
              fi
              crontab - < "${syswarden_cron_filtered}" || return 1
          }

          if command -v crontab >/dev/null 2>&1; then
              umask 077
              SYSWARDEN_CRON_ABSENCE_SPOOL=/var/cron/tabs/root
              cron_work=
              trap 'syswarden_cleanup_cron_work' 0
              trap 'syswarden_cleanup_cron_work; exit 129' 1
              trap 'syswarden_cleanup_cron_work; exit 130' 2
              trap 'syswarden_cleanup_cron_work; exit 143' 15
              syswarden_prepare_cron_work || exit 1
              syswarden_cleanup_crontab \
                  "${cron_backup}" "${cron_error}" "${cron_filtered}" \
                  /usr/local/syswarden/bin/syswarden-cli \
                  /opt/syswarden/bin/syswarden-cli
              syswarden_cleanup_cron_work
              trap - 0 1 2 15
          fi
          rm -f /usr/local/etc/rsyslog.d/99-syswarden-siem.conf
          rm -f /usr/local/etc/rsyslog.d/99-syswarden-waf-bridge.conf
          rm -f /usr/local/bin/syswarden
          rm -f /usr/local/bin/syswarden-tui
          rm -f /usr/local/etc/rc.d/syswarden
          rm -f /usr/local/etc/rc.d/syswardenwebtui
          rm -rf /usr/local/syswarden
          rmdir /var/db/syswarden 2>/dev/null || true
          EOF

          cat << 'EOF' > "${PACKAGE_SCRIPTS}/prerm_fbsd.sh"
          #!/bin/sh
          set -eu
          service syswarden onestop >/dev/null 2>&1 || true
          if service syswarden onestatus >/dev/null 2>&1; then
              echo "syswarden service is still running; PF restore is unsafe" >&2
              exit 1
          fi
          service syswardenwebtui onestop >/dev/null 2>&1 || true
          if service syswardenwebtui onestatus >/dev/null 2>&1; then
              echo "syswardenwebtui service is still running; package removal is unsafe" >&2
              exit 1
          fi
          sysrc -x syswarden_enable || true
          sysrc -x syswardenwebtui_enable || true
          rm -f /usr/local/etc/rsyslog.d/99-syswarden-siem.conf
          rm -f /usr/local/etc/rsyslog.d/99-syswarden-waf-bridge.conf
          /usr/local/syswarden/bin/syswarden-cli package-restore-host-state
          /usr/local/syswarden/bin/syswarden-cli package-restore-pf
          EOF
          chmod 0755 \
            "${PACKAGE_SCRIPTS}/preinst_fbsd.sh" \
            "${PACKAGE_SCRIPTS}/postinst_fbsd.sh" \
            "${PACKAGE_SCRIPTS}/postrm_fbsd.sh" \
            "${PACKAGE_SCRIPTS}/prerm_fbsd.sh"

      - name: Validate Exact FreeBSD Staging Inventory
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/package_stage_gate.py \
            freebsd --root "${STAGING_FREEBSD}"

      - name: Build FreeBSD Package (.pkg)
        run: |
          set -euo pipefail
          fpm -s dir -t freebsd \
            -n syswarden \
            -v "${VERSION}" \
            -p "${PACKAGE_ASSETS}/syswarden-${VERSION}.txz" \
            --vendor "SysWarden Security" \
            --maintainer "SysWarden Engineering" \
            --description "SysWarden Host-based Security Orchestrator for FreeBSD" \
            --url "https://github.com/${{ github.repository }}" \
            --architecture amd64 \
            --freebsd-osversion 14 \
            --before-install "${PACKAGE_SCRIPTS}/preinst_fbsd.sh" \
            --after-install "${PACKAGE_SCRIPTS}/postinst_fbsd.sh" \
            --before-remove "${PACKAGE_SCRIPTS}/prerm_fbsd.sh" \
            --after-remove "${PACKAGE_SCRIPTS}/postrm_fbsd.sh" \
            -C "${STAGING_FREEBSD}" .
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/freebsd_package_manifest.py \
            finalize "${PACKAGE_ASSETS}/syswarden-${VERSION}.txz"

      - name: Validate Package Metadata
        shell: bash
        run: |
          set -euo pipefail

          validate_deb() {
            local path="$1"
            local architecture="$2"
            [[ "$(dpkg-deb --field "${path}" Version)" == "${VERSION}" ]]
            [[ "$(dpkg-deb --field "${path}" Architecture)" == "${architecture}" ]]
          }

          validate_rpm() {
            local path="$1"
            local architecture="$2"
            [[ "$(rpm --query --package --queryformat '%{VERSION}' "${path}")" == "${VERSION}" ]]
            [[ "$(rpm --query --package --queryformat '%{ARCH}' "${path}")" == "${architecture}" ]]
          }

          validate_apk() {
            local path="$1"
            local architecture="$2"
            local member
            local metadata
            local package_version
            local package_architecture
            local -a postinstall_members=()
            local -a postupgrade_members=()
            member="$(tar --list --file "${path}" | awk '/(^|\/)\.PKGINFO$/ { print }')"
            [[ "$(wc -l <<< "${member}")" -eq 1 ]]
            metadata="$(tar --extract --to-stdout --file "${path}" "${member}")"
            [[ "$(grep --count '^pkgver = ' <<< "${metadata}")" -eq 1 ]]
            [[ "$(grep --count '^arch = ' <<< "${metadata}")" -eq 1 ]]
            [[ "$(grep --count '^depend = openrc$' <<< "${metadata}")" -eq 1 ]]
            mapfile -t postinstall_members < <(
              tar --list --file "${path}" | awk '/(^|\/)\.post-install$/ { print }'
            )
            mapfile -t postupgrade_members < <(
              tar --list --file "${path}" | awk '/(^|\/)\.post-upgrade$/ { print }'
            )
            [[ "${#postinstall_members[@]}" -eq 1 ]]
            [[ "${#postupgrade_members[@]}" -eq 1 ]]
            cmp -s \
              <(tar --extract --to-stdout --file "${path}" "${postinstall_members[0]}") \
              <(tar --extract --to-stdout --file "${path}" "${postupgrade_members[0]}")
            package_version="$(sed -n 's/^pkgver = //p' <<< "${metadata}")"
            package_architecture="$(sed -n 's/^arch = //p' <<< "${metadata}")"
            python3 - "${VERSION}" "${package_version}" <<'PY'
          import re
          import sys

          expected, actual = sys.argv[1:]
          pattern = re.compile(r"^[0-9]+(?:\.[0-9]+){2}$")
          if pattern.fullmatch(expected) is None or pattern.fullmatch(actual) is None:
              raise SystemExit("APK versions must contain exactly three numeric components")
          normalize = lambda value: tuple(int(part) for part in value.split("."))
          if normalize(expected) != normalize(actual):
              raise SystemExit(f"APK version mismatch: expected {expected}, found {actual}")
          PY
            [[ "${package_architecture}" == "${architecture}" ]]
          }

          validate_deb "${PACKAGE_ASSETS}/syswarden_${VERSION}_amd64.deb" amd64
          validate_deb "${PACKAGE_ASSETS}/syswarden_${VERSION}_arm64.deb" arm64
          validate_rpm "${PACKAGE_ASSETS}/syswarden-${VERSION}-1.x86_64.rpm" x86_64
          validate_rpm "${PACKAGE_ASSETS}/syswarden-${VERSION}-1.aarch64.rpm" aarch64
          validate_apk "${PACKAGE_ASSETS}/syswarden_${VERSION}_x86_64.apk" x86_64
          validate_apk "${PACKAGE_ASSETS}/syswarden_${VERSION}_aarch64.apk" aarch64

          freebsd_manifest="$(tar --extract --to-stdout \
            --file "${PACKAGE_ASSETS}/syswarden-${VERSION}.txz" \
            +COMPACT_MANIFEST)"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/freebsd_package_manifest.py \
            verify "${PACKAGE_ASSETS}/syswarden-${VERSION}.txz"
          jq --exit-status \
            --arg name syswarden \
            --arg version "${VERSION}" \
            '.name == $name and .version == $version and .arch == "FreeBSD:14:amd64" and (.deps | keys) == ["curl", "jq", "libqrencode", "rsyslog", "wireguard-tools"]' \
            <<< "${freebsd_manifest}"

      - name: Generate Checksums
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "syswarden_${VERSION}_amd64.deb"
            "syswarden_${VERSION}_arm64.deb"
            "syswarden-${VERSION}-1.x86_64.rpm"
            "syswarden-${VERSION}-1.aarch64.rpm"
            "syswarden_${VERSION}_x86_64.apk"
            "syswarden_${VERSION}_aarch64.apk"
            "syswarden-${VERSION}.txz"
          )
          (
            cd "${PACKAGE_ASSETS}"
            for asset in "${assets[@]}"; do
              test -s "${asset}" || {
                echo "ERROR: required package is missing or empty: ${asset}" >&2
                exit 1
              }
            done
            sha256sum "${assets[@]}" > SHA256SUMS.txt
            sha256sum --check --strict SHA256SUMS.txt
          )

      - name: Validate Exact Package Artifact
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py verify-packages \
            --tag "${RELEASE_TAG}" \
            --packages "${PACKAGE_ASSETS}"

      - name: Prove Packaging Did Not Mutate Source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PACKAGE_REPOSITORY_STATE:-}" || {
            echo "ERROR: package repository-state snapshot is unavailable." >&2
            exit 1
          }
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/repository_state.py \
            --repository "${GITHUB_WORKSPACE}" \
            verify \
            --snapshot "${PACKAGE_REPOSITORY_STATE}"

      - name: Upload Package Artifacts
        if: ${{ !github.event.act }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syswarden-packages-${{ env.VERSION }}
          path: ${{ steps.package_workspace.outputs.assets }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Package Artifacts with Act-compatible protocol
        if: ${{ github.event.act }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: '1'
        with:
          name: syswarden-packages-${{ env.VERSION }}
          path: ${{ steps.package_workspace.outputs.assets }}
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package
    needs: [build-and-package]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce package build result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build-and-package.result }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "ERROR: Compile and Build Packages concluded ${BUILD_RESULT}." >&2
            exit 1
          fi

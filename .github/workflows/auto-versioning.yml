name: "Auto-Versioning"

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: version-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-bump:
    # Preserve the historical status-check identity while making the job read-only.
    name: "SysWarden Version Bumper"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: "Checkout candidate without write credentials"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: "Verify clean checkout"
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: "Test version validator"
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/versionctl
          GOWORK=off go test ./...

      - name: "Validate commit version contract"
        shell: bash
        env:
          BASE_REF: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "refs/heads/main"
          if [[ "${BASE_REF}" =~ ^0+$ ]]; then
            BASE_REF="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${BASE_REF}^{commit}"
          ./scripts/versioning.sh validate-commit \
            --repo "${GITHUB_WORKSPACE}" \
            --base-ref "${BASE_REF}" \
            --commit-message "${COMMIT_MESSAGE}"

      - name: "Prove validator did not mutate the repository"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

name: "Auto-Versioning"

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: version-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-bump:
    # Preserve the historical status-check identity while making the job read-only.
    name: "SysWarden Version Bumper"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: "Checkout candidate without write credentials"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: "Verify clean checkout"
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: "Test version validator"
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/versionctl
          GOWORK=off go test ./...

      - name: "Test push release context"
        shell: bash
        run: python3 -B -m unittest discover -s scripts/ci -p 'push_release_context_test.py'

      - name: "Validate commit version contract"
        shell: bash
        env:
          BASE_REF: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "refs/heads/main"
          if [[ "${BASE_REF}" =~ ^0+$ ]]; then
            BASE_REF="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${BASE_REF}^{commit}"
          ./scripts/versioning.sh validate-commit \
            --repo "${GITHUB_WORKSPACE}" \
            --base-ref "${BASE_REF}" \
            --commit-message "${COMMIT_MESSAGE}"

      - name: Identify Push Release Context
        id: push-context
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$(./scripts/versioning.sh inspect --repo "${GITHUB_WORKSPACE}")"
          context_report="${RUNNER_TEMP}/syswarden-push-context.json"
          bash scripts/ci/push_release_context.sh \
            "${GITHUB_WORKSPACE}" "${RELEASE_TAG}" "${RELEASE_SHA}" "${context_report}"
          echo "release_track_required=$(jq -r '.release_track_required' "${context_report}")" >> "${GITHUB_OUTPUT}"
          {
            echo '### Push and existing release context'
            echo '```json'
            cat "${context_report}"
            echo '```'
            echo 'Post-tag follow-ups keep the published tag unchanged and inherit no release verdict. Commit validation remains mandatory.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve Push Release Context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syswarden-push-context-${{ github.sha }}
          path: ${{ runner.temp }}/syswarden-push-context.json
          if-no-files-found: error
          retention-days: 30

      - name: Record Version-Derived Release Validation Track
        if: steps.push-context.outputs.release_track_required == 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$(./scripts/versioning.sh inspect --repo "${GITHUB_WORKSPACE}")"
          track_report="${RUNNER_TEMP}/syswarden-release-track.json"
          bash scripts/ci/record_release_track.sh \
            "${GITHUB_WORKSPACE}" "${RELEASE_TAG}" "${RELEASE_SHA}" "${track_report}"
          {
            echo '### Required release validation track'
            echo '```json'
            cat "${track_report}"
            echo '```'
            echo 'Classification only. Required validation, signatures and publication gates remain mandatory.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve Release Track Classification
        if: steps.push-context.outputs.release_track_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syswarden-release-track-${{ github.sha }}
          path: ${{ runner.temp }}/syswarden-release-track.json
          if-no-files-found: error
          retention-days: 30

      - name: "Prove validator did not mutate the repository"
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

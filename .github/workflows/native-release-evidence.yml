name: SysWarden Native Release Evidence

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact candidate release tag
        required: true
        type: string
      release_sha:
        description: Exact full candidate SHA on main
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: syswarden-native-release-evidence
  cancel-in-progress: false

jobs:
  seal-native-evidence:
    runs-on: [self-hosted, linux, x64, syswarden-native-evidence]
    environment:
      name: syswarden-release-qualification
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Validate Protected Native Evidence Context
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          NODE02_SSH_HOST_KEY_SHA256: ${{ vars.NODE02_SSH_HOST_KEY_SHA256 }}
          NODE03_SSH_HOST_KEY_SHA256: ${{ vars.NODE03_SSH_HOST_KEY_SHA256 }}
          NODE04_SSH_HOST_KEY_SHA256: ${{ vars.NODE04_SSH_HOST_KEY_SHA256 }}
          NODE05_SSH_HOST_KEY_SHA256: ${{ vars.NODE05_SSH_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${RELEASE_TAG}" = "v4.10.0"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${RELEASE_SHA}"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
          test "${GITHUB_TRIGGERING_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
          [[ "${NODE02_SSH_HOST_KEY_SHA256}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          [[ "${NODE03_SSH_HOST_KEY_SHA256}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          [[ "${NODE04_SSH_HOST_KEY_SHA256}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          [[ "${NODE05_SSH_HOST_KEY_SHA256}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          test "${NODE02_SSH_HOST_KEY_SHA256}" != "${NODE03_SSH_HOST_KEY_SHA256}"
          test "${NODE02_SSH_HOST_KEY_SHA256}" != "${NODE04_SSH_HOST_KEY_SHA256}"
          test "${NODE02_SSH_HOST_KEY_SHA256}" != "${NODE05_SSH_HOST_KEY_SHA256}"
          test "${NODE03_SSH_HOST_KEY_SHA256}" != "${NODE04_SSH_HOST_KEY_SHA256}"
          test "${NODE03_SSH_HOST_KEY_SHA256}" != "${NODE05_SSH_HOST_KEY_SHA256}"
          test "${NODE04_SSH_HOST_KEY_SHA256}" != "${NODE05_SSH_HOST_KEY_SHA256}"

      - name: Validate Exact Native Evidence Environment Protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          environment_name="syswarden-release-qualification"
          environment_json="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/environments/${environment_name}")"
          required_boolean() {
            local field=${1:?field is required}
            jq -er --arg field "${field}" '
              .deployment_branch_policy[$field] |
              if type == "boolean" then tostring
              else error("deployment_branch_policy." + $field + " must be boolean") end
            ' <<< "${environment_json}"
          }
          top_level_boolean() {
            local field=${1:?field is required}
            jq -er --arg field "${field}" '
              .[$field] |
              if type == "boolean" then tostring
              else error($field + " must be boolean") end
            ' <<< "${environment_json}"
          }
          reviewer_rule_count="$(jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' <<< "${environment_json}")"
          reviewer_entry_count="$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' <<< "${environment_json}")"
          owner_reviewer_count="$(jq --arg owner "${REPOSITORY_OWNER}" '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]? | select(.type == "User" and .reviewer.login == $owner)] | length' <<< "${environment_json}")"
          prevent_self_review="$(jq -er '[.protection_rules[]? | select(.type == "required_reviewers") | .prevent_self_review] | if length == 1 and .[0] == false then "false" else error("reviewer rule must allow owner approval") end' <<< "${environment_json}")"
          if [[ "$(jq -r '.name // ""' <<< "${environment_json}")" != "${environment_name}" || \
                "${reviewer_rule_count}" != "1" || \
                "${reviewer_entry_count}" != "1" || \
                "${owner_reviewer_count}" != "1" || \
                "${prevent_self_review}" != "false" || \
                "$(jq '[.protection_rules[]? | select(.type == "branch_policy")] | length' <<< "${environment_json}")" != "1" || \
                "$(jq '[.protection_rules[]?] | length' <<< "${environment_json}")" != "2" || \
                "$(required_boolean protected_branches)" != "false" || \
                "$(required_boolean custom_branch_policies)" != "true" || \
                "$(top_level_boolean can_admins_bypass)" != "false" ]]; then
            echo "ERROR: native evidence requires the exact reviewed main-only qualification environment." >&2
            exit 1
          fi
          policies_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/environments/${environment_name}/deployment-branch-policies" \
            -f per_page=100)"
          if [[ "$(jq -r '.[0].total_count' <<< "${policies_json}")" != "1" || \
                "$(jq '[.[] | .branch_policies[]?] | length' <<< "${policies_json}")" != "1" || \
                "$(jq '[.[] | .branch_policies[]? | select(.name == "main" and .type == "branch")] | length' <<< "${policies_json}")" != "1" ]]; then
            echo "ERROR: native evidence environment must allow only the main branch." >&2
            exit 1
          fi

      - name: Checkout Exact Candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Set Up Pinned Go for Candidate Verification
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Resolve Unique Protected Candidate Update Bundle
        id: candidate_update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          runs_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/candidate-update-bundle.yml/runs" \
            -f event=workflow_dispatch -f branch=main \
            -f head_sha="${RELEASE_SHA}" -f per_page=100)"
          matches="$(jq --arg sha "${RELEASE_SHA}" '[
            .[] | .workflow_runs[]? | select(
              .head_sha == $sha and .head_branch == "main" and
              .event == "workflow_dispatch" and
              .path == ".github/workflows/candidate-update-bundle.yml" and
              .run_attempt == 1 and .status == "completed" and
              .conclusion == "success"
            )
          ]' <<< "${runs_json}")"
          if [[ "$(jq 'length' <<< "${matches}")" != "1" ]]; then
            echo "ERROR: expected exactly one protected candidate update run for main/${RELEASE_SHA}." >&2
            exit 1
          fi
          run_id="$(jq -er '.[0].id | tostring' <<< "${matches}")"
          artifact_name="syswarden-candidate-update-bundle-${version}-${run_id}-1-${RELEASE_SHA}"
          artifacts_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" -f per_page=100)"
          if [[ "$(jq '[.[] | .artifacts[]?] | length' <<< "${artifacts_json}")" != "1" ]]; then
            echo "ERROR: candidate update run must expose exactly one artifact." >&2
            exit 1
          fi
          artifact="$(jq --arg name "${artifact_name}" --arg sha "${RELEASE_SHA}" \
            --argjson run "${run_id}" '[.[] | .artifacts[]? | select(
              .name == $name and .workflow_run.id == $run and
              .workflow_run.head_sha == $sha)]' <<< "${artifacts_json}")"
          artifact_id="$(jq -r '.[0].id | tostring // ""' <<< "${artifact}")"
          artifact_digest="$(jq -r '.[0].digest // ""' <<< "${artifact}")"
          if [[ "$(jq 'length' <<< "${artifact}")" != "1" || \
                ! "${run_id}" =~ ^[1-9][0-9]*$ || \
                ! "${artifact_id}" =~ ^[1-9][0-9]*$ || \
                ! "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ || \
                "$(jq -r '.[0].expired' <<< "${artifact}")" != "false" || \
                ! "$(jq -r '.[0].size_in_bytes | tostring' <<< "${artifact}")" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: candidate update artifact is absent, expired, empty, ambiguous, or malformed." >&2
            exit 1
          fi
          printf 'run_id=%s\nartifact_id=%s\nartifact_name=%s\nartifact_digest=%s\n' \
            "${run_id}" "${artifact_id}" "${artifact_name}" "${artifact_digest}" >> "${GITHUB_OUTPUT}"

      - name: Create Private Candidate Verification Workspace
        id: candidate_workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          candidate_root="$(mktemp -d \
            "${RUNNER_TEMP%/}/syswarden-native-candidate-update.XXXXXX")"
          candidate_bundle="${candidate_root}/bundle"
          install -d -m 0700 "${candidate_bundle}"
          printf 'root=%s\nbundle=%s\n' \
            "${candidate_root}" "${candidate_bundle}" >> "${GITHUB_OUTPUT}"

      - name: Download Exact Candidate Update Bundle by Artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate_update.outputs.artifact_id }}
          path: ${{ steps.candidate_workspace.outputs.bundle }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate_update.outputs.run_id }}

      - name: Validate and Seal Pre-Staged Native Evidence
        id: seal
        shell: bash
        env:
          CANDIDATE_UPDATE_ARTIFACT_DIGEST: ${{ steps.candidate_update.outputs.artifact_digest }}
          CANDIDATE_UPDATE_ARTIFACT_ID: ${{ steps.candidate_update.outputs.artifact_id }}
          CANDIDATE_UPDATE_ARTIFACT_NAME: ${{ steps.candidate_update.outputs.artifact_name }}
          CANDIDATE_UPDATE_RUN_ID: ${{ steps.candidate_update.outputs.run_id }}
          CANDIDATE_UPDATE_SOURCE_DIR: ${{ steps.candidate_workspace.outputs.bundle }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          NODE02_SSH_HOST_KEY_SHA256: ${{ vars.NODE02_SSH_HOST_KEY_SHA256 }}
          NODE03_SSH_HOST_KEY_SHA256: ${{ vars.NODE03_SSH_HOST_KEY_SHA256 }}
          NODE04_SSH_HOST_KEY_SHA256: ${{ vars.NODE04_SSH_HOST_KEY_SHA256 }}
          NODE05_SSH_HOST_KEY_SHA256: ${{ vars.NODE05_SSH_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${NODE02_SSH_HOST_KEY_SHA256}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          [[ "${NODE03_SSH_HOST_KEY_SHA256}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          [[ "${NODE04_SSH_HOST_KEY_SHA256}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          [[ "${NODE05_SSH_HOST_KEY_SHA256}" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          test "${NODE02_SSH_HOST_KEY_SHA256}" != "${NODE03_SSH_HOST_KEY_SHA256}"
          test "${NODE02_SSH_HOST_KEY_SHA256}" != "${NODE04_SSH_HOST_KEY_SHA256}"
          test "${NODE02_SSH_HOST_KEY_SHA256}" != "${NODE05_SSH_HOST_KEY_SHA256}"
          test "${NODE03_SSH_HOST_KEY_SHA256}" != "${NODE04_SSH_HOST_KEY_SHA256}"
          test "${NODE03_SSH_HOST_KEY_SHA256}" != "${NODE05_SSH_HOST_KEY_SHA256}"
          test "${NODE04_SSH_HOST_KEY_SHA256}" != "${NODE05_SSH_HOST_KEY_SHA256}"
          source_root="/var/lib/syswarden/native-release-evidence/${RELEASE_SHA}"
          test -d "${source_root}"
          test ! -L "${source_root}"
          test "$(stat -c '%u' "${source_root}")" = "$(id -u)"
          test "$(stat -c '%a' "${source_root}")" = "700"
          native_feed_contract="${GITHUB_WORKSPACE}/scripts/ci/native_feed_contract_v4.10.0.json"
          mapfile -t native_feed_raw_inventory < <(jq -er '.raw_evidence.inventory[]' "${native_feed_contract}")
          test "${#native_feed_raw_inventory[@]}" -eq 110
          mapfile -t native_feed_raw_directories < <(
            python3 - "${native_feed_contract}" <<'PY'
          import json
          import pathlib
          import sys
          document = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          directories = {"native-feed/raw"}
          for relative in document["raw_evidence"]["inventory"]:
              parent = pathlib.PurePosixPath(relative).parent
              while str(parent) != ".":
                  directories.add("native-feed/raw/" + parent.as_posix())
                  parent = parent.parent
          print("\n".join(sorted(directories)))
          PY
          )
          for directory in ha-v2 ha-v2/raw native-capability native-feed performance node01-migration node01-migration/artifacts native-lifecycle native-lifecycle/artifacts native-signing native-signing/evidence native-signing/packages native-signing/rhel-package-owned native-signing/rhel-package-owned/evidence native-signing/rhel-package-owned/packages source-allocation source-allocation/raw source-allocation/raw/allocation-campaign-01 source-allocation/raw/allocation-campaign-02 source-allocation/raw/allocation-campaign-03 "${native_feed_raw_directories[@]}"; do
            path="${source_root}/${directory}"
            test -d "${path}"; test ! -L "${path}"
            test "$(stat -c '%u' "${path}")" = "$(id -u)"
            test "$(stat -c '%a' "${path}")" = "700"
          done
          output_root="$(mktemp -d "${RUNNER_TEMP%/}/native-release-evidence.XXXXXXXXXX")"
          chmod 0700 "${output_root}"
          mkdir -m 0700 "${output_root}/candidate-update" "${output_root}/candidate-update/node01" "${output_root}/candidate-update/verification" "${output_root}/ha-v2" "${output_root}/native-capability" "${output_root}/native-feed" "${output_root}/performance" "${output_root}/node01-migration" "${output_root}/native-lifecycle" "${output_root}/source-allocation"
          for directory in "${native_feed_raw_directories[@]}"; do
            mkdir -m 0700 -p "${output_root}/${directory}"
          done
          mkdir -m 0700 "${output_root}/source-allocation/raw" \
            "${output_root}/source-allocation/raw/allocation-campaign-01" \
            "${output_root}/source-allocation/raw/allocation-campaign-02" \
            "${output_root}/source-allocation/raw/allocation-campaign-03"

          require_input() {
            local relative=$1 expected_mode=${2:-600} path="${source_root}/$1"
            test -f "${path}"; test ! -L "${path}"
            test "$(stat -c '%u' "${path}")" = "$(id -u)"
            test "$(stat -c '%a' "${path}")" = "${expected_mode}"
            test "$(stat -c '%h' "${path}")" = "1"
            test -s "${path}"
          }
          raw_names=(node01-attestation.json node02-attestation.json asymmetric-partition.json crash-head-recovery.json crash-wal-recovery.json heartbeat-monotonic-receipt-timeout.json instance-lease-exclusion.json normal-replication-ack-checkpoint.json partition-fence-split-brain.json rejoin-explicit.json rolling-rollback.json rolling-upgrade.json)
          expected_source=(ha-v2/HA_V2_NATIVE_EVIDENCE.json native-capability/APK-324.json native-capability/DEB-13.json native-capability/DEB-U2604.json native-capability/RPM-A10.json native-capability/RPM-A9-RHELPO.json native-capability/RPM-A10-RHELPO.json native-feed/EVIDENCE.json native-feed/VERDICT.json native-feed/raw/SHA256SUMS performance/ADAPTER_CONFIG.json performance/EVIDENCE.json)
          for relative in "${native_feed_raw_inventory[@]}"; do
            expected_source+=("native-feed/raw/${relative}")
          done
          candidate_version="${RELEASE_TAG#v}"
          native_signing_files=(
            native-signing/SIGNED_ARTIFACT_SHA256SUMS.txt
            native-signing/evidence/APK_NATIVE_VERIFICATION.json
            native-signing/evidence/DEB_NATIVE_VERIFICATION.json
            native-signing/evidence/NATIVE_SIGNING_PROVENANCE.json
            native-signing/evidence/RPM_NATIVE_VERIFICATION.json
            native-signing/evidence/RPM_PAYLOAD_PROOF.json
            native-signing/evidence/UNSIGNED_SHA256SUMS.txt
            native-signing/packages/SHA256SUMS.txt
            "native-signing/packages/syswarden-${candidate_version}-1.x86_64.rpm"
            "native-signing/packages/syswarden_${candidate_version}_amd64.deb"
            "native-signing/packages/syswarden_${candidate_version}_amd64.deb.asc"
            "native-signing/packages/syswarden_${candidate_version}_x86_64.apk"
            native-signing/rhel-package-owned/SIGNED_ARTIFACT_SHA256SUMS.txt
            native-signing/rhel-package-owned/evidence/RPM_NATIVE_VERIFICATION.json
            native-signing/rhel-package-owned/evidence/RPM_PAYLOAD_PROOF.json
            native-signing/rhel-package-owned/evidence/SIGNING_PROVENANCE.json
            native-signing/rhel-package-owned/evidence/UNSIGNED_SHA256SUMS.txt
            native-signing/rhel-package-owned/packages/SHA256SUMS.txt
            "native-signing/rhel-package-owned/packages/syswarden-${candidate_version}-1.rhelpo.x86_64.rpm"
          )
          expected_source+=("${native_signing_files[@]}")
          allocation_metadata=(environment.json execution-control-attestation.json build-attestation.json benchmark-source.go fixture.json signature-catalog.json)
          allocation_probes=(baseline-probe candidate-probe)
          allocation_campaigns=(allocation-campaign-01 allocation-campaign-02 allocation-campaign-03)
          allocation_roles=(baseline candidate)
          allocation_samples=(01 02 03 04 05 06 07 08 09 10)
          for name in "${allocation_metadata[@]}" "${allocation_probes[@]}"; do
            expected_source+=("source-allocation/${name}")
          done
          for campaign in "${allocation_campaigns[@]}"; do
            for role in "${allocation_roles[@]}"; do
              for sample in "${allocation_samples[@]}"; do
                expected_source+=("source-allocation/raw/${campaign}/${role}-${sample}.json")
              done
            done
          done
          signing_validation_root="$(mktemp -d "${RUNNER_TEMP%/}/native-signing-validation.XXXXXXXXXX")"
          chmod 0700 "${signing_validation_root}"
          trap 'rm -rf -- "${signing_validation_root}"' EXIT
          mkdir -m 0700 \
            "${signing_validation_root}/evidence" \
            "${signing_validation_root}/packages" \
            "${signing_validation_root}/rhel-package-owned" \
            "${signing_validation_root}/rhel-package-owned/evidence" \
            "${signing_validation_root}/rhel-package-owned/packages"
          for relative in "${native_signing_files[@]}"; do
            require_input "${relative}"
            target_relative="${relative#native-signing/}"
            install -m 0600 -- "${source_root}/${relative}" "${signing_validation_root}/${target_relative}"
          done
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/native_package_signing_bundle.py verify \
            --bundle "${signing_validation_root}" --release "${RELEASE_TAG}" \
            --release-sha "${RELEASE_SHA}"
          signing_provenance="${signing_validation_root}/evidence/NATIVE_SIGNING_PROVENANCE.json"
          rhel_signing_provenance="${signing_validation_root}/rhel-package-owned/evidence/SIGNING_PROVENANCE.json"
          signature_policy="scripts/ci/native_package_signature_policy_v4100.json"
          signature_policy_sha256="$(sha256sum "${signature_policy}" | awk '{print $1}')"
          jq -e --arg repository "${GITHUB_REPOSITORY}" \
            --arg release_sha "${RELEASE_SHA}" --arg release_tag "${RELEASE_TAG}" \
            --arg policy_sha256 "${signature_policy_sha256}" '
              .status == "native-signatures-verified-not-release-qualified" and
              .public_release == false and .release_qualified == false and
              .repository == $repository and .source.release_sha == $release_sha and
              .source.release_tag == $release_tag and .policy_sha256 == $policy_sha256
            ' "${signing_provenance}" >/dev/null
          jq -e --arg repository "${GITHUB_REPOSITORY}" \
            --arg release_sha "${RELEASE_SHA}" --arg release_tag "${RELEASE_TAG}" \
            --arg version "${candidate_version}" --arg policy_sha256 "${signature_policy_sha256}" \
            --argjson standard_rpm_key "$(jq -c '.rpm_signature.key' "${signing_provenance}")" '
              .schema_version == 1 and
              .profile == "syswarden-rhel-package-owned-signing/v4.10.0" and
              .package_role == "rhel-package-owned" and
              .status == "native-signatures-verified-not-release-qualified" and
              .public_release == false and .release_qualified == false and
              .updater_manifest_included == false and
              .repository == $repository and .source.release_sha == $release_sha and
              .source.release_tag == $release_tag and .policy_sha256 == $policy_sha256 and
              .rpm_identity == {
                architecture: "x86_64",
                filename: ("syswarden-" + $version + "-1.rhelpo.x86_64.rpm"),
                name: "syswarden",
                release: "1.rhelpo",
                version: $version
              } and
              .rpm_signature.key == $standard_rpm_key
            ' "${rhel_signing_provenance}" >/dev/null
          attested_native_identities="$(jq -ce '
            def exact_key:
              if type == "object" and
                 (keys | sort) == ["fingerprint","id","public_key","public_key_sha256"] and
                 (.id | type == "string" and test("^[a-z0-9][a-z0-9._-]{0,63}$")) and
                 (.public_key | type == "string" and length > 0) and
                 (.public_key_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
              then . else error("native signing provenance key identity is malformed") end;
            {rpm:(.rpm_signature.key | exact_key),apk:(.apk_signature.key | exact_key),deb:(.deb_signature.key | exact_key)} |
            if (.rpm.fingerprint | type == "string" and test("^[0-9A-F]{40}$")) and
               (.deb.fingerprint | type == "string" and test("^[0-9A-F]{40}$")) and
               (.apk.fingerprint | type == "string" and test("^[0-9a-f]{64}$")) and
               .apk.fingerprint == .apk.public_key_sha256 and
               .rpm.id != .apk.id and .rpm.id != .deb.id and .apk.id != .deb.id and
               .rpm.public_key_sha256 != .apk.public_key_sha256 and
               .rpm.public_key_sha256 != .deb.public_key_sha256 and
               .apk.public_key_sha256 != .deb.public_key_sha256 and
               .rpm.fingerprint != .deb.fingerprint
            then . else error("native signing provenance identities are invalid or ambiguous") end
          ' "${signing_provenance}")"
          attested_standard_packages="$(jq -ce \
            --arg rpm_name "syswarden-${candidate_version}-1.x86_64.rpm" \
            --arg deb_name "syswarden_${candidate_version}_amd64.deb" \
            --arg apk_name "syswarden_${candidate_version}_x86_64.apk" '
            def exact_package($name):
              if type == "object" and
                 (keys | sort) == ["name","sha256","size"] and
                 .name == $name and
                 (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
                 (.size | type == "number" and floor == . and . > 0 and . <= 268435456)
              then . else error("native signing provenance package record is malformed") end;
            def exactly_one($name):
              [.packages.signed[] | select(type == "object" and .name == $name)] |
              if length == 1 then (.[0] | exact_package($name))
              else error("native signing provenance package record is missing or ambiguous") end;
            {rpm: exactly_one($rpm_name), deb: exactly_one($deb_name), apk: exactly_one($apk_name)}
          ' "${signing_provenance}")"
          attested_rhel_package="$(jq -ce \
            --arg rpm_name "syswarden-${candidate_version}-1.rhelpo.x86_64.rpm" '
            def exact_package($name):
              if type == "object" and
                 (keys | sort) == ["name","sha256","size"] and
                 .name == $name and
                 (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and

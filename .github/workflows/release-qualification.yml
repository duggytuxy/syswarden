name: SysWarden Release Qualification

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Canonical pre-release version (the tag must not exist yet)
        required: true
        type: string
      release_sha:
        description: Exact full commit SHA on main to qualify
        required: true
        type: string
      previous_tag:
        description: Exact latest public release used for lifecycle rollback
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

concurrency:
  group: syswarden-release-qualification
  cancel-in-progress: false

jobs:
  package-lifecycle-arm64:
    name: Native ARM64 Package Lifecycle Shard
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.seal.outputs.artifact_name }}
      report_sha256: ${{ steps.seal.outputs.report_sha256 }}
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
      candidate_artifact_id: ${{ steps.candidate.outputs.artifact_id }}
      candidate_artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      previous_release_id: ${{ steps.previous.outputs.release_id }}

    steps:
      - name: Seal Native ARM64 Podman Trust Path
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          podman_parent="/usr/local/bin"
          for trusted_parent in /usr /usr/bin /usr/local; do
            if [[ ! -d "${trusted_parent}" || -L "${trusted_parent}" || \
                  "$(/usr/bin/stat -c '%u:%g' "${trusted_parent}")" != "0:0" ]]; then
              echo "ERROR: the native ARM64 Podman ancestor is not a trusted root-owned directory: ${trusted_parent}." >&2
              exit 1
            fi
            trusted_parent_mode="$(/usr/bin/stat -c '%a' "${trusted_parent}")"
            if [[ ! "${trusted_parent_mode}" =~ ^[0-7]{3,4}$ ]] || \
               (( (8#${trusted_parent_mode} & 0022) != 0 )); then
              echo "ERROR: the native ARM64 Podman ancestor is writable by an untrusted account: ${trusted_parent}." >&2
              exit 1
            fi
          done
          trusted_system_tools=(
            /usr/bin/bash
            /usr/bin/chmod
            /usr/bin/sha256sum
            /usr/bin/stat
            /usr/bin/sudo
          )
          for trusted_system_tool in "${trusted_system_tools[@]}"; do
            if [[ ! -f "${trusted_system_tool}" || -L "${trusted_system_tool}" || \
                  ! -x "${trusted_system_tool}" || \
                  "$(/usr/bin/stat -c '%u:%g' "${trusted_system_tool}")" != "0:0" ]]; then
              echo "ERROR: the native ARM64 trust-path tool is not an exact root-owned executable: ${trusted_system_tool}." >&2
              exit 1
            fi
            trusted_system_tool_mode="$(/usr/bin/stat -c '%a' "${trusted_system_tool}")"
            if [[ ! "${trusted_system_tool_mode}" =~ ^[0-7]{3,4}$ ]] || \
               (( (8#${trusted_system_tool_mode} & 0022) != 0 )); then
              echo "ERROR: the native ARM64 trust-path tool is writable by an untrusted account: ${trusted_system_tool}." >&2
              exit 1
            fi
          done
          if [[ ! -d "${podman_parent}" || -L "${podman_parent}" || \
                "$(/usr/bin/stat -c '%u:%g' "${podman_parent}")" != "0:0" ]]; then
            echo "ERROR: the native ARM64 Podman parent is not the expected root-owned directory." >&2
            exit 1
          fi
          podman_bin_tools=(
            /usr/local/bin/podman
            /usr/local/bin/crun
            /usr/local/bin/runc
            /usr/local/bin/pasta
            /usr/local/bin/fuse-overlayfs
          )
          for podman_tool in "${podman_bin_tools[@]}"; do
            if [[ ! -f "${podman_tool}" || -L "${podman_tool}" || \
                  ! -x "${podman_tool}" || \
                  "$(/usr/bin/stat -c '%u:%g' "${podman_tool}")" != "0:0" ]]; then
              echo "ERROR: the native ARM64 Podman bundle tool is not an exact root-owned executable: ${podman_tool}." >&2
              exit 1
            fi
          done
          /usr/bin/sudo -n /usr/bin/chmod 0755 -- \
            "${podman_parent}" "${podman_bin_tools[@]}"
          if [[ "$(/usr/bin/stat -c '%u:%g:%a' "${podman_parent}")" != "0:0:755" ]]; then
            echo "ERROR: the native ARM64 Podman parent could not be sealed." >&2
            exit 1
          fi
          for podman_tool in "${podman_bin_tools[@]}"; do
            if [[ "$(/usr/bin/stat -c '%u:%g:%a' "${podman_tool}")" != "0:0:755" ]]; then
              echo "ERROR: the native ARM64 Podman bundle tool could not be sealed: ${podman_tool}." >&2
              exit 1
            fi
          done
          for podman_library_parent in /usr/local/lib /usr/local/lib/podman; do
            if [[ ! -d "${podman_library_parent}" || -L "${podman_library_parent}" || \
                  "$(/usr/bin/stat -c '%u:%g' "${podman_library_parent}")" != "0:0" ]]; then
              echo "ERROR: the native ARM64 Podman library path is not a trusted root-owned directory: ${podman_library_parent}." >&2
              exit 1
            fi
            podman_library_parent_mode="$(/usr/bin/stat -c '%a' "${podman_library_parent}")"
            if [[ ! "${podman_library_parent_mode}" =~ ^[0-7]{3,4}$ ]] || \
               (( (8#${podman_library_parent_mode} & 0022) != 0 )); then
              echo "ERROR: the native ARM64 Podman library path is writable by an untrusted account: ${podman_library_parent}." >&2
              exit 1
            fi
          done
          podman_library_tools=(
            /usr/local/lib/podman/conmon
            /usr/local/lib/podman/rootlessport
            /usr/local/lib/podman/netavark
            /usr/local/lib/podman/catatonit
            /usr/local/lib/podman/aardvark-dns
          )
          for podman_tool in "${podman_library_tools[@]}"; do
            if [[ ! -f "${podman_tool}" || -L "${podman_tool}" || \
                  ! -x "${podman_tool}" || \
                  "$(/usr/bin/stat -c '%u:%g:%a' "${podman_tool}")" != "0:0:755" ]]; then
              echo "ERROR: the native ARM64 Podman library tool is not an exact sealed executable: ${podman_tool}." >&2
              exit 1
            fi
          done
          # These hashes are derived from the podman-static v5.8.4 ARM64 archive
          # used and checksum-pinned by actions/runner-images at SHA256 a2f6b73cc0f7018e2e8518338a4ec27db70148e1af86e16719235605aefd1df3.
          printf '%s\n' \
            '5884e882b252f4a8073fc22c66633993fb8e0adf79ecd1631b4d3e1f382f6f90  /usr/local/bin/podman' \
            'eb61412faa7ea9ee395b21f3a70def43238de0d7e120ae5e93f4f9528af5f5f4  /usr/local/bin/crun' \
            '4efb64a7a1125462cec5023c09384651654c15f294b3c59e0753e8e1536c068b  /usr/local/bin/runc' \
            '54461fe89d55222cde826b917e96b92c450031446841eeab672c6c70fcdc9822  /usr/local/bin/pasta' \
            '36c2f2886f132e568636d018e491570c36364d9984f4df30a4616133f89c0119  /usr/local/bin/fuse-overlayfs' \
            'dcc03958b573a8ddc189f5cd87b78913df129384cba59cb03093f1ff03417c53  /usr/local/lib/podman/conmon' \
            'b0fa7e4a1aacaed6dffe28131cff7d1d295f2d7653bc963d507f6a67009225d9  /usr/local/lib/podman/rootlessport' \
            '2d80e408dd2d393673e8970f201165df96f84e0dd91976d64b9c1cc77fde6bf9  /usr/local/lib/podman/netavark' \
            '75e90ba96e3fbe6c9ed9f994f821fc4e7af89273acb5022790b682674b6911df  /usr/local/lib/podman/catatonit' \
            '844e4d8900fd6856d3f8f03a81599d6add195b69015de6b040c2da3b99bb7b95  /usr/local/lib/podman/aardvark-dns' | \
            /usr/bin/sha256sum --check --strict
          test "$(/usr/local/bin/podman --version)" = "podman version 5.8.4"

      - name: Checkout Exact ARM64 Candidate Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Validate Native ARM64 Shard Context
        shell: bash
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ -z "${REPOSITORY_OWNER}" || \
                "${EVENT_ACTOR}" != "${REPOSITORY_OWNER}" || \
                "${EVENT_TRIGGERING_ACTOR}" != "${REPOSITORY_OWNER}" || \
                "${RUN_ATTEMPT}" != "1" || \
                "${EVENT_NAME}" != "workflow_dispatch" || \
                "${EVENT_REF_TYPE}" != "branch" || \
                "${EVENT_REF_NAME}" != "main" || \
                "${EVENT_REF}" != "refs/heads/main" || \
                "${EVENT_SHA}" != "${RELEASE_SHA}" || \
                ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ || \
                ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]{2}\.[0-9]+$ || \
                ! "${PREVIOUS_TAG}" =~ ^v[0-9]+\.[0-9]{2}\.[0-9]+$ || \
                "${RELEASE_TAG}" == "${PREVIOUS_TAG}" ]]; then
            echo "ERROR: native ARM64 qualification context is not the exact main candidate." >&2
            exit 1
          fi
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${RELEASE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(./scripts/versioning.sh inspect --repo "${GITHUB_WORKSPACE}")" = \
            "${RELEASE_TAG}"
          test "$(uname -m)" = "aarch64"
          command -v gh >/dev/null
          command -v jq >/dev/null
          command -v python3 >/dev/null
          command -v runc >/dev/null
          command -v sha256sum >/dev/null
          command -v sudo >/dev/null
          command -v systemctl >/dev/null
          command -v systemd-run >/dev/null
          podman_path="/usr/local/bin/podman"
          for parent in /usr /usr/local /usr/local/bin; do
            if [[ ! -d "${parent}" || -L "${parent}" || \
                  "$(stat -c '%u:%g' "${parent}")" != "0:0" ]]; then
              echo "ERROR: the native ARM64 Podman parent path is not a trusted root-owned directory: ${parent}." >&2
              exit 1
            fi
            parent_mode="$(stat -c '%a' "${parent}")"
            if [[ ! "${parent_mode}" =~ ^[0-7]{3,4}$ ]] || \
               (( (8#${parent_mode} & 0022) != 0 )); then
              echo "ERROR: the native ARM64 Podman parent path is writable by an untrusted account: ${parent}." >&2
              exit 1
            fi
          done
          if [[ ! -f "${podman_path}" || -L "${podman_path}" || \
                ! -x "${podman_path}" || \
                "$(stat -c '%u:%g' "${podman_path}")" != "0:0" ]]; then
            echo "ERROR: the native ARM64 Podman executable is not the exact trusted regular file." >&2
            exit 1
          fi
          podman_mode="$(stat -c '%a' "${podman_path}")"
          if [[ ! "${podman_mode}" =~ ^[0-7]{3,4}$ ]] || \
             (( (8#${podman_mode} & 0022) != 0 )); then
            echo "ERROR: the native ARM64 Podman executable is writable by an untrusted account." >&2
            exit 1
          fi

      - name: Create Native ARM64 Shard Workspace
        id: arm_workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${RUNNER_TEMP:-}"
          test -d "${RUNNER_TEMP}"
          test ! -L "${RUNNER_TEMP}"
          shard_root="$(mktemp -d \
            "${RUNNER_TEMP%/}/syswarden-package-arm64.XXXXXX")"
          candidate_packages="${shard_root}/packages/candidate"
          previous_packages="${shard_root}/packages/previous"
          evidence_dir="${shard_root}/evidence"
          transition_dir="${shard_root}/historical-transition"
          install -d -m 0700 \
            "${candidate_packages}" \
            "${previous_packages}" \
            "${evidence_dir}" \
            "${transition_dir}"
          {
            printf 'SHARD_ROOT=%s\n' "${shard_root}"
            printf 'ARM_CANDIDATE_PACKAGES_DIR=%s\n' "${candidate_packages}"
            printf 'ARM_PREVIOUS_PACKAGES_DIR=%s\n' "${previous_packages}"
            printf 'ARM_EVIDENCE_DIR=%s\n' "${evidence_dir}"
            printf 'ARM_TRANSITION_DIR=%s\n' "${transition_dir}"
          } >> "${GITHUB_ENV}"
          {
            printf 'candidate_packages_dir=%s\n' "${candidate_packages}"
            printf 'previous_packages_dir=%s\n' "${previous_packages}"
            printf 'evidence_dir=%s\n' "${evidence_dir}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve Exact ARM64 Candidate Package Artifact
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          runs_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/package.yml/runs" \
            -f event=push \
            -f head_sha="${RELEASE_SHA}" \
            -f per_page=100)"
          matches="$(jq --arg sha "${RELEASE_SHA}" '[
            .[] | .workflow_runs[]? |
            select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push"
            )
          ]' <<< "${runs_json}")"
          if [[ "$(jq 'length' <<< "${matches}")" != "1" ]]; then
            echo "ERROR: expected one ARM64 source package run for ${RELEASE_SHA}." >&2
            exit 1
          fi
          run_id="$(jq -r '.[0].id' <<< "${matches}")"
          run_status="$(jq -r '.[0].status' <<< "${matches}")"
          run_conclusion="$(jq -r '.[0].conclusion // ""' <<< "${matches}")"
          if [[ ! "${run_id}" =~ ^[0-9]+$ || \
                "${run_status}" != "completed" || \
                "${run_conclusion}" != "success" ]]; then
            echo "ERROR: exact ARM64 source package run is not a completed success." >&2
            exit 1
          fi
          artifact_name="syswarden-packages-${version}"
          artifacts_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            -f per_page=100)"
          artifact_matches="$(jq --arg name "${artifact_name}" '[
            .[] | .artifacts[]? | select(.name == $name)
          ]' <<< "${artifacts_json}")"
          if [[ "$(jq 'length' <<< "${artifact_matches}")" != "1" ]]; then
            echo "ERROR: exact ARM64 source artifact is absent or ambiguous." >&2
            exit 1
          fi
          artifact_id="$(jq -r '.[0].id' <<< "${artifact_matches}")"
          expired="$(jq -r '.[0].expired' <<< "${artifact_matches}")"
          size="$(jq -r '.[0].size_in_bytes' <<< "${artifact_matches}")"
          if [[ ! "${artifact_id}" =~ ^[0-9]+$ || \
                "${expired}" != "false" || \
                ! "${size}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: exact ARM64 source artifact is expired, empty, or malformed." >&2
            exit 1
          fi
          {
            printf 'run_id=%s\n' "${run_id}"
            printf 'artifact_id=%s\n' "${artifact_id}"
            printf 'artifact_name=%s\n' "${artifact_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download Exact ARM64 Candidate Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: ${{ steps.arm_workspace.outputs.candidate_packages_dir }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}

      - name: Verify Exact ARM64 Candidate Package Inventory
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            verify-packages \
            --tag "${RELEASE_TAG}" \
            --packages "${ARM_CANDIDATE_PACKAGES_DIR}"

      - name: Download Exact ARM64 Previous Packages
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          set -euo pipefail
          umask 077
          previous_version="${PREVIOUS_TAG#v}"
          release_json="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/releases/latest")"
          release_id="$(jq -r '.id' <<< "${release_json}")"
          if [[ "$(jq -r '.tag_name' <<< "${release_json}")" != "${PREVIOUS_TAG}" || \
                "$(jq -r '.draft' <<< "${release_json}")" != "false" || \
                "$(jq -r '.prerelease' <<< "${release_json}")" != "false" || \
                "$(jq -r '.published_at // ""' <<< "${release_json}")" == "" || \
                ! "${release_id}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: ARM64 previous_tag is not the latest public release." >&2
            exit 1
          fi
          assets_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            -f per_page=100)"
          transition_required=false
          transition_metadata="${ARM_TRANSITION_DIR}/public-release-assets.json"
          transition_source_manifest="${ARM_TRANSITION_DIR}/public-SHA256SUMS.txt"
          transition_provenance="${ARM_TRANSITION_DIR}/v4.02.8-linux-transition.json"
          if [[ "${PREVIOUS_TAG}" == "v4.02.8" ]]; then
            transition_required=true
            jq -cS '[.[] | .[] | {digest, id, name, size, state}]' \
              <<< "${assets_json}" > "${transition_metadata}"
            chmod 0600 "${transition_metadata}"
          fi
          expected_assets=(
            "syswarden_${previous_version}_amd64.deb"
            "syswarden_${previous_version}_arm64.deb"
            "syswarden-${previous_version}-1.x86_64.rpm"
            "syswarden-${previous_version}-1.aarch64.rpm"
            "syswarden_${previous_version}_x86_64.apk"
            "syswarden_${previous_version}_aarch64.apk"
            "SHA256SUMS.txt"
          )
          for asset_name in "${expected_assets[@]}"; do
            matches="$(jq --arg name "${asset_name}" '[
              .[] | .[] | select(.name == $name)
            ]' <<< "${assets_json}")"
            if [[ "$(jq 'length' <<< "${matches}")" != "1" ]]; then
              echo "ERROR: ARM64 previous asset ${asset_name} is absent or ambiguous." >&2
              exit 1
            fi
            asset_id="$(jq -r '.[0].id' <<< "${matches}")"
            asset_state="$(jq -r '.[0].state' <<< "${matches}")"
            asset_size="$(jq -r '.[0].size' <<< "${matches}")"
            if [[ ! "${asset_id}" =~ ^[0-9]+$ || \
                  "${asset_state}" != "uploaded" || \
                  ! "${asset_size}" =~ ^[1-9][0-9]*$ ]]; then
              echo "ERROR: ARM64 previous asset ${asset_name} is invalid." >&2
              exit 1
            fi
            destination="${ARM_PREVIOUS_PACKAGES_DIR}/${asset_name}"
            if [[ "${transition_required}" == "true" && \
                  "${asset_name}" == "SHA256SUMS.txt" ]]; then
              destination="${transition_source_manifest}"
            fi
            gh api --method GET \
              -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "${destination}"
            test -s "${destination}"
            test -f "${destination}"
            test ! -L "${destination}"
            chmod 0600 "${destination}"
          done
          printf 'release_id=%s\n' "${release_id}" >> "${GITHUB_OUTPUT}"
          if [[ "${transition_required}" == "true" ]]; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
              normalize-v4028-linux-packages \
              --repository "${GITHUB_REPOSITORY}" \
              --release-id "${release_id}" \
              --tag "${PREVIOUS_TAG}" \
              --source-manifest "${transition_source_manifest}" \
              --asset-metadata "${transition_metadata}" \
              --packages "${ARM_PREVIOUS_PACKAGES_DIR}" \
              --output-manifest "${ARM_PREVIOUS_PACKAGES_DIR}/SHA256SUMS.txt" \
              --provenance-output "${transition_provenance}"
            cat "${transition_provenance}"
            sha256sum "${transition_provenance}"
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            verify-packages \
            --tag "${PREVIOUS_TAG}" \
            --packages "${ARM_PREVIOUS_PACKAGES_DIR}"

      - name: Run Native ARM64 Package Lifecycle Shard
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          PREVIOUS_RELEASE_ID: ${{ steps.previous.outputs.release_id }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          user_id="$(id -u)"
          user_name="$(id -un)"
          user_service="user@${user_id}.service"
          runtime_dir="/run/user/${user_id}"
          delegate_directory="/etc/systemd/system/user@.service.d"
          delegate_drop_in="${delegate_directory}/syswarden-release-qualification.conf"
          containers_override="${SHARD_ROOT}/containers-override.conf"
          delegate_drop_in_owned=false
          original_user_service_active=false
          arm_cleanup_completed=false

          if [[ "${user_id}" -eq 0 || "${user_name}" != "runner" || \
                "${HOME}" != "/home/runner" || ! -d "${HOME}" || \
                -L "${HOME}" || "$(stat -c '%u' "${HOME}")" != "${user_id}" ]]; then
            echo "ERROR: ARM64 qualification requires the exact non-root hosted runner identity." >&2
            exit 1
          fi
          self_cgroup="$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          if [[ -z "${self_cgroup}" || "${self_cgroup}" == /user.slice/* ]]; then
            echo "ERROR: the hosted runner shell must remain outside the user manager being renewed." >&2
            exit 1
          fi
          test -n "${RUNNER_TEMP:-}"
          test -d "${RUNNER_TEMP}"
          test ! -L "${RUNNER_TEMP}"
          test -d "${SHARD_ROOT}"
          test ! -L "${SHARD_ROOT}"
          test ! -e "${containers_override}"
          test ! -L "${containers_override}"
          if sudo -n systemctl is-active --quiet "${user_service}"; then
            original_user_service_active=true
          fi

          cleanup_arm_cgroup_session() {
            local cleanup_rc=0
            if [[ "${delegate_drop_in_owned}" == "true" ]]; then
              if ! sudo -n systemctl stop "${user_service}"; then
                cleanup_rc=1
              fi
              if ! sudo -n rm -f -- "${delegate_drop_in}"; then
                cleanup_rc=1
              fi
              if sudo -n test -e "${delegate_drop_in}" || \
                 sudo -n test -L "${delegate_drop_in}"; then
                cleanup_rc=1
              fi
              if ! sudo -n systemctl daemon-reload; then
                cleanup_rc=1
              fi
              if [[ "${original_user_service_active}" == "true" ]]; then
                if ! sudo -n systemctl start "${user_service}" || \
                   ! sudo -n systemctl is-active --quiet "${user_service}"; then
                  cleanup_rc=1
                fi
              fi
            fi
            if ! rm -f -- "${containers_override}"; then
              cleanup_rc=1
            fi
            if [[ -e "${containers_override}" || -L "${containers_override}" ]]; then
              cleanup_rc=1
            fi
            return "${cleanup_rc}"
          }
          cleanup_arm_cgroup_session_on_exit() {
            local exit_rc=$?
            trap - EXIT
            if [[ "${arm_cleanup_completed}" != "true" ]] && \
               ! cleanup_arm_cgroup_session; then
              exit_rc=1
            fi
            exit "${exit_rc}"
          }
          trap cleanup_arm_cgroup_session_on_exit EXIT

          if sudo -n test -e "${delegate_drop_in}" || \
             sudo -n test -L "${delegate_drop_in}"; then
            echo "ERROR: the dedicated ARM64 delegation drop-in already exists." >&2
            exit 1
          fi
          if sudo -n test -L "${delegate_directory}"; then
            echo "ERROR: the systemd user-service drop-in directory must not be a symbolic link." >&2
            exit 1
          fi
          sudo -n install -d -o root -g root -m 0755 "${delegate_directory}"
          if ! sudo -n test -d "${delegate_directory}" || \
             sudo -n test -L "${delegate_directory}"; then
            echo "ERROR: the systemd user-service drop-in directory is not a real directory." >&2
            exit 1
          fi
          delegate_drop_in_owned=true
          printf '%s\n' \
            '[Service]' \
            'Delegate=cpu io memory pids' | \
            sudo -n tee "${delegate_drop_in}" >/dev/null
          sudo -n chown root:root "${delegate_drop_in}"
          sudo -n chmod 0644 "${delegate_drop_in}"
          if ! sudo -n test -f "${delegate_drop_in}" || \
             sudo -n test -L "${delegate_drop_in}" || \
             [[ "$(sudo -n stat -c '%u:%g:%a' "${delegate_drop_in}")" != "0:0:644" ]]; then
            echo "ERROR: the dedicated ARM64 delegation drop-in is not an exact root-owned file." >&2
            exit 1
          fi
          sudo -n systemctl daemon-reload
          sudo -n systemctl stop "${user_service}" || true

          umask 077
          printf '%s\n' \
            '[engine]' \
            'cgroup_manager="systemd"' \
            'runtime="runc"' \
            '[engine.runtimes]' \
            'runc = ["/usr/local/bin/runc"]' > "${containers_override}"
          if [[ ! -f "${containers_override}" || -L "${containers_override}" || \
                "$(stat -c '%u' "${containers_override}")" != "${user_id}" || \
                "$(stat -c '%a' "${containers_override}")" != "600" ]]; then
            echo "ERROR: the isolated Podman override is not a private runner-owned file." >&2
            exit 1
          fi

          unit_name="syswarden-arm64-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          sudo -n systemd-run \
            --machine="${user_name}@" \
            --user \
            --unit="${unit_name}" \
            --quiet \
            --wait \
            --collect \
            --pipe \
            --working-directory="${GITHUB_WORKSPACE}" \
            --property='Type=exec' \
            --property='Delegate=cpu io memory pids' \
            --property='UMask=0077' \
            --setenv="CONTAINERS_CONF_OVERRIDE=${containers_override}" \
            --setenv="DBUS_SESSION_BUS_ADDRESS=unix:path=${runtime_dir}/bus" \
            --setenv="HOME=${HOME}" \
            --setenv='PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' \
            --setenv='PYTHONDONTWRITEBYTECODE=1' \
            --setenv="RUNNER_TEMP=${RUNNER_TEMP}" \
            --setenv="XDG_RUNTIME_DIR=${runtime_dir}" \
            /usr/bin/bash --noprofile --norc -e -o pipefail -c \
            'runtime_path="$(/usr/local/bin/podman info --format "{{.Host.OCIRuntime.Path}}")"; test "${runtime_path}" = "/usr/local/bin/runc"; exec "$@"' \
            syswarden-arm64-lifecycle \
            /usr/bin/python3 "${GITHUB_WORKSPACE}/scripts/ci/package_lifecycle_lab.py" \
            --packages-dir "${ARM_CANDIDATE_PACKAGES_DIR}" \
            --previous-packages-dir "${ARM_PREVIOUS_PACKAGES_DIR}" \
            --podman /usr/local/bin/podman \
            --architecture-shard arm64 \
            --qualification-repository "${GITHUB_REPOSITORY}" \
            --qualification-release-sha "${RELEASE_SHA}" \
            --qualification-release-tag "${RELEASE_TAG}" \
            --qualification-previous-tag "${PREVIOUS_TAG}" \
            --qualification-workflow-run-id "${GITHUB_RUN_ID}" \
            --qualification-workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --qualification-candidate-run-id "${CANDIDATE_RUN_ID}" \
            --qualification-candidate-artifact-id "${CANDIDATE_ARTIFACT_ID}" \
            --qualification-candidate-artifact-name "${CANDIDATE_ARTIFACT_NAME}" \
            --qualification-previous-release-id "${PREVIOUS_RELEASE_ID}" \
            --pull-policy always \
            --output "${ARM_EVIDENCE_DIR}/package-lifecycle-arm64.json" \
            --pretty
          shard_rc=$?
          set -e
          cleanup_rc=0
          if ! cleanup_arm_cgroup_session; then
            cleanup_rc=1
          fi
          arm_cleanup_completed=true
          trap - EXIT
          if [[ "${cleanup_rc}" -ne 0 ]]; then
            echo "ERROR: ARM64 delegated session cleanup or restoration failed." >&2
            if [[ "${shard_rc}" -eq 0 ]]; then
              shard_rc=1
            fi
          fi
          printf '%s\n' "${shard_rc}" > \
            "${ARM_EVIDENCE_DIR}/package-lifecycle-arm64.rc"
          chmod 0600 "${ARM_EVIDENCE_DIR}/package-lifecycle-arm64.rc"

      - name: Seal Native ARM64 Package Lifecycle Shard
        id: seal
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          umask 077
          report="${ARM_EVIDENCE_DIR}/package-lifecycle-arm64.json"
          status="${ARM_EVIDENCE_DIR}/package-lifecycle-arm64.rc"
          for path in "${report}" "${status}"; do
            test -s "${path}"
            test -f "${path}"
            test ! -L "${path}"
          done
          report_sha256="$(sha256sum "${report}")"
          report_sha256="${report_sha256%% *}"
          [[ "${report_sha256}" =~ ^[0-9a-f]{64}$ ]]
          (
            cd "${ARM_EVIDENCE_DIR}"
            sha256sum \
              package-lifecycle-arm64.json \
              package-lifecycle-arm64.rc > SHA256SUMS.txt
            sha256sum --check --strict SHA256SUMS.txt
          )
          artifact_name="syswarden-package-lifecycle-arm64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RELEASE_SHA}"
          {
            printf 'artifact_name=%s\n' "${artifact_name}"
            printf 'report_sha256=%s\n' "${report_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload Native ARM64 Package Lifecycle Shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.seal.outputs.artifact_name }}
          path: ${{ steps.arm_workspace.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Enforce Native ARM64 Package Lifecycle Verdict
        shell: bash
        run: |
          set -euo pipefail
          report="${ARM_EVIDENCE_DIR}/package-lifecycle-arm64.json"
          status="${ARM_EVIDENCE_DIR}/package-lifecycle-arm64.rc"
          test -s "${report}"
          test -f "${report}"
          test ! -L "${report}"
          test -s "${status}"
          test -f "${status}"
          test ! -L "${status}"
          shard_rc="$(cat "${status}")"
          if [[ ! "${shard_rc}" =~ ^[0-9]+$ || "${shard_rc}" != "0" ]]; then
            echo "ERROR: the native ARM64 package lifecycle command failed with rc=${shard_rc}." >&2
            exit 1
          fi
          if ! jq -e '
            type == "object" and
            .status == "pass" and
            .harness_complete == true and
            .release_ready == true and
            (.blocker_ids | type == "array" and length == 0) and
            (.unexpected_failed_checks | type == "array" and length == 0) and
            (has("error") | not)
          ' "${report}" >/dev/null; then
            echo "ERROR: the native ARM64 package lifecycle report is not release-ready." >&2
            exit 1
          fi

  qualify-release:
    name: Qualify Exact Pre-Tag Commit
    needs: package-lifecycle-arm64
    outputs:
      candidate_artifact_id: ${{ steps.candidate.outputs.artifact_id }}
      candidate_artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
      previous_release_id: ${{ steps.previous.outputs.release_id }}
      signed_update_required: ${{ steps.update_contract.outputs.required }}
      unsigned_artifact_name: ${{ steps.inventory.outputs.artifact_name }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - ${{ 'syswarden-release-lab' }}
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read

    steps:
      - name: Validate Dedicated Ephemeral Qualification Runner
        shell: bash
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_ARCH_CONTEXT: ${{ runner.arch }}
          RUNNER_NAME_CONTEXT: ${{ runner.name }}
          RUNNER_OS_CONTEXT: ${{ runner.os }}
        run: |
          set -euo pipefail
          command -v id >/dev/null
          command -v jq >/dev/null
          command -v realpath >/dev/null
          command -v stat >/dev/null
          if [[ -z "${REPOSITORY_OWNER}" || \
                "${EVENT_ACTOR}" != "${REPOSITORY_OWNER}" || \
                "${EVENT_TRIGGERING_ACTOR}" != "${REPOSITORY_OWNER}" || \
                "${RUN_ATTEMPT}" != "1" || \
                ! "${RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: qualification must be dispatched once by the repository owner." >&2
            exit 1
          fi

          expected_runner_name="syswarden-release-lab-${RUN_ID}-a${RUN_ATTEMPT}"
          if [[ "${RUNNER_NAME_CONTEXT}" != "${expected_runner_name}" || \
                "${RUNNER_OS_CONTEXT}" != "Linux" || \
                "${RUNNER_ARCH_CONTEXT}" != "X64" ]]; then
            echo "ERROR: qualification requires the exact run-bound Linux X64 ephemeral runner." >&2
            exit 1
          fi
          if [[ -z "${RUNNER_TEMP:-}" || "${RUNNER_TEMP}" != /* || \
                "${RUNNER_TEMP%/}" != */_work/_temp ]]; then
            echo "ERROR: runner temporary storage is not an exact private runner work path." >&2
            exit 1
          fi
          runner_temp="${RUNNER_TEMP%/}"
          if [[ "$(realpath -e "${runner_temp}")" != "${runner_temp}" ]]; then
            echo "ERROR: runner temporary storage must not traverse aliases or symbolic links." >&2
            exit 1
          fi
          runner_work="${runner_temp%/_temp}"
          runner_root="${runner_work%/_work}"
          if [[ -z "${runner_root}" || "${runner_root}" == "${runner_work}" || \
                "${runner_work}" == "${runner_temp}" ]]; then
            echo "ERROR: runner root could not be derived from RUNNER_TEMP." >&2
            exit 1
          fi
          current_uid="$(id -u)"
          for directory in "${runner_root}" "${runner_work}" "${runner_temp}"; do
            if [[ ! -d "${directory}" || -L "${directory}" || \
                  "$(stat -c '%u' "${directory}")" != "${current_uid}" || \
                  "$(stat -c '%a' "${directory}")" != "700" ]]; then
              echo "ERROR: runner directories must be private real directories owned by the runner account." >&2
              exit 1
            fi
          done
          for identity_file in .runner .credentials .credentials_rsaparams; do
            identity_path="${runner_root}/${identity_file}"
            if [[ ! -f "${identity_path}" || -L "${identity_path}" || \
                  "$(stat -c '%u' "${identity_path}")" != "${current_uid}" || \
                  "$(stat -c '%a' "${identity_path}")" != "600" ]]; then
              echo "ERROR: runner identity files must be private regular files owned by the runner account." >&2
              exit 1
            fi
          done
          runner_config="${runner_root}/.runner"
          if ! jq -e \
            --arg expected_name "${expected_runner_name}" \
            --arg expected_url "https://github.com/${GITHUB_REPOSITORY}" '
              def has_exact_key($canonical):
                ([keys_unsorted[] |
                  select(ascii_downcase == ($canonical | ascii_downcase))]
                ) as $matching_keys |
                ($matching_keys | length) == 1 and
                $matching_keys[0] == $canonical;
              type == "object" and
              has_exact_key("agentId") and
              has_exact_key("agentName") and
              has_exact_key("disableUpdate") and
              has_exact_key("ephemeral") and
              has_exact_key("gitHubUrl") and
              has_exact_key("workFolder") and
              has_exact_key("poolName") and
              .agentName == $expected_name and
              .disableUpdate == true and
              .ephemeral == true and
              .gitHubUrl == $expected_url and
              .workFolder == "_work" and
              .poolName == "Default" and
              (.agentId | type == "number" and . > 0 and floor == .)
            ' "${runner_config}" >/dev/null; then
            echo "ERROR: runner identity is not the exact ephemeral qualification configuration." >&2
            exit 1
          fi

      - name: Checkout Exact Candidate Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Set Up Go for Version Validation
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Validate Manual Main Pre-Tag Context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "workflow_dispatch" || \
                "${EVENT_REF_TYPE}" != "branch" || \
                "${EVENT_REF_NAME}" != "main" || \
                "${EVENT_REF}" != "refs/heads/main" || \
                "${EVENT_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "ERROR: qualification must be manually dispatched at the exact main candidate SHA." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: release_sha must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]{2}\.[0-9]+$ || \
                ! "${PREVIOUS_TAG}" =~ ^v[0-9]+\.[0-9]{2}\.[0-9]+$ || \
                "${RELEASE_TAG}" == "${PREVIOUS_TAG}" ]]; then
            echo "ERROR: release_tag and previous_tag must be distinct canonical versions." >&2
            exit 1
          fi
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${RELEASE_SHA}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          source_tag="$(./scripts/versioning.sh inspect --repo "${GITHUB_WORKSPACE}")"
          if [[ "${source_tag}" != "${RELEASE_TAG}" ]]; then
            echo "ERROR: source version ${source_tag} does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          commit_message="$(git log -1 --format=%B HEAD)"
          ./scripts/versioning.sh validate-commit \
            --repo "${GITHUB_WORKSPACE}" \
            --base-ref HEAD^ \
            --commit-message "${commit_message}"

          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "ERROR: candidate tag ${RELEASE_TAG} already exists locally." >&2
            exit 1
          fi
          remote_error="${RUNNER_TEMP%/}/syswarden-release-tag-query.err"
          set +e
          remote_tag="$(git ls-remote --exit-code --refs origin \
            "refs/tags/${RELEASE_TAG}" 2> "${remote_error}")"
          remote_rc=$?
          set -e
          if [[ "${remote_rc}" -eq 0 && -n "${remote_tag}" ]]; then
            echo "ERROR: candidate tag ${RELEASE_TAG} already exists remotely." >&2
            exit 1
          fi
          if [[ "${remote_rc}" -ne 2 || -n "${remote_tag}" ]]; then
            echo "ERROR: remote candidate-tag absence could not be proven." >&2
            sed -n '1,20p' "${remote_error}" >&2
            exit 1
          fi
          rm -f "${remote_error}"

          previous_sha="$(git rev-parse --verify "refs/tags/${PREVIOUS_TAG}^{commit}")"
          git merge-base --is-ancestor "${previous_sha}" "${RELEASE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Qualify Optional RHEL Image Extension Offline Contract
        shell: bash
        run: |
          set -euo pipefail
          command -v unshare >/dev/null
          bash -n \
            extensions/rhel-image/stage-syswarden-rhel-image.sh \
            extensions/rhel-image/tests/test-stage.sh
          extensions/rhel-image/tests/test-stage.sh

      - name: Create Isolated Qualification Workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          required_tools=(
            diff
            find
            git
            go
            grep
            jq
            mktemp
            podman
            python3
            sed
            sha256sum
            stat
          )
          for tool in "${required_tools[@]}"; do
            command -v "${tool}" >/dev/null || {
              echo "ERROR: dedicated qualification runner is missing ${tool}." >&2
              exit 1
            }
          done
          test -n "${RUNNER_TEMP:-}"
          test -d "${RUNNER_TEMP}"
          test ! -L "${RUNNER_TEMP}"
          qualification_root="$(mktemp -d \
            "${RUNNER_TEMP%/}/syswarden-release-qualification.XXXXXX")"
          test -d "${qualification_root}"
          test ! -L "${qualification_root}"
          [[ -O "${qualification_root}" ]]
          test "$(stat -c '%a' "${qualification_root}")" = "700"
          artifact_root="${qualification_root}/artifact"
          candidate_packages="${artifact_root}/packages/candidate"
          previous_packages="${artifact_root}/packages/previous"
          raw_dir="${artifact_root}/raw"
          bound_dir="${artifact_root}/bound"
          aggregate_dir="${artifact_root}/aggregate"
          status_dir="${qualification_root}/status-internal"
          nftables_tmp_dir="${qualification_root}/nftables-tmp"
          transition_dir="${qualification_root}/historical-transition"
          install -d -m 0700 \
            "${artifact_root}" \
            "${candidate_packages}" \
            "${previous_packages}" \
            "${raw_dir}" \
            "${bound_dir}" \
            "${aggregate_dir}" \
            "${artifact_root}/status" \
            "${status_dir}" \
            "${nftables_tmp_dir}" \
            "${transition_dir}"
          test -d "${nftables_tmp_dir}"
          test ! -L "${nftables_tmp_dir}"
          [[ -O "${nftables_tmp_dir}" ]]
          test "$(stat -c '%a' "${nftables_tmp_dir}")" = "700"
          nftables_tmp_probe="$(mktemp \
            "${nftables_tmp_dir}/.write-probe.XXXXXX")"
          test -f "${nftables_tmp_probe}"
          test ! -L "${nftables_tmp_probe}"
          rm -f -- "${nftables_tmp_probe}"
          test ! -e "${nftables_tmp_probe}"

          {
            printf 'QUALIFICATION_ROOT=%s\n' "${qualification_root}"
            printf 'ARTIFACT_ROOT=%s\n' "${artifact_root}"
            printf 'CANDIDATE_PACKAGES_DIR=%s\n' "${candidate_packages}"
            printf 'PREVIOUS_PACKAGES_DIR=%s\n' "${previous_packages}"
            printf 'RAW_DIR=%s\n' "${raw_dir}"
            printf 'BOUND_DIR=%s\n' "${bound_dir}"
            printf 'AGGREGATE_DIR=%s\n' "${aggregate_dir}"
            printf 'STATUS_DIR=%s\n' "${status_dir}"
            printf 'NFTABLES_TMP_DIR=%s\n' "${nftables_tmp_dir}"
            printf 'TRANSITION_DIR=%s\n' "${transition_dir}"
          } >> "${GITHUB_ENV}"
          {
            printf 'qualification_root=%s\n' "${qualification_root}"
            printf 'artifact_root=%s\n' "${artifact_root}"
            printf 'candidate_packages_dir=%s\n' "${candidate_packages}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download Exact Native ARM64 Lifecycle Shard
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package-lifecycle-arm64.outputs.artifact_name }}
          path: ${{ steps.workspace.outputs.qualification_root }}/arm64-shard

      - name: Resolve Unique Successful Main Package Artifact
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          runs_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/package.yml/runs" \
            -f event=push \
            -f head_sha="${RELEASE_SHA}" \
            -f per_page=100)"
          matches="$(jq --arg sha "${RELEASE_SHA}" '[
            .[] | .workflow_runs[]? |
            select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push"
            )
          ]' <<< "${runs_json}")"
          if [[ "$(jq 'length' <<< "${matches}")" != "1" ]]; then
            echo "ERROR: expected exactly one package.yml main push run for ${RELEASE_SHA}." >&2
            exit 1
          fi
          run_id="$(jq -r '.[0].id' <<< "${matches}")"
          run_status="$(jq -r '.[0].status' <<< "${matches}")"
          run_conclusion="$(jq -r '.[0].conclusion // ""' <<< "${matches}")"
          if [[ ! "${run_id}" =~ ^[0-9]+$ || \
                "${run_status}" != "completed" || \
                "${run_conclusion}" != "success" ]]; then
            echo "ERROR: the unique package.yml main run is not a completed success." >&2
            exit 1
          fi

          artifact_name="syswarden-packages-${version}"
          artifacts_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            -f per_page=100)"
          artifact_matches="$(jq --arg name "${artifact_name}" '[
            .[] | .artifacts[]? | select(.name == $name)
          ]' <<< "${artifacts_json}")"
          if [[ "$(jq 'length' <<< "${artifact_matches}")" != "1" ]]; then
            echo "ERROR: the exact package artifact is absent or ambiguous." >&2
            exit 1
          fi
          artifact_id="$(jq -r '.[0].id' <<< "${artifact_matches}")"
          expired="$(jq -r '.[0].expired' <<< "${artifact_matches}")"
          size="$(jq -r '.[0].size_in_bytes' <<< "${artifact_matches}")"
          if [[ ! "${artifact_id}" =~ ^[0-9]+$ || \
                "${expired}" != "false" || \
                ! "${size}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: the exact package artifact is expired, empty, or malformed." >&2
            exit 1
          fi
          {
            printf 'run_id=%s\n' "${run_id}"
            printf 'artifact_id=%s\n' "${artifact_id}"
            printf 'artifact_name=%s\n' "${artifact_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download Exact Candidate Package Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: ${{ steps.workspace.outputs.candidate_packages_dir }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}

      - name: Verify Exact Candidate Package Inventory
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            verify-packages \
            --tag "${RELEASE_TAG}" \
            --packages "${CANDIDATE_PACKAGES_DIR}"

      - name: Resolve Signed Update Contract
        id: update_contract
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          required="$(PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            requires-signed-update --tag "${RELEASE_TAG}")"
          if [[ "${required}" != "true" && "${required}" != "false" ]]; then
            echo "ERROR: signed update contract returned invalid state ${required}." >&2
            exit 1
          fi
          echo "required=${required}" >> "${GITHUB_OUTPUT}"

      - name: Download Latest Public Previous Packages by Asset ID
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          set -euo pipefail
          umask 077
          previous_version="${PREVIOUS_TAG#v}"
          release_json="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/releases/latest")"
          release_id="$(jq -r '.id' <<< "${release_json}")"
          if [[ "$(jq -r '.tag_name' <<< "${release_json}")" != "${PREVIOUS_TAG}" || \
                "$(jq -r '.draft' <<< "${release_json}")" != "false" || \
                "$(jq -r '.prerelease' <<< "${release_json}")" != "false" || \
                "$(jq -r '.published_at // ""' <<< "${release_json}")" == "" || \
                ! "${release_id}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: previous_tag must be the latest non-draft, non-prerelease public release." >&2
            exit 1
          fi
          assets_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            -f per_page=100)"
          transition_required=false
          transition_metadata="${TRANSITION_DIR}/public-release-assets.json"
          transition_source_manifest="${TRANSITION_DIR}/public-SHA256SUMS.txt"
          transition_provenance="${TRANSITION_DIR}/v4.02.8-linux-transition.json"
          if [[ "${PREVIOUS_TAG}" == "v4.02.8" ]]; then
            transition_required=true
            jq -cS '[.[] | .[] | {digest, id, name, size, state}]' \
              <<< "${assets_json}" > "${transition_metadata}"
            chmod 0600 "${transition_metadata}"
          fi

          expected_assets=(
            "syswarden_${previous_version}_amd64.deb"
            "syswarden_${previous_version}_arm64.deb"
            "syswarden-${previous_version}-1.x86_64.rpm"
            "syswarden-${previous_version}-1.aarch64.rpm"
            "syswarden_${previous_version}_x86_64.apk"
            "syswarden_${previous_version}_aarch64.apk"
            "SHA256SUMS.txt"
          )
          asset_records='[]'
          for asset_name in "${expected_assets[@]}"; do
            matches="$(jq --arg name "${asset_name}" '[
              .[] | .[] | select(.name == $name)
            ]' <<< "${assets_json}")"
            if [[ "$(jq 'length' <<< "${matches}")" != "1" ]]; then
              echo "ERROR: previous release asset ${asset_name} is absent or ambiguous." >&2
              exit 1
            fi
            asset_id="$(jq -r '.[0].id' <<< "${matches}")"
            asset_state="$(jq -r '.[0].state' <<< "${matches}")"
            asset_size="$(jq -r '.[0].size' <<< "${matches}")"
            if [[ ! "${asset_id}" =~ ^[0-9]+$ || \
                  "${asset_state}" != "uploaded" || \
                  ! "${asset_size}" =~ ^[1-9][0-9]*$ ]]; then
              echo "ERROR: previous release asset ${asset_name} is not a non-empty uploaded asset." >&2
              exit 1
            fi
            destination="${PREVIOUS_PACKAGES_DIR}/${asset_name}"
            if [[ "${transition_required}" == "true" && \
                  "${asset_name}" == "SHA256SUMS.txt" ]]; then
              destination="${transition_source_manifest}"
            fi
            gh api --method GET \
              -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "${destination}"
            test -s "${destination}"
            test -f "${destination}"
            test ! -L "${destination}"
            chmod 0600 "${destination}"
            asset_records="$(jq \
              --arg name "${asset_name}" \
              --argjson id "${asset_id}" \
              '. + [{name: $name, id: $id}]' \
              <<< "${asset_records}")"
          done
          printf 'release_id=%s\n' "${release_id}" >> "${GITHUB_OUTPUT}"
          printf 'asset_ids=%s\n' "$(jq -c -S . <<< "${asset_records}")" \
            >> "${GITHUB_OUTPUT}"

          if [[ "${transition_required}" == "true" ]]; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
              normalize-v4028-linux-packages \
              --repository "${GITHUB_REPOSITORY}" \
              --release-id "${release_id}" \
              --tag "${PREVIOUS_TAG}" \
              --source-manifest "${transition_source_manifest}" \
              --asset-metadata "${transition_metadata}" \
              --packages "${PREVIOUS_PACKAGES_DIR}" \
              --output-manifest "${PREVIOUS_PACKAGES_DIR}/SHA256SUMS.txt" \
              --provenance-output "${transition_provenance}"
            cat "${transition_provenance}"
            sha256sum "${transition_provenance}"
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            verify-packages \
            --tag "${PREVIOUS_TAG}" \
            --packages "${PREVIOUS_PACKAGES_DIR}"

      - name: Record Qualification Provenance Context
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          PREVIOUS_ASSET_IDS: ${{ steps.previous.outputs.asset_ids }}
          PREVIOUS_RELEASE_ID: ${{ steps.previous.outputs.release_id }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          jq -n -S \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg previous_tag "${PREVIOUS_TAG}" \
            --argjson candidate_run_id "${CANDIDATE_RUN_ID}" \
            --argjson candidate_artifact_id "${CANDIDATE_ARTIFACT_ID}" \
            --arg candidate_artifact_name "${CANDIDATE_ARTIFACT_NAME}" \
            --argjson previous_release_id "${PREVIOUS_RELEASE_ID}" \
            --argjson previous_asset_ids "${PREVIOUS_ASSET_IDS}" \
            '{
              schema_version: 1,
              repository: $repository,
              release_tag: $release_tag,
              release_sha: $release_sha,
              previous_tag: $previous_tag,
              candidate_package_workflow: "package.yml",
              candidate_package_run_id: $candidate_run_id,
              candidate_package_artifact_id: $candidate_artifact_id,
              candidate_package_artifact_name: $candidate_artifact_name,
              previous_release_id: $previous_release_id,
              previous_package_asset_ids: $previous_asset_ids
            }' > "${ARTIFACT_ROOT}/qualification-context.json"
          chmod 0600 "${ARTIFACT_ROOT}/qualification-context.json"

      - name: Verify and Aggregate Native Package Lifecycle Shards
        shell: bash
        env:
          ARM_ARTIFACT_NAME: ${{ needs.package-lifecycle-arm64.outputs.artifact_name }}
          ARM_CANDIDATE_ARTIFACT_ID: ${{ needs.package-lifecycle-arm64.outputs.candidate_artifact_id }}
          ARM_CANDIDATE_ARTIFACT_NAME: ${{ needs.package-lifecycle-arm64.outputs.candidate_artifact_name }}
          ARM_CANDIDATE_RUN_ID: ${{ needs.package-lifecycle-arm64.outputs.candidate_run_id }}
          ARM_PREVIOUS_RELEASE_ID: ${{ needs.package-lifecycle-arm64.outputs.previous_release_id }}
          ARM_REPORT_SHA256: ${{ needs.package-lifecycle-arm64.outputs.report_sha256 }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          PREVIOUS_RELEASE_ID: ${{ steps.previous.outputs.release_id }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          arm_dir="${QUALIFICATION_ROOT}/arm64-shard"
          expected_arm_artifact="syswarden-package-lifecycle-arm64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RELEASE_SHA}"
          if [[ "${ARM_ARTIFACT_NAME}" != "${expected_arm_artifact}" || \
                "${ARM_CANDIDATE_RUN_ID}" != "${CANDIDATE_RUN_ID}" || \
                "${ARM_CANDIDATE_ARTIFACT_ID}" != "${CANDIDATE_ARTIFACT_ID}" || \
                "${ARM_CANDIDATE_ARTIFACT_NAME}" != "${CANDIDATE_ARTIFACT_NAME}" || \
                "${ARM_PREVIOUS_RELEASE_ID}" != "${PREVIOUS_RELEASE_ID}" || \
                ! "${ARM_REPORT_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: native ARM64 shard provenance differs from the exact qualification inputs." >&2
            exit 1
          fi
          mapfile -t arm_files < <(
            find -P "${arm_dir}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
              LC_ALL=C sort
          )
          expected_arm_files=(
            SHA256SUMS.txt
            package-lifecycle-arm64.json
            package-lifecycle-arm64.rc
          )
          if [[ "${arm_files[*]}" != "${expected_arm_files[*]}" ]]; then
            echo "ERROR: native ARM64 shard inventory is not exact." >&2
            exit 1
          fi
          while IFS= read -r -d '' entry; do
            test -f "${entry}"
            test ! -L "${entry}"
          done < <(find -P "${arm_dir}" -mindepth 1 -maxdepth 1 -print0)
          (
            cd "${arm_dir}"
            sha256sum --check --strict SHA256SUMS.txt
          )
          actual_arm_sha256="$(sha256sum \
            "${arm_dir}/package-lifecycle-arm64.json")"
          actual_arm_sha256="${actual_arm_sha256%% *}"
          test "${actual_arm_sha256}" = "${ARM_REPORT_SHA256}"
          arm_rc="$(cat "${arm_dir}/package-lifecycle-arm64.rc")"
          [[ "${arm_rc}" =~ ^[0-9]+$ ]]
          install -m 0600 \
            "${arm_dir}/package-lifecycle-arm64.json" \
            "${RAW_DIR}/package-lifecycle-arm64.json"

          common_binding_arguments=(
            --qualification-repository "${GITHUB_REPOSITORY}"
            --qualification-release-sha "${RELEASE_SHA}"
            --qualification-release-tag "${RELEASE_TAG}"
            --qualification-previous-tag "${PREVIOUS_TAG}"
            --qualification-workflow-run-id "${GITHUB_RUN_ID}"
            --qualification-workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"
            --qualification-candidate-run-id "${CANDIDATE_RUN_ID}"
            --qualification-candidate-artifact-id "${CANDIDATE_ARTIFACT_ID}"
            --qualification-candidate-artifact-name "${CANDIDATE_ARTIFACT_NAME}"
            --qualification-previous-release-id "${PREVIOUS_RELEASE_ID}"
          )
          set +e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/package_lifecycle_lab.py \
            --packages-dir "${CANDIDATE_PACKAGES_DIR}" \
            --previous-packages-dir "${PREVIOUS_PACKAGES_DIR}" \
            --architecture-shard amd64 \
            "${common_binding_arguments[@]}" \
            --pull-policy never \
            --output "${RAW_DIR}/package-lifecycle-amd64.json" \
            --pretty
          amd64_rc=$?
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/package_lifecycle_lab.py \
            --packages-dir "${CANDIDATE_PACKAGES_DIR}" \
            --previous-packages-dir "${PREVIOUS_PACKAGES_DIR}" \
            --aggregate-amd64-report "${RAW_DIR}/package-lifecycle-amd64.json" \
            --aggregate-arm64-report "${RAW_DIR}/package-lifecycle-arm64.json" \
            "${common_binding_arguments[@]}" \
            --output "${RAW_DIR}/package-lifecycle-raw.json" \
            --pretty
          aggregate_rc=$?
          set -e
          if [[ "${aggregate_rc}" -eq 0 && "${amd64_rc}" -ne 0 ]] || \
             [[ "${aggregate_rc}" -eq 0 && "${arm_rc}" -ne 0 ]]; then
            echo "ERROR: a native shard returned nonzero while the aggregate claimed success." >&2
            aggregate_rc=97
          fi
          printf '%s\n' "${amd64_rc}" > "${STATUS_DIR}/package-lab-amd64.rc"
          printf '%s\n' "${arm_rc}" > "${STATUS_DIR}/package-lab-arm64.rc"
          printf '%s\n' "${aggregate_rc}" > "${STATUS_DIR}/package-lab.rc"
          chmod 0600 \
            "${STATUS_DIR}/package-lab-amd64.rc" \
            "${STATUS_DIR}/package-lab-arm64.rc" \
            "${STATUS_DIR}/package-lab.rc"

      - name: Run Isolated nftables Kernel Laboratory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${NFTABLES_TMP_DIR:-}"
          test "${NFTABLES_TMP_DIR}" = "${QUALIFICATION_ROOT}/nftables-tmp"
          test -d "${QUALIFICATION_ROOT}"
          test ! -L "${QUALIFICATION_ROOT}"
          [[ -O "${QUALIFICATION_ROOT}" ]]
          test "$(stat -c '%a' "${QUALIFICATION_ROOT}")" = "700"
          test -d "${NFTABLES_TMP_DIR}"
          test ! -L "${NFTABLES_TMP_DIR}"
          [[ -O "${NFTABLES_TMP_DIR}" ]]
          test "$(stat -c '%a' "${NFTABLES_TMP_DIR}")" = "700"
          nftables_tmp_probe="$(mktemp \
            "${NFTABLES_TMP_DIR}/.write-probe.XXXXXX")"
          test -f "${nftables_tmp_probe}"
          test ! -L "${nftables_tmp_probe}"
          rm -f -- "${nftables_tmp_probe}"
          test ! -e "${nftables_tmp_probe}"
          set +e
          TMPDIR="${NFTABLES_TMP_DIR}" \
          GOTMPDIR="${NFTABLES_TMP_DIR}" \
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/nftables_kernel_lab.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --pull-policy never \
            --output "${RAW_DIR}/nftables-raw.json"
          laboratory_rc=$?
          set -e
          printf '%s\n' "${laboratory_rc}" > "${STATUS_DIR}/nftables-lab.rc"
          chmod 0600 "${STATUS_DIR}/nftables-lab.rc"

      - name: Build and Verify Bound Laboratory Envelopes
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          PREVIOUS_RELEASE_ID: ${{ steps.previous.outputs.release_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          common_arguments=(
            --repo-root "${GITHUB_WORKSPACE}"
            --expected-sha "${RELEASE_SHA}"
            --expected-version "${RELEASE_TAG}"
            --candidate-packages-dir "${CANDIDATE_PACKAGES_DIR}"
            --previous-packages-dir "${PREVIOUS_PACKAGES_DIR}"
            --nft-raw "${RAW_DIR}/nftables-raw.json"
            --package-raw "${RAW_DIR}/package-lifecycle-raw.json"
            --package-amd64-shard "${RAW_DIR}/package-lifecycle-amd64.json"
            --package-arm64-shard "${RAW_DIR}/package-lifecycle-arm64.json"
            --expected-repository "${GITHUB_REPOSITORY}"
            --expected-workflow-run-id "${GITHUB_RUN_ID}"
            --expected-workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"
            --expected-candidate-run-id "${CANDIDATE_RUN_ID}"
            --expected-candidate-artifact-id "${CANDIDATE_ARTIFACT_ID}"
            --expected-candidate-artifact-name "${CANDIDATE_ARTIFACT_NAME}"
            --expected-previous-release-id "${PREVIOUS_RELEASE_ID}"
            --max-age-seconds 172800
            --max-report-skew-seconds 0
          )
          set +e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_adapter.py \
            build "${common_arguments[@]}" \
            --nft-output "${BOUND_DIR}/nftables-bound.json" \
            --package-output "${BOUND_DIR}/package-lifecycle-bound.json"
          build_rc=$?
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_adapter.py \
            verify "${common_arguments[@]}" \
            --nft-envelope "${BOUND_DIR}/nftables-bound.json" \
            --package-envelope "${BOUND_DIR}/package-lifecycle-bound.json"
          verify_rc=$?
          set -e
          printf '%s\n' "${build_rc}" > "${STATUS_DIR}/adapter-build.rc"
          printf '%s\n' "${verify_rc}" > "${STATUS_DIR}/adapter-verify.rc"
          chmod 0600 "${STATUS_DIR}/adapter-build.rc" "${STATUS_DIR}/adapter-verify.rc"

      - name: Generate and Recompute Release Qualification Gate
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          common_arguments=(
            --repo-root "${GITHUB_WORKSPACE}"
            --expected-sha "${RELEASE_SHA}"
            --expected-version "${RELEASE_TAG}"
            --candidate-packages-dir "${CANDIDATE_PACKAGES_DIR}"
            --nft-report "${BOUND_DIR}/nftables-bound.json"
            --package-report "${BOUND_DIR}/package-lifecycle-bound.json"
            --max-age-seconds 172800
            --max-report-skew-seconds 0
          )
          set +e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_gate.py \
            generate "${common_arguments[@]}" \
            --profile release \
            --output "${AGGREGATE_DIR}/release-qualification.json"
          generate_rc=$?
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_gate.py \
            verify "${common_arguments[@]}" \
            --aggregate "${AGGREGATE_DIR}/release-qualification.json"
          verify_rc=$?
          set -e
          printf '%s\n' "${generate_rc}" > "${STATUS_DIR}/gate-generate.rc"
          printf '%s\n' "${verify_rc}" > "${STATUS_DIR}/gate-verify.rc"
          chmod 0600 "${STATUS_DIR}/gate-generate.rc" "${STATUS_DIR}/gate-verify.rc"

      - name: Seal Exact Unsigned Qualification Evidence Inventory
        id: inventory
        shell: bash
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SIGNED_UPDATE_REQUIRED: ${{ steps.update_contract.outputs.required }}
        run: |
          set -euo pipefail
          umask 077
          candidate_version="${RELEASE_TAG#v}"
          previous_version="${PREVIOUS_TAG#v}"
          read_rc() {
            local path="$1"
            local value
            value="$(cat "${path}")"
            [[ "${value}" =~ ^[0-9]+$ ]] || return 1
            printf '%s' "${value}"
          }
          if [[ "${SIGNED_UPDATE_REQUIRED}" != "true" && \
                "${SIGNED_UPDATE_REQUIRED}" != "false" ]]; then
            echo "ERROR: signed update requirement is not a canonical boolean." >&2
            exit 1
          fi
          jq -n -S \
            --argjson package_lab "$(read_rc "${STATUS_DIR}/package-lab.rc")" \
            --argjson nftables_lab "$(read_rc "${STATUS_DIR}/nftables-lab.rc")" \
            --argjson adapter_build "$(read_rc "${STATUS_DIR}/adapter-build.rc")" \
            --argjson adapter_verify "$(read_rc "${STATUS_DIR}/adapter-verify.rc")" \
            --argjson gate_generate "$(read_rc "${STATUS_DIR}/gate-generate.rc")" \
            --argjson gate_verify "$(read_rc "${STATUS_DIR}/gate-verify.rc")" \
            '{
              package_lab: $package_lab,
              nftables_lab: $nftables_lab,
              adapter_build: $adapter_build,
              adapter_verify: $adapter_verify,
              gate_generate: $gate_generate,
              gate_verify: $gate_verify
            }' > "${ARTIFACT_ROOT}/status/qualification-exit-codes.json"

          expected=(
            "aggregate/release-qualification.json"
            "bound/nftables-bound.json"
            "bound/package-lifecycle-bound.json"
            "packages/candidate/SHA256SUMS.txt"
            "packages/candidate/syswarden-${candidate_version}-1.aarch64.rpm"
            "packages/candidate/syswarden-${candidate_version}-1.x86_64.rpm"
            "packages/candidate/syswarden_${candidate_version}_aarch64.apk"
            "packages/candidate/syswarden_${candidate_version}_amd64.deb"
            "packages/candidate/syswarden_${candidate_version}_arm64.deb"
            "packages/candidate/syswarden_${candidate_version}_x86_64.apk"
            "packages/previous/SHA256SUMS.txt"
            "packages/previous/syswarden-${previous_version}-1.aarch64.rpm"
            "packages/previous/syswarden-${previous_version}-1.x86_64.rpm"
            "packages/previous/syswarden_${previous_version}_aarch64.apk"
            "packages/previous/syswarden_${previous_version}_amd64.deb"
            "packages/previous/syswarden_${previous_version}_arm64.deb"
            "packages/previous/syswarden_${previous_version}_x86_64.apk"
            "qualification-context.json"
            "raw/nftables-raw.json"
            "raw/package-lifecycle-amd64.json"
            "raw/package-lifecycle-arm64.json"
            "raw/package-lifecycle-raw.json"
            "status/qualification-exit-codes.json"
          )
          expected_directories=(
            aggregate
            bound
            packages
            packages/candidate
            packages/previous
            raw
            status
          )
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          mapfile -t actual_before_manifest < <(
            find -P "${ARTIFACT_ROOT}" -type f -printf '%P\n' | LC_ALL=C sort
          )
          if [[ "${sorted_expected[*]}" != "${actual_before_manifest[*]}" ]]; then
            echo "ERROR: qualification evidence inventory is incomplete or contains unexpected files." >&2
            diff -u \
              <(printf '%s\n' "${sorted_expected[@]}") \
              <(printf '%s\n' "${actual_before_manifest[@]}") >&2 || true
            exit 1
          fi
          mapfile -t sorted_expected_directories < <(
            printf '%s\n' "${expected_directories[@]}" | LC_ALL=C sort
          )
          mapfile -t actual_directories < <(
            find -P "${ARTIFACT_ROOT}" -mindepth 1 -type d -printf '%P\n' | LC_ALL=C sort
          )
          if [[ "${sorted_expected_directories[*]}" != "${actual_directories[*]}" ]]; then
            echo "ERROR: qualification evidence directory inventory is not exact." >&2
            exit 1
          fi
          while IFS= read -r -d '' entry; do
            if [[ (-d "${entry}" || -f "${entry}") && ! -L "${entry}" ]]; then
              continue
            fi
            echo "ERROR: qualification artifact contains an unsafe filesystem entry: ${entry}." >&2
            exit 1
          done < <(find -P "${ARTIFACT_ROOT}" -mindepth 1 -print0)
          for relative in "${sorted_expected[@]}"; do
            test -s "${ARTIFACT_ROOT}/${relative}"
            test -f "${ARTIFACT_ROOT}/${relative}"
            test ! -L "${ARTIFACT_ROOT}/${relative}"
          done
          chmod -R go-rwx "${ARTIFACT_ROOT}"
          (
            cd "${ARTIFACT_ROOT}"
            sha256sum "${sorted_expected[@]}" > EVIDENCE_SHA256SUMS.txt
            sha256sum --check --strict EVIDENCE_SHA256SUMS.txt
          )
          test "$(find -P "${ARTIFACT_ROOT}" -type f | wc -l)" \
            -eq "$(( ${#sorted_expected[@]} + 1 ))"
          artifact_name="syswarden-release-qualification-unsigned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RELEASE_SHA}"
          printf 'artifact_name=%s\n' "${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload Exact Unsigned Qualification Evidence
        id: upload
        if: ${{ always() && steps.inventory.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.inventory.outputs.artifact_name }}
          path: ${{ steps.workspace.outputs.artifact_root }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Remove Ephemeral Qualification Material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NFTABLES_TMP_DIR:-}" ]]; then
            if [[ -z "${QUALIFICATION_ROOT:-}" || \
                  "${QUALIFICATION_ROOT}" != "${RUNNER_TEMP%/}"/syswarden-release-qualification.* || \
                  "${NFTABLES_TMP_DIR}" != "${QUALIFICATION_ROOT}/nftables-tmp" ]]; then
              echo "ERROR: refusing unsafe nftables temporary-directory cleanup." >&2
              exit 1
            fi
            test -d "${QUALIFICATION_ROOT}"
            test ! -L "${QUALIFICATION_ROOT}"
            [[ -O "${QUALIFICATION_ROOT}" ]]
            test "$(stat -c '%a' "${QUALIFICATION_ROOT}")" = "700"
            test -d "${NFTABLES_TMP_DIR}"
            test ! -L "${NFTABLES_TMP_DIR}"
            [[ -O "${NFTABLES_TMP_DIR}" ]]
            test "$(stat -c '%a' "${NFTABLES_TMP_DIR}")" = "700"
            find -P "${NFTABLES_TMP_DIR}" -xdev -mindepth 1 -delete
            rmdir -- "${NFTABLES_TMP_DIR}"
            test ! -e "${NFTABLES_TMP_DIR}"
            test ! -L "${NFTABLES_TMP_DIR}"
          fi
          if [[ -n "${TRANSITION_DIR:-}" ]]; then
            if [[ -z "${QUALIFICATION_ROOT:-}" || \
                  "${QUALIFICATION_ROOT}" != "${RUNNER_TEMP%/}"/syswarden-release-qualification.* || \
                  "${TRANSITION_DIR}" != "${QUALIFICATION_ROOT}/historical-transition" ]]; then
              echo "ERROR: refusing unsafe historical-transition cleanup." >&2
              exit 1
            fi
            test -d "${TRANSITION_DIR}"
            test ! -L "${TRANSITION_DIR}"
            [[ -O "${TRANSITION_DIR}" ]]
            test "$(stat -c '%a' "${TRANSITION_DIR}")" = "700"
            find -P "${TRANSITION_DIR}" -xdev -mindepth 1 -delete
            rmdir -- "${TRANSITION_DIR}"
            test ! -e "${TRANSITION_DIR}"
            test ! -L "${TRANSITION_DIR}"
          fi

      - name: Enforce Final Release Qualification Verdict
        if: ${{ always() }}
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_RELEASE_TAG: ${{ inputs.release_tag }}
          SIGNED_UPDATE_REQUIRED: ${{ steps.update_contract.outputs.required }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          PREVIOUS_RELEASE_ID: ${{ steps.previous.outputs.release_id }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          summarize_raw_report() {
            local label="$1"
            local path="$2"
            local size
            local summary
            if [[ ! -f "${path}" || -L "${path}" ]]; then
              jq -cnS --arg label "${label}" \
                '{label: $label, parse_status: "unavailable"}'
              return
            fi
            size="$(stat -c '%s' "${path}" 2>/dev/null || true)"
            if [[ ! "${size}" =~ ^[0-9]+$ ]] || (( 10#${size} > 67108864 )); then
              jq -cnS --arg label "${label}" \
                '{label: $label, parse_status: "invalid"}'
              return
            fi
            if ! summary="$(jq -cS --arg label "${label}" '
              if type != "object" then error("report is not an object") else . end
              | . as $report
              | {
                  label: $label,
                  parse_status: "valid",
                  schema_version: (
                    if (($report.schema_version | type) == "number" and
                        ($report.schema_version | floor) == $report.schema_version and
                        $report.schema_version >= 0 and
                        $report.schema_version <= 100)
                    then $report.schema_version else null end
                  ),
                  status: (
                    if (($report.status | type) == "string" and
                        (["pass", "fail", "incomplete"] | index($report.status)) != null)
                    then $report.status else null end
                  ),
                  release_ready: (
                    if ($report.release_ready | type) == "boolean"
                    then $report.release_ready else null end
                  ),
                  blocker_count: (
                    if ($report.blocker_ids | type) == "array"
                    then ($report.blocker_ids | length) else null end
                  ),
                  error_present: (
                    ($report.error | type) == "string" and
                    ($report.error | length) > 0
                  )
                }
            ' "${path}" 2>/dev/null)"; then
              jq -cnS --arg label "${label}" \
                '{label: $label, parse_status: "invalid"}'
              return
            fi
            printf '%s\n' "${summary}"
          }

          status_files=(
            package-lab.rc
            nftables-lab.rc
            adapter-build.rc
            adapter-verify.rc
            gate-generate.rc
            gate-verify.rc
          )
          failed_statuses=()
          invalid_statuses=()
          raw_summaries=()
          summarized_raws=()
          if [[ -n "${STATUS_DIR:-}" && -d "${STATUS_DIR}" && \
                ! -L "${STATUS_DIR}" ]]; then
            for status_file in "${status_files[@]}"; do
              status_path="${STATUS_DIR}/${status_file}"
              if [[ ! -f "${status_path}" || -L "${status_path}" ]]; then
                invalid_statuses+=("${status_file}")
                continue
              fi
              status="$(cat "${status_path}")"
              if [[ ! "${status}" =~ ^(0|[1-9][0-9]{0,2})$ ]] || \
                 (( 10#${status} > 255 )); then
                invalid_statuses+=("${status_file}")
                continue
              fi
              if [[ "${status}" == "0" ]]; then
                continue
              fi
              failed_statuses+=("${status_file}=${status}")
              raw_label=""
              raw_path=""
              case "${status_file}" in
                package-lab.rc)
                  raw_label="package-lifecycle"
                  raw_path="${RAW_DIR:-}/package-lifecycle-raw.json"
                  ;;
                nftables-lab.rc)
                  raw_label="nftables"
                  raw_path="${RAW_DIR:-}/nftables-raw.json"
                  ;;
              esac
              if [[ -n "${raw_label}" && \
                    " ${summarized_raws[*]} " != *" ${raw_label} "* ]]; then
                summarized_raws+=("${raw_label}")
                raw_summaries+=("$(summarize_raw_report "${raw_label}" "${raw_path}")")
              fi
            done
          else
            invalid_statuses+=(status-directory)
          fi
          for invalid_status in "${invalid_statuses[@]}"; do
            echo "ERROR: qualification status ${invalid_status}=invalid." >&2
          done
          for failed_status in "${failed_statuses[@]}"; do
            echo "ERROR: qualification status ${failed_status}." >&2
          done
          if (( ${#raw_summaries[@]} > 0 )); then
            printf '%s\n' "${raw_summaries[@]}" | \
              jq -csS '{qualification_raw_failure_summaries: .}' >&2
          fi
          if (( ${#invalid_statuses[@]} > 0 || ${#failed_statuses[@]} > 0 )); then
            echo "ERROR: release qualification status is not uniformly zero." >&2
            exit 1
          fi
          if [[ "${INVENTORY_OUTCOME}" != "success" || \
                "${UPLOAD_OUTCOME}" != "success" ]]; then
            echo "ERROR: exact qualification evidence was not sealed and uploaded." >&2
            exit 1
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_adapter.py \
            verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-sha "${EXPECTED_RELEASE_SHA}" \
            --expected-version "${EXPECTED_RELEASE_TAG}" \
            --candidate-packages-dir "${CANDIDATE_PACKAGES_DIR}" \
            --previous-packages-dir "${PREVIOUS_PACKAGES_DIR}" \
            --nft-raw "${RAW_DIR}/nftables-raw.json" \
            --package-raw "${RAW_DIR}/package-lifecycle-raw.json" \
            --package-amd64-shard "${RAW_DIR}/package-lifecycle-amd64.json" \
            --package-arm64-shard "${RAW_DIR}/package-lifecycle-arm64.json" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-workflow-run-id "${GITHUB_RUN_ID}" \
            --expected-workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --expected-candidate-run-id "${CANDIDATE_RUN_ID}" \
            --expected-candidate-artifact-id "${CANDIDATE_ARTIFACT_ID}" \
            --expected-candidate-artifact-name "${CANDIDATE_ARTIFACT_NAME}" \
            --expected-previous-release-id "${PREVIOUS_RELEASE_ID}" \
            --max-age-seconds 172800 \
            --max-report-skew-seconds 0 \
            --nft-envelope "${BOUND_DIR}/nftables-bound.json" \
            --package-envelope "${BOUND_DIR}/package-lifecycle-bound.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_gate.py \
            verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-sha "${EXPECTED_RELEASE_SHA}" \
            --expected-version "${EXPECTED_RELEASE_TAG}" \
            --candidate-packages-dir "${CANDIDATE_PACKAGES_DIR}" \
            --nft-report "${BOUND_DIR}/nftables-bound.json" \
            --package-report "${BOUND_DIR}/package-lifecycle-bound.json" \
            --max-age-seconds 172800 \
            --max-report-skew-seconds 0 \
            --aggregate "${AGGREGATE_DIR}/release-qualification.json"
          if [[ "${SIGNED_UPDATE_REQUIRED}" != "true" && \
                "${SIGNED_UPDATE_REQUIRED}" != "false" ]]; then
            echo "ERROR: signed update requirement is not a canonical boolean." >&2
            exit 1
          fi
          jq --exit-status '
            (keys | sort) == ([
              "adapter_build",
              "adapter_verify",
              "gate_generate",
              "gate_verify",
              "nftables_lab",
              "package_lab"
            ] | sort) and all(.[]; . == 0)
          ' "${ARTIFACT_ROOT}/status/qualification-exit-codes.json"

  seal-release:
    name: Seal Qualified Evidence on GitHub Hosted Runner
    needs: qualify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: syswarden-release-qualification
    permissions:
      actions: read
      contents: read

    steps:
      - name: Validate Protected Hosted Signing Context
        shell: bash
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_ARCH_CONTEXT: ${{ runner.arch }}
          RUNNER_ENVIRONMENT_CONTEXT: ${{ runner.environment }}
          RUNNER_OS_CONTEXT: ${{ runner.os }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v jq >/dev/null
          if [[ -z "${REPOSITORY_OWNER}" || \
                "${EVENT_ACTOR}" != "${REPOSITORY_OWNER}" || \
                "${EVENT_TRIGGERING_ACTOR}" != "${REPOSITORY_OWNER}" || \
                "${RUN_ATTEMPT}" != "1" || \
                "${EVENT_NAME}" != "workflow_dispatch" || \
                "${EVENT_REF_TYPE}" != "branch" || \
                "${EVENT_REF_NAME}" != "main" || \
                "${EVENT_REF}" != "refs/heads/main" || \
                "${EVENT_SHA}" != "${RELEASE_SHA}" || \
                ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ || \
                ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]{2}\.[0-9]+$ || \
                "${RUNNER_ENVIRONMENT_CONTEXT}" != "github-hosted" || \
                "${RUNNER_OS_CONTEXT}" != "Linux" || \
                "${RUNNER_ARCH_CONTEXT}" != "X64" ]]; then
            echo "ERROR: signing requires the exact owner-dispatched main context on GitHub-hosted Linux X64." >&2
            exit 1
          fi

          environment_json="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/environments/syswarden-release-qualification")"
          required_environment_boolean() {
            local field="${1:?environment boolean field is required}"
            jq -er --arg field "${field}" '
              .deployment_branch_policy[$field] |
              if type == "boolean" then
                tostring
              else
                error("deployment_branch_policy." + $field + " must be boolean")
              end
            ' <<< "${environment_json}"
          }
          required_top_level_environment_boolean() {
            local field="${1:?environment boolean field is required}"
            jq -er --arg field "${field}" '
              .[$field] |
              if type == "boolean" then
                tostring
              else
                error($field + " must be boolean")
              end
            ' <<< "${environment_json}"
          }
          environment_name="$(jq -r '.name // ""' <<< "${environment_json}")"
          reviewer_rule_count="$(jq '[
            .protection_rules[]? | select(.type == "required_reviewers")
          ] | length' <<< "${environment_json}")"
          reviewer_entry_count="$(jq '[
            .protection_rules[]? | select(.type == "required_reviewers") |
            .reviewers[]?
          ] | length' <<< "${environment_json}")"
          owner_reviewer_count="$(jq --arg owner "${REPOSITORY_OWNER}" '[
            .protection_rules[]? | select(.type == "required_reviewers") |
            .reviewers[]? |
            select(.type == "User" and .reviewer.login == $owner)
          ] | length' <<< "${environment_json}")"
          prevent_self_review="$(jq -er '
            [
              .protection_rules[]? |
              select(.type == "required_reviewers") |
              .prevent_self_review
            ] |
            if length == 1 and .[0] == false then
              "false"
            else
              error("the reviewer rule must explicitly allow repository-owner approval")
            end
          ' <<< "${environment_json}")"
          branch_policy_rule_count="$(jq '[
            .protection_rules[]? | select(.type == "branch_policy")
          ] | length' <<< "${environment_json}")"
          protection_rule_count="$(jq '[.protection_rules[]?] | length' \
            <<< "${environment_json}")"
          protected_branches="$(required_environment_boolean \
            "protected_branches")"
          custom_branch_policies="$(required_environment_boolean \
            "custom_branch_policies")"
          can_admins_bypass="$(required_top_level_environment_boolean \
            "can_admins_bypass")"
          if [[ "${environment_name}" != "syswarden-release-qualification" || \
                "${reviewer_rule_count}" != "1" || \
                "${reviewer_entry_count}" != "1" || \
                "${owner_reviewer_count}" != "1" || \
                "${prevent_self_review}" != "false" || \
                "${branch_policy_rule_count}" != "1" || \
                "${protection_rule_count}" != "2" || \
                "${protected_branches}" != "false" || \
                "${custom_branch_policies}" != "true" || \
                "${can_admins_bypass}" != "false" ]]; then
            echo "ERROR: the signing environment must require explicit repository-owner approval, forbid administrator bypass, and have exactly one custom branch policy." >&2
            exit 1
          fi

          policies_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/environments/syswarden-release-qualification/deployment-branch-policies" \
            -f per_page=100)"
          declared_policy_count="$(jq -r '.[0].total_count' <<< "${policies_json}")"
          policy_count="$(jq '[.[] | .branch_policies[]?] | length' <<< "${policies_json}")"
          main_policy_count="$(jq '[
            .[] | .branch_policies[]? |
            select(.name == "main" and .type == "branch")
          ] | length' <<< "${policies_json}")"
          if [[ "${declared_policy_count}" != "1" || \
                "${policy_count}" != "1" || \
                "${main_policy_count}" != "1" ]]; then
            echo "ERROR: the signing environment must allow deployments from main only." >&2
            exit 1
          fi

      - name: Checkout Exact Hosted Signing Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Set Up Go for Hosted Signing
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Revalidate Exact Hosted Candidate Commit
        shell: bash
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${RELEASE_SHA}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(./scripts/versioning.sh inspect --repo "${GITHUB_WORKSPACE}")" = \
            "${RELEASE_TAG}"
          commit_message="$(git log -1 --format=%B HEAD)"
          ./scripts/versioning.sh validate-commit \
            --repo "${GITHUB_WORKSPACE}" \
            --base-ref HEAD^ \
            --commit-message "${commit_message}"
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "ERROR: hosted signing candidate tag already exists locally." >&2
            exit 1
          fi
          remote_error="${RUNNER_TEMP%/}/syswarden-hosted-release-tag-query.err"
          set +e
          remote_tag="$(git ls-remote --exit-code --refs origin \
            "refs/tags/${RELEASE_TAG}" 2> "${remote_error}")"
          remote_rc=$?
          set -e
          if [[ "${remote_rc}" -eq 0 && -n "${remote_tag}" ]]; then
            echo "ERROR: hosted signing candidate tag already exists remotely." >&2
            exit 1
          fi
          if [[ "${remote_rc}" -ne 2 || -n "${remote_tag}" ]]; then
            echo "ERROR: hosted signing could not prove candidate-tag absence." >&2
            exit 1
          fi
          rm -f -- "${remote_error}"
          previous_sha="$(git rev-parse --verify "refs/tags/${PREVIOUS_TAG}^{commit}")"
          git merge-base --is-ancestor "${previous_sha}" "${RELEASE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Create Isolated Hosted Signing Workspace
        id: signing_workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          required_tools=(
            cmp
            diff
            find
            git
            go
            gh
            jq
            mktemp
            python3
            sha256sum
            stat
          )
          for tool in "${required_tools[@]}"; do
            command -v "${tool}" >/dev/null || {
              echo "ERROR: hosted signing runner is missing ${tool}." >&2
              exit 1
            }
          done
          signing_root="$(mktemp -d \
            "${RUNNER_TEMP%/}/syswarden-hosted-signing.XXXXXX")"
          test -d "${signing_root}"
          test ! -L "${signing_root}"
          [[ -O "${signing_root}" ]]
          test "$(stat -c '%a' "${signing_root}")" = "700"
          unsigned_root="${signing_root}/unsigned-evidence"
          package_source_dir="${signing_root}/package-main-source"
          signing_tool_dir="${signing_root}/signing-tool"
          install -d -m 0700 \
            "${unsigned_root}" \
            "${package_source_dir}" \
            "${signing_tool_dir}"
          {
            printf 'HOSTED_SIGNING_ROOT=%s\n' "${signing_root}"
            printf 'UNSIGNED_EVIDENCE_ROOT=%s\n' "${unsigned_root}"
            printf 'PACKAGE_MAIN_SOURCE_DIR=%s\n' "${package_source_dir}"
            printf 'SIGNING_TOOL_DIR=%s\n' "${signing_tool_dir}"
          } >> "${GITHUB_ENV}"
          {
            printf 'unsigned_root=%s\n' "${unsigned_root}"
            printf 'package_source_dir=%s\n' "${package_source_dir}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve Exact Unsigned Qualification Artifact
        id: unsigned_artifact
        shell: bash
        env:
          EXPECTED_UNSIGNED_ARTIFACT_NAME: ${{ needs.qualify-release.outputs.unsigned_artifact_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "${RUN_ID}" =~ ^[1-9][0-9]*$ || \
                "${RUN_ATTEMPT}" != "1" || \
                ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: unsigned artifact resolution context is invalid." >&2
            exit 1
          fi
          expected_name="syswarden-release-qualification-unsigned-${RUN_ID}-${RUN_ATTEMPT}-${RELEASE_SHA}"
          if [[ "${EXPECTED_UNSIGNED_ARTIFACT_NAME}" != "${expected_name}" ]]; then
            echo "ERROR: unsigned artifact name is not bound to the exact run context." >&2
            exit 1
          fi
          artifacts_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            -f per_page=100)"
          artifact_matches="$(jq \
            --arg name "${expected_name}" \
            --arg sha "${RELEASE_SHA}" \
            --argjson run_id "${RUN_ID}" '[
              .[] | .artifacts[]? |
              select(
                .name == $name and
                .workflow_run.id == $run_id and
                .workflow_run.head_sha == $sha
              )
            ]' <<< "${artifacts_json}")"
          if [[ "$(jq 'length' <<< "${artifact_matches}")" != "1" ]]; then
            echo "ERROR: exact unsigned qualification artifact is absent or ambiguous." >&2
            exit 1
          fi
          artifact_id="$(jq -r '.[0].id' <<< "${artifact_matches}")"
          expired="$(jq -r '.[0].expired' <<< "${artifact_matches}")"
          size="$(jq -r '.[0].size_in_bytes' <<< "${artifact_matches}")"
          if [[ ! "${artifact_id}" =~ ^[1-9][0-9]*$ || \
                "${expired}" != "false" || \
                ! "${size}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: exact unsigned qualification artifact is unusable." >&2
            exit 1
          fi
          {
            printf 'artifact_id=%s\n' "${artifact_id}"
            printf 'artifact_name=%s\n' "${expected_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download Exact Unsigned Qualification Evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.unsigned_artifact.outputs.artifact_id }}
          path: ${{ steps.signing_workspace.outputs.unsigned_root }}
          merge-multiple: true

      - name: Resolve Exact Package Main Artifact for Hosted Signing
        id: hosted_candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          runs_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/package.yml/runs" \
            -f event=push \
            -f head_sha="${RELEASE_SHA}" \
            -f per_page=100)"
          matches="$(jq --arg sha "${RELEASE_SHA}" '[
            .[] | .workflow_runs[]? |
            select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push"
            )
          ]' <<< "${runs_json}")"
          if [[ "$(jq 'length' <<< "${matches}")" != "1" ]]; then
            echo "ERROR: hosted signing expected one exact package.yml main push run." >&2
            exit 1
          fi
          run_id="$(jq -r '.[0].id' <<< "${matches}")"
          run_status="$(jq -r '.[0].status' <<< "${matches}")"
          run_conclusion="$(jq -r '.[0].conclusion // ""' <<< "${matches}")"
          if [[ ! "${run_id}" =~ ^[0-9]+$ || \
                "${run_status}" != "completed" || \
                "${run_conclusion}" != "success" ]]; then
            echo "ERROR: hosted signing package.yml run is not a completed success." >&2
            exit 1
          fi
          artifact_name="syswarden-packages-${version}"
          artifacts_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            -f per_page=100)"
          artifact_matches="$(jq --arg name "${artifact_name}" '[
            .[] | .artifacts[]? | select(.name == $name)
          ]' <<< "${artifacts_json}")"
          if [[ "$(jq 'length' <<< "${artifact_matches}")" != "1" ]]; then
            echo "ERROR: hosted signing package artifact is absent or ambiguous." >&2
            exit 1
          fi
          artifact_id="$(jq -r '.[0].id' <<< "${artifact_matches}")"
          expired="$(jq -r '.[0].expired' <<< "${artifact_matches}")"
          size="$(jq -r '.[0].size_in_bytes' <<< "${artifact_matches}")"
          if [[ ! "${artifact_id}" =~ ^[0-9]+$ || \
                "${expired}" != "false" || \
                ! "${size}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: hosted signing package artifact is unusable." >&2
            exit 1
          fi
          {
            printf 'run_id=%s\n' "${run_id}"
            printf 'artifact_id=%s\n' "${artifact_id}"
            printf 'artifact_name=%s\n' "${artifact_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download Exact Package Main Bytes for Hosted Signing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.hosted_candidate.outputs.artifact_name }}
          path: ${{ steps.signing_workspace.outputs.package_source_dir }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.hosted_candidate.outputs.run_id }}

      - name: Require Successful Qualification Before Release Signing
        id: update_contract
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.hosted_candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.hosted_candidate.outputs.artifact_name }}
          CANDIDATE_RUN_ID: ${{ steps.hosted_candidate.outputs.run_id }}
          EXPECTED_CANDIDATE_ARTIFACT_ID: ${{ needs.qualify-release.outputs.candidate_artifact_id }}
          EXPECTED_CANDIDATE_ARTIFACT_NAME: ${{ needs.qualify-release.outputs.candidate_artifact_name }}
          EXPECTED_CANDIDATE_RUN_ID: ${{ needs.qualify-release.outputs.candidate_run_id }}
          EXPECTED_PREVIOUS_RELEASE_ID: ${{ needs.qualify-release.outputs.previous_release_id }}
          EXPECTED_SIGNED_UPDATE_REQUIRED: ${{ needs.qualify-release.outputs.signed_update_required }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          candidate_version="${RELEASE_TAG#v}"
          previous_version="${PREVIOUS_TAG#v}"
          expected_unsigned_files=(
            "EVIDENCE_SHA256SUMS.txt"
            "aggregate/release-qualification.json"
            "bound/nftables-bound.json"
            "bound/package-lifecycle-bound.json"
            "packages/candidate/SHA256SUMS.txt"
            "packages/candidate/syswarden-${candidate_version}-1.aarch64.rpm"
            "packages/candidate/syswarden-${candidate_version}-1.x86_64.rpm"
            "packages/candidate/syswarden_${candidate_version}_aarch64.apk"
            "packages/candidate/syswarden_${candidate_version}_amd64.deb"
            "packages/candidate/syswarden_${candidate_version}_arm64.deb"
            "packages/candidate/syswarden_${candidate_version}_x86_64.apk"
            "packages/previous/SHA256SUMS.txt"
            "packages/previous/syswarden-${previous_version}-1.aarch64.rpm"
            "packages/previous/syswarden-${previous_version}-1.x86_64.rpm"
            "packages/previous/syswarden_${previous_version}_aarch64.apk"
            "packages/previous/syswarden_${previous_version}_amd64.deb"
            "packages/previous/syswarden_${previous_version}_arm64.deb"
            "packages/previous/syswarden_${previous_version}_x86_64.apk"
            "qualification-context.json"
            "raw/nftables-raw.json"
            "raw/package-lifecycle-amd64.json"
            "raw/package-lifecycle-arm64.json"
            "raw/package-lifecycle-raw.json"
            "status/qualification-exit-codes.json"
          )
          expected_unsigned_directories=(
            aggregate
            bound
            packages
            packages/candidate
            packages/previous
            raw
            status
          )
          mapfile -t sorted_expected_unsigned < <(
            printf '%s\n' "${expected_unsigned_files[@]}" | LC_ALL=C sort
          )
          mapfile -t actual_unsigned_files < <(
            find -P "${UNSIGNED_EVIDENCE_ROOT}" -type f -printf '%P\n' |
              LC_ALL=C sort
          )
          if [[ "${sorted_expected_unsigned[*]}" != "${actual_unsigned_files[*]}" ]]; then
            echo "ERROR: unsigned qualification artifact inventory is not exact." >&2
            exit 1
          fi
          mapfile -t sorted_expected_unsigned_directories < <(
            printf '%s\n' "${expected_unsigned_directories[@]}" | LC_ALL=C sort
          )
          mapfile -t actual_unsigned_directories < <(
            find -P "${UNSIGNED_EVIDENCE_ROOT}" -mindepth 1 -type d -printf '%P\n' |
              LC_ALL=C sort
          )
          if [[ "${sorted_expected_unsigned_directories[*]}" != \
                "${actual_unsigned_directories[*]}" ]]; then
            echo "ERROR: unsigned qualification artifact directories are not exact." >&2
            exit 1
          fi
          while IFS= read -r -d '' entry; do
            if [[ (-d "${entry}" || -f "${entry}") && ! -L "${entry}" ]]; then
              continue
            fi
            echo "ERROR: unsigned qualification artifact has an unsafe filesystem entry." >&2
            exit 1
          done < <(find -P "${UNSIGNED_EVIDENCE_ROOT}" -mindepth 1 -print0)
          expected_manifest_files=()
          for relative in "${expected_unsigned_files[@]}"; do
            if [[ "${relative}" != "EVIDENCE_SHA256SUMS.txt" ]]; then
              expected_manifest_files+=("${relative}")
            fi
          done
          mapfile -t sorted_expected_manifest_files < <(
            printf '%s\n' "${expected_manifest_files[@]}" | LC_ALL=C sort
          )
          manifest_path="${UNSIGNED_EVIDENCE_ROOT}/EVIDENCE_SHA256SUMS.txt"
          mapfile -t manifest_files < <(
            sed -nE 's/^[0-9a-f]{64}  ([A-Za-z0-9._\/-]+)$/\1/p' \
              "${manifest_path}" |
              LC_ALL=C sort
          )
          manifest_line_count="$(wc -l < "${manifest_path}")"
          if [[ ! "${manifest_line_count}" =~ ^[0-9]+$ || \
                "${manifest_line_count}" -ne "${#manifest_files[@]}" || \
                "${sorted_expected_manifest_files[*]}" != "${manifest_files[*]}" ]]; then
            echo "ERROR: unsigned qualification checksum coverage is not exact." >&2
            exit 1
          fi
          (
            cd "${UNSIGNED_EVIDENCE_ROOT}"
            sha256sum --check --strict EVIDENCE_SHA256SUMS.txt
          )
          if [[ "${EXPECTED_SIGNED_UPDATE_REQUIRED}" != "true" && \
                "${EXPECTED_SIGNED_UPDATE_REQUIRED}" != "false" ]]; then
            echo "ERROR: unsigned evidence has an invalid signed update contract." >&2
            exit 1
          fi
          independently_required="$(PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/ci/release_gate.py \
              requires-signed-update --tag "${RELEASE_TAG}")"
          if [[ "${independently_required}" != "${EXPECTED_SIGNED_UPDATE_REQUIRED}" ]]; then
            echo "ERROR: hosted signing disagrees with the unsigned signed-update contract." >&2
            exit 1
          fi
          if ! jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg previous_tag "${PREVIOUS_TAG}" \
            --arg candidate_artifact_name "${CANDIDATE_ARTIFACT_NAME}" \
            --argjson candidate_run_id "${CANDIDATE_RUN_ID}" \
            --argjson candidate_artifact_id "${CANDIDATE_ARTIFACT_ID}" \
            --argjson previous_release_id "${EXPECTED_PREVIOUS_RELEASE_ID}" '
              (keys | sort) == ([
                "candidate_package_artifact_id",
                "candidate_package_artifact_name",
                "candidate_package_run_id",
                "candidate_package_workflow",
                "previous_package_asset_ids",
                "previous_release_id",
                "previous_tag",
                "release_sha",
                "release_tag",
                "repository",
                "schema_version"
              ] | sort) and
              .schema_version == 1 and
              .repository == $repository and
              .release_tag == $release_tag and
              .release_sha == $release_sha and
              .previous_tag == $previous_tag and
              .candidate_package_workflow == "package.yml" and
              .candidate_package_run_id == $candidate_run_id and
              .candidate_package_artifact_id == $candidate_artifact_id and
              .candidate_package_artifact_name == $candidate_artifact_name and
              .previous_release_id == $previous_release_id and
              (.previous_package_asset_ids | type == "array" and length == 7) and
              ([.previous_package_asset_ids[].name] | unique | length) == 7 and
              all(.previous_package_asset_ids[];
                (.id | type == "number" and . > 0 and floor == .) and
                (.name | type == "string" and length > 0))
            ' "${UNSIGNED_EVIDENCE_ROOT}/qualification-context.json" >/dev/null; then
            echo "ERROR: unsigned qualification context is not bound to hosted signing inputs." >&2
            exit 1
          fi
          if [[ "${CANDIDATE_RUN_ID}" != "${EXPECTED_CANDIDATE_RUN_ID}" || \
                "${CANDIDATE_ARTIFACT_ID}" != "${EXPECTED_CANDIDATE_ARTIFACT_ID}" || \
                "${CANDIDATE_ARTIFACT_NAME}" != "${EXPECTED_CANDIDATE_ARTIFACT_NAME}" ]]; then
            echo "ERROR: hosted Package main resolution differs from x64 qualification outputs." >&2
            exit 1
          fi
          mapfile -t failed_statuses < <(
            jq -r 'to_entries[] | select(.value != 0) |
              (.key + "=" + (.value | tostring))' \
              "${UNSIGNED_EVIDENCE_ROOT}/status/qualification-exit-codes.json"
          )
          for failed_status in "${failed_statuses[@]}"; do
            echo "ERROR: qualification status ${failed_status}." >&2
          done
          if (( ${#failed_statuses[@]} > 0 )); then
            echo "ERROR: refusing to sign because qualification status is not uniformly zero." >&2
            exit 1
          fi
          jq --exit-status '
            (keys | sort) == ([
              "adapter_build",
              "adapter_verify",
              "gate_generate",
              "gate_verify",
              "nftables_lab",
              "package_lab"
            ] | sort) and all(.[]; . == 0)
          ' "${UNSIGNED_EVIDENCE_ROOT}/status/qualification-exit-codes.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            verify-packages \
            --tag "${RELEASE_TAG}" \
            --packages "${PACKAGE_MAIN_SOURCE_DIR}"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            verify-packages \
            --tag "${RELEASE_TAG}" \
            --packages "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate"
          mapfile -t source_package_files < <(
            find -P "${PACKAGE_MAIN_SOURCE_DIR}" -mindepth 1 -maxdepth 1 \
              -type f -printf '%f\n' | LC_ALL=C sort
          )
          mapfile -t evidence_package_files < <(
            find -P "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate" \
              -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          )
          if [[ "${source_package_files[*]}" != "${evidence_package_files[*]}" ]]; then
            echo "ERROR: Package main and unsigned package inventories differ." >&2
            exit 1
          fi
          for package_file in "${source_package_files[@]}"; do
            cmp -s \
              "${PACKAGE_MAIN_SOURCE_DIR}/${package_file}" \
              "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate/${package_file}" || {
                echo "ERROR: unsigned package bytes differ from exact Package main bytes." >&2
                exit 1
              }
          done
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_adapter.py \
            verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-version "${RELEASE_TAG}" \
            --candidate-packages-dir "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate" \
            --previous-packages-dir "${UNSIGNED_EVIDENCE_ROOT}/packages/previous" \
            --nft-raw "${UNSIGNED_EVIDENCE_ROOT}/raw/nftables-raw.json" \
            --package-raw "${UNSIGNED_EVIDENCE_ROOT}/raw/package-lifecycle-raw.json" \
            --package-amd64-shard "${UNSIGNED_EVIDENCE_ROOT}/raw/package-lifecycle-amd64.json" \
            --package-arm64-shard "${UNSIGNED_EVIDENCE_ROOT}/raw/package-lifecycle-arm64.json" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-workflow-run-id "${GITHUB_RUN_ID}" \
            --expected-workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --expected-candidate-run-id "${CANDIDATE_RUN_ID}" \
            --expected-candidate-artifact-id "${CANDIDATE_ARTIFACT_ID}" \
            --expected-candidate-artifact-name "${CANDIDATE_ARTIFACT_NAME}" \
            --expected-previous-release-id "${EXPECTED_PREVIOUS_RELEASE_ID}" \
            --max-age-seconds 172800 \
            --max-report-skew-seconds 0 \
            --nft-envelope "${UNSIGNED_EVIDENCE_ROOT}/bound/nftables-bound.json" \
            --package-envelope "${UNSIGNED_EVIDENCE_ROOT}/bound/package-lifecycle-bound.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_gate.py \
            verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-version "${RELEASE_TAG}" \
            --candidate-packages-dir "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate" \
            --nft-report "${UNSIGNED_EVIDENCE_ROOT}/bound/nftables-bound.json" \
            --package-report "${UNSIGNED_EVIDENCE_ROOT}/bound/package-lifecycle-bound.json" \
            --max-age-seconds 172800 \
            --max-report-skew-seconds 0 \
            --aggregate "${UNSIGNED_EVIDENCE_ROOT}/aggregate/release-qualification.json"
          {
            printf 'required=%s\n' "${independently_required}"
            printf 'verified=true\n'
          } >> "${GITHUB_OUTPUT}"

      - name: Build and Test Signed Update Manifest Tool
        id: hosted_manifest_tool
        if: ${{ steps.update_contract.outputs.required == 'true' }}
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${RELEASE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          GOFLAGS=-mod=readonly go test \
            ./scripts/ci/update_manifest.go \
            ./scripts/ci/update_manifest_test.go
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${RELEASE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          GOFLAGS=-mod=readonly go build \
            -o "${SIGNING_TOOL_DIR}/syswarden-update-manifest" \
            ./scripts/ci/update_manifest.go
          chmod 0700 "${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          test -f "${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          test ! -L "${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          test -x "${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          tool_sha256="$(sha256sum \
            "${SIGNING_TOOL_DIR}/syswarden-update-manifest")"
          tool_sha256="${tool_sha256%% *}"
          [[ "${tool_sha256}" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "${tool_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Revalidate Hosted Signing Tool Before Secret Exposure
        id: verified_hosted_manifest_tool
        if: ${{ steps.hosted_manifest_tool.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_MANIFEST_TOOL_SHA256: ${{ steps.hosted_manifest_tool.outputs.sha256 }}
        run: |
          set -euo pipefail
          manifest_tool="${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          test -f "${manifest_tool}"
          test ! -L "${manifest_tool}"
          test -x "${manifest_tool}"
          test "$(stat -c '%u' "${manifest_tool}")" = "$(id -u)"
          test "$(stat -c '%a' "${manifest_tool}")" = "700"
          actual_tool_sha256="$(sha256sum "${manifest_tool}")"
          actual_tool_sha256="${actual_tool_sha256%% *}"
          if [[ ! "${EXPECTED_MANIFEST_TOOL_SHA256}" =~ ^[0-9a-f]{64}$ || \
                "${actual_tool_sha256}" != "${EXPECTED_MANIFEST_TOOL_SHA256}" ]]; then
            echo "ERROR: hosted signing tool changed after its validated build." >&2
            exit 1
          fi
          echo "verified=true" >> "${GITHUB_OUTPUT}"

      - name: Generate and Verify Signed Update Manifest
        id: signed_update
        if: >-
          ${{ needs.qualify-release.outputs.signed_update_required == 'true' &&
              steps.update_contract.outputs.verified == 'true' &&
              steps.verified_hosted_manifest_tool.outputs.verified == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          manifest_dir="${UNSIGNED_EVIDENCE_ROOT}/update"
          manifest_path="${manifest_dir}/syswarden-update-manifest-v1.json"
          signature_path="${manifest_path}.sig"
          signing_complete=false
          clear_signing_material() {
            unset SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY
            if [[ "${signing_complete}" != "true" ]]; then
              rm -f -- "${manifest_path}" "${signature_path}"
              rmdir -- "${manifest_dir}" 2>/dev/null || true
            fi
          }
          trap clear_signing_material EXIT HUP INT TERM
          if [[ -z "${SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY}" ]]; then
            echo "ERROR: the protected Ed25519 release-signing secret is required." >&2
            exit 1
          fi
          manifest_tool="${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          test -f "${manifest_tool}"
          test ! -L "${manifest_tool}"
          test -x "${manifest_tool}"
          "${manifest_tool}" generate \
            --repository "${GITHUB_WORKSPACE}" \
            --tag "${RELEASE_TAG}" \
            --packages "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate" \
            --output "${manifest_dir}"
          unset SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY
          env -u SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY \
            "${manifest_tool}" verify \
              --repository "${GITHUB_WORKSPACE}" \
              --tag "${RELEASE_TAG}" \
              --packages "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate" \
              --manifest "${manifest_path}" \
              --signature "${signature_path}"
          signing_complete=true
          trap - EXIT HUP INT TERM

      - name: Seal Exact Qualification Evidence Inventory
        id: final_inventory
        if: >-
          ${{ steps.update_contract.outputs.verified == 'true' &&
              (needs.qualify-release.outputs.signed_update_required == 'false' ||
               steps.signed_update.outcome == 'success') }}
        shell: bash
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SIGNED_UPDATE_REQUIRED: ${{ needs.qualify-release.outputs.signed_update_required }}
        run: |
          set -euo pipefail
          umask 077
          candidate_version="${RELEASE_TAG#v}"
          previous_version="${PREVIOUS_TAG#v}"
          rm -f -- "${UNSIGNED_EVIDENCE_ROOT}/EVIDENCE_SHA256SUMS.txt"
          expected=(
            "aggregate/release-qualification.json"
            "bound/nftables-bound.json"
            "bound/package-lifecycle-bound.json"
            "packages/candidate/SHA256SUMS.txt"
            "packages/candidate/syswarden-${candidate_version}-1.aarch64.rpm"
            "packages/candidate/syswarden-${candidate_version}-1.x86_64.rpm"
            "packages/candidate/syswarden_${candidate_version}_aarch64.apk"
            "packages/candidate/syswarden_${candidate_version}_amd64.deb"
            "packages/candidate/syswarden_${candidate_version}_arm64.deb"
            "packages/candidate/syswarden_${candidate_version}_x86_64.apk"
            "packages/previous/SHA256SUMS.txt"
            "packages/previous/syswarden-${previous_version}-1.aarch64.rpm"
            "packages/previous/syswarden-${previous_version}-1.x86_64.rpm"
            "packages/previous/syswarden_${previous_version}_aarch64.apk"
            "packages/previous/syswarden_${previous_version}_amd64.deb"
            "packages/previous/syswarden_${previous_version}_arm64.deb"
            "packages/previous/syswarden_${previous_version}_x86_64.apk"
            "qualification-context.json"
            "raw/nftables-raw.json"
            "raw/package-lifecycle-amd64.json"
            "raw/package-lifecycle-arm64.json"
            "raw/package-lifecycle-raw.json"
            "status/qualification-exit-codes.json"
          )
          expected_directories=(
            aggregate
            bound
            packages
            packages/candidate
            packages/previous
            raw
            status
          )
          if [[ "${SIGNED_UPDATE_REQUIRED}" == "true" ]]; then
            expected+=(
              "update/syswarden-update-manifest-v1.json"
              "update/syswarden-update-manifest-v1.json.sig"
            )
            expected_directories+=(update)
          elif [[ "${SIGNED_UPDATE_REQUIRED}" != "false" ]]; then
            echo "ERROR: final signed update requirement is not canonical." >&2
            exit 1
          fi
          mapfile -t sorted_expected < <(
            printf '%s\n' "${expected[@]}" | LC_ALL=C sort
          )
          mapfile -t actual_files < <(
            find -P "${UNSIGNED_EVIDENCE_ROOT}" -type f -printf '%P\n' |
              LC_ALL=C sort
          )
          if [[ "${sorted_expected[*]}" != "${actual_files[*]}" ]]; then
            echo "ERROR: final qualification evidence inventory is not exact." >&2
            exit 1
          fi
          mapfile -t sorted_expected_directories < <(
            printf '%s\n' "${expected_directories[@]}" | LC_ALL=C sort
          )
          mapfile -t actual_directories < <(
            find -P "${UNSIGNED_EVIDENCE_ROOT}" -mindepth 1 -type d -printf '%P\n' |
              LC_ALL=C sort
          )
          if [[ "${sorted_expected_directories[*]}" != "${actual_directories[*]}" ]]; then
            echo "ERROR: final qualification evidence directories are not exact." >&2
            exit 1
          fi
          while IFS= read -r -d '' entry; do
            if [[ (-d "${entry}" || -f "${entry}") && ! -L "${entry}" ]]; then
              continue
            fi
            echo "ERROR: final qualification evidence has an unsafe entry." >&2
            exit 1
          done < <(find -P "${UNSIGNED_EVIDENCE_ROOT}" -mindepth 1 -print0)
          for relative in "${sorted_expected[@]}"; do
            test -s "${UNSIGNED_EVIDENCE_ROOT}/${relative}"
            test -f "${UNSIGNED_EVIDENCE_ROOT}/${relative}"
            test ! -L "${UNSIGNED_EVIDENCE_ROOT}/${relative}"
          done
          chmod -R go-rwx "${UNSIGNED_EVIDENCE_ROOT}"
          (
            cd "${UNSIGNED_EVIDENCE_ROOT}"
            sha256sum "${sorted_expected[@]}" > EVIDENCE_SHA256SUMS.txt
            sha256sum --check --strict EVIDENCE_SHA256SUMS.txt
          )
          test "$(find -P "${UNSIGNED_EVIDENCE_ROOT}" -type f | wc -l)" \
            -eq "$(( ${#sorted_expected[@]} + 1 ))"

      - name: Upload Exact Final Qualification Evidence
        id: final_upload
        if: ${{ steps.final_inventory.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syswarden-release-qualification
          path: ${{ steps.signing_workspace.outputs.unsigned_root }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove Ephemeral Signing Material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          unset SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY
          if [[ -z "${HOSTED_SIGNING_ROOT:-}" || \
                "${HOSTED_SIGNING_ROOT}" != "${RUNNER_TEMP%/}"/syswarden-hosted-signing.* || \
                -z "${UNSIGNED_EVIDENCE_ROOT:-}" || \
                "${UNSIGNED_EVIDENCE_ROOT}" != "${HOSTED_SIGNING_ROOT}/unsigned-evidence" || \
                -z "${SIGNING_TOOL_DIR:-}" || \
                "${SIGNING_TOOL_DIR}" != "${HOSTED_SIGNING_ROOT}/signing-tool" ]]; then
            echo "ERROR: refusing unsafe hosted signing cleanup." >&2
            exit 1
          fi
          test -d "${HOSTED_SIGNING_ROOT}"
          test ! -L "${HOSTED_SIGNING_ROOT}"
          [[ -O "${HOSTED_SIGNING_ROOT}" ]]
          test "$(stat -c '%a' "${HOSTED_SIGNING_ROOT}")" = "700"
          update_dir="${UNSIGNED_EVIDENCE_ROOT}/update"
          if [[ -e "${update_dir}" ]]; then
            test -d "${update_dir}"
            test ! -L "${update_dir}"
            [[ -O "${update_dir}" ]]
          fi
          test -d "${SIGNING_TOOL_DIR}"
          test ! -L "${SIGNING_TOOL_DIR}"
          [[ -O "${SIGNING_TOOL_DIR}" ]]
          test "$(stat -c '%a' "${SIGNING_TOOL_DIR}")" = "700"
          rm -f -- \
            "${update_dir}/syswarden-update-manifest-v1.json" \
            "${update_dir}/syswarden-update-manifest-v1.json.sig"
          rmdir -- "${update_dir}" 2>/dev/null || true
          rm -f -- "${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          rmdir -- "${SIGNING_TOOL_DIR}" 2>/dev/null || true

      - name: Enforce Hosted Qualification Seal Verdict
        if: ${{ always() }}
        shell: bash
        env:
          FINAL_INVENTORY_OUTCOME: ${{ steps.final_inventory.outcome }}
          FINAL_UPLOAD_OUTCOME: ${{ steps.final_upload.outcome }}
          PACKAGE_BYTES_GATE_OUTCOME: ${{ steps.update_contract.outcome }}
          SIGNED_UPDATE_OUTCOME: ${{ steps.signed_update.outcome }}
          SIGNED_UPDATE_REQUIRED: ${{ needs.qualify-release.outputs.signed_update_required }}
        run: |
          set -euo pipefail
          if [[ "${PACKAGE_BYTES_GATE_OUTCOME}" != "success" || \
                "${FINAL_INVENTORY_OUTCOME}" != "success" || \
                "${FINAL_UPLOAD_OUTCOME}" != "success" ]]; then
            echo "ERROR: hosted qualification evidence was not independently gated, sealed, and uploaded." >&2
            exit 1
          fi
          if [[ "${SIGNED_UPDATE_REQUIRED}" == "true" && \
                "${SIGNED_UPDATE_OUTCOME}" != "success" ]]; then
            echo "ERROR: hosted qualification required signing but signing did not succeed." >&2
            exit 1
          fi
          if [[ "${SIGNED_UPDATE_REQUIRED}" != "true" && \
                "${SIGNED_UPDATE_REQUIRED}" != "false" ]]; then
            echo "ERROR: hosted qualification signed update requirement is invalid." >&2
            exit 1
          fi

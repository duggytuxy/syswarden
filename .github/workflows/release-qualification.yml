name: SysWarden Release Qualification

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Canonical pre-release version (the tag must not exist yet)
        required: true
        type: string
      release_sha:
        description: Exact full commit SHA on main to qualify
        required: true
        type: string
      previous_tag:
        description: Exact latest public release used for lifecycle rollback
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QUALIFICATION_MATRIX_PATH: ${{ inputs.release_tag == 'v4.10.0' && 'scripts/ci/package_qualification_matrix_v4.10.0.json' || 'scripts/ci/package_qualification_matrix.json' }}

permissions:
  actions: read
  contents: read

concurrency:
  group: syswarden-release-qualification
  cancel-in-progress: false

jobs:
  qualify-release:
    name: Qualify Exact Pre-Tag Commit
    outputs:
      candidate_artifact_id: ${{ steps.candidate.outputs.artifact_id }}
      candidate_artifact_digest: ${{ steps.candidate.outputs.artifact_digest }}
      candidate_artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
      previous_commit_sha: ${{ steps.previous.outputs.commit_sha }}
      previous_release_id: ${{ steps.previous.outputs.release_id }}
      signed_update_required: ${{ steps.update_contract.outputs.required }}
      unsigned_artifact_name: ${{ steps.inventory.outputs.artifact_name }}
      native_signing_artifact_digest: ${{ steps.native_candidate.outputs.artifact_digest }}
      native_signing_artifact_id: ${{ steps.native_candidate.outputs.artifact_id }}
      native_signing_artifact_name: ${{ steps.native_candidate.outputs.artifact_name }}
      native_signing_run_id: ${{ steps.native_candidate.outputs.run_id }}
      native_evidence_artifact_digest: ${{ steps.native_evidence.outputs.artifact_digest }}
      native_evidence_artifact_id: ${{ steps.native_evidence.outputs.artifact_id }}
      native_evidence_artifact_name: ${{ steps.native_evidence.outputs.artifact_name }}
      native_evidence_run_id: ${{ steps.native_evidence.outputs.run_id }}
      go127_artifact_digest: ${{ steps.go127.outputs.artifact_digest }}
      go127_artifact_id: ${{ steps.go127.outputs.artifact_id }}
      go127_artifact_name: ${{ steps.go127.outputs.artifact_name }}
      go127_run_id: ${{ steps.go127.outputs.run_id }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - ${{ 'syswarden-release-lab' }}
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read

    steps:
      - name: Validate Dedicated Ephemeral Qualification Runner
        shell: bash
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_ARCH_CONTEXT: ${{ runner.arch }}
          RUNNER_NAME_CONTEXT: ${{ runner.name }}
          RUNNER_OS_CONTEXT: ${{ runner.os }}
        run: |
          set -euo pipefail
          command -v id >/dev/null
          command -v jq >/dev/null
          command -v realpath >/dev/null
          command -v stat >/dev/null
          if [[ -z "${REPOSITORY_OWNER}" || \
                "${EVENT_ACTOR}" != "${REPOSITORY_OWNER}" || \
                "${EVENT_TRIGGERING_ACTOR}" != "${REPOSITORY_OWNER}" || \
                "${RUN_ATTEMPT}" != "1" || \
                ! "${RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: qualification must be dispatched once by the repository owner." >&2
            exit 1
          fi

          expected_runner_name="syswarden-release-lab-${RUN_ID}-a${RUN_ATTEMPT}"
          if [[ "${RUNNER_NAME_CONTEXT}" != "${expected_runner_name}" || \
                "${RUNNER_OS_CONTEXT}" != "Linux" || \
                "${RUNNER_ARCH_CONTEXT}" != "X64" ]]; then
            echo "ERROR: qualification requires the exact run-bound Linux X64 ephemeral runner." >&2
            exit 1
          fi
          if [[ -z "${RUNNER_TEMP:-}" || "${RUNNER_TEMP}" != /* || \
                "${RUNNER_TEMP%/}" != */_work/_temp ]]; then
            echo "ERROR: runner temporary storage is not an exact private runner work path." >&2
            exit 1
          fi
          runner_temp="${RUNNER_TEMP%/}"
          if [[ "$(realpath -e "${runner_temp}")" != "${runner_temp}" ]]; then
            echo "ERROR: runner temporary storage must not traverse aliases or symbolic links." >&2
            exit 1
          fi
          runner_work="${runner_temp%/_temp}"
          runner_root="${runner_work%/_work}"
          if [[ -z "${runner_root}" || "${runner_root}" == "${runner_work}" || \
                "${runner_work}" == "${runner_temp}" ]]; then
            echo "ERROR: runner root could not be derived from RUNNER_TEMP." >&2
            exit 1
          fi
          current_uid="$(id -u)"
          for directory in "${runner_root}" "${runner_work}" "${runner_temp}"; do
            if [[ ! -d "${directory}" || -L "${directory}" || \
                  "$(stat -c '%u' "${directory}")" != "${current_uid}" || \
                  "$(stat -c '%a' "${directory}")" != "700" ]]; then
              echo "ERROR: runner directories must be private real directories owned by the runner account." >&2
              exit 1
            fi
          done
          for identity_file in .runner .credentials .credentials_rsaparams; do
            identity_path="${runner_root}/${identity_file}"
            if [[ ! -f "${identity_path}" || -L "${identity_path}" || \
                  "$(stat -c '%u' "${identity_path}")" != "${current_uid}" || \
                  "$(stat -c '%a' "${identity_path}")" != "600" ]]; then
              echo "ERROR: runner identity files must be private regular files owned by the runner account." >&2
              exit 1
            fi
          done
          runner_config="${runner_root}/.runner"
          if ! jq -e \
            --arg expected_name "${expected_runner_name}" \
            --arg expected_url "https://github.com/${GITHUB_REPOSITORY}" '
              def has_exact_key($canonical):
                ([keys_unsorted[] |
                  select(ascii_downcase == ($canonical | ascii_downcase))]
                ) as $matching_keys |
                ($matching_keys | length) == 1 and
                $matching_keys[0] == $canonical;
              type == "object" and
              has_exact_key("agentId") and
              has_exact_key("agentName") and
              has_exact_key("disableUpdate") and
              has_exact_key("ephemeral") and
              has_exact_key("gitHubUrl") and
              has_exact_key("workFolder") and
              has_exact_key("poolName") and
              .agentName == $expected_name and
              .disableUpdate == true and
              .ephemeral == true and
              .gitHubUrl == $expected_url and
              .workFolder == "_work" and
              .poolName == "Default" and
              (.agentId | type == "number" and . > 0 and floor == .)
            ' "${runner_config}" >/dev/null; then
            echo "ERROR: runner identity is not the exact ephemeral qualification configuration." >&2
            exit 1
          fi

      - name: Checkout Exact Candidate Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Set Up Go for Version Validation
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Validate Manual Main Pre-Tag Context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "workflow_dispatch" || \
                "${EVENT_REF_TYPE}" != "branch" || \
                "${EVENT_REF_NAME}" != "main" || \
                "${EVENT_REF}" != "refs/heads/main" || \
                "${EVENT_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "ERROR: qualification must be manually dispatched at the exact main candidate SHA." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: release_sha must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]{2}\.[0-9]+$ || \
                ! "${PREVIOUS_TAG}" =~ ^v[0-9]+\.[0-9]{2}\.[0-9]+$ || \
                "${RELEASE_TAG}" == "${PREVIOUS_TAG}" ]]; then
            echo "ERROR: release_tag and previous_tag must be distinct canonical versions." >&2
            exit 1
          fi
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${RELEASE_SHA}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          source_tag="$(./scripts/versioning.sh inspect --repo "${GITHUB_WORKSPACE}")"
          if [[ "${source_tag}" != "${RELEASE_TAG}" ]]; then
            echo "ERROR: source version ${source_tag} does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          commit_message="$(git log -1 --format=%B HEAD)"
          ./scripts/versioning.sh validate-commit \
            --repo "${GITHUB_WORKSPACE}" \
            --base-ref HEAD^ \
            --commit-message "${commit_message}"

          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "ERROR: candidate tag ${RELEASE_TAG} already exists locally." >&2
            exit 1
          fi
          remote_error="${RUNNER_TEMP%/}/syswarden-release-tag-query.err"
          set +e
          remote_tag="$(git ls-remote --exit-code --refs origin \
            "refs/tags/${RELEASE_TAG}" 2> "${remote_error}")"
          remote_rc=$?
          set -e
          if [[ "${remote_rc}" -eq 0 && -n "${remote_tag}" ]]; then
            echo "ERROR: candidate tag ${RELEASE_TAG} already exists remotely." >&2
            exit 1
          fi
          if [[ "${remote_rc}" -ne 2 || -n "${remote_tag}" ]]; then
            echo "ERROR: remote candidate-tag absence could not be proven." >&2
            sed -n '1,20p' "${remote_error}" >&2
            exit 1
          fi
          rm -f "${remote_error}"

          previous_sha="$(git rev-parse --verify "refs/tags/${PREVIOUS_TAG}^{commit}")"
          git merge-base --is-ancestor "${previous_sha}" "${RELEASE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate Frozen Package Qualification Matrix
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/package_qualification_matrix.py \
            --expected-target-release "${RELEASE_TAG}"

      - name: Qualify Optional RHEL Image Extension Offline Contract
        shell: bash
        run: |
          set -euo pipefail
          command -v unshare >/dev/null
          bash -n \
            extensions/rhel-image/stage-syswarden-rhel-image.sh \
            extensions/rhel-image/tests/test-stage.sh
          extensions/rhel-image/tests/test-stage.sh

      - name: Create Isolated Qualification Workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          required_tools=(
            diff
            find
            git
            go
            grep
            jq
            mktemp
            podman
            python3
            sed
            sha256sum
            stat
          )
          for tool in "${required_tools[@]}"; do
            command -v "${tool}" >/dev/null || {
              echo "ERROR: dedicated qualification runner is missing ${tool}." >&2
              exit 1
            }
          done
          test -n "${RUNNER_TEMP:-}"
          test -d "${RUNNER_TEMP}"
          test ! -L "${RUNNER_TEMP}"
          qualification_root="$(mktemp -d \
            "${RUNNER_TEMP%/}/syswarden-release-qualification.XXXXXX")"
          test -d "${qualification_root}"
          test ! -L "${qualification_root}"
          [[ -O "${qualification_root}" ]]
          test "$(stat -c '%a' "${qualification_root}")" = "700"
          artifact_root="${qualification_root}/artifact"
          candidate_packages="${artifact_root}/packages/candidate"
          unsigned_packages="${qualification_root}/unsigned-packages"
          native_signing="${artifact_root}/native-signing"
          native_release_evidence="${artifact_root}/native-release-evidence"
          go127_evidence="${artifact_root}/go127-evidence"
          previous_packages="${artifact_root}/packages/previous"
          raw_dir="${artifact_root}/raw"
          bound_dir="${artifact_root}/bound"
          aggregate_dir="${artifact_root}/aggregate"
          status_dir="${qualification_root}/status-internal"
          nftables_tmp_dir="${qualification_root}/nftables-tmp"
          package_tmp_dir="${qualification_root}/package-tmp"
          transition_dir="${qualification_root}/historical-transition"
          install -d -m 0700 \
            "${artifact_root}" \
            "${candidate_packages}" \
            "${unsigned_packages}" \
            "${native_signing}" \
            "${native_release_evidence}" \
            "${go127_evidence}" \
            "${previous_packages}" \
            "${raw_dir}" \
            "${bound_dir}" \
            "${aggregate_dir}" \
            "${artifact_root}/status" \
            "${status_dir}" \
            "${nftables_tmp_dir}" \
            "${package_tmp_dir}" \
            "${transition_dir}"
          test -d "${nftables_tmp_dir}"
          test ! -L "${nftables_tmp_dir}"
          [[ -O "${nftables_tmp_dir}" ]]
          test "$(stat -c '%a' "${nftables_tmp_dir}")" = "700"
          nftables_tmp_probe="$(mktemp \
            "${nftables_tmp_dir}/.write-probe.XXXXXX")"
          test -f "${nftables_tmp_probe}"
          test ! -L "${nftables_tmp_probe}"
          rm -f -- "${nftables_tmp_probe}"
          test ! -e "${nftables_tmp_probe}"
          test -d "${package_tmp_dir}"
          test ! -L "${package_tmp_dir}"
          [[ -O "${package_tmp_dir}" ]]
          test "$(stat -c '%a' "${package_tmp_dir}")" = "700"
          package_tmp_probe="$(mktemp \
            "${package_tmp_dir}/.write-probe.XXXXXX")"
          test -f "${package_tmp_probe}"
          test ! -L "${package_tmp_probe}"
          rm -f -- "${package_tmp_probe}"
          test ! -e "${package_tmp_probe}"

          {
            printf 'QUALIFICATION_ROOT=%s\n' "${qualification_root}"
            printf 'ARTIFACT_ROOT=%s\n' "${artifact_root}"
            printf 'CANDIDATE_PACKAGES_DIR=%s\n' "${candidate_packages}"
            printf 'UNSIGNED_PACKAGES_DIR=%s\n' "${unsigned_packages}"
            printf 'NATIVE_SIGNING_DIR=%s\n' "${native_signing}"
            printf 'NATIVE_RELEASE_EVIDENCE_DIR=%s\n' "${native_release_evidence}"
            printf 'GO127_EVIDENCE_DIR=%s\n' "${go127_evidence}"
            printf 'PREVIOUS_PACKAGES_DIR=%s\n' "${previous_packages}"
            printf 'RAW_DIR=%s\n' "${raw_dir}"
            printf 'BOUND_DIR=%s\n' "${bound_dir}"
            printf 'AGGREGATE_DIR=%s\n' "${aggregate_dir}"
            printf 'STATUS_DIR=%s\n' "${status_dir}"
            printf 'NFTABLES_TMP_DIR=%s\n' "${nftables_tmp_dir}"
            printf 'PACKAGE_TMP_DIR=%s\n' "${package_tmp_dir}"
            printf 'TRANSITION_DIR=%s\n' "${transition_dir}"
          } >> "${GITHUB_ENV}"
          {
            printf 'qualification_root=%s\n' "${qualification_root}"
            printf 'artifact_root=%s\n' "${artifact_root}"
            printf 'candidate_packages_dir=%s\n' "${candidate_packages}"
            printf 'unsigned_packages_dir=%s\n' "${unsigned_packages}"
            printf 'native_signing_dir=%s\n' "${native_signing}"
            printf 'native_release_evidence_dir=%s\n' "${native_release_evidence}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve Unique Successful Main Package Artifact
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          runs_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/package.yml/runs" \
            -f event=push \
            -f head_sha="${RELEASE_SHA}" \
            -f per_page=100)"
          matches="$(jq --arg sha "${RELEASE_SHA}" '[
            .[] | .workflow_runs[]? |
            select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push"
            )
          ]' <<< "${runs_json}")"
          if [[ "$(jq 'length' <<< "${matches}")" != "1" ]]; then
            echo "ERROR: expected exactly one package.yml main push run for ${RELEASE_SHA}." >&2
            exit 1
          fi
          run_id="$(jq -r '.[0].id' <<< "${matches}")"
          run_status="$(jq -r '.[0].status' <<< "${matches}")"
          run_conclusion="$(jq -r '.[0].conclusion // ""' <<< "${matches}")"
          if [[ ! "${run_id}" =~ ^[0-9]+$ || \
                "${run_status}" != "completed" || \
                "${run_conclusion}" != "success" ]]; then
            echo "ERROR: the unique package.yml main run is not a completed success." >&2
            exit 1
          fi

          artifact_name="syswarden-packages-${version}"
          artifacts_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            -f per_page=100)"
          artifact_matches="$(jq --arg name "${artifact_name}" '[
            .[] | .artifacts[]? | select(.name == $name)
          ]' <<< "${artifacts_json}")"
          if [[ "$(jq 'length' <<< "${artifact_matches}")" != "1" ]]; then
            echo "ERROR: the exact package artifact is absent or ambiguous." >&2
            exit 1
          fi
          artifact_id="$(jq -r '.[0].id' <<< "${artifact_matches}")"
          artifact_digest="$(jq -r '.[0].digest // ""' <<< "${artifact_matches}")"
          expired="$(jq -r '.[0].expired' <<< "${artifact_matches}")"
          size="$(jq -r '.[0].size_in_bytes' <<< "${artifact_matches}")"
          if [[ ! "${artifact_id}" =~ ^[0-9]+$ || \
                "${expired}" != "false" || \
                ! "${size}" =~ ^[1-9][0-9]*$ || \
                ! "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: the exact package artifact is expired, empty, or malformed." >&2
            exit 1
          fi
          {
            printf 'run_id=%s\n' "${run_id}"
            printf 'artifact_id=%s\n' "${artifact_id}"
            printf 'artifact_name=%s\n' "${artifact_name}"
            printf 'artifact_digest=%s\n' "${artifact_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download Exact Candidate Package Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          path: ${{ steps.workspace.outputs.unsigned_packages_dir }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}

      - name: Verify Exact Candidate Package Inventory
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            verify-packages \
            --tag "${RELEASE_TAG}" \
            --packages "${UNSIGNED_PACKAGES_DIR}"

      - name: Resolve Unique Go 1.27 Evaluation
        id: go127
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          runs_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/go-127-evaluation.yml/runs" \
            -f event=workflow_dispatch -f branch=main \
            -f head_sha="${RELEASE_SHA}" -f per_page=100)"
          matches="$(jq --arg sha "${RELEASE_SHA}" '[
            .[] | .workflow_runs[]? | select(
              .head_sha == $sha and .head_branch == "main" and
              .event == "workflow_dispatch" and
              .path == ".github/workflows/go-127-evaluation.yml" and
              .run_attempt == 1 and .status == "completed" and
              .conclusion == "success"
            )
          ]' <<< "${runs_json}")"
          if [[ "$(jq 'length' <<< "${matches}")" != "1" ]]; then
            echo "ERROR: expected exactly one successful Go 1.27 evaluation for main/${RELEASE_SHA}." >&2
            exit 1
          fi
          run_id="$(jq -r '.[0].id | tostring' <<< "${matches}")"
          artifact_name="syswarden-go127-evaluation-${RELEASE_SHA}"
          artifacts_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" -f per_page=100)"
          if [[ "$(jq '[.[] | .artifacts[]?] | length' <<< "${artifacts_json}")" != "1" ]]; then
            echo "ERROR: Go 1.27 evaluation run must expose exactly one artifact." >&2
            exit 1
          fi
          artifact="$(jq --arg name "${artifact_name}" --arg sha "${RELEASE_SHA}" \
            --argjson run "${run_id}" '[.[] | .artifacts[]? | select(
              .name == $name and .workflow_run.id == $run and
              .workflow_run.head_sha == $sha)]' <<< "${artifacts_json}")"
          artifact_id="$(jq -r '.[0].id | tostring // ""' <<< "${artifact}")"
          artifact_digest="$(jq -r '.[0].digest // ""' <<< "${artifact}")"
          if [[ "$(jq 'length' <<< "${artifact}")" != "1" ||
                ! "${run_id}" =~ ^[1-9][0-9]*$ ||
                ! "${artifact_id}" =~ ^[1-9][0-9]*$ ||
                ! "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ||
                "$(jq -r '.[0].expired' <<< "${artifact}")" != "false" ||
                ! "$(jq -r '.[0].size_in_bytes | tostring' <<< "${artifact}")" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: Go 1.27 evaluation artifact is absent, expired, empty, ambiguous, or malformed." >&2
            exit 1
          fi
          printf 'run_id=%s\nartifact_id=%s\nartifact_name=%s\nartifact_digest=%s\n' \
            "${run_id}" "${artifact_id}" "${artifact_name}" "${artifact_digest}" >> "${GITHUB_OUTPUT}"

      - name: Download Exact Go 1.27 Evaluation by Artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.go127.outputs.artifact_id }}
          path: ${{ steps.workspace.outputs.artifact_root }}/go127-evidence
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.go127.outputs.run_id }}

      - name: Resolve Unique Protected Native Signing Bundle
        id: native_candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          runs_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/native-package-signing.yml/runs" \
            -f event=workflow_dispatch -f branch=main \
            -f head_sha="${RELEASE_SHA}" -f per_page=100)"
          matches="$(jq --arg sha "${RELEASE_SHA}" '[
            .[] | .workflow_runs[]? | select(
              .head_sha == $sha and .head_branch == "main" and
              .event == "workflow_dispatch" and
              .path == ".github/workflows/native-package-signing.yml" and
              .run_attempt == 1 and .status == "completed" and
              .conclusion == "success"
            )
          ]' <<< "${runs_json}")"
          if [[ "$(jq 'length' <<< "${matches}")" != "1" ]]; then
            echo "ERROR: expected exactly one native-package-signing.yml run for main/${RELEASE_SHA}." >&2
            exit 1
          fi
          run_id="$(jq -r '.[0].id | tostring' <<< "${matches}")"
          if [[ ! "${run_id}" =~ ^[1-9][0-9]*$ || \
                "$(jq -r '.[0].path' <<< "${matches}")" != ".github/workflows/native-package-signing.yml" || \
                "$(jq -r '.[0].run_attempt | tostring' <<< "${matches}")" != "1" || \
                "$(jq -r '.[0].status' <<< "${matches}")" != "completed" || \
                "$(jq -r '.[0].conclusion // ""' <<< "${matches}")" != "success" ]]; then
            echo "ERROR: native package signing is not one completed successful attempt-1 run." >&2
            exit 1
          fi
          artifact_name="syswarden-native-signed-packages-${version}-${run_id}-1-${RELEASE_SHA}"
          artifacts_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            -f per_page=100)"
          if [[ "$(jq '[.[] | .artifacts[]?] | length' <<< "${artifacts_json}")" != "1" ]]; then
            echo "ERROR: native signing run must expose exactly one artifact." >&2
            exit 1
          fi
          artifact_matches="$(jq \
            --arg name "${artifact_name}" --arg sha "${RELEASE_SHA}" \
            --argjson run_id "${run_id}" '[
              .[] | .artifacts[]? | select(
                .name == $name and .workflow_run.id == $run_id and
                .workflow_run.head_sha == $sha
              )
            ]' <<< "${artifacts_json}")"
          if [[ "$(jq 'length' <<< "${artifact_matches}")" != "1" ]]; then
            echo "ERROR: exact native signing artifact is absent or ambiguous." >&2
            exit 1
          fi
          artifact_id="$(jq -r '.[0].id | tostring' <<< "${artifact_matches}")"
          artifact_digest="$(jq -r '.[0].digest // ""' <<< "${artifact_matches}")"
          if [[ ! "${artifact_id}" =~ ^[1-9][0-9]*$ || \
                "$(jq -r '.[0].expired' <<< "${artifact_matches}")" != "false" || \
                ! "$(jq -r '.[0].size_in_bytes | tostring' <<< "${artifact_matches}")" =~ ^[1-9][0-9]*$ || \
                ! "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: exact native signing artifact is expired, empty, or lacks an immutable digest." >&2
            exit 1
          fi
          {
            printf 'run_id=%s\n' "${run_id}"
            printf 'artifact_id=%s\n' "${artifact_id}"
            printf 'artifact_name=%s\n' "${artifact_name}"
            printf 'artifact_digest=%s\n' "${artifact_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download Exact Native Signing Bundle by Artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.native_candidate.outputs.artifact_id }}
          path: ${{ steps.workspace.outputs.native_signing_dir }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.native_candidate.outputs.run_id }}

      - name: Verify and Bind Exact Native Signing Bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT_DIGEST: ${{ steps.native_candidate.outputs.artifact_digest }}
          NATIVE_ARTIFACT_ID: ${{ steps.native_candidate.outputs.artifact_id }}
          NATIVE_ARTIFACT_NAME: ${{ steps.native_candidate.outputs.artifact_name }}
          NATIVE_RUN_ID: ${{ steps.native_candidate.outputs.run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          UNSIGNED_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          UNSIGNED_ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact_digest }}
          UNSIGNED_ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          UNSIGNED_RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/native_package_signing_bundle.py verify \
            --bundle "${NATIVE_SIGNING_DIR}" --release "${RELEASE_TAG}" \
            --release-sha "${RELEASE_SHA}"
          provenance="${NATIVE_SIGNING_DIR}/evidence/NATIVE_SIGNING_PROVENANCE.json"
          policy="scripts/ci/native_package_signature_policy_v4100.json"
          PYTHONDONTWRITEBYTECODE=1 python3 - "${policy}" "${provenance}" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          from scripts.ci import native_package_signature_gate as gate

          policy_path = Path(sys.argv[1])
          provenance = gate.load_json(Path(sys.argv[2]), "native signing provenance")
          verification = gate.load_json(
              Path(sys.argv[2]).parent / "DEB_NATIVE_VERIFICATION.json",
              "DEB verification evidence",
          )
          policy_bytes = gate.regular_bytes(policy_path, gate.MAX_JSON_BYTES, "signature policy")
          policy_document = gate.decode_json(policy_bytes, "signature policy")
          gate.validate_policy(
              policy_document, gate.parse_day(verification["as_of"], "qualification date")
          )
          if policy_document["status"] != "qualified" or policy_document["publishing"] is not True:
              raise SystemExit("native signature policy is not approved for release publication")
          if hashlib.sha256(policy_bytes).hexdigest() != provenance["policy_sha256"]:
              raise SystemExit("native signing bundle differs from the committed signature policy")
          PY
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg unsigned_name "${UNSIGNED_ARTIFACT_NAME}" \
            --arg unsigned_digest "${UNSIGNED_ARTIFACT_DIGEST}" \
            --arg native_name "${NATIVE_ARTIFACT_NAME}" \
            --arg native_digest "${NATIVE_ARTIFACT_DIGEST}" \
            --argjson unsigned_run "${UNSIGNED_RUN_ID}" \
            --argjson unsigned_id "${UNSIGNED_ARTIFACT_ID}" \
            --argjson native_run "${NATIVE_RUN_ID}" \
            --argjson native_id "${NATIVE_ARTIFACT_ID}" '
              .repository == $repository and
              .status == "native-signatures-verified-not-release-qualified" and
              .public_release == false and .release_qualified == false and
              .source.release_sha == $release_sha and
              .source.release_tag == $release_tag and
              .source.unsigned_package_run_id == $unsigned_run and
              .source.unsigned_artifact_id == $unsigned_id and
              .source.unsigned_artifact_name == $unsigned_name and
              .source.unsigned_artifact_digest == $unsigned_digest and
              .signing_run.id == $native_run and
              .signing_run.attempt == 1 and
              .signing_run.workflow == ".github/workflows/native-package-signing.yml" and
              ($native_id > 0) and ($native_name | length > 0) and
              ($native_digest | test("^sha256:[0-9a-f]{64}$"))
          ' "${provenance}" >/dev/null
          rhel_provenance="${NATIVE_SIGNING_DIR}/rhel-package-owned/evidence/SIGNING_PROVENANCE.json"
          rhel_artifact_name="syswarden-rhel-package-owned-${RELEASE_TAG#v}"
          package_artifacts_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${UNSIGNED_RUN_ID}/artifacts" \
            -f per_page=100)"
          if [[ "$(jq '[.[] | .artifacts[]?] | length' <<< "${package_artifacts_json}")" != "2" ]]; then
            echo "ERROR: package.yml must expose exactly the standard and opt-in RHEL package artifacts." >&2
            exit 1
          fi
          rhel_artifact="$(jq --arg name "${rhel_artifact_name}" \
            --arg sha "${RELEASE_SHA}" --argjson run "${UNSIGNED_RUN_ID}" '[
              .[] | .artifacts[]? | select(
                .name == $name and .workflow_run.id == $run and
                .workflow_run.head_sha == $sha
              )
            ]' <<< "${package_artifacts_json}")"
          if [[ "$(jq 'length' <<< "${rhel_artifact}")" != "1" ]]; then
            echo "ERROR: the opt-in RHEL package artifact is absent or ambiguous." >&2
            exit 1
          fi
          rhel_artifact_id="$(jq -er '.[0].id | tostring' <<< "${rhel_artifact}")"
          rhel_artifact_digest="$(jq -er '.[0].digest' <<< "${rhel_artifact}")"
          if [[ ! "${rhel_artifact_id}" =~ ^[1-9][0-9]*$ || \
                ! "${rhel_artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ || \
                "$(jq -er '.[0].expired' <<< "${rhel_artifact}")" != "false" || \
                ! "$(jq -er '.[0].size_in_bytes | tostring' <<< "${rhel_artifact}")" =~ ^[1-9][0-9]*$ || \
                "${rhel_artifact_id}" == "${UNSIGNED_ARTIFACT_ID}" || \
                "${rhel_artifact_digest}" == "${UNSIGNED_ARTIFACT_DIGEST}" ]]; then
            echo "ERROR: the opt-in RHEL package artifact identity is unsafe." >&2
            exit 1
          fi
          jq -e --arg repository "${GITHUB_REPOSITORY}" \
            --arg release_sha "${RELEASE_SHA}" --arg release_tag "${RELEASE_TAG}" \
            --arg artifact_name "${rhel_artifact_name}" \
            --arg artifact_digest "${rhel_artifact_digest}" \
            --argjson artifact_id "${rhel_artifact_id}" \
            --argjson run_id "${UNSIGNED_RUN_ID}" '
              .schema_version == 1 and
              .profile == "syswarden-rhel-package-owned-signing/v4.10.0" and
              .package_role == "rhel-package-owned" and
              .repository == $repository and
              .status == "native-signatures-verified-not-release-qualified" and
              .public_release == false and .release_qualified == false and
              .updater_manifest_included == false and
              .source.release_sha == $release_sha and
              .source.release_tag == $release_tag and
              .source.unsigned_package_run_id == $run_id and
              .source.unsigned_artifact_id == $artifact_id and
              .source.unsigned_artifact_name == $artifact_name and
              .source.unsigned_artifact_digest == $artifact_digest and
              .rpm_identity == {
                architecture:"x86_64", filename:("syswarden-" + ($release_tag | ltrimstr("v")) + "-1.rhelpo.x86_64.rpm"),
                name:"syswarden", release:"1.rhelpo", version:($release_tag | ltrimstr("v"))
              }
            ' "${rhel_provenance}" >/dev/null
          version="${RELEASE_TAG#v}"
          install -m 0600 \
            "${NATIVE_SIGNING_DIR}/packages/syswarden-${version}-1.x86_64.rpm" \
            "${NATIVE_SIGNING_DIR}/packages/syswarden_${version}_amd64.deb" \
            "${NATIVE_SIGNING_DIR}/packages/syswarden_${version}_x86_64.apk" \
            "${CANDIDATE_PACKAGES_DIR}/"
          (
            cd "${CANDIDATE_PACKAGES_DIR}"
            sha256sum -- *.deb *.rpm *.apk | LC_ALL=C sort -k2 > SHA256SUMS.txt
            sha256sum --check --strict SHA256SUMS.txt
          )

      - name: Resolve Unique Protected Native Release Evidence
        id: native_evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          runs="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/native-release-evidence.yml/runs" \
            -f event=workflow_dispatch -f branch=main -f head_sha="${RELEASE_SHA}" -f per_page=100)"
          matches="$(jq --arg sha "${RELEASE_SHA}" '[.[] | .workflow_runs[]? | select(
            .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and
            .path == ".github/workflows/native-release-evidence.yml" and .run_attempt == 1 and
            .status == "completed" and .conclusion == "success")]' <<< "${runs}")"
          test "$(jq 'length' <<< "${matches}")" = "1"
          run_id="$(jq -r '.[0].id' <<< "${matches}")"
          artifact_name="syswarden-native-evidence-${RELEASE_TAG}-${RELEASE_SHA}"
          artifacts="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" -f per_page=100)"
          test "$(jq '[.[] | .artifacts[]?] | length' <<< "${artifacts}")" = "1"
          match="$(jq --arg name "${artifact_name}" --arg sha "${RELEASE_SHA}" --argjson run_id "${run_id}" \
            '[.[] | .artifacts[]? | select(.name == $name and .workflow_run.id == $run_id and .workflow_run.head_sha == $sha)]' <<< "${artifacts}")"
          test "$(jq 'length' <<< "${match}")" = "1"
          artifact_id="$(jq -r '.[0].id' <<< "${match}")"
          artifact_digest="$(jq -r '.[0].digest // ""' <<< "${match}")"
          test "$(jq -r '.[0].expired' <<< "${match}")" = "false"
          [[ "$(jq -r '.[0].size_in_bytes' <<< "${match}")" =~ ^[1-9][0-9]*$ ]]
          [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]
          [[ "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'run_id=%s\nartifact_id=%s\nartifact_name=%s\nartifact_digest=%s\n' \
            "${run_id}" "${artifact_id}" "${artifact_name}" "${artifact_digest}" >> "${GITHUB_OUTPUT}"

      - name: Download Exact Native Release Evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.native_evidence.outputs.artifact_id }}
          path: ${{ steps.workspace.outputs.native_release_evidence_dir }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.native_evidence.outputs.run_id }}

      - name: Revalidate Candidate-Bound Native Release Evidence
        shell: bash
        env:
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.native_evidence.outputs.artifact_digest }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.native_evidence.outputs.artifact_id }}
          EVIDENCE_RUN_ID: ${{ steps.native_evidence.outputs.run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          temporary="$(mktemp -d "${QUALIFICATION_ROOT}/native-evidence-verify.XXXXXXXXXX")"
          chmod 0700 "${temporary}"
          while IFS= read -r -d '' entry; do
            if [[ -L "${entry}" || "$(stat -c '%u' -- "${entry}")" != "$(id -u)" ]]; then
              echo "ERROR: downloaded native evidence contains a symlink or foreign owner." >&2
              exit 1
            fi
            if [[ -f "${entry}" ]]; then
              [[ "$(stat -c '%h' -- "${entry}")" == 1 && -s "${entry}" ]] || {
                echo "ERROR: downloaded native evidence file is empty or multiply linked." >&2
                exit 1
              }
            elif [[ ! -d "${entry}" ]]; then
              echo "ERROR: downloaded native evidence contains a special entry." >&2
              exit 1
            fi
          done < <(find -P "${NATIVE_RELEASE_EVIDENCE_DIR}" -mindepth 1 -print0)
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/ha_v2_native_evidence.py \
            --bundle "${NATIVE_RELEASE_EVIDENCE_DIR}/ha-v2" \
            --evidence "${NATIVE_RELEASE_EVIDENCE_DIR}/ha-v2/HA_V2_NATIVE_EVIDENCE.json" \
            --candidate-sha "${RELEASE_SHA}" --release-tag "${RELEASE_TAG}" \
            --output "${temporary}/HA_V2_NATIVE_VERDICT.json"
          cmp -- "${temporary}/HA_V2_NATIVE_VERDICT.json" "${NATIVE_RELEASE_EVIDENCE_DIR}/ha-v2/HA_V2_NATIVE_VERDICT.json"
          capability_args=()
          for profile in DEB-13 DEB-U2604 RPM-A10 APK-324 RPM-A9-RHELPO RPM-A10-RHELPO; do
            capability_args+=(--verdict "${NATIVE_RELEASE_EVIDENCE_DIR}/native-capability/${profile}.json")
          done
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/native_capability_evidence.py aggregate \
            --candidate-commit "${RELEASE_SHA}" "${capability_args[@]}" \
            --signing-bundle "${NATIVE_SIGNING_DIR}" \
            --output "${temporary}/CAPABILITY_AGGREGATE.json"
          cmp -- "${temporary}/CAPABILITY_AGGREGATE.json" "${NATIVE_RELEASE_EVIDENCE_DIR}/native-capability/AGGREGATE.json"
          python3 - "${NATIVE_RELEASE_EVIDENCE_DIR}/node01-migration/RAW_EVIDENCE.tar" "${temporary}/node01-migration" <<'PY'
          import pathlib, tarfile, sys
          archive, root = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          root.mkdir(mode=0o700)
          with tarfile.open(archive, mode="r:") as stream:
              members = stream.getmembers()
              if not members or len(members) > 256:
                  raise SystemExit("NODE01 evidence archive member count is invalid")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or any(part in {"", ".", ".."} for part in path.parts) or not (member.isdir() or member.isfile()):
                      raise SystemExit("NODE01 evidence archive contains an unsafe member")
                  target = root.joinpath(*path.parts)
                  if member.isdir():
                      target.mkdir(mode=0o700, parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                      source = stream.extractfile(member)
                      if source is None or member.size <= 0 or member.size > 1048576:
                          raise SystemExit("NODE01 evidence archive member size is invalid")
                      target.write_bytes(source.read()); target.chmod(0o600)
          PY
          signing_provenance="${NATIVE_SIGNING_DIR}/evidence/NATIVE_SIGNING_PROVENANCE.json"
          rhel_signing_provenance="${NATIVE_SIGNING_DIR}/rhel-package-owned/evidence/SIGNING_PROVENANCE.json"
          candidate_version="${RELEASE_TAG#v}"
          attested_native_identities="$(jq -ce '
            def exact_key:
              if type == "object" and
                 (keys | sort) == ["fingerprint","id","public_key","public_key_sha256"] and
                 (.id | type == "string" and test("^[a-z0-9][a-z0-9._-]{0,63}$")) and
                 (.public_key | type == "string" and length > 0) and
                 (.public_key_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
              then .
              else error("native signing provenance key identity is malformed")
              end;
            {
              rpm: (.rpm_signature.key | exact_key),
              apk: (.apk_signature.key | exact_key),
              deb: (.deb_signature.key | exact_key)
            }
            | if (.rpm.fingerprint | type == "string" and test("^[0-9A-F]{40}$")) and
                 (.deb.fingerprint | type == "string" and test("^[0-9A-F]{40}$")) and
                 (.apk.fingerprint | type == "string" and test("^[0-9a-f]{64}$")) and
                 .apk.fingerprint == .apk.public_key_sha256 and
                 .rpm.id != .apk.id and .rpm.id != .deb.id and .apk.id != .deb.id and
                 .rpm.public_key_sha256 != .apk.public_key_sha256 and
                 .rpm.public_key_sha256 != .deb.public_key_sha256 and
                 .apk.public_key_sha256 != .deb.public_key_sha256 and
                 .rpm.fingerprint != .deb.fingerprint
              then .
              else error("native signing provenance identities are invalid or ambiguous")
              end
          ' "${signing_provenance}")"
          attested_standard_packages="$(jq -ce \
            --arg rpm_name "syswarden-${candidate_version}-1.x86_64.rpm" \
            --arg deb_name "syswarden_${candidate_version}_amd64.deb" \
            --arg apk_name "syswarden_${candidate_version}_x86_64.apk" '
            def exact_package($name):
              if type == "object" and
                 (keys | sort) == ["name","sha256","size"] and
                 .name == $name and
                 (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
                 (.size | type == "number" and floor == . and . > 0 and . <= 268435456)
              then . else error("native signing provenance package record is malformed") end;
            def exactly_one($name):
              [.packages.signed[] | select(type == "object" and .name == $name)] |
              if length == 1 then (.[0] | exact_package($name))
              else error("native signing provenance package record is missing or ambiguous") end;
            {rpm: exactly_one($rpm_name), deb: exactly_one($deb_name), apk: exactly_one($apk_name)}
          ' "${signing_provenance}")"
          attested_rhel_package="$(jq -ce \
            --arg rpm_name "syswarden-${candidate_version}-1.rhelpo.x86_64.rpm" '
            def exact_package($name):
              if type == "object" and
                 (keys | sort) == ["name","sha256","size"] and
                 .name == $name and
                 (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
                 (.size | type == "number" and floor == . and . > 0 and . <= 268435456)
              then . else error("RHEL package-owned signing provenance package record is malformed") end;
            .packages.signed | exact_package($rpm_name)
          ' "${rhel_signing_provenance}")"
          rpm_signer_fingerprint="$(jq -er '.rpm.fingerprint' \
            <<< "${attested_native_identities}")"
          deb_signer_fingerprint="$(jq -er '.deb.fingerprint' \
            <<< "${attested_native_identities}")"
          apk_public_key_sha256="$(jq -er '.apk.public_key_sha256' \
            <<< "${attested_native_identities}")"
          rpm_package_name="$(jq -er '.rpm.name' <<< "${attested_standard_packages}")"
          rpm_package_sha256="$(jq -er '.rpm.sha256' <<< "${attested_standard_packages}")"
          rpm_package_size="$(jq -er '.rpm.size' <<< "${attested_standard_packages}")"
          deb_package_name="$(jq -er '.deb.name' <<< "${attested_standard_packages}")"
          deb_package_sha256="$(jq -er '.deb.sha256' <<< "${attested_standard_packages}")"
          deb_package_size="$(jq -er '.deb.size' <<< "${attested_standard_packages}")"
          apk_package_name="$(jq -er '.apk.name' <<< "${attested_standard_packages}")"
          apk_package_sha256="$(jq -er '.apk.sha256' <<< "${attested_standard_packages}")"
          apk_package_size="$(jq -er '.apk.size' <<< "${attested_standard_packages}")"
          rhel_rpm_package_name="$(jq -er '.name' <<< "${attested_rhel_package}")"
          rhel_rpm_package_sha256="$(jq -er '.sha256' <<< "${attested_rhel_package}")"
          rhel_rpm_package_size="$(jq -er '.size' <<< "${attested_rhel_package}")"
          test "${rhel_rpm_package_name}" != "${rpm_package_name}"
          test "${rhel_rpm_package_sha256}" != "${rpm_package_sha256}"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/node01_migration_evidence.py validate \
            --evidence "${NATIVE_RELEASE_EVIDENCE_DIR}/node01-migration/EVIDENCE.json" \
            --artifact-root "${temporary}/node01-migration/artifacts" \
            --candidate-sha "${RELEASE_SHA}" --release-tag "${RELEASE_TAG}" \
            --openpgp-fingerprint "${deb_signer_fingerprint}" \
            --candidate-package-name "${deb_package_name}" \
            --candidate-package-sha256 "${deb_package_sha256}" \
            --candidate-package-size "${deb_package_size}" \
            --output "${temporary}/NODE01_MIGRATION_VERDICT.json"
          cmp -- "${temporary}/NODE01_MIGRATION_VERDICT.json" \
            "${NATIVE_RELEASE_EVIDENCE_DIR}/node01-migration/VERDICT.json"
          python3 - "${NATIVE_RELEASE_EVIDENCE_DIR}/native-lifecycle/RAW_EVIDENCE.tar" "${temporary}/native-lifecycle" <<'PY'
          import pathlib, tarfile, sys
          archive, root = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          root.mkdir(mode=0o700)
          with tarfile.open(archive, mode="r:") as stream:
              members = stream.getmembers()
              if not members or len(members) > 192:
                  raise SystemExit("native lifecycle evidence archive member count is invalid")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or any(part in {"", ".", ".."} for part in path.parts) or not (member.isdir() or member.isfile()):
                      raise SystemExit("native lifecycle evidence archive contains an unsafe member")
                  target = root.joinpath(*path.parts)
                  if member.isdir():
                      target.mkdir(mode=0o700, parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                      source = stream.extractfile(member)
                      if source is None or member.size <= 0 or member.size > 1048576:
                          raise SystemExit("native lifecycle evidence archive member size is invalid")
                      target.write_bytes(source.read()); target.chmod(0o600)
          PY
          node02_lifecycle="${temporary}/native-lifecycle/node02-ubuntu26.04.json"
          node04_lifecycle="${temporary}/native-lifecycle/node04-alpine3.24.json"
          node05_lifecycle="${temporary}/native-lifecycle/node05-almalinux9.8.json"
          node05_rhelpo_lifecycle="${temporary}/native-lifecycle/node05-almalinux9.8-rhelpo.json"
          node03_rhelpo_lifecycle="${temporary}/native-lifecycle/node03-almalinux10.2-rhelpo.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/native_lifecycle_evidence.py \
            --candidate-commit "${RELEASE_SHA}" \
            --observation "${node02_lifecycle}" --observation "${node04_lifecycle}" \
            --observation "${node05_lifecycle}" --observation "${node05_rhelpo_lifecycle}" \
            --observation "${node03_rhelpo_lifecycle}" \
            --artifact-root "${temporary}/native-lifecycle/artifacts" \
            --rpm-signer-fingerprint "${rpm_signer_fingerprint}" \
            --deb-signer-fingerprint "${deb_signer_fingerprint}" \
            --apk-public-key-sha256 "${apk_public_key_sha256}" \
            --rpm-package-name "${rpm_package_name}" \
            --rpm-package-sha256 "${rpm_package_sha256}" \
            --rpm-package-size "${rpm_package_size}" \
            --rhel-rpm-package-name "${rhel_rpm_package_name}" \
            --rhel-rpm-package-sha256 "${rhel_rpm_package_sha256}" \
            --rhel-rpm-package-size "${rhel_rpm_package_size}" \
            --deb-package-name "${deb_package_name}" \
            --deb-package-sha256 "${deb_package_sha256}" \
            --deb-package-size "${deb_package_size}" \
            --apk-package-name "${apk_package_name}" \
            --apk-package-sha256 "${apk_package_sha256}" \
            --apk-package-size "${apk_package_size}" \
            --node02-ssh-host-key-sha256 "$(jq -er '.host.ssh_host_key_sha256' "${node02_lifecycle}")" \
            --node03-ssh-host-key-sha256 "$(jq -er '.host.ssh_host_key_sha256' "${node03_rhelpo_lifecycle}")" \
            --node04-ssh-host-key-sha256 "$(jq -er '.host.ssh_host_key_sha256' "${node04_lifecycle}")" \
            --node05-ssh-host-key-sha256 "$(jq -er '.host.ssh_host_key_sha256' "${node05_lifecycle}")" \
            --output "${temporary}/NATIVE_LIFECYCLE_VERDICT.json"
          cmp -- "${temporary}/NATIVE_LIFECYCLE_VERDICT.json" \
            "${NATIVE_RELEASE_EVIDENCE_DIR}/native-lifecycle/VERDICT.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/native_lifecycle_bundle_verify.py \
            --bundle "${NATIVE_RELEASE_EVIDENCE_DIR}/native-lifecycle" \
            --signing-evidence "${NATIVE_SIGNING_DIR}/evidence" \
            --candidate-commit "${RELEASE_SHA}" \
            --node02-ssh-host-key-sha256 "$(jq -er '.trusted_host_keys.node02' "${NATIVE_RELEASE_EVIDENCE_DIR}/NATIVE_RELEASE_EVIDENCE_MANIFEST.json")" \
            --node03-ssh-host-key-sha256 "$(jq -er '.trusted_host_keys.node03' "${NATIVE_RELEASE_EVIDENCE_DIR}/NATIVE_RELEASE_EVIDENCE_MANIFEST.json")" \
            --node04-ssh-host-key-sha256 "$(jq -er '.trusted_host_keys.node04' "${NATIVE_RELEASE_EVIDENCE_DIR}/NATIVE_RELEASE_EVIDENCE_MANIFEST.json")" \
            --node05-ssh-host-key-sha256 "$(jq -er '.trusted_host_keys.node05' "${NATIVE_RELEASE_EVIDENCE_DIR}/NATIVE_RELEASE_EVIDENCE_MANIFEST.json")"
          gh attestation verify "${NATIVE_RELEASE_EVIDENCE_DIR}/NATIVE_RELEASE_EVIDENCE_MANIFEST.json" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null
          python3 - "${NATIVE_RELEASE_EVIDENCE_DIR}" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / "NATIVE_RELEASE_EVIDENCE_MANIFEST.json").read_text(encoding="utf-8"))
          actual = []
          for path in sorted(p for p in root.rglob("*") if p.is_file() and p.name != "NATIVE_RELEASE_EVIDENCE_MANIFEST.json"):
              actual.append({"path": path.relative_to(root).as_posix(), "sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "size": path.stat().st_size})
          if manifest.get("files") != actual:
              raise SystemExit("native evidence manifest inventory or digest mismatch")
          PY
          ha_contract="$(sha256sum scripts/ci/ha_v2_native_contract_v4.10.0.json | awk '{print $1}')"
          capability_contract="$(sha256sum scripts/ci/native_capability_contract_v4.10.0.json | awk '{print $1}')"
          performance_contract="$(sha256sum scripts/ci/performance_contract_v4.10.0.json | awk '{print $1}')"
          source_allocation_contract="$(sha256sum scripts/ci/source_allocation_contract_v4.10.0.json | awk '{print $1}')"
          node01_contract="$(sha256sum scripts/ci/node01_migration_contract_v4.10.0.json | awk '{print $1}')"
          lifecycle_contract="$(sha256sum scripts/ci/native_lifecycle_contract_v4.10.0.json | awk '{print $1}')"
          signing_provenance_sha256="$(sha256sum "${signing_provenance}" | awk '{print $1}')"
          rhel_signing_provenance_sha256="$(sha256sum "${rhel_signing_provenance}" | awk '{print $1}')"
          signature_policy_sha256="$(sha256sum scripts/ci/native_package_signature_policy_v4100.json | awk '{print $1}')"
          jq -e --arg repository "${GITHUB_REPOSITORY}" --arg release_tag "${RELEASE_TAG}" \
            --arg release_sha "${RELEASE_SHA}" --argjson run_id "${EVIDENCE_RUN_ID}" \
            --arg ha_contract "${ha_contract}" --arg capability_contract "${capability_contract}" \
            --arg performance_contract "${performance_contract}" \
            --arg source_allocation_contract "${source_allocation_contract}" \
            --arg node01_contract "${node01_contract}" --arg lifecycle_contract "${lifecycle_contract}" \
            --arg signing_provenance_sha256 "${signing_provenance_sha256}" \
            --arg rhel_signing_provenance_sha256 "${rhel_signing_provenance_sha256}" \
            --arg signature_policy_sha256 "${signature_policy_sha256}" \
            --argjson selected_keys "${attested_native_identities}" \
            --argjson rhel_package "${attested_rhel_package}" '
            (keys | sort) == ["contracts","files","native_signing","release_sha","release_tag","repository","run_attempt","run_id","schema_version","trusted_host_keys"] and
            .schema_version == 2 and .repository == $repository and .release_tag == $release_tag and
            .release_sha == $release_sha and .run_id == $run_id and .run_attempt == 1 and
            (.trusted_host_keys | keys | sort) == ["node02","node03","node04","node05"] and
            (.trusted_host_keys.node02 | test("^SHA256:[A-Za-z0-9+/]{43}$")) and
            (.trusted_host_keys.node03 | test("^SHA256:[A-Za-z0-9+/]{43}$")) and
            (.trusted_host_keys.node04 | test("^SHA256:[A-Za-z0-9+/]{43}$")) and
            (.trusted_host_keys.node05 | test("^SHA256:[A-Za-z0-9+/]{43}$")) and
            .trusted_host_keys.node02 != .trusted_host_keys.node03 and
            .trusted_host_keys.node02 != .trusted_host_keys.node04 and
            .trusted_host_keys.node02 != .trusted_host_keys.node05 and
            .trusted_host_keys.node03 != .trusted_host_keys.node04 and
            .trusted_host_keys.node03 != .trusted_host_keys.node05 and
            .trusted_host_keys.node04 != .trusted_host_keys.node05 and
            .native_signing == {
              policy_sha256:$signature_policy_sha256,
              provenance_sha256:$signing_provenance_sha256,
              rhel_package_owned:{
                package:$rhel_package,
                provenance_sha256:$rhel_signing_provenance_sha256,
                selected_rpm_key:$selected_keys.rpm,
                status:"native-signatures-verified-not-release-qualified",
                updater_manifest_included:false
              },
              selected_keys:$selected_keys,
              status:"native-signatures-verified-not-release-qualified"
            } and
            .contracts == {ha_v2:$ha_contract,native_capability:$capability_contract,performance:$performance_contract,source_allocation:$source_allocation_contract,node01_migration:$node01_contract,native_lifecycle:$lifecycle_contract}
          ' "${NATIVE_RELEASE_EVIDENCE_DIR}/NATIVE_RELEASE_EVIDENCE_MANIFEST.json" >/dev/null
          jq -n -S --arg repository "${GITHUB_REPOSITORY}" --arg release_tag "${RELEASE_TAG}" \
            --arg release_sha "${RELEASE_SHA}" --arg artifact_digest "${EVIDENCE_ARTIFACT_DIGEST}" \
            --argjson run_id "${EVIDENCE_RUN_ID}" --argjson artifact_id "${EVIDENCE_ARTIFACT_ID}" \
            '{schema_version:1,repository:$repository,release_tag:$release_tag,release_sha:$release_sha,
              source_run_id:$run_id,source_artifact_id:$artifact_id,source_artifact_digest:$artifact_digest}' \
            > "${NATIVE_RELEASE_EVIDENCE_DIR}/QUALIFICATION_BINDING.json"
          chmod -R go-rwx "${NATIVE_RELEASE_EVIDENCE_DIR}"
          # Artifact transport does not preserve producer modes. Restore only the
          # reviewed validation modes after the exact bytes and attestation pass.
          chmod 0700 \
            "${NATIVE_RELEASE_EVIDENCE_DIR}/source-allocation/baseline-probe" \
            "${NATIVE_RELEASE_EVIDENCE_DIR}/source-allocation/candidate-probe"
          performance_adapter_config="${temporary}/ADAPTER_CONFIG.json"
          install -m 0600 -- \
            "${NATIVE_RELEASE_EVIDENCE_DIR}/performance/ADAPTER_CONFIG.json" \
            "${performance_adapter_config}"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/performance_gate.py \
            --evidence "${NATIVE_RELEASE_EVIDENCE_DIR}/performance/EVIDENCE.json" \
            --adapter-config "${performance_adapter_config}" \
            --native-lifecycle-verdict "${NATIVE_RELEASE_EVIDENCE_DIR}/native-lifecycle/VERDICT.json" \
            --candidate-commit "${RELEASE_SHA}" --report "${temporary}/PERFORMANCE_REPORT.json"
          cmp -- "${temporary}/PERFORMANCE_REPORT.json" \
            "${NATIVE_RELEASE_EVIDENCE_DIR}/performance/REPORT.json"
          allocation_bundle="${NATIVE_RELEASE_EVIDENCE_DIR}/source-allocation"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/source_allocation_gate.py validate \
            --contract scripts/ci/source_allocation_contract_v4.10.0.json \
            --bundle-root "${allocation_bundle}" --candidate-commit "${RELEASE_SHA}" \
            --evidence "${allocation_bundle}/EVIDENCE.json" \
            --report "${allocation_bundle}/REPORT.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/performance_channel_aggregate.py \
            --native-contract scripts/ci/performance_contract_v4.10.0.json \
            --allocation-contract scripts/ci/source_allocation_contract_v4.10.0.json \
            --native-evidence "${NATIVE_RELEASE_EVIDENCE_DIR}/performance/EVIDENCE.json" \
            --native-report "${NATIVE_RELEASE_EVIDENCE_DIR}/performance/REPORT.json" \
            --adapter-config "${performance_adapter_config}" \
            --native-lifecycle-verdict "${NATIVE_RELEASE_EVIDENCE_DIR}/native-lifecycle/VERDICT.json" \
            --allocation-evidence "${allocation_bundle}/EVIDENCE.json" \
            --allocation-report "${allocation_bundle}/REPORT.json" \
            --candidate-commit "${RELEASE_SHA}" \
            --output "${temporary}/PERFORMANCE_AGGREGATE.json"
          cmp -- "${temporary}/PERFORMANCE_AGGREGATE.json" \
            "${NATIVE_RELEASE_EVIDENCE_DIR}/performance/AGGREGATE.json"

      - name: Derive Explicit Go Toolchain Release Verdict
        shell: bash
        env:
          GO127_ARTIFACT_DIGEST: ${{ steps.go127.outputs.artifact_digest }}
          GO127_ARTIFACT_ID: ${{ steps.go127.outputs.artifact_id }}
          GO127_ARTIFACT_NAME: ${{ steps.go127.outputs.artifact_name }}
          GO127_RUN_ID: ${{ steps.go127.outputs.run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          diff -u <(printf '%s\n' evaluation.json) \
            <(find "${GO127_EVIDENCE_DIR}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n')
          test -z "$(find "${GO127_EVIDENCE_DIR}" -mindepth 1 ! -type f -print -quit)"
          pinned_toolchain="go$(awk '$1 == "go" {print $2}' go.work)"
          test "$(grep -R -h '^go ' src/core/*/go.mod scripts/versionctl/go.mod | LC_ALL=C sort -u)" = \
            "go ${pinned_toolchain#go}"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/go_toolchain_release_verdict.py \
            --evidence "${GO127_EVIDENCE_DIR}/evaluation.json" \
            --metadata scripts/ci/go_toolchain_evaluation.json \
            --release-sha "${RELEASE_SHA}" --release-tag "${RELEASE_TAG}" \
            --pinned-toolchain "${pinned_toolchain}" --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GO127_RUN_ID}" --artifact-id "${GO127_ARTIFACT_ID}" \
            --artifact-name "${GO127_ARTIFACT_NAME}" \
            --artifact-digest "${GO127_ARTIFACT_DIGEST}" \
            --output "${GO127_EVIDENCE_DIR}/RELEASE_VERDICT.json"
          jq -e '.status == "pass" and
            (.decision == "defer-go1.27-keep-go1.26.6" or .decision == "adopt-go1.27.1")' \
            "${GO127_EVIDENCE_DIR}/RELEASE_VERDICT.json" >/dev/null
          chmod -R go-rwx "${GO127_EVIDENCE_DIR}"

      - name: Resolve Signed Update Contract
        id: update_contract
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          required="$(PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            requires-signed-update --tag "${RELEASE_TAG}")"
          if [[ "${required}" != "true" && "${required}" != "false" ]]; then
            echo "ERROR: signed update contract returned invalid state ${required}." >&2
            exit 1
          fi
          echo "required=${required}" >> "${GITHUB_OUTPUT}"

      - name: Download Latest Public Previous Packages by Asset ID
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          set -euo pipefail
          umask 077
          previous_version="${PREVIOUS_TAG#v}"
          release_json="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/releases/latest")"
          release_id="$(jq -r '.id' <<< "${release_json}")"
          if [[ "$(jq -r '.tag_name' <<< "${release_json}")" != "${PREVIOUS_TAG}" || \
                "$(jq -r '.draft' <<< "${release_json}")" != "false" || \
                "$(jq -r '.prerelease' <<< "${release_json}")" != "false" || \
                "$(jq -r '.published_at // ""' <<< "${release_json}")" == "" || \
                ! "${release_id}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: previous_tag must be the latest non-draft, non-prerelease public release." >&2
            exit 1
          fi
          assets_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            -f per_page=100)"
          matrix_path="${GITHUB_WORKSPACE}/${QUALIFICATION_MATRIX_PATH}"
          baseline_release="$(jq -er '.package_sources.baseline.release' "${matrix_path}")"
          baseline_commit="$(jq -er '.package_sources.baseline.commit' "${matrix_path}")"
          baseline_release_id="$(jq -er '.package_sources.baseline.release_id' "${matrix_path}")"
          previous_commit="$(git rev-parse --verify "refs/tags/${PREVIOUS_TAG}^{commit}")"
          if [[ "${PREVIOUS_TAG}" != "${baseline_release}" || \
                "${release_id}" != "${baseline_release_id}" || \
                "${previous_commit}" != "${baseline_commit}" || \
                "$(jq '.package_sources.baseline.assets | length' "${matrix_path}")" != "4" ]]; then
            echo "ERROR: previous release identity differs from the frozen baseline." >&2
            exit 1
          fi
          transition_required=false
          transition_metadata="${TRANSITION_DIR}/public-release-assets.json"
          transition_source_manifest="${TRANSITION_DIR}/public-SHA256SUMS.txt"
          transition_provenance="${TRANSITION_DIR}/v4.02.8-linux-transition.json"
          if [[ "${PREVIOUS_TAG}" == "v4.02.8" ]]; then
            transition_required=true
            jq -cS '[.[] | .[] | {digest, id, name, size, state}]' \
              <<< "${assets_json}" > "${transition_metadata}"
            chmod 0600 "${transition_metadata}"
          fi

          expected_assets=(
            "syswarden_${previous_version}_amd64.deb"
            "syswarden-${previous_version}-1.x86_64.rpm"
            "syswarden_${previous_version}_x86_64.apk"
            "SHA256SUMS.txt"
          )
          asset_records='[]'
          for asset_name in "${expected_assets[@]}"; do
            matches="$(jq --arg name "${asset_name}" '[
              .[] | .[] | select(.name == $name)
            ]' <<< "${assets_json}")"
            if [[ "$(jq 'length' <<< "${matches}")" != "1" ]]; then
              echo "ERROR: previous release asset ${asset_name} is absent or ambiguous." >&2
              exit 1
            fi
            asset_id="$(jq -r '.[0].id' <<< "${matches}")"
            asset_state="$(jq -r '.[0].state' <<< "${matches}")"
            asset_size="$(jq -r '.[0].size' <<< "${matches}")"
            expected_asset="$(jq -ce --arg name "${asset_name}" '
              [.package_sources.baseline.assets[] | select(.name == $name)]
              | if length == 1 then .[0]
                else error("baseline asset is absent or ambiguous") end
            ' "${matrix_path}")"
            expected_asset_id="$(jq -r '.id' <<< "${expected_asset}")"
            expected_asset_size="$(jq -r '.size' <<< "${expected_asset}")"
            expected_asset_sha256="$(jq -r '.sha256' <<< "${expected_asset}")"
            if [[ ! "${asset_id}" =~ ^[0-9]+$ || \
                  "${asset_state}" != "uploaded" || \
                  ! "${asset_size}" =~ ^[1-9][0-9]*$ || \
                  "${asset_id}" != "${expected_asset_id}" || \
                  "${asset_size}" != "${expected_asset_size}" ]]; then
              echo "ERROR: previous release asset ${asset_name} identity/size differs from the frozen uploaded asset." >&2
              exit 1
            fi
            destination="${PREVIOUS_PACKAGES_DIR}/${asset_name}"
            if [[ "${transition_required}" == "true" && \
                  "${asset_name}" == "SHA256SUMS.txt" ]]; then
              destination="${transition_source_manifest}"
            fi
            gh api --method GET \
              -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "${destination}"
            test -s "${destination}"
            test -f "${destination}"
            test ! -L "${destination}"
            if [[ "$(stat -c '%s' "${destination}")" != "${expected_asset_size}" || \
                  "$(sha256sum "${destination}" | awk '{print $1}')" != \
                    "${expected_asset_sha256}" ]]; then
              echo "ERROR: previous release asset ${asset_name} bytes differ from the frozen baseline." >&2
              exit 1
            fi
            chmod 0600 "${destination}"
            asset_records="$(jq \
              --arg name "${asset_name}" \
              --argjson id "${asset_id}" \
              '. + [{name: $name, id: $id}]' \
              <<< "${asset_records}")"
          done
          printf 'commit_sha=%s\n' "${previous_commit}" >> "${GITHUB_OUTPUT}"
          printf 'release_id=%s\n' "${release_id}" >> "${GITHUB_OUTPUT}"
          printf 'asset_ids=%s\n' "$(jq -c -S . <<< "${asset_records}")" \
            >> "${GITHUB_OUTPUT}"

          if [[ "${transition_required}" == "true" ]]; then
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
              normalize-v4028-linux-packages \
              --repository "${GITHUB_REPOSITORY}" \
              --release-id "${release_id}" \
              --tag "${PREVIOUS_TAG}" \
              --source-manifest "${transition_source_manifest}" \
              --asset-metadata "${transition_metadata}" \
              --packages "${PREVIOUS_PACKAGES_DIR}" \
              --output-manifest "${PREVIOUS_PACKAGES_DIR}/SHA256SUMS.txt" \
              --provenance-output "${transition_provenance}"
            cat "${transition_provenance}"
            sha256sum "${transition_provenance}"
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            verify-packages \
            --tag "${PREVIOUS_TAG}" \
            --packages "${PREVIOUS_PACKAGES_DIR}"

      - name: Record Qualification Provenance Context
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact_digest }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          NATIVE_ARTIFACT_DIGEST: ${{ steps.native_candidate.outputs.artifact_digest }}
          NATIVE_ARTIFACT_ID: ${{ steps.native_candidate.outputs.artifact_id }}
          NATIVE_ARTIFACT_NAME: ${{ steps.native_candidate.outputs.artifact_name }}
          NATIVE_RUN_ID: ${{ steps.native_candidate.outputs.run_id }}
          NATIVE_EVIDENCE_ARTIFACT_DIGEST: ${{ steps.native_evidence.outputs.artifact_digest }}
          NATIVE_EVIDENCE_ARTIFACT_ID: ${{ steps.native_evidence.outputs.artifact_id }}
          NATIVE_EVIDENCE_ARTIFACT_NAME: ${{ steps.native_evidence.outputs.artifact_name }}
          NATIVE_EVIDENCE_RUN_ID: ${{ steps.native_evidence.outputs.run_id }}
          GO127_ARTIFACT_DIGEST: ${{ steps.go127.outputs.artifact_digest }}
          GO127_ARTIFACT_ID: ${{ steps.go127.outputs.artifact_id }}
          GO127_ARTIFACT_NAME: ${{ steps.go127.outputs.artifact_name }}
          GO127_RUN_ID: ${{ steps.go127.outputs.run_id }}
          PREVIOUS_ASSET_IDS: ${{ steps.previous.outputs.asset_ids }}
          PREVIOUS_COMMIT_SHA: ${{ steps.previous.outputs.commit_sha }}
          PREVIOUS_RELEASE_ID: ${{ steps.previous.outputs.release_id }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          jq -n -S \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg previous_tag "${PREVIOUS_TAG}" \
            --arg previous_commit_sha "${PREVIOUS_COMMIT_SHA}" \
            --argjson candidate_run_id "${CANDIDATE_RUN_ID}" \
            --argjson candidate_artifact_id "${CANDIDATE_ARTIFACT_ID}" \
            --arg candidate_artifact_name "${CANDIDATE_ARTIFACT_NAME}" \
            --arg candidate_artifact_digest "${CANDIDATE_ARTIFACT_DIGEST}" \
            --arg native_artifact_digest "${NATIVE_ARTIFACT_DIGEST}" \
            --argjson native_artifact_id "${NATIVE_ARTIFACT_ID}" \
            --arg native_artifact_name "${NATIVE_ARTIFACT_NAME}" \
            --argjson native_run_id "${NATIVE_RUN_ID}" \
            --arg native_evidence_artifact_digest "${NATIVE_EVIDENCE_ARTIFACT_DIGEST}" \
            --argjson native_evidence_artifact_id "${NATIVE_EVIDENCE_ARTIFACT_ID}" \
            --arg native_evidence_artifact_name "${NATIVE_EVIDENCE_ARTIFACT_NAME}" \
            --argjson native_evidence_run_id "${NATIVE_EVIDENCE_RUN_ID}" \
            --arg go127_artifact_digest "${GO127_ARTIFACT_DIGEST}" \
            --argjson go127_artifact_id "${GO127_ARTIFACT_ID}" \
            --arg go127_artifact_name "${GO127_ARTIFACT_NAME}" \
            --argjson go127_run_id "${GO127_RUN_ID}" \
            --argjson previous_release_id "${PREVIOUS_RELEASE_ID}" \
            --argjson previous_asset_ids "${PREVIOUS_ASSET_IDS}" \
            '{
              schema_version: 5,
              repository: $repository,
              release_tag: $release_tag,
              release_sha: $release_sha,
              previous_tag: $previous_tag,
              previous_commit_sha: $previous_commit_sha,
              candidate_package_workflow: "package.yml",
              candidate_package_run_id: $candidate_run_id,
              candidate_package_artifact_id: $candidate_artifact_id,
              candidate_package_artifact_name: $candidate_artifact_name,
              candidate_package_artifact_digest: $candidate_artifact_digest,
              native_signing_workflow: "native-package-signing.yml",
              native_signing_run_id: $native_run_id,
              native_signing_artifact_id: $native_artifact_id,
              native_signing_artifact_name: $native_artifact_name,
              native_signing_artifact_digest: $native_artifact_digest,
              native_evidence_workflow: "native-release-evidence.yml",
              native_evidence_run_id: $native_evidence_run_id,
              native_evidence_artifact_id: $native_evidence_artifact_id,
              native_evidence_artifact_name: $native_evidence_artifact_name,
              native_evidence_artifact_digest: $native_evidence_artifact_digest,
              go127_workflow: "go-127-evaluation.yml",
              go127_run_id: $go127_run_id,
              go127_artifact_id: $go127_artifact_id,
              go127_artifact_name: $go127_artifact_name,
              go127_artifact_digest: $go127_artifact_digest,
              previous_release_id: $previous_release_id,
              previous_package_asset_ids: $previous_asset_ids
            }' > "${ARTIFACT_ROOT}/qualification-context.json"
          chmod 0600 "${ARTIFACT_ROOT}/qualification-context.json"

      - name: Run and Aggregate Native AMD64 Package Lifecycle Shard
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          PREVIOUS_RELEASE_ID: ${{ steps.previous.outputs.release_id }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${PACKAGE_TMP_DIR:-}"
          test "${PACKAGE_TMP_DIR}" = "${QUALIFICATION_ROOT}/package-tmp"
          test -d "${QUALIFICATION_ROOT}"
          test ! -L "${QUALIFICATION_ROOT}"
          [[ -O "${QUALIFICATION_ROOT}" ]]
          test "$(stat -c '%a' "${QUALIFICATION_ROOT}")" = "700"
          test -d "${PACKAGE_TMP_DIR}"
          test ! -L "${PACKAGE_TMP_DIR}"
          [[ -O "${PACKAGE_TMP_DIR}" ]]
          test "$(stat -c '%a' "${PACKAGE_TMP_DIR}")" = "700"
          package_tmp_probe="$(mktemp \
            "${PACKAGE_TMP_DIR}/.write-probe.XXXXXX")"
          test -f "${package_tmp_probe}"
          test ! -L "${package_tmp_probe}"
          rm -f -- "${package_tmp_probe}"
          test ! -e "${package_tmp_probe}"
          common_binding_arguments=(
            --qualification-repository "${GITHUB_REPOSITORY}"
            --qualification-release-sha "${RELEASE_SHA}"
            --qualification-release-tag "${RELEASE_TAG}"
            --qualification-previous-tag "${PREVIOUS_TAG}"
            --qualification-workflow-run-id "${GITHUB_RUN_ID}"
            --qualification-workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"
            --qualification-candidate-run-id "${CANDIDATE_RUN_ID}"
            --qualification-candidate-artifact-id "${CANDIDATE_ARTIFACT_ID}"
            --qualification-candidate-artifact-name "${CANDIDATE_ARTIFACT_NAME}"
            --qualification-previous-release-id "${PREVIOUS_RELEASE_ID}"
          )
          set +e
          TMPDIR="${PACKAGE_TMP_DIR}" \
          TMP="${PACKAGE_TMP_DIR}" \
          TEMP="${PACKAGE_TMP_DIR}" \
          GOTMPDIR="${PACKAGE_TMP_DIR}" \
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/package_lifecycle_lab.py \
            --packages-dir "${CANDIDATE_PACKAGES_DIR}" \
            --previous-packages-dir "${PREVIOUS_PACKAGES_DIR}" \
            --package-tmp-dir "${PACKAGE_TMP_DIR}" \
            --qualification-matrix "${GITHUB_WORKSPACE}/${QUALIFICATION_MATRIX_PATH}" \
            --expected-target-release "${RELEASE_TAG}" \
            --architecture-shard amd64 \
            "${common_binding_arguments[@]}" \
            --pull-policy never \
            --output "${RAW_DIR}/package-lifecycle-amd64.json" \
            --pretty
          amd64_rc=$?
          TMPDIR="${PACKAGE_TMP_DIR}" \
          TMP="${PACKAGE_TMP_DIR}" \
          TEMP="${PACKAGE_TMP_DIR}" \
          GOTMPDIR="${PACKAGE_TMP_DIR}" \
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/package_lifecycle_lab.py \
            --packages-dir "${CANDIDATE_PACKAGES_DIR}" \
            --previous-packages-dir "${PREVIOUS_PACKAGES_DIR}" \
            --qualification-matrix "${GITHUB_WORKSPACE}/${QUALIFICATION_MATRIX_PATH}" \
            --expected-target-release "${RELEASE_TAG}" \
            --aggregate-amd64-report "${RAW_DIR}/package-lifecycle-amd64.json" \
            "${common_binding_arguments[@]}" \
            --output "${RAW_DIR}/package-lifecycle-raw.json" \
            --pretty
          aggregate_rc=$?
          set -e
          if [[ "${aggregate_rc}" -eq 0 && "${amd64_rc}" -ne 0 ]]; then
            echo "ERROR: a native shard returned nonzero while the aggregate claimed success." >&2
            aggregate_rc=97
          fi
          printf '%s\n' "${amd64_rc}" > "${STATUS_DIR}/package-lab-amd64.rc"
          printf '%s\n' "${aggregate_rc}" > "${STATUS_DIR}/package-lab.rc"
          chmod 0600 \
            "${STATUS_DIR}/package-lab-amd64.rc" \
            "${STATUS_DIR}/package-lab.rc"

      - name: Run Isolated nftables Kernel Laboratory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${NFTABLES_TMP_DIR:-}"
          test "${NFTABLES_TMP_DIR}" = "${QUALIFICATION_ROOT}/nftables-tmp"
          test -d "${QUALIFICATION_ROOT}"
          test ! -L "${QUALIFICATION_ROOT}"
          [[ -O "${QUALIFICATION_ROOT}" ]]
          test "$(stat -c '%a' "${QUALIFICATION_ROOT}")" = "700"
          test -d "${NFTABLES_TMP_DIR}"
          test ! -L "${NFTABLES_TMP_DIR}"
          [[ -O "${NFTABLES_TMP_DIR}" ]]
          test "$(stat -c '%a' "${NFTABLES_TMP_DIR}")" = "700"
          nftables_tmp_probe="$(mktemp \
            "${NFTABLES_TMP_DIR}/.write-probe.XXXXXX")"
          test -f "${nftables_tmp_probe}"
          test ! -L "${nftables_tmp_probe}"
          rm -f -- "${nftables_tmp_probe}"
          test ! -e "${nftables_tmp_probe}"
          set +e
          TMPDIR="${NFTABLES_TMP_DIR}" \
          GOTMPDIR="${NFTABLES_TMP_DIR}" \
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/nftables_kernel_lab.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --pull-policy never \
            --output "${RAW_DIR}/nftables-raw.json"
          laboratory_rc=$?
          set -e
          printf '%s\n' "${laboratory_rc}" > "${STATUS_DIR}/nftables-lab.rc"
          chmod 0600 "${STATUS_DIR}/nftables-lab.rc"

      - name: Build and Verify Bound Laboratory Envelopes
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          PREVIOUS_RELEASE_ID: ${{ steps.previous.outputs.release_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          common_arguments=(
            --repo-root "${GITHUB_WORKSPACE}"
            --expected-sha "${RELEASE_SHA}"
            --expected-version "${RELEASE_TAG}"
            --candidate-packages-dir "${CANDIDATE_PACKAGES_DIR}"
            --previous-packages-dir "${PREVIOUS_PACKAGES_DIR}"
            --nft-raw "${RAW_DIR}/nftables-raw.json"
            --package-raw "${RAW_DIR}/package-lifecycle-raw.json"
            --package-amd64-shard "${RAW_DIR}/package-lifecycle-amd64.json"
            --qualification-matrix "${GITHUB_WORKSPACE}/${QUALIFICATION_MATRIX_PATH}"
            --expected-repository "${GITHUB_REPOSITORY}"
            --expected-workflow-run-id "${GITHUB_RUN_ID}"
            --expected-workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"
            --expected-candidate-run-id "${CANDIDATE_RUN_ID}"
            --expected-candidate-artifact-id "${CANDIDATE_ARTIFACT_ID}"
            --expected-candidate-artifact-name "${CANDIDATE_ARTIFACT_NAME}"
            --expected-previous-release-id "${PREVIOUS_RELEASE_ID}"
            --max-age-seconds 172800
            --max-report-skew-seconds 0
          )
          set +e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_adapter.py \
            build "${common_arguments[@]}" \
            --nft-output "${BOUND_DIR}/nftables-bound.json" \
            --package-output "${BOUND_DIR}/package-lifecycle-bound.json"
          build_rc=$?
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_adapter.py \
            verify "${common_arguments[@]}" \
            --nft-envelope "${BOUND_DIR}/nftables-bound.json" \
            --package-envelope "${BOUND_DIR}/package-lifecycle-bound.json"
          verify_rc=$?
          set -e
          printf '%s\n' "${build_rc}" > "${STATUS_DIR}/adapter-build.rc"
          printf '%s\n' "${verify_rc}" > "${STATUS_DIR}/adapter-verify.rc"
          chmod 0600 "${STATUS_DIR}/adapter-build.rc" "${STATUS_DIR}/adapter-verify.rc"

      - name: Generate and Recompute Release Qualification Gate
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          common_arguments=(
            --repo-root "${GITHUB_WORKSPACE}"
            --expected-sha "${RELEASE_SHA}"
            --expected-version "${RELEASE_TAG}"
            --candidate-packages-dir "${CANDIDATE_PACKAGES_DIR}"
            --nft-report "${BOUND_DIR}/nftables-bound.json"
            --package-report "${BOUND_DIR}/package-lifecycle-bound.json"
            --max-age-seconds 172800
            --max-report-skew-seconds 0
          )
          set +e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_gate.py \
            generate "${common_arguments[@]}" \
            --profile release \
            --output "${AGGREGATE_DIR}/release-qualification.json"
          generate_rc=$?
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_gate.py \
            verify "${common_arguments[@]}" \
            --aggregate "${AGGREGATE_DIR}/release-qualification.json"
          verify_rc=$?
          set -e
          printf '%s\n' "${generate_rc}" > "${STATUS_DIR}/gate-generate.rc"
          printf '%s\n' "${verify_rc}" > "${STATUS_DIR}/gate-verify.rc"
          chmod 0600 "${STATUS_DIR}/gate-generate.rc" "${STATUS_DIR}/gate-verify.rc"

      - name: Seal Exact Unsigned Qualification Evidence Inventory
        id: inventory
        shell: bash
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SIGNED_UPDATE_REQUIRED: ${{ steps.update_contract.outputs.required }}
        run: |
          set -euo pipefail
          umask 077
          candidate_version="${RELEASE_TAG#v}"
          previous_version="${PREVIOUS_TAG#v}"
          read_rc() {
            local path="$1"
            local value
            value="$(cat "${path}")"
            [[ "${value}" =~ ^[0-9]+$ ]] || return 1
            printf '%s' "${value}"
          }
          if [[ "${SIGNED_UPDATE_REQUIRED}" != "true" && \
                "${SIGNED_UPDATE_REQUIRED}" != "false" ]]; then
            echo "ERROR: signed update requirement is not a canonical boolean." >&2
            exit 1
          fi
          jq -n -S \
            --argjson package_lab "$(read_rc "${STATUS_DIR}/package-lab.rc")" \
            --argjson nftables_lab "$(read_rc "${STATUS_DIR}/nftables-lab.rc")" \
            --argjson adapter_build "$(read_rc "${STATUS_DIR}/adapter-build.rc")" \
            --argjson adapter_verify "$(read_rc "${STATUS_DIR}/adapter-verify.rc")" \
            --argjson gate_generate "$(read_rc "${STATUS_DIR}/gate-generate.rc")" \
            --argjson gate_verify "$(read_rc "${STATUS_DIR}/gate-verify.rc")" \
            '{
              package_lab: $package_lab,
              nftables_lab: $nftables_lab,
              adapter_build: $adapter_build,
              adapter_verify: $adapter_verify,
              gate_generate: $gate_generate,
              gate_verify: $gate_verify
            }' > "${ARTIFACT_ROOT}/status/qualification-exit-codes.json"

          expected=(
            "aggregate/release-qualification.json"
            "bound/nftables-bound.json"
            "bound/package-lifecycle-bound.json"
            "go127-evidence/evaluation.json"
            "go127-evidence/RELEASE_VERDICT.json"
            "native-release-evidence/node01-migration/EVIDENCE.json"
            "native-release-evidence/node01-migration/RAW_EVIDENCE.tar"
            "native-release-evidence/node01-migration/VERDICT.json"
            "native-release-evidence/native-lifecycle/RAW_EVIDENCE.tar"
            "native-release-evidence/native-lifecycle/VERDICT.json"
            "native-signing/SIGNED_ARTIFACT_SHA256SUMS.txt"
            "native-signing/evidence/APK_NATIVE_VERIFICATION.json"
            "native-signing/evidence/DEB_NATIVE_VERIFICATION.json"
            "native-signing/evidence/NATIVE_SIGNING_PROVENANCE.json"
            "native-signing/evidence/RPM_NATIVE_VERIFICATION.json"
            "native-signing/evidence/RPM_PAYLOAD_PROOF.json"
            "native-signing/evidence/UNSIGNED_SHA256SUMS.txt"
            "native-signing/packages/SHA256SUMS.txt"
            "native-signing/packages/syswarden-${candidate_version}-1.x86_64.rpm"
            "native-signing/packages/syswarden_${candidate_version}_amd64.deb"
            "native-signing/packages/syswarden_${candidate_version}_amd64.deb.asc"
            "native-signing/packages/syswarden_${candidate_version}_x86_64.apk"
            "native-signing/rhel-package-owned/SIGNED_ARTIFACT_SHA256SUMS.txt"
            "native-signing/rhel-package-owned/evidence/RPM_NATIVE_VERIFICATION.json"
            "native-signing/rhel-package-owned/evidence/RPM_PAYLOAD_PROOF.json"
            "native-signing/rhel-package-owned/evidence/SIGNING_PROVENANCE.json"
            "native-signing/rhel-package-owned/evidence/UNSIGNED_SHA256SUMS.txt"
            "native-signing/rhel-package-owned/packages/SHA256SUMS.txt"
            "native-signing/rhel-package-owned/packages/syswarden-${candidate_version}-1.rhelpo.x86_64.rpm"
            "native-release-evidence/NATIVE_RELEASE_EVIDENCE_MANIFEST.json"
            "native-release-evidence/QUALIFICATION_BINDING.json"
            "native-release-evidence/ha-v2/HA_V2_NATIVE_EVIDENCE.json"
            "native-release-evidence/ha-v2/HA_V2_NATIVE_VERDICT.json"
            "native-release-evidence/native-capability/AGGREGATE.json"
            "native-release-evidence/native-capability/APK-324.json"
            "native-release-evidence/native-capability/DEB-13.json"
            "native-release-evidence/native-capability/DEB-U2604.json"
            "native-release-evidence/native-capability/RPM-A10.json"
            "native-release-evidence/native-capability/RPM-A10-RHELPO.json"
            "native-release-evidence/native-capability/RPM-A9-RHELPO.json"
            "native-release-evidence/performance/AGGREGATE.json"
            "native-release-evidence/performance/ADAPTER_CONFIG.json"
            "native-release-evidence/performance/EVIDENCE.json"
            "native-release-evidence/performance/REPORT.json"
            "native-release-evidence/source-allocation/EVIDENCE.json"
            "native-release-evidence/source-allocation/REPORT.json"
            "native-release-evidence/source-allocation/baseline-probe"
            "native-release-evidence/source-allocation/benchmark-source.go"
            "native-release-evidence/source-allocation/build-attestation.json"
            "native-release-evidence/source-allocation/candidate-probe"
            "native-release-evidence/source-allocation/environment.json"
            "native-release-evidence/source-allocation/execution-control-attestation.json"
            "native-release-evidence/source-allocation/fixture.json"
            "native-release-evidence/source-allocation/signature-catalog.json"
            "packages/candidate/SHA256SUMS.txt"
            "packages/candidate/syswarden-${candidate_version}-1.x86_64.rpm"
            "packages/candidate/syswarden_${candidate_version}_amd64.deb"
            "packages/candidate/syswarden_${candidate_version}_x86_64.apk"
            "packages/previous/SHA256SUMS.txt"
            "packages/previous/syswarden-${previous_version}-1.x86_64.rpm"
            "packages/previous/syswarden_${previous_version}_amd64.deb"
            "packages/previous/syswarden_${previous_version}_x86_64.apk"
            "qualification-context.json"
            "raw/nftables-raw.json"
            "raw/package-lifecycle-amd64.json"
            "raw/package-lifecycle-raw.json"
            "status/qualification-exit-codes.json"
          )
          for name in node01-attestation node02-attestation asymmetric-partition crash-head-recovery crash-wal-recovery heartbeat-monotonic-receipt-timeout instance-lease-exclusion normal-replication-ack-checkpoint partition-fence-split-brain rejoin-explicit rolling-rollback rolling-upgrade; do
            expected+=("native-release-evidence/ha-v2/raw/${name}.json")
          done
          for campaign in 01 02 03; do
            for role in baseline candidate; do
              for sample in 01 02 03 04 05 06 07 08 09 10; do
                expected+=("native-release-evidence/source-allocation/raw/allocation-campaign-${campaign}/${role}-${sample}.json")
              done
            done
          done
          expected_directories=(
            aggregate
            bound
            go127-evidence
            native-signing
            native-signing/evidence
            native-signing/packages
            native-signing/rhel-package-owned
            native-signing/rhel-package-owned/evidence
            native-signing/rhel-package-owned/packages
            native-release-evidence
            native-release-evidence/ha-v2
            native-release-evidence/ha-v2/raw
            native-release-evidence/native-capability
            native-release-evidence/node01-migration
            native-release-evidence/native-lifecycle
            native-release-evidence/performance
            native-release-evidence/source-allocation
            native-release-evidence/source-allocation/raw
            native-release-evidence/source-allocation/raw/allocation-campaign-01
            native-release-evidence/source-allocation/raw/allocation-campaign-02
            native-release-evidence/source-allocation/raw/allocation-campaign-03
            packages
            packages/candidate
            packages/previous
            raw
            status
          )
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          mapfile -t actual_before_manifest < <(
            find -P "${ARTIFACT_ROOT}" -type f -printf '%P\n' | LC_ALL=C sort
          )
          if [[ "${sorted_expected[*]}" != "${actual_before_manifest[*]}" ]]; then
            echo "ERROR: qualification evidence inventory is incomplete or contains unexpected files." >&2
            diff -u \
              <(printf '%s\n' "${sorted_expected[@]}") \
              <(printf '%s\n' "${actual_before_manifest[@]}") >&2 || true
            exit 1
          fi
          mapfile -t sorted_expected_directories < <(
            printf '%s\n' "${expected_directories[@]}" | LC_ALL=C sort
          )
          mapfile -t actual_directories < <(
            find -P "${ARTIFACT_ROOT}" -mindepth 1 -type d -printf '%P\n' | LC_ALL=C sort
          )
          if [[ "${sorted_expected_directories[*]}" != "${actual_directories[*]}" ]]; then
            echo "ERROR: qualification evidence directory inventory is not exact." >&2
            exit 1
          fi
          while IFS= read -r -d '' entry; do
            if [[ (-d "${entry}" || -f "${entry}") && ! -L "${entry}" ]]; then
              continue
            fi
            echo "ERROR: qualification artifact contains an unsafe filesystem entry: ${entry}." >&2
            exit 1
          done < <(find -P "${ARTIFACT_ROOT}" -mindepth 1 -print0)
          for relative in "${sorted_expected[@]}"; do
            test -s "${ARTIFACT_ROOT}/${relative}"
            test -f "${ARTIFACT_ROOT}/${relative}"
            test ! -L "${ARTIFACT_ROOT}/${relative}"
          done
          chmod -R go-rwx "${ARTIFACT_ROOT}"
          (
            cd "${ARTIFACT_ROOT}"
            sha256sum "${sorted_expected[@]}" > EVIDENCE_SHA256SUMS.txt
            sha256sum --check --strict EVIDENCE_SHA256SUMS.txt
          )
          test "$(find -P "${ARTIFACT_ROOT}" -type f | wc -l)" \
            -eq "$(( ${#sorted_expected[@]} + 1 ))"
          artifact_name="syswarden-release-qualification-unsigned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RELEASE_SHA}"
          printf 'artifact_name=%s\n' "${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload Exact Unsigned Qualification Evidence
        id: upload
        if: ${{ always() && steps.inventory.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.inventory.outputs.artifact_name }}
          path: ${{ steps.workspace.outputs.artifact_root }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Remove Ephemeral Qualification Material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NFTABLES_TMP_DIR:-}" ]]; then
            if [[ -z "${QUALIFICATION_ROOT:-}" || \
                  "${QUALIFICATION_ROOT}" != "${RUNNER_TEMP%/}"/syswarden-release-qualification.* || \
                  "${NFTABLES_TMP_DIR}" != "${QUALIFICATION_ROOT}/nftables-tmp" ]]; then
              echo "ERROR: refusing unsafe nftables temporary-directory cleanup." >&2
              exit 1
            fi
            test -d "${QUALIFICATION_ROOT}"
            test ! -L "${QUALIFICATION_ROOT}"
            [[ -O "${QUALIFICATION_ROOT}" ]]
            test "$(stat -c '%a' "${QUALIFICATION_ROOT}")" = "700"
            test -d "${NFTABLES_TMP_DIR}"
            test ! -L "${NFTABLES_TMP_DIR}"
            [[ -O "${NFTABLES_TMP_DIR}" ]]
            test "$(stat -c '%a' "${NFTABLES_TMP_DIR}")" = "700"
            find -P "${NFTABLES_TMP_DIR}" -xdev -mindepth 1 -delete
            rmdir -- "${NFTABLES_TMP_DIR}"
            test ! -e "${NFTABLES_TMP_DIR}"
            test ! -L "${NFTABLES_TMP_DIR}"
          fi
          if [[ -n "${PACKAGE_TMP_DIR:-}" ]]; then
            if [[ -z "${QUALIFICATION_ROOT:-}" || \
                  "${QUALIFICATION_ROOT}" != "${RUNNER_TEMP%/}"/syswarden-release-qualification.* || \
                  "${PACKAGE_TMP_DIR}" != "${QUALIFICATION_ROOT}/package-tmp" ]]; then
              echo "ERROR: refusing unsafe package temporary-directory cleanup." >&2
              exit 1
            fi
            test -d "${QUALIFICATION_ROOT}"
            test ! -L "${QUALIFICATION_ROOT}"
            [[ -O "${QUALIFICATION_ROOT}" ]]
            test "$(stat -c '%a' "${QUALIFICATION_ROOT}")" = "700"
            test -d "${PACKAGE_TMP_DIR}"
            test ! -L "${PACKAGE_TMP_DIR}"
            [[ -O "${PACKAGE_TMP_DIR}" ]]
            test "$(stat -c '%a' "${PACKAGE_TMP_DIR}")" = "700"
            find -P "${PACKAGE_TMP_DIR}" -xdev -mindepth 1 -delete
            rmdir -- "${PACKAGE_TMP_DIR}"
            test ! -e "${PACKAGE_TMP_DIR}"
            test ! -L "${PACKAGE_TMP_DIR}"
          fi
          if [[ -n "${TRANSITION_DIR:-}" ]]; then
            if [[ -z "${QUALIFICATION_ROOT:-}" || \
                  "${QUALIFICATION_ROOT}" != "${RUNNER_TEMP%/}"/syswarden-release-qualification.* || \
                  "${TRANSITION_DIR}" != "${QUALIFICATION_ROOT}/historical-transition" ]]; then
              echo "ERROR: refusing unsafe historical-transition cleanup." >&2
              exit 1
            fi
            test -d "${TRANSITION_DIR}"
            test ! -L "${TRANSITION_DIR}"
            [[ -O "${TRANSITION_DIR}" ]]
            test "$(stat -c '%a' "${TRANSITION_DIR}")" = "700"
            find -P "${TRANSITION_DIR}" -xdev -mindepth 1 -delete
            rmdir -- "${TRANSITION_DIR}"
            test ! -e "${TRANSITION_DIR}"
            test ! -L "${TRANSITION_DIR}"
          fi

      - name: Enforce Final Release Qualification Verdict
        if: ${{ always() }}
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_RELEASE_TAG: ${{ inputs.release_tag }}
          SIGNED_UPDATE_REQUIRED: ${{ steps.update_contract.outputs.required }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          PREVIOUS_RELEASE_ID: ${{ steps.previous.outputs.release_id }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          summarize_raw_report() {
            local label="$1"
            local path="$2"
            local qualification_matrix_sha256
            local size
            local summary
            if [[ ! -f "${path}" || -L "${path}" ]]; then
              jq -cnS --arg label "${label}" \
                '{label: $label, parse_status: "unavailable"}'
              return
            fi
            size="$(stat -c '%s' "${path}" 2>/dev/null || true)"
            if [[ ! "${size}" =~ ^[0-9]+$ ]] || (( 10#${size} > 67108864 )); then
              jq -cnS --arg label "${label}" \
                '{label: $label, parse_status: "invalid"}'
              return
            fi
            qualification_matrix_sha256="$(sha256sum \
              "${GITHUB_WORKSPACE}/${QUALIFICATION_MATRIX_PATH}" |
              awk '{print $1}')"
            if ! summary="$(jq -cS \
              --arg label "${label}" \
              --arg qualification_matrix_sha256 \
                "${qualification_matrix_sha256}" \
              --slurpfile qualification_matrix \
                "${GITHUB_WORKSPACE}/${QUALIFICATION_MATRIX_PATH}" '
              if type != "object" then error("report is not an object") else . end
              | . as $report
              | {
                  label: $label,
                  parse_status: "valid",
                  schema_version: (
                    if (($report.schema_version | type) == "number" and
                        ($report.schema_version | floor) == $report.schema_version and
                        $report.schema_version >= 0 and
                        $report.schema_version <= 100)
                    then $report.schema_version else null end
                  ),
                  status: (
                    if (($report.status | type) == "string" and
                        (["pass", "fail", "incomplete"] | index($report.status)) != null)
                    then $report.status else null end
                  ),
                  release_ready: (
                    if $label == "package-lifecycle" then null
                    elif ($report.release_ready | type) == "boolean"
                    then $report.release_ready else null end
                  ),
                  container_lifecycle_release_ready: (
                    if $label == "package-lifecycle" and
                      ($report.release_ready | type) == "boolean" and
                      $report.scope.evidence_kind == "container-lifecycle" and
                      $report.scope.coverage_kind == "container_scenarios_only" and
                      $report.scope.real_host_evidence_included == false and
                      $report.scope.required_checks_complete == false and
                      $report.scope.covered_scenarios ==
                        [$qualification_matrix[0].cells[] |
                          {cell_id: .id, scenarios: .container_scenarios}] and
                      $report.qualification_matrix == {
                        matrix_id: $qualification_matrix[0].matrix_id,
                        sha256: $qualification_matrix_sha256
                      }
                    then $report.release_ready else null end
                  ),
                  blocker_count: (
                    if ($report.blocker_ids | type) == "array"
                    then ($report.blocker_ids | length) else null end
                  ),
                  error_present: (
                    ($report.error | type) == "string" and
                    ($report.error | length) > 0
                  )
                }
            ' "${path}" 2>/dev/null)"; then
              jq -cnS --arg label "${label}" \
                '{label: $label, parse_status: "invalid"}'
              return
            fi
            printf '%s\n' "${summary}"
          }

          status_files=(
            package-lab.rc
            nftables-lab.rc
            adapter-build.rc
            adapter-verify.rc
            gate-generate.rc
            gate-verify.rc
          )
          failed_statuses=()
          invalid_statuses=()
          raw_summaries=()
          summarized_raws=()
          if [[ -n "${STATUS_DIR:-}" && -d "${STATUS_DIR}" && \
                ! -L "${STATUS_DIR}" ]]; then
            for status_file in "${status_files[@]}"; do
              status_path="${STATUS_DIR}/${status_file}"
              if [[ ! -f "${status_path}" || -L "${status_path}" ]]; then
                invalid_statuses+=("${status_file}")
                continue
              fi
              status="$(cat "${status_path}")"
              if [[ ! "${status}" =~ ^(0|[1-9][0-9]{0,2})$ ]] || \
                 (( 10#${status} > 255 )); then
                invalid_statuses+=("${status_file}")
                continue
              fi
              if [[ "${status}" == "0" ]]; then
                continue
              fi
              failed_statuses+=("${status_file}=${status}")
              raw_label=""
              raw_path=""
              case "${status_file}" in
                package-lab.rc)
                  raw_label="package-lifecycle"
                  raw_path="${RAW_DIR:-}/package-lifecycle-raw.json"
                  ;;
                nftables-lab.rc)
                  raw_label="nftables"
                  raw_path="${RAW_DIR:-}/nftables-raw.json"
                  ;;
              esac
              if [[ -n "${raw_label}" && \
                    " ${summarized_raws[*]} " != *" ${raw_label} "* ]]; then
                summarized_raws+=("${raw_label}")
                raw_summaries+=("$(summarize_raw_report "${raw_label}" "${raw_path}")")
              fi
            done
          else
            invalid_statuses+=(status-directory)
          fi
          for invalid_status in "${invalid_statuses[@]}"; do
            echo "ERROR: qualification status ${invalid_status}=invalid." >&2
          done
          for failed_status in "${failed_statuses[@]}"; do
            echo "ERROR: qualification status ${failed_status}." >&2
          done
          if (( ${#raw_summaries[@]} > 0 )); then
            printf '%s\n' "${raw_summaries[@]}" | \
              jq -csS '{qualification_raw_failure_summaries: .}' >&2
          fi
          if (( ${#invalid_statuses[@]} > 0 || ${#failed_statuses[@]} > 0 )); then
            echo "ERROR: release qualification status is not uniformly zero." >&2
            exit 1
          fi
          if [[ "${INVENTORY_OUTCOME}" != "success" || \
                "${UPLOAD_OUTCOME}" != "success" ]]; then
            echo "ERROR: exact qualification evidence was not sealed and uploaded." >&2
            exit 1
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_adapter.py \
            verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-sha "${EXPECTED_RELEASE_SHA}" \
            --expected-version "${EXPECTED_RELEASE_TAG}" \
            --candidate-packages-dir "${CANDIDATE_PACKAGES_DIR}" \
            --previous-packages-dir "${PREVIOUS_PACKAGES_DIR}" \
            --nft-raw "${RAW_DIR}/nftables-raw.json" \
            --package-raw "${RAW_DIR}/package-lifecycle-raw.json" \
            --package-amd64-shard "${RAW_DIR}/package-lifecycle-amd64.json" \
            --qualification-matrix "${GITHUB_WORKSPACE}/${QUALIFICATION_MATRIX_PATH}" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-workflow-run-id "${GITHUB_RUN_ID}" \
            --expected-workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --expected-candidate-run-id "${CANDIDATE_RUN_ID}" \
            --expected-candidate-artifact-id "${CANDIDATE_ARTIFACT_ID}" \
            --expected-candidate-artifact-name "${CANDIDATE_ARTIFACT_NAME}" \
            --expected-previous-release-id "${PREVIOUS_RELEASE_ID}" \
            --max-age-seconds 172800 \
            --max-report-skew-seconds 0 \
            --nft-envelope "${BOUND_DIR}/nftables-bound.json" \
            --package-envelope "${BOUND_DIR}/package-lifecycle-bound.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_gate.py \
            verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-sha "${EXPECTED_RELEASE_SHA}" \
            --expected-version "${EXPECTED_RELEASE_TAG}" \
            --candidate-packages-dir "${CANDIDATE_PACKAGES_DIR}" \
            --nft-report "${BOUND_DIR}/nftables-bound.json" \
            --package-report "${BOUND_DIR}/package-lifecycle-bound.json" \
            --max-age-seconds 172800 \
            --max-report-skew-seconds 0 \
            --aggregate "${AGGREGATE_DIR}/release-qualification.json"
          if [[ "${SIGNED_UPDATE_REQUIRED}" != "true" && \
                "${SIGNED_UPDATE_REQUIRED}" != "false" ]]; then
            echo "ERROR: signed update requirement is not a canonical boolean." >&2
            exit 1
          fi
          jq --exit-status '
            (keys | sort) == ([
              "adapter_build",
              "adapter_verify",
              "gate_generate",
              "gate_verify",
              "nftables_lab",
              "package_lab"
            ] | sort) and all(.[]; . == 0)
          ' "${ARTIFACT_ROOT}/status/qualification-exit-codes.json"

  seal-release:
    name: Seal Qualified Evidence on GitHub Hosted Runner
    needs: qualify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: syswarden-release-qualification
    permissions:
      actions: read
      contents: read

    steps:
      - name: Validate Protected Hosted Signing Context
        shell: bash
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_ARCH_CONTEXT: ${{ runner.arch }}
          RUNNER_ENVIRONMENT_CONTEXT: ${{ runner.environment }}
          RUNNER_OS_CONTEXT: ${{ runner.os }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v jq >/dev/null
          if [[ -z "${REPOSITORY_OWNER}" || \
                "${EVENT_ACTOR}" != "${REPOSITORY_OWNER}" || \
                "${EVENT_TRIGGERING_ACTOR}" != "${REPOSITORY_OWNER}" || \
                "${RUN_ATTEMPT}" != "1" || \
                "${EVENT_NAME}" != "workflow_dispatch" || \
                "${EVENT_REF_TYPE}" != "branch" || \
                "${EVENT_REF_NAME}" != "main" || \
                "${EVENT_REF}" != "refs/heads/main" || \
                "${EVENT_SHA}" != "${RELEASE_SHA}" || \
                ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ || \
                ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]{2}\.[0-9]+$ || \
                "${RUNNER_ENVIRONMENT_CONTEXT}" != "github-hosted" || \
                "${RUNNER_OS_CONTEXT}" != "Linux" || \
                "${RUNNER_ARCH_CONTEXT}" != "X64" ]]; then
            echo "ERROR: signing requires the exact owner-dispatched main context on GitHub-hosted Linux X64." >&2
            exit 1
          fi

          environment_json="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/environments/syswarden-release-qualification")"
          required_environment_boolean() {
            local field="${1:?environment boolean field is required}"
            jq -er --arg field "${field}" '
              .deployment_branch_policy[$field] |
              if type == "boolean" then
                tostring
              else
                error("deployment_branch_policy." + $field + " must be boolean")
              end
            ' <<< "${environment_json}"
          }
          required_top_level_environment_boolean() {
            local field="${1:?environment boolean field is required}"
            jq -er --arg field "${field}" '
              .[$field] |
              if type == "boolean" then
                tostring
              else
                error($field + " must be boolean")
              end
            ' <<< "${environment_json}"
          }
          environment_name="$(jq -r '.name // ""' <<< "${environment_json}")"
          reviewer_rule_count="$(jq '[
            .protection_rules[]? | select(.type == "required_reviewers")
          ] | length' <<< "${environment_json}")"
          reviewer_entry_count="$(jq '[
            .protection_rules[]? | select(.type == "required_reviewers") |
            .reviewers[]?
          ] | length' <<< "${environment_json}")"
          owner_reviewer_count="$(jq --arg owner "${REPOSITORY_OWNER}" '[
            .protection_rules[]? | select(.type == "required_reviewers") |
            .reviewers[]? |
            select(.type == "User" and .reviewer.login == $owner)
          ] | length' <<< "${environment_json}")"
          prevent_self_review="$(jq -er '
            [
              .protection_rules[]? |
              select(.type == "required_reviewers") |
              .prevent_self_review
            ] |
            if length == 1 and .[0] == false then
              "false"
            else
              error("the reviewer rule must explicitly allow repository-owner approval")
            end
          ' <<< "${environment_json}")"
          branch_policy_rule_count="$(jq '[
            .protection_rules[]? | select(.type == "branch_policy")
          ] | length' <<< "${environment_json}")"
          protection_rule_count="$(jq '[.protection_rules[]?] | length' \
            <<< "${environment_json}")"
          protected_branches="$(required_environment_boolean \
            "protected_branches")"
          custom_branch_policies="$(required_environment_boolean \
            "custom_branch_policies")"
          can_admins_bypass="$(required_top_level_environment_boolean \
            "can_admins_bypass")"
          if [[ "${environment_name}" != "syswarden-release-qualification" || \
                "${reviewer_rule_count}" != "1" || \
                "${reviewer_entry_count}" != "1" || \
                "${owner_reviewer_count}" != "1" || \
                "${prevent_self_review}" != "false" || \
                "${branch_policy_rule_count}" != "1" || \
                "${protection_rule_count}" != "2" || \
                "${protected_branches}" != "false" || \
                "${custom_branch_policies}" != "true" || \
                "${can_admins_bypass}" != "false" ]]; then
            echo "ERROR: the signing environment must require explicit repository-owner approval, forbid administrator bypass, and have exactly one custom branch policy." >&2
            exit 1
          fi

          policies_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/environments/syswarden-release-qualification/deployment-branch-policies" \
            -f per_page=100)"
          declared_policy_count="$(jq -r '.[0].total_count' <<< "${policies_json}")"
          policy_count="$(jq '[.[] | .branch_policies[]?] | length' <<< "${policies_json}")"
          main_policy_count="$(jq '[
            .[] | .branch_policies[]? |
            select(.name == "main" and .type == "branch")
          ] | length' <<< "${policies_json}")"
          if [[ "${declared_policy_count}" != "1" || \
                "${policy_count}" != "1" || \
                "${main_policy_count}" != "1" ]]; then
            echo "ERROR: the signing environment must allow deployments from main only." >&2
            exit 1
          fi

      - name: Checkout Exact Hosted Signing Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Set Up Go for Hosted Signing
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Revalidate Exact Hosted Candidate Commit
        shell: bash
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${RELEASE_SHA}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(./scripts/versioning.sh inspect --repo "${GITHUB_WORKSPACE}")" = \
            "${RELEASE_TAG}"
          commit_message="$(git log -1 --format=%B HEAD)"
          ./scripts/versioning.sh validate-commit \
            --repo "${GITHUB_WORKSPACE}" \
            --base-ref HEAD^ \
            --commit-message "${commit_message}"
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "ERROR: hosted signing candidate tag already exists locally." >&2
            exit 1
          fi
          remote_error="${RUNNER_TEMP%/}/syswarden-hosted-release-tag-query.err"
          set +e
          remote_tag="$(git ls-remote --exit-code --refs origin \
            "refs/tags/${RELEASE_TAG}" 2> "${remote_error}")"
          remote_rc=$?
          set -e
          if [[ "${remote_rc}" -eq 0 && -n "${remote_tag}" ]]; then
            echo "ERROR: hosted signing candidate tag already exists remotely." >&2
            exit 1
          fi
          if [[ "${remote_rc}" -ne 2 || -n "${remote_tag}" ]]; then
            echo "ERROR: hosted signing could not prove candidate-tag absence." >&2
            exit 1
          fi
          rm -f -- "${remote_error}"
          previous_sha="$(git rev-parse --verify "refs/tags/${PREVIOUS_TAG}^{commit}")"
          git merge-base --is-ancestor "${previous_sha}" "${RELEASE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Create Isolated Hosted Signing Workspace
        id: signing_workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          required_tools=(
            cmp
            diff
            find
            git
            go
            gh
            jq
            mktemp
            python3
            sha256sum
            stat
          )
          for tool in "${required_tools[@]}"; do
            command -v "${tool}" >/dev/null || {
              echo "ERROR: hosted signing runner is missing ${tool}." >&2
              exit 1
            }
          done
          signing_root="$(mktemp -d \
            "${RUNNER_TEMP%/}/syswarden-hosted-signing.XXXXXX")"
          test -d "${signing_root}"
          test ! -L "${signing_root}"
          [[ -O "${signing_root}" ]]
          test "$(stat -c '%a' "${signing_root}")" = "700"
          unsigned_root="${signing_root}/unsigned-evidence"
          package_source_dir="${signing_root}/package-main-source"
          signing_tool_dir="${signing_root}/signing-tool"
          install -d -m 0700 \
            "${unsigned_root}" \
            "${package_source_dir}" \
            "${signing_tool_dir}"
          {
            printf 'HOSTED_SIGNING_ROOT=%s\n' "${signing_root}"
            printf 'UNSIGNED_EVIDENCE_ROOT=%s\n' "${unsigned_root}"
            printf 'PACKAGE_MAIN_SOURCE_DIR=%s\n' "${package_source_dir}"
            printf 'SIGNING_TOOL_DIR=%s\n' "${signing_tool_dir}"
          } >> "${GITHUB_ENV}"
          {
            printf 'unsigned_root=%s\n' "${unsigned_root}"
            printf 'package_source_dir=%s\n' "${package_source_dir}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve Exact Unsigned Qualification Artifact
        id: unsigned_artifact
        shell: bash
        env:
          EXPECTED_UNSIGNED_ARTIFACT_NAME: ${{ needs.qualify-release.outputs.unsigned_artifact_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "${RUN_ID}" =~ ^[1-9][0-9]*$ || \
                "${RUN_ATTEMPT}" != "1" || \
                ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: unsigned artifact resolution context is invalid." >&2
            exit 1
          fi
          expected_name="syswarden-release-qualification-unsigned-${RUN_ID}-${RUN_ATTEMPT}-${RELEASE_SHA}"
          if [[ "${EXPECTED_UNSIGNED_ARTIFACT_NAME}" != "${expected_name}" ]]; then
            echo "ERROR: unsigned artifact name is not bound to the exact run context." >&2
            exit 1
          fi
          artifacts_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            -f per_page=100)"
          artifact_matches="$(jq \
            --arg name "${expected_name}" \
            --arg sha "${RELEASE_SHA}" \
            --argjson run_id "${RUN_ID}" '[
              .[] | .artifacts[]? |
              select(
                .name == $name and
                .workflow_run.id == $run_id and
                .workflow_run.head_sha == $sha
              )
            ]' <<< "${artifacts_json}")"
          if [[ "$(jq 'length' <<< "${artifact_matches}")" != "1" ]]; then
            echo "ERROR: exact unsigned qualification artifact is absent or ambiguous." >&2
            exit 1
          fi
          artifact_id="$(jq -r '.[0].id' <<< "${artifact_matches}")"
          expired="$(jq -r '.[0].expired' <<< "${artifact_matches}")"
          size="$(jq -r '.[0].size_in_bytes' <<< "${artifact_matches}")"
          if [[ ! "${artifact_id}" =~ ^[1-9][0-9]*$ || \
                "${expired}" != "false" || \
                ! "${size}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: exact unsigned qualification artifact is unusable." >&2
            exit 1
          fi
          {
            printf 'artifact_id=%s\n' "${artifact_id}"
            printf 'artifact_name=%s\n' "${expected_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download Exact Unsigned Qualification Evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.unsigned_artifact.outputs.artifact_id }}
          path: ${{ steps.signing_workspace.outputs.unsigned_root }}
          merge-multiple: true

      - name: Resolve Exact Package Main Artifact for Hosted Signing
        id: hosted_candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          runs_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/package.yml/runs" \
            -f event=push \
            -f head_sha="${RELEASE_SHA}" \
            -f per_page=100)"
          matches="$(jq --arg sha "${RELEASE_SHA}" '[
            .[] | .workflow_runs[]? |
            select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push"
            )
          ]' <<< "${runs_json}")"
          if [[ "$(jq 'length' <<< "${matches}")" != "1" ]]; then
            echo "ERROR: hosted signing expected one exact package.yml main push run." >&2
            exit 1
          fi
          run_id="$(jq -r '.[0].id' <<< "${matches}")"
          run_status="$(jq -r '.[0].status' <<< "${matches}")"
          run_conclusion="$(jq -r '.[0].conclusion // ""' <<< "${matches}")"
          if [[ ! "${run_id}" =~ ^[0-9]+$ || \
                "${run_status}" != "completed" || \
                "${run_conclusion}" != "success" ]]; then
            echo "ERROR: hosted signing package.yml run is not a completed success." >&2
            exit 1
          fi
          artifact_name="syswarden-packages-${version}"
          artifacts_json="$(gh api --paginate --slurp --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            -f per_page=100)"
          artifact_matches="$(jq --arg name "${artifact_name}" '[
            .[] | .artifacts[]? | select(.name == $name)
          ]' <<< "${artifacts_json}")"
          if [[ "$(jq 'length' <<< "${artifact_matches}")" != "1" ]]; then
            echo "ERROR: hosted signing package artifact is absent or ambiguous." >&2
            exit 1
          fi
          artifact_id="$(jq -r '.[0].id' <<< "${artifact_matches}")"
          artifact_digest="$(jq -r '.[0].digest // ""' <<< "${artifact_matches}")"
          expired="$(jq -r '.[0].expired' <<< "${artifact_matches}")"
          size="$(jq -r '.[0].size_in_bytes' <<< "${artifact_matches}")"
          if [[ ! "${artifact_id}" =~ ^[0-9]+$ || \
                "${expired}" != "false" || \
                ! "${size}" =~ ^[1-9][0-9]*$ || \
                ! "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: hosted signing package artifact is unusable." >&2
            exit 1
          fi
          {
            printf 'run_id=%s\n' "${run_id}"
            printf 'artifact_id=%s\n' "${artifact_id}"
            printf 'artifact_name=%s\n' "${artifact_name}"
            printf 'artifact_digest=%s\n' "${artifact_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download Exact Package Main Bytes for Hosted Signing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.hosted_candidate.outputs.artifact_id }}
          path: ${{ steps.signing_workspace.outputs.package_source_dir }}
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.hosted_candidate.outputs.run_id }}

      - name: Require Successful Qualification Before Release Signing
        id: update_contract
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.hosted_candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.hosted_candidate.outputs.artifact_digest }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.hosted_candidate.outputs.artifact_name }}
          CANDIDATE_RUN_ID: ${{ steps.hosted_candidate.outputs.run_id }}
          EXPECTED_CANDIDATE_ARTIFACT_ID: ${{ needs.qualify-release.outputs.candidate_artifact_id }}
          EXPECTED_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.qualify-release.outputs.candidate_artifact_digest }}
          EXPECTED_CANDIDATE_ARTIFACT_NAME: ${{ needs.qualify-release.outputs.candidate_artifact_name }}
          EXPECTED_CANDIDATE_RUN_ID: ${{ needs.qualify-release.outputs.candidate_run_id }}
          EXPECTED_NATIVE_ARTIFACT_DIGEST: ${{ needs.qualify-release.outputs.native_signing_artifact_digest }}
          EXPECTED_NATIVE_ARTIFACT_ID: ${{ needs.qualify-release.outputs.native_signing_artifact_id }}
          EXPECTED_NATIVE_ARTIFACT_NAME: ${{ needs.qualify-release.outputs.native_signing_artifact_name }}
          EXPECTED_NATIVE_RUN_ID: ${{ needs.qualify-release.outputs.native_signing_run_id }}
          EXPECTED_NATIVE_EVIDENCE_ARTIFACT_DIGEST: ${{ needs.qualify-release.outputs.native_evidence_artifact_digest }}
          EXPECTED_NATIVE_EVIDENCE_ARTIFACT_ID: ${{ needs.qualify-release.outputs.native_evidence_artifact_id }}
          EXPECTED_NATIVE_EVIDENCE_ARTIFACT_NAME: ${{ needs.qualify-release.outputs.native_evidence_artifact_name }}
          EXPECTED_NATIVE_EVIDENCE_RUN_ID: ${{ needs.qualify-release.outputs.native_evidence_run_id }}
          EXPECTED_GO127_ARTIFACT_DIGEST: ${{ needs.qualify-release.outputs.go127_artifact_digest }}
          EXPECTED_GO127_ARTIFACT_ID: ${{ needs.qualify-release.outputs.go127_artifact_id }}
          EXPECTED_GO127_ARTIFACT_NAME: ${{ needs.qualify-release.outputs.go127_artifact_name }}
          EXPECTED_GO127_RUN_ID: ${{ needs.qualify-release.outputs.go127_run_id }}
          EXPECTED_PREVIOUS_COMMIT_SHA: ${{ needs.qualify-release.outputs.previous_commit_sha }}
          EXPECTED_PREVIOUS_RELEASE_ID: ${{ needs.qualify-release.outputs.previous_release_id }}
          EXPECTED_SIGNED_UPDATE_REQUIRED: ${{ needs.qualify-release.outputs.signed_update_required }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |

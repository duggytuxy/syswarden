          expected_unsigned_files=(
            "EVIDENCE_SHA256SUMS.txt"
            "aggregate/release-qualification.json"
            "bound/nftables-bound.json"
            "bound/package-lifecycle-bound.json"
            "go127-evidence/evaluation.json"
            "go127-evidence/RELEASE_VERDICT.json"
            "native-release-evidence/node01-migration/EVIDENCE.json"
            "native-release-evidence/node01-migration/RAW_EVIDENCE.tar"
            "native-release-evidence/node01-migration/VERDICT.json"
            "native-release-evidence/native-lifecycle/RAW_EVIDENCE.tar"
            "native-release-evidence/native-lifecycle/VERDICT.json"
            "native-signing/SIGNED_ARTIFACT_SHA256SUMS.txt"
            "native-signing/evidence/APK_NATIVE_VERIFICATION.json"
            "native-signing/evidence/DEB_NATIVE_VERIFICATION.json"
            "native-signing/evidence/NATIVE_SIGNING_PROVENANCE.json"
            "native-signing/evidence/RPM_NATIVE_VERIFICATION.json"
            "native-signing/evidence/RPM_PAYLOAD_PROOF.json"
            "native-signing/evidence/UNSIGNED_SHA256SUMS.txt"
            "native-signing/packages/SHA256SUMS.txt"
            "native-signing/packages/syswarden-${candidate_version}-1.x86_64.rpm"
            "native-signing/packages/syswarden_${candidate_version}_amd64.deb"
            "native-signing/packages/syswarden_${candidate_version}_amd64.deb.asc"
            "native-signing/packages/syswarden_${candidate_version}_x86_64.apk"
            "native-signing/rhel-package-owned/SIGNED_ARTIFACT_SHA256SUMS.txt"
            "native-signing/rhel-package-owned/evidence/RPM_NATIVE_VERIFICATION.json"
            "native-signing/rhel-package-owned/evidence/RPM_PAYLOAD_PROOF.json"
            "native-signing/rhel-package-owned/evidence/SIGNING_PROVENANCE.json"
            "native-signing/rhel-package-owned/evidence/UNSIGNED_SHA256SUMS.txt"
            "native-signing/rhel-package-owned/packages/SHA256SUMS.txt"
            "native-signing/rhel-package-owned/packages/syswarden-${candidate_version}-1.rhelpo.x86_64.rpm"
            "native-release-evidence/NATIVE_RELEASE_EVIDENCE_MANIFEST.json"
            "native-release-evidence/QUALIFICATION_BINDING.json"
            "native-release-evidence/ha-v2/HA_V2_NATIVE_EVIDENCE.json"
            "native-release-evidence/ha-v2/HA_V2_NATIVE_VERDICT.json"
            "native-release-evidence/native-capability/AGGREGATE.json"
            "native-release-evidence/native-capability/APK-324.json"
            "native-release-evidence/native-capability/DEB-13.json"
            "native-release-evidence/native-capability/DEB-U2604.json"
            "native-release-evidence/native-capability/RPM-A10.json"
            "native-release-evidence/native-capability/RPM-A10-RHELPO.json"
            "native-release-evidence/native-capability/RPM-A9-RHELPO.json"
            "native-release-evidence/performance/AGGREGATE.json"
            "native-release-evidence/performance/ADAPTER_CONFIG.json"
            "native-release-evidence/performance/EVIDENCE.json"
            "native-release-evidence/performance/REPORT.json"
            "native-release-evidence/source-allocation/EVIDENCE.json"
            "native-release-evidence/source-allocation/REPORT.json"
            "native-release-evidence/source-allocation/baseline-probe"
            "native-release-evidence/source-allocation/benchmark-source.go"
            "native-release-evidence/source-allocation/build-attestation.json"
            "native-release-evidence/source-allocation/candidate-probe"
            "native-release-evidence/source-allocation/environment.json"
            "native-release-evidence/source-allocation/execution-control-attestation.json"
            "native-release-evidence/source-allocation/fixture.json"
            "native-release-evidence/source-allocation/signature-catalog.json"
            "packages/candidate/SHA256SUMS.txt"
            "packages/candidate/syswarden-${candidate_version}-1.x86_64.rpm"
            "packages/candidate/syswarden_${candidate_version}_amd64.deb"
            "packages/candidate/syswarden_${candidate_version}_x86_64.apk"
            "packages/previous/SHA256SUMS.txt"
            "packages/previous/syswarden-${previous_version}-1.x86_64.rpm"
            "packages/previous/syswarden_${previous_version}_amd64.deb"
            "packages/previous/syswarden_${previous_version}_x86_64.apk"
            "qualification-context.json"
            "raw/nftables-raw.json"
            "raw/package-lifecycle-amd64.json"
            "raw/package-lifecycle-raw.json"
            "status/qualification-exit-codes.json"
          )
          for name in node01-attestation node02-attestation asymmetric-partition crash-head-recovery crash-wal-recovery heartbeat-monotonic-receipt-timeout instance-lease-exclusion normal-replication-ack-checkpoint partition-fence-split-brain rejoin-explicit rolling-rollback rolling-upgrade; do
            expected_unsigned_files+=("native-release-evidence/ha-v2/raw/${name}.json")
          done
          for campaign in 01 02 03; do
            for role in baseline candidate; do
              for sample in 01 02 03 04 05 06 07 08 09 10; do
                expected_unsigned_files+=("native-release-evidence/source-allocation/raw/allocation-campaign-${campaign}/${role}-${sample}.json")
              done
            done
          done
          expected_unsigned_directories=(
            aggregate
            bound
            go127-evidence
            native-signing
            native-signing/evidence
            native-signing/packages
            native-signing/rhel-package-owned
            native-signing/rhel-package-owned/evidence
            native-signing/rhel-package-owned/packages
            native-release-evidence
            native-release-evidence/ha-v2
            native-release-evidence/ha-v2/raw
            native-release-evidence/native-capability
            native-release-evidence/node01-migration
            native-release-evidence/native-lifecycle
            native-release-evidence/performance
            native-release-evidence/source-allocation
            native-release-evidence/source-allocation/raw
            native-release-evidence/source-allocation/raw/allocation-campaign-01
            native-release-evidence/source-allocation/raw/allocation-campaign-02
            native-release-evidence/source-allocation/raw/allocation-campaign-03
            packages
            packages/candidate
            packages/previous
            raw
            status
          )
          mapfile -t sorted_expected_unsigned < <(
            printf '%s\n' "${expected_unsigned_files[@]}" | LC_ALL=C sort
          )
          mapfile -t actual_unsigned_files < <(
            find -P "${UNSIGNED_EVIDENCE_ROOT}" -type f -printf '%P\n' |
              LC_ALL=C sort
          )
          if [[ "${sorted_expected_unsigned[*]}" != "${actual_unsigned_files[*]}" ]]; then
            echo "ERROR: unsigned qualification artifact inventory is not exact." >&2
            exit 1
          fi
          mapfile -t sorted_expected_unsigned_directories < <(
            printf '%s\n' "${expected_unsigned_directories[@]}" | LC_ALL=C sort
          )
          mapfile -t actual_unsigned_directories < <(
            find -P "${UNSIGNED_EVIDENCE_ROOT}" -mindepth 1 -type d -printf '%P\n' |
              LC_ALL=C sort
          )
          if [[ "${sorted_expected_unsigned_directories[*]}" != \
                "${actual_unsigned_directories[*]}" ]]; then
            echo "ERROR: unsigned qualification artifact directories are not exact." >&2
            exit 1
          fi
          while IFS= read -r -d '' entry; do
            if [[ (-d "${entry}" || -f "${entry}") && ! -L "${entry}" ]]; then
              continue
            fi
            echo "ERROR: unsigned qualification artifact has an unsafe filesystem entry." >&2
            exit 1
          done < <(find -P "${UNSIGNED_EVIDENCE_ROOT}" -mindepth 1 -print0)
          expected_manifest_files=()
          for relative in "${expected_unsigned_files[@]}"; do
            if [[ "${relative}" != "EVIDENCE_SHA256SUMS.txt" ]]; then
              expected_manifest_files+=("${relative}")
            fi
          done
          mapfile -t sorted_expected_manifest_files < <(
            printf '%s\n' "${expected_manifest_files[@]}" | LC_ALL=C sort
          )
          manifest_path="${UNSIGNED_EVIDENCE_ROOT}/EVIDENCE_SHA256SUMS.txt"
          mapfile -t manifest_files < <(
            sed -nE 's/^[0-9a-f]{64}  ([A-Za-z0-9._\/-]+)$/\1/p' \
              "${manifest_path}" |
              LC_ALL=C sort
          )
          manifest_line_count="$(wc -l < "${manifest_path}")"
          if [[ ! "${manifest_line_count}" =~ ^[0-9]+$ || \
                "${manifest_line_count}" -ne "${#manifest_files[@]}" || \
                "${sorted_expected_manifest_files[*]}" != "${manifest_files[*]}" ]]; then
            echo "ERROR: unsigned qualification checksum coverage is not exact." >&2
            exit 1
          fi
          (
            cd "${UNSIGNED_EVIDENCE_ROOT}"
            sha256sum --check --strict EVIDENCE_SHA256SUMS.txt
          )
          pinned_toolchain="go$(awk '$1 == "go" {print $2}' go.work)"
          go_verdict="$(mktemp "${RUNNER_TEMP}/go127-release-verdict.XXXXXXXXXX")"
          rm -f -- "${go_verdict}"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/go_toolchain_release_verdict.py \
            --evidence "${UNSIGNED_EVIDENCE_ROOT}/go127-evidence/evaluation.json" \
            --metadata scripts/ci/go_toolchain_evaluation.json \
            --release-sha "${RELEASE_SHA}" --release-tag "${RELEASE_TAG}" \
            --pinned-toolchain "${pinned_toolchain}" --repository "${GITHUB_REPOSITORY}" \
            --run-id "${EXPECTED_GO127_RUN_ID}" --artifact-id "${EXPECTED_GO127_ARTIFACT_ID}" \
            --artifact-name "${EXPECTED_GO127_ARTIFACT_NAME}" \
            --artifact-digest "${EXPECTED_GO127_ARTIFACT_DIGEST}" --output "${go_verdict}"
          cmp -- "${go_verdict}" "${UNSIGNED_EVIDENCE_ROOT}/go127-evidence/RELEASE_VERDICT.json"
          rm -f -- "${go_verdict}"
          if [[ "${EXPECTED_SIGNED_UPDATE_REQUIRED}" != "true" && \
                "${EXPECTED_SIGNED_UPDATE_REQUIRED}" != "false" ]]; then
            echo "ERROR: unsigned evidence has an invalid signed update contract." >&2
            exit 1
          fi
          independently_required="$(PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/ci/release_gate.py \
              requires-signed-update --tag "${RELEASE_TAG}")"
          if [[ "${independently_required}" != "${EXPECTED_SIGNED_UPDATE_REQUIRED}" ]]; then
            echo "ERROR: hosted signing disagrees with the unsigned signed-update contract." >&2
            exit 1
          fi
          if ! jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg release_sha "${RELEASE_SHA}" \
            --arg previous_tag "${PREVIOUS_TAG}" \
            --arg previous_commit_sha "${EXPECTED_PREVIOUS_COMMIT_SHA}" \
            --arg candidate_artifact_name "${CANDIDATE_ARTIFACT_NAME}" \
            --argjson candidate_run_id "${CANDIDATE_RUN_ID}" \
            --argjson candidate_artifact_id "${CANDIDATE_ARTIFACT_ID}" \
            --argjson previous_release_id "${EXPECTED_PREVIOUS_RELEASE_ID}" \
            --slurpfile qualification_matrix \
              "${GITHUB_WORKSPACE}/${QUALIFICATION_MATRIX_PATH}" '
              (keys | sort) == ([
                "candidate_package_artifact_id",
                "candidate_package_artifact_digest",
                "candidate_package_artifact_name",
                "candidate_package_run_id",
                "candidate_package_workflow",
                "go127_artifact_digest",
                "go127_artifact_id",
                "go127_artifact_name",
                "go127_run_id",
                "go127_workflow",
                "native_signing_artifact_digest",
                "native_signing_artifact_id",
                "native_signing_artifact_name",
                "native_signing_run_id",
                "native_signing_workflow",
                "native_evidence_artifact_digest",
                "native_evidence_artifact_id",
                "native_evidence_artifact_name",
                "native_evidence_run_id",
                "native_evidence_workflow",
                "previous_package_asset_ids",
                "previous_commit_sha",
                "previous_release_id",
                "previous_tag",
                "release_sha",
                "release_tag",
                "repository",
                "schema_version"
              ] | sort) and
              .schema_version == 5 and
              .repository == $repository and
              .release_tag == $release_tag and
              .release_sha == $release_sha and
              .previous_tag == $previous_tag and
              .previous_commit_sha == $previous_commit_sha and
              .candidate_package_workflow == "package.yml" and
              .candidate_package_run_id == $candidate_run_id and
              .candidate_package_artifact_id == $candidate_artifact_id and
              .candidate_package_artifact_digest == env.EXPECTED_CANDIDATE_ARTIFACT_DIGEST and
              .candidate_package_artifact_name == $candidate_artifact_name and
              .go127_workflow == "go-127-evaluation.yml" and
              .go127_run_id == (env.EXPECTED_GO127_RUN_ID | tonumber) and
              .go127_artifact_id == (env.EXPECTED_GO127_ARTIFACT_ID | tonumber) and
              .go127_artifact_name == env.EXPECTED_GO127_ARTIFACT_NAME and
              .go127_artifact_digest == env.EXPECTED_GO127_ARTIFACT_DIGEST and
              .native_signing_workflow == "native-package-signing.yml" and
              .native_signing_run_id == (env.EXPECTED_NATIVE_RUN_ID | tonumber) and
              .native_signing_artifact_id == (env.EXPECTED_NATIVE_ARTIFACT_ID | tonumber) and
              .native_signing_artifact_name == env.EXPECTED_NATIVE_ARTIFACT_NAME and
              .native_signing_artifact_digest == env.EXPECTED_NATIVE_ARTIFACT_DIGEST and
              .native_evidence_workflow == "native-release-evidence.yml" and
              .native_evidence_run_id == (env.EXPECTED_NATIVE_EVIDENCE_RUN_ID | tonumber) and
              .native_evidence_artifact_id == (env.EXPECTED_NATIVE_EVIDENCE_ARTIFACT_ID | tonumber) and
              .native_evidence_artifact_name == env.EXPECTED_NATIVE_EVIDENCE_ARTIFACT_NAME and
              .native_evidence_artifact_digest == env.EXPECTED_NATIVE_EVIDENCE_ARTIFACT_DIGEST and
              .previous_release_id == $previous_release_id and
              $qualification_matrix[0].package_sources.baseline.release ==
                $previous_tag and
              $qualification_matrix[0].package_sources.baseline.commit ==
                $previous_commit_sha and
              $qualification_matrix[0].package_sources.baseline.release_id ==
                $previous_release_id and
              (.previous_package_asset_ids | type == "array" and length == 4) and
              ([.previous_package_asset_ids[].name] | sort) == ([
                "SHA256SUMS.txt",
                ("syswarden-" + ($previous_tag | ltrimstr("v")) + "-1.x86_64.rpm"),
                ("syswarden_" + ($previous_tag | ltrimstr("v")) + "_amd64.deb"),
                ("syswarden_" + ($previous_tag | ltrimstr("v")) + "_x86_64.apk")
              ] | sort) and
              all(.previous_package_asset_ids[];
                (.id | type == "number" and . > 0 and floor == .) and
                (.name | type == "string" and length > 0)) and
              (.previous_package_asset_ids | sort_by(.name)) ==
                ($qualification_matrix[0].package_sources.baseline.assets |
                  map({name, id}) | sort_by(.name))
            ' "${UNSIGNED_EVIDENCE_ROOT}/qualification-context.json" >/dev/null; then
            echo "ERROR: unsigned qualification context is not bound to hosted signing inputs." >&2
            exit 1
          fi
          if [[ "${CANDIDATE_RUN_ID}" != "${EXPECTED_CANDIDATE_RUN_ID}" || \
                "${CANDIDATE_ARTIFACT_ID}" != "${EXPECTED_CANDIDATE_ARTIFACT_ID}" || \
                "${CANDIDATE_ARTIFACT_DIGEST}" != "${EXPECTED_CANDIDATE_ARTIFACT_DIGEST}" || \
                "${CANDIDATE_ARTIFACT_NAME}" != "${EXPECTED_CANDIDATE_ARTIFACT_NAME}" ]]; then
            echo "ERROR: hosted Package main resolution differs from x64 qualification outputs." >&2
            exit 1
          fi
          mapfile -t failed_statuses < <(
            jq -r 'to_entries[] | select(.value != 0) |
              (.key + "=" + (.value | tostring))' \
              "${UNSIGNED_EVIDENCE_ROOT}/status/qualification-exit-codes.json"
          )
          for failed_status in "${failed_statuses[@]}"; do
            echo "ERROR: qualification status ${failed_status}." >&2
          done
          if (( ${#failed_statuses[@]} > 0 )); then
            echo "ERROR: refusing to sign because qualification status is not uniformly zero." >&2
            exit 1
          fi
          jq --exit-status '
            (keys | sort) == ([
              "adapter_build",
              "adapter_verify",
              "gate_generate",
              "gate_verify",
              "nftables_lab",
              "package_lab"
            ] | sort) and all(.[]; . == 0)
          ' "${UNSIGNED_EVIDENCE_ROOT}/status/qualification-exit-codes.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            verify-packages \
            --tag "${RELEASE_TAG}" \
            --packages "${PACKAGE_MAIN_SOURCE_DIR}"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_gate.py \
            verify-packages \
            --tag "${RELEASE_TAG}" \
            --packages "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate"
          unsigned_manifest="${UNSIGNED_EVIDENCE_ROOT}/native-signing/evidence/UNSIGNED_SHA256SUMS.txt"
          for package_file in \
            "syswarden-${candidate_version}-1.x86_64.rpm" \
            "syswarden_${candidate_version}_amd64.deb" \
            "syswarden_${candidate_version}_x86_64.apk"; do
            expected_unsigned_sha="$(awk -v name="${package_file}" \
              '$2 == name {print $1}' "${unsigned_manifest}")"
            if [[ ! "${expected_unsigned_sha}" =~ ^[0-9a-f]{64}$ || \
                  "$(sha256sum "${PACKAGE_MAIN_SOURCE_DIR}/${package_file}" | awk '{print $1}')" != \
                    "${expected_unsigned_sha}" ]]; then
              echo "ERROR: Package main bytes differ from native-signing unsigned provenance." >&2
              exit 1
            fi
          done
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/native_package_signing_bundle.py verify \
            --bundle "${UNSIGNED_EVIDENCE_ROOT}/native-signing" \
            --release "${RELEASE_TAG}" --release-sha "${RELEASE_SHA}"
          for package_file in \
            "syswarden-${candidate_version}-1.x86_64.rpm" \
            "syswarden_${candidate_version}_amd64.deb" \
            "syswarden_${candidate_version}_x86_64.apk"; do
            cmp -s \
              "${UNSIGNED_EVIDENCE_ROOT}/native-signing/packages/${package_file}" \
              "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate/${package_file}" || {
                echo "ERROR: qualified package bytes differ from the verified native signing bundle." >&2
                exit 1
              }
          done
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_adapter.py \
            verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-version "${RELEASE_TAG}" \
            --candidate-packages-dir "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate" \
            --previous-packages-dir "${UNSIGNED_EVIDENCE_ROOT}/packages/previous" \
            --nft-raw "${UNSIGNED_EVIDENCE_ROOT}/raw/nftables-raw.json" \
            --package-raw "${UNSIGNED_EVIDENCE_ROOT}/raw/package-lifecycle-raw.json" \
            --package-amd64-shard "${UNSIGNED_EVIDENCE_ROOT}/raw/package-lifecycle-amd64.json" \
            --qualification-matrix "${GITHUB_WORKSPACE}/${QUALIFICATION_MATRIX_PATH}" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-workflow-run-id "${GITHUB_RUN_ID}" \
            --expected-workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --expected-candidate-run-id "${CANDIDATE_RUN_ID}" \
            --expected-candidate-artifact-id "${CANDIDATE_ARTIFACT_ID}" \
            --expected-candidate-artifact-name "${CANDIDATE_ARTIFACT_NAME}" \
            --expected-previous-release-id "${EXPECTED_PREVIOUS_RELEASE_ID}" \
            --max-age-seconds 172800 \
            --max-report-skew-seconds 0 \
            --nft-envelope "${UNSIGNED_EVIDENCE_ROOT}/bound/nftables-bound.json" \
            --package-envelope "${UNSIGNED_EVIDENCE_ROOT}/bound/package-lifecycle-bound.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/release_qualification_gate.py \
            verify \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-version "${RELEASE_TAG}" \
            --candidate-packages-dir "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate" \
            --nft-report "${UNSIGNED_EVIDENCE_ROOT}/bound/nftables-bound.json" \
            --package-report "${UNSIGNED_EVIDENCE_ROOT}/bound/package-lifecycle-bound.json" \
            --max-age-seconds 172800 \
            --max-report-skew-seconds 0 \
            --aggregate "${UNSIGNED_EVIDENCE_ROOT}/aggregate/release-qualification.json"
          {
            printf 'required=%s\n' "${independently_required}"
            printf 'verified=true\n'
          } >> "${GITHUB_OUTPUT}"

      - name: Build and Test Signed Update Manifest Tool
        id: hosted_manifest_tool
        if: ${{ steps.update_contract.outputs.required == 'true' }}
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${RELEASE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          GOFLAGS=-mod=readonly go test \
            ./scripts/ci/update_manifest.go \
            ./scripts/ci/update_manifest_test.go
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${RELEASE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          GOFLAGS=-mod=readonly go build \
            -o "${SIGNING_TOOL_DIR}/syswarden-update-manifest" \
            ./scripts/ci/update_manifest.go
          chmod 0700 "${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          test -f "${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          test ! -L "${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          test -x "${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          tool_sha256="$(sha256sum \
            "${SIGNING_TOOL_DIR}/syswarden-update-manifest")"
          tool_sha256="${tool_sha256%% *}"
          [[ "${tool_sha256}" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "${tool_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Revalidate Hosted Signing Tool Before Secret Exposure
        id: verified_hosted_manifest_tool
        if: ${{ steps.hosted_manifest_tool.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_MANIFEST_TOOL_SHA256: ${{ steps.hosted_manifest_tool.outputs.sha256 }}
        run: |
          set -euo pipefail
          manifest_tool="${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          test -f "${manifest_tool}"
          test ! -L "${manifest_tool}"
          test -x "${manifest_tool}"
          test "$(stat -c '%u' "${manifest_tool}")" = "$(id -u)"
          test "$(stat -c '%a' "${manifest_tool}")" = "700"
          actual_tool_sha256="$(sha256sum "${manifest_tool}")"
          actual_tool_sha256="${actual_tool_sha256%% *}"
          if [[ ! "${EXPECTED_MANIFEST_TOOL_SHA256}" =~ ^[0-9a-f]{64}$ || \
                "${actual_tool_sha256}" != "${EXPECTED_MANIFEST_TOOL_SHA256}" ]]; then
            echo "ERROR: hosted signing tool changed after its validated build." >&2
            exit 1
          fi
          echo "verified=true" >> "${GITHUB_OUTPUT}"

      - name: Generate and Verify Signed Update Manifest
        id: signed_update
        if: >-
          ${{ needs.qualify-release.outputs.signed_update_required == 'true' &&
              steps.update_contract.outputs.verified == 'true' &&
              steps.verified_hosted_manifest_tool.outputs.verified == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          manifest_dir="${UNSIGNED_EVIDENCE_ROOT}/update"
          manifest_path="${manifest_dir}/syswarden-update-manifest-v1.json"
          signature_path="${manifest_path}.sig"
          signing_complete=false
          clear_signing_material() {
            unset SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY
            if [[ "${signing_complete}" != "true" ]]; then
              rm -f -- "${manifest_path}" "${signature_path}"
              rmdir -- "${manifest_dir}" 2>/dev/null || true
            fi
          }
          trap clear_signing_material EXIT HUP INT TERM
          if [[ -z "${SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY}" ]]; then
            echo "ERROR: the protected Ed25519 release-signing secret is required." >&2
            exit 1
          fi
          manifest_tool="${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          test -f "${manifest_tool}"
          test ! -L "${manifest_tool}"
          test -x "${manifest_tool}"
          "${manifest_tool}" generate \
            --repository "${GITHUB_WORKSPACE}" \
            --tag "${RELEASE_TAG}" \
            --packages "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate" \
            --output "${manifest_dir}"
          unset SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY
          env -u SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY \
            "${manifest_tool}" verify \
              --repository "${GITHUB_WORKSPACE}" \
              --tag "${RELEASE_TAG}" \
              --packages "${UNSIGNED_EVIDENCE_ROOT}/packages/candidate" \
              --manifest "${manifest_path}" \
              --signature "${signature_path}"
          signing_complete=true
          trap - EXIT HUP INT TERM

      - name: Seal Exact Qualification Evidence Inventory
        id: final_inventory
        if: >-
          ${{ steps.update_contract.outputs.verified == 'true' &&
              (needs.qualify-release.outputs.signed_update_required == 'false' ||
               steps.signed_update.outcome == 'success') }}
        shell: bash
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SIGNED_UPDATE_REQUIRED: ${{ needs.qualify-release.outputs.signed_update_required }}
        run: |
          set -euo pipefail
          umask 077
          candidate_version="${RELEASE_TAG#v}"
          previous_version="${PREVIOUS_TAG#v}"
          rm -f -- "${UNSIGNED_EVIDENCE_ROOT}/EVIDENCE_SHA256SUMS.txt"
          expected=(
            "aggregate/release-qualification.json"
            "bound/nftables-bound.json"
            "bound/package-lifecycle-bound.json"
            "go127-evidence/evaluation.json"
            "go127-evidence/RELEASE_VERDICT.json"
            "native-release-evidence/node01-migration/EVIDENCE.json"
            "native-release-evidence/node01-migration/RAW_EVIDENCE.tar"
            "native-release-evidence/node01-migration/VERDICT.json"
            "native-release-evidence/native-lifecycle/RAW_EVIDENCE.tar"
            "native-release-evidence/native-lifecycle/VERDICT.json"
            "native-signing/SIGNED_ARTIFACT_SHA256SUMS.txt"
            "native-signing/evidence/APK_NATIVE_VERIFICATION.json"
            "native-signing/evidence/DEB_NATIVE_VERIFICATION.json"
            "native-signing/evidence/NATIVE_SIGNING_PROVENANCE.json"
            "native-signing/evidence/RPM_NATIVE_VERIFICATION.json"
            "native-signing/evidence/RPM_PAYLOAD_PROOF.json"
            "native-signing/evidence/UNSIGNED_SHA256SUMS.txt"
            "native-signing/packages/SHA256SUMS.txt"
            "native-signing/packages/syswarden-${candidate_version}-1.x86_64.rpm"
            "native-signing/packages/syswarden_${candidate_version}_amd64.deb"
            "native-signing/packages/syswarden_${candidate_version}_amd64.deb.asc"
            "native-signing/packages/syswarden_${candidate_version}_x86_64.apk"
            "native-signing/rhel-package-owned/SIGNED_ARTIFACT_SHA256SUMS.txt"
            "native-signing/rhel-package-owned/evidence/RPM_NATIVE_VERIFICATION.json"
            "native-signing/rhel-package-owned/evidence/RPM_PAYLOAD_PROOF.json"
            "native-signing/rhel-package-owned/evidence/SIGNING_PROVENANCE.json"
            "native-signing/rhel-package-owned/evidence/UNSIGNED_SHA256SUMS.txt"
            "native-signing/rhel-package-owned/packages/SHA256SUMS.txt"
            "native-signing/rhel-package-owned/packages/syswarden-${candidate_version}-1.rhelpo.x86_64.rpm"
            "native-release-evidence/NATIVE_RELEASE_EVIDENCE_MANIFEST.json"
            "native-release-evidence/QUALIFICATION_BINDING.json"
            "native-release-evidence/ha-v2/HA_V2_NATIVE_EVIDENCE.json"
            "native-release-evidence/ha-v2/HA_V2_NATIVE_VERDICT.json"
            "native-release-evidence/native-capability/AGGREGATE.json"
            "native-release-evidence/native-capability/APK-324.json"
            "native-release-evidence/native-capability/DEB-13.json"
            "native-release-evidence/native-capability/DEB-U2604.json"
            "native-release-evidence/native-capability/RPM-A10.json"
            "native-release-evidence/native-capability/RPM-A10-RHELPO.json"
            "native-release-evidence/native-capability/RPM-A9-RHELPO.json"
            "native-release-evidence/performance/AGGREGATE.json"
            "native-release-evidence/performance/ADAPTER_CONFIG.json"
            "native-release-evidence/performance/EVIDENCE.json"
            "native-release-evidence/performance/REPORT.json"
            "native-release-evidence/source-allocation/EVIDENCE.json"
            "native-release-evidence/source-allocation/REPORT.json"
            "native-release-evidence/source-allocation/baseline-probe"
            "native-release-evidence/source-allocation/benchmark-source.go"
            "native-release-evidence/source-allocation/build-attestation.json"
            "native-release-evidence/source-allocation/candidate-probe"
            "native-release-evidence/source-allocation/environment.json"
            "native-release-evidence/source-allocation/execution-control-attestation.json"
            "native-release-evidence/source-allocation/fixture.json"
            "native-release-evidence/source-allocation/signature-catalog.json"
            "packages/candidate/SHA256SUMS.txt"
            "packages/candidate/syswarden-${candidate_version}-1.x86_64.rpm"
            "packages/candidate/syswarden_${candidate_version}_amd64.deb"
            "packages/candidate/syswarden_${candidate_version}_x86_64.apk"
            "packages/previous/SHA256SUMS.txt"
            "packages/previous/syswarden-${previous_version}-1.x86_64.rpm"
            "packages/previous/syswarden_${previous_version}_amd64.deb"
            "packages/previous/syswarden_${previous_version}_x86_64.apk"
            "qualification-context.json"
            "raw/nftables-raw.json"
            "raw/package-lifecycle-amd64.json"
            "raw/package-lifecycle-raw.json"
            "status/qualification-exit-codes.json"
          )
          for name in node01-attestation node02-attestation asymmetric-partition crash-head-recovery crash-wal-recovery heartbeat-monotonic-receipt-timeout instance-lease-exclusion normal-replication-ack-checkpoint partition-fence-split-brain rejoin-explicit rolling-rollback rolling-upgrade; do
            expected+=("native-release-evidence/ha-v2/raw/${name}.json")
          done
          for campaign in 01 02 03; do
            for role in baseline candidate; do
              for sample in 01 02 03 04 05 06 07 08 09 10; do
                expected+=("native-release-evidence/source-allocation/raw/allocation-campaign-${campaign}/${role}-${sample}.json")
              done
            done
          done
          expected_directories=(
            aggregate
            bound
            go127-evidence
            native-signing
            native-signing/evidence
            native-signing/packages
            native-signing/rhel-package-owned
            native-signing/rhel-package-owned/evidence
            native-signing/rhel-package-owned/packages
            native-release-evidence
            native-release-evidence/ha-v2
            native-release-evidence/ha-v2/raw
            native-release-evidence/native-capability
            native-release-evidence/node01-migration
            native-release-evidence/native-lifecycle
            native-release-evidence/performance
            native-release-evidence/source-allocation
            native-release-evidence/source-allocation/raw
            native-release-evidence/source-allocation/raw/allocation-campaign-01
            native-release-evidence/source-allocation/raw/allocation-campaign-02
            native-release-evidence/source-allocation/raw/allocation-campaign-03
            packages
            packages/candidate
            packages/previous
            raw
            status
          )
          if [[ "${SIGNED_UPDATE_REQUIRED}" == "true" ]]; then
            expected+=(
              "update/syswarden-update-manifest-v1.json"
              "update/syswarden-update-manifest-v1.json.sig"
            )
            expected_directories+=(update)
          elif [[ "${SIGNED_UPDATE_REQUIRED}" != "false" ]]; then
            echo "ERROR: final signed update requirement is not canonical." >&2
            exit 1
          fi
          mapfile -t sorted_expected < <(
            printf '%s\n' "${expected[@]}" | LC_ALL=C sort
          )
          mapfile -t actual_files < <(
            find -P "${UNSIGNED_EVIDENCE_ROOT}" -type f -printf '%P\n' |
              LC_ALL=C sort
          )
          if [[ "${sorted_expected[*]}" != "${actual_files[*]}" ]]; then
            echo "ERROR: final qualification evidence inventory is not exact." >&2
            exit 1
          fi
          mapfile -t sorted_expected_directories < <(
            printf '%s\n' "${expected_directories[@]}" | LC_ALL=C sort
          )
          mapfile -t actual_directories < <(
            find -P "${UNSIGNED_EVIDENCE_ROOT}" -mindepth 1 -type d -printf '%P\n' |
              LC_ALL=C sort
          )
          if [[ "${sorted_expected_directories[*]}" != "${actual_directories[*]}" ]]; then
            echo "ERROR: final qualification evidence directories are not exact." >&2
            exit 1
          fi
          while IFS= read -r -d '' entry; do
            if [[ (-d "${entry}" || -f "${entry}") && ! -L "${entry}" ]]; then
              continue
            fi
            echo "ERROR: final qualification evidence has an unsafe entry." >&2
            exit 1
          done < <(find -P "${UNSIGNED_EVIDENCE_ROOT}" -mindepth 1 -print0)
          for relative in "${sorted_expected[@]}"; do
            test -s "${UNSIGNED_EVIDENCE_ROOT}/${relative}"
            test -f "${UNSIGNED_EVIDENCE_ROOT}/${relative}"
            test ! -L "${UNSIGNED_EVIDENCE_ROOT}/${relative}"
          done
          chmod -R go-rwx "${UNSIGNED_EVIDENCE_ROOT}"
          (
            cd "${UNSIGNED_EVIDENCE_ROOT}"
            sha256sum "${sorted_expected[@]}" > EVIDENCE_SHA256SUMS.txt
            sha256sum --check --strict EVIDENCE_SHA256SUMS.txt
          )
          test "$(find -P "${UNSIGNED_EVIDENCE_ROOT}" -type f | wc -l)" \
            -eq "$(( ${#sorted_expected[@]} + 1 ))"

      - name: Upload Exact Final Qualification Evidence
        id: final_upload
        if: ${{ steps.final_inventory.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syswarden-release-qualification
          path: ${{ steps.signing_workspace.outputs.unsigned_root }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove Ephemeral Signing Material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          unset SYSWARDEN_UPDATE_ED25519_PRIVATE_KEY
          if [[ -z "${HOSTED_SIGNING_ROOT:-}" || \
                "${HOSTED_SIGNING_ROOT}" != "${RUNNER_TEMP%/}"/syswarden-hosted-signing.* || \
                -z "${UNSIGNED_EVIDENCE_ROOT:-}" || \
                "${UNSIGNED_EVIDENCE_ROOT}" != "${HOSTED_SIGNING_ROOT}/unsigned-evidence" || \
                -z "${SIGNING_TOOL_DIR:-}" || \
                "${SIGNING_TOOL_DIR}" != "${HOSTED_SIGNING_ROOT}/signing-tool" ]]; then
            echo "ERROR: refusing unsafe hosted signing cleanup." >&2
            exit 1
          fi
          test -d "${HOSTED_SIGNING_ROOT}"
          test ! -L "${HOSTED_SIGNING_ROOT}"
          [[ -O "${HOSTED_SIGNING_ROOT}" ]]
          test "$(stat -c '%a' "${HOSTED_SIGNING_ROOT}")" = "700"
          update_dir="${UNSIGNED_EVIDENCE_ROOT}/update"
          if [[ -e "${update_dir}" ]]; then
            test -d "${update_dir}"
            test ! -L "${update_dir}"
            [[ -O "${update_dir}" ]]
          fi
          test -d "${SIGNING_TOOL_DIR}"
          test ! -L "${SIGNING_TOOL_DIR}"
          [[ -O "${SIGNING_TOOL_DIR}" ]]
          test "$(stat -c '%a' "${SIGNING_TOOL_DIR}")" = "700"
          rm -f -- \
            "${update_dir}/syswarden-update-manifest-v1.json" \
            "${update_dir}/syswarden-update-manifest-v1.json.sig"
          rmdir -- "${update_dir}" 2>/dev/null || true
          rm -f -- "${SIGNING_TOOL_DIR}/syswarden-update-manifest"
          rmdir -- "${SIGNING_TOOL_DIR}" 2>/dev/null || true

      - name: Enforce Hosted Qualification Seal Verdict
        if: ${{ always() }}
        shell: bash
        env:
          FINAL_INVENTORY_OUTCOME: ${{ steps.final_inventory.outcome }}
          FINAL_UPLOAD_OUTCOME: ${{ steps.final_upload.outcome }}
          PACKAGE_BYTES_GATE_OUTCOME: ${{ steps.update_contract.outcome }}
          SIGNED_UPDATE_OUTCOME: ${{ steps.signed_update.outcome }}
          SIGNED_UPDATE_REQUIRED: ${{ needs.qualify-release.outputs.signed_update_required }}
        run: |
          set -euo pipefail
          if [[ "${PACKAGE_BYTES_GATE_OUTCOME}" != "success" || \
                "${FINAL_INVENTORY_OUTCOME}" != "success" || \
                "${FINAL_UPLOAD_OUTCOME}" != "success" ]]; then
            echo "ERROR: hosted qualification evidence was not independently gated, sealed, and uploaded." >&2
            exit 1
          fi
          if [[ "${SIGNED_UPDATE_REQUIRED}" == "true" && \
                "${SIGNED_UPDATE_OUTCOME}" != "success" ]]; then
            echo "ERROR: hosted qualification required signing but signing did not succeed." >&2
            exit 1
          fi
          if [[ "${SIGNED_UPDATE_REQUIRED}" != "true" && \
                "${SIGNED_UPDATE_REQUIRED}" != "false" ]]; then
            echo "ERROR: hosted qualification signed update requirement is invalid." >&2
            exit 1
          fi

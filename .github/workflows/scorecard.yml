name: OSSF Scorecard Supply Chain Security

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Recommended by OSSF: run an automated weekly scan.
  schedule:
    - cron: '30 2 * * 1'

# New PR revisions supersede older analyses. Each trusted run and rerun has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.run_attempt }}-${{ github.run_attempt == '1' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

permissions:
  contents: read

jobs:
  pull-request-analysis:
    name: Scorecard analysis (pull request)
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: ./.github/workflows/scorecard-pr.yml

  published-analysis:
    name: Scorecard analysis and publication
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run and publish OSSF Scorecard analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to Code Scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

  scorecard:
    name: Scorecard supply-chain security
    needs: [pull-request-analysis, published-analysis]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce event-specific Scorecard result
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_RESULT: ${{ needs.pull-request-analysis.result }}
          PUBLISHED_RESULT: ${{ needs.published-analysis.result }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request)
              [[ "${PULL_REQUEST_RESULT}" == "success" ]]
              [[ "${PUBLISHED_RESULT}" == "skipped" ]]
              ;;
            push|schedule)
              [[ "${PULL_REQUEST_RESULT}" == "skipped" ]]
              [[ "${PUBLISHED_RESULT}" == "success" ]]
              ;;
            *)
              echo "ERROR: unsupported Scorecard event ${EVENT_NAME}." >&2
              exit 1
              ;;
          esac

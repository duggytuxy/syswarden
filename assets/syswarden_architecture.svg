<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title description" data-theme="dark" data-theme-status="legacy">
  <title id="title">SysWarden v4.04.0 candidate architecture</title>
  <desc id="description">Protected Linux workloads emit logs and host telemetry to a local SysWarden core. The core commits authoritative nftables policy and may reconcile one already active UFW or firewalld compatibility frontend. It also manages local telemetry and an authenticated peer-scoped HA API. Operators use a privileged CLI and a local terminal dashboard. A challenge-bound HA fence protects partner migration cleanup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="1" stop-color="#0b2033"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d4c"/>
      <stop offset="1" stop-color="#102943"/>
    </linearGradient>
    <linearGradient id="officialShieldGradient" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="officialLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Official brand geometry copied verbatim from assets/syswarden_logo.svg. -->
    <g id="syswardenOfficialMark">
        <path d="M50 0 L100 20 V60 C100 90 75 110 50 120 C25 110 0 90 0 60 V20 L50 0 Z" fill="#161B22" stroke="url(#officialShieldGradient)" stroke-width="4" filter="url(#officialLogoGlow)"/>
        <path d="M50 15 L85 30 V55 C85 75 65 90 50 100 C35 90 15 75 15 55 V30 L50 15 Z" fill="none" stroke="#00A3FF" stroke-width="1.5" opacity="0.5"/>
        <path d="M35 45 L50 60 L35 75" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="55" y1="75" x2="70" y2="75" stroke="#00A3FF" stroke-width="4" stroke-linecap="round" filter="url(#officialLogoGlow)"/>
    </g>
    <g id="syswardenOfficialLogo" data-brand-source="assets/syswarden_logo.svg">
      <use href="#syswardenOfficialMark" transform="translate(30, 15)"/>
      <text x="160" y="90" class="official-logo-text">SYSWARDEN</text>
      <text x="165" y="118" class="official-logo-sub">ACTIVE DEFENSE HIDS/HIPS</text>
    </g>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2dd4bf"/>
    </marker>
    <style>
      .h1 { font: 800 36px Inter,Segoe UI,Arial,sans-serif; fill: #f8fafc; }
      .h2 { font: 750 21px Inter,Segoe UI,Arial,sans-serif; fill: #f8fafc; }
      .body { font: 500 16px Inter,Segoe UI,Arial,sans-serif; fill: #c1d3df; }
      .small { font: 500 14px Inter,Segoe UI,Arial,sans-serif; fill: #9db5c7; }
      .mono { font: 700 14px ui-monospace,SFMono-Regular,Consolas,monospace; fill: #d7f8ff; }
      .panel { fill: #0d2437; stroke: #234861; stroke-width: 2; }
      .inner { fill: #102c42; stroke: #2b5872; stroke-width: 1.5; }
      .tag { fill: #0e3548; stroke: #2dd4bf; stroke-width: 1.3; }
      .official-logo-text { font: 700 64px "Fira Code",ui-monospace,SFMono-Regular,Consolas,monospace; fill: #ffffff; letter-spacing: -1px; }
      .official-logo-sub { font: 400 14px "Fira Code",ui-monospace,SFMono-Regular,Consolas,monospace; fill: #ffffff; letter-spacing: 5px; }
    </style>
  </defs>

  <rect width="1600" height="940" rx="28" fill="url(#bg)"/>
  <g transform="translate(30 5) scale(0.68)">
    <use href="#syswardenOfficialLogo"/>
  </g>
  <text x="475" y="62" class="h1">v4.04.0 candidate architecture</text>
  <text x="475" y="98" class="body">Linux-only host enforcement, local terminal operations and condition-bound HA migration</text>

  <g transform="translate(70 154)" filter="url(#shadow)">
    <rect width="350" height="294" rx="22" class="panel"/>
    <text x="26" y="44" class="small" fill="#5eead4">PROTECTED WORKLOADS</text>
    <g transform="translate(24 68)">
      <rect width="302" height="58" rx="13" class="inner"/>
      <text x="18" y="26" class="h2" font-size="18">APIs and services</text>
      <text x="18" y="47" class="small">Traffic stays on its normal path</text>
    </g>
    <g transform="translate(24 138)">
      <rect width="302" height="58" rx="13" class="inner"/>
      <text x="18" y="26" class="h2" font-size="18">Security logs</text>
      <text x="18" y="47" class="small">WAAP and authentication signals</text>
    </g>
    <g transform="translate(24 208)">
      <rect width="302" height="58" rx="13" class="inner"/>
      <text x="18" y="26" class="h2" font-size="18">Host telemetry</text>
      <text x="18" y="47" class="small">Kernel, process and service state</text>
    </g>
  </g>

  <g transform="translate(500 142)" filter="url(#shadow)">
    <rect width="600" height="322" rx="26" fill="url(#core)" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="300" y="48" text-anchor="middle" class="small" fill="#5eead4">HOST-LOCAL TRUST BOUNDARY</text>
    <text x="300" y="88" text-anchor="middle" class="h1">SysWarden Core</text>
    <g transform="translate(28 116)">
      <rect width="166" height="82" rx="14" class="inner"/>
      <text x="83" y="31" text-anchor="middle" class="mono">CONFIG</text>
      <text x="83" y="55" text-anchor="middle" class="small">validated modules</text>
      <text x="83" y="71" text-anchor="middle" class="small">atomic migration</text>
    </g>
    <g transform="translate(216 116)">
      <rect width="166" height="82" rx="14" class="inner"/>
      <text x="83" y="31" text-anchor="middle" class="mono">WAAP</text>
      <text x="83" y="55" text-anchor="middle" class="small">out-of-band logs</text>
      <text x="83" y="71" text-anchor="middle" class="small">bounded decisions</text>
    </g>
    <g transform="translate(404 116)">
      <rect width="166" height="82" rx="14" class="inner"/>
      <text x="83" y="31" text-anchor="middle" class="mono">OWNERSHIP</text>
      <text x="83" y="55" text-anchor="middle" class="small">static + ledger</text>
      <text x="83" y="71" text-anchor="middle" class="small">separate stores</text>
    </g>
    <g transform="translate(28 220)">
      <rect width="262" height="72" rx="14" class="tag"/>
      <text x="131" y="29" text-anchor="middle" class="mono">NFTABLES MANAGER</text>
      <text x="131" y="52" text-anchor="middle" class="small">validate, commit, verify</text>
    </g>
    <g transform="translate(310 220)">
      <rect width="262" height="72" rx="14" class="tag"/>
      <text x="131" y="29" text-anchor="middle" class="mono">HA API | TCP 62026</text>
      <text x="131" y="52" text-anchor="middle" class="small">TLS 1.3 + bearer token</text>
    </g>
  </g>

  <g transform="translate(1180 154)" filter="url(#shadow)">
    <rect width="350" height="294" rx="22" class="panel"/>
    <text x="26" y="44" class="small" fill="#5eead4">ENFORCEMENT AND PEERS</text>
    <g transform="translate(24 68)">
      <rect width="302" height="78" rx="13" class="inner"/>
      <text x="18" y="29" class="h2" font-size="18">Authoritative nftables</text>
      <text x="18" y="51" class="small">Exact IPv4 and IPv6 sets</text>
      <text x="18" y="67" class="small">One active UFW or firewalld frontend</text>
    </g>
    <g transform="translate(24 158)">
      <rect width="302" height="108" rx="13" class="inner"/>
      <text x="18" y="29" class="h2" font-size="18">HA and BunkerWeb</text>
      <text x="18" y="52" class="small">Authenticated peer-scoped API</text>
      <text x="18" y="70" class="small">TTL and provenance gate</text>
      <text x="18" y="88" class="small">Challenge-bound fence status</text>
    </g>
  </g>

  <path d="M420 301 H478" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <text x="449" y="270" text-anchor="middle" class="small">logs</text>
  <path d="M1102 301 H1158" stroke="#2dd4bf" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <text x="1130" y="270" text-anchor="middle" class="small">policy</text>

  <g transform="translate(70 530)" filter="url(#shadow)">
    <rect width="480" height="208" rx="22" class="panel"/>
    <text x="26" y="44" class="small" fill="#5eead4">OPERATOR PLANE</text>
    <g transform="translate(24 68)">
      <rect width="204" height="108" rx="14" class="inner"/>
      <text x="102" y="32" text-anchor="middle" class="mono">PRIVILEGED CLI</text>
      <text x="102" y="58" text-anchor="middle" class="small">config and lifecycle</text>
      <text x="102" y="78" text-anchor="middle" class="small">fence administration</text>
      <text x="102" y="96" text-anchor="middle" class="small">host mutation</text>
    </g>
    <g transform="translate(252 68)">
      <rect width="204" height="108" rx="14" class="inner"/>
      <text x="102" y="32" text-anchor="middle" class="mono">NATIVE TUI</text>
      <text x="102" y="58" text-anchor="middle" class="small">local terminal only</text>
      <text x="102" y="78" text-anchor="middle" class="small">local telemetry</text>
      <text x="102" y="96" text-anchor="middle" class="small">no network listener</text>
    </g>
  </g>

  <g transform="translate(610 510)" filter="url(#shadow)">
    <rect width="920" height="248" rx="22" class="panel"/>
    <text x="26" y="44" class="small" fill="#5eead4">HA MIGRATION FENCE</text>
    <g transform="translate(24 68)">
      <rect width="202" height="142" rx="14" class="inner"/>
      <text x="101" y="30" text-anchor="middle" class="mono">1 | MANIFEST</text>
      <text x="18" y="58" class="small">Complete members</text>
      <text x="18" y="78" class="small">Live leaf pins</text>
      <text x="18" y="98" class="small">External writers</text>
      <text x="18" y="118" class="small">One epoch + digests</text>
    </g>
    <g transform="translate(246 68)">
      <rect width="202" height="142" rx="14" class="inner"/>
      <text x="101" y="30" text-anchor="middle" class="mono">2 | ATTEST</text>
      <text x="18" y="58" class="small">Fresh challenge</text>
      <text x="18" y="78" class="small">active_drained</text>
      <text x="18" y="98" class="small">Exact string equality</text>
      <text x="18" y="118" class="small">Stable condition</text>
    </g>
    <g transform="translate(468 68)">
      <rect width="202" height="142" rx="14" class="inner"/>
      <text x="101" y="30" text-anchor="middle" class="mono">3 | CLEAN</text>
      <text x="18" y="58" class="small">Durable partner journal</text>
      <text x="18" y="78" class="small">Peer-specific delete</text>
      <text x="18" y="98" class="small">Condition header</text>
      <text x="18" y="118" class="small">No inferred ownership</text>
    </g>
    <g transform="translate(690 68)">
      <rect width="202" height="142" rx="14" class="tag"/>
      <text x="101" y="30" text-anchor="middle" class="mono">4 | RELEASE</text>
      <text x="18" y="58" class="small">All members stable</text>
      <text x="18" y="78" class="small">No unexplained residue</text>
      <text x="18" y="98" class="small">Writer closure durable</text>
      <text x="18" y="118" class="small">No queued retry</text>
    </g>
  </g>

  <path d="M550 632 H588" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <path d="M800 464 V494" stroke="#2dd4bf" stroke-width="4" marker-end="url(#arrowTeal)"/>

  <g transform="translate(70 814)">
    <rect width="1460" height="72" rx="18" fill="#0d2b3e" stroke="#28536d" stroke-width="1.5"/>
    <text x="28" y="30" class="mono">RELEASE GATE</text>
    <text x="28" y="53" class="small">3 Linux packages | native AMD64 | nftables lab | signed update manifest | exact 10-asset inventory | immutable qualified SHA</text>
    <rect x="1192" y="16" width="240" height="40" rx="11" fill="#123a45" stroke="#2dd4bf"/>
    <text x="1312" y="41" text-anchor="middle" class="mono">FAIL CLOSED</text>
  </g>
</svg>
